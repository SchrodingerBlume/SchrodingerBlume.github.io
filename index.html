<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生化真题智能训练系统 (全能版)</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f5f6fa; --card: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2, h3 { text-align: center; color: var(--primary); }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-outline:hover { background: var(--accent); color: white; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .question-box { border-left: 5px solid var(--accent); padding-left: 20px; margin: 20px 0; }
        .meta { background: #e1f0fa; color: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; font-weight: bold; }
        .hidden { display: none !important; }
        .timer { font-size: 2em; color: #e74c3c; text-align: center; font-family: monospace; }
        .ai-feedback { background: #f8f9fa; border: 1px dashed #ccc; padding: 15px; margin-top: 15px; border-radius: 5px; }
        .loading { color: #f39c12; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🧬 生化考研真题训练</h1>
            <p style="text-align:center; color:#7f8c8d;">全题型覆盖 · 阿里百炼AI严格判卷</p>
        </div>

        <div id="setup-panel" class="card">
            <h2>⚙️ 考试设置</h2>
            
            <label>运行模式</label>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <button class="btn" id="mode-train" onclick="setMode('training')">🏋️ 训练模式 (做一题对一题)</button>
                <button class="btn btn-outline" id="mode-exam" onclick="setMode('exam')">📝 考试模式 (限时交卷)</button>
            </div>

            <div class="card" style="background:#f8f9fa;">
                <label>抽题数量设置</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div><label>名词解释</label><input type="number" id="num-noun" value="5"></div>
                    <div><label>填空题</label><input type="number" id="num-fill" value="5"></div>
                    <div><label>判断题</label><input type="number" id="num-judge" value="5"></div>
                    <div><label>简答/论述</label><input type="number" id="num-essay" value="2"></div>
                </div>
            </div>

            <div id="exam-time-box" class="hidden">
                <label>考试时长 (分钟)</label>
                <input type="number" id="exam-time" value="180">
            </div>

            <label>AI API Key (阿里百炼)</label>
            <input type="password" id="api-key" value="sk-b65219b6fe91460aae42bed7d5e166b4">
            
            <button class="btn" style="width:100%; margin-top:15px; font-size:18px;" onclick="startQuiz()">🚀 开始答题</button>
        </div>

        <div id="quiz-panel" class="card hidden">
            <div id="timer" class="timer hidden">03:00:00</div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span id="progress"></span>
                <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" onclick="exitQuiz()">退出</button>
            </div>
            
            <div id="question-display"></div>

            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button class="btn btn-outline" onclick="nav(-1)" id="btn-prev">上一题</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="checkAnswer()" id="btn-check" style="background:#27ae60;">✅ 提交本题 & 看解析</button>
                    <button class="btn" onclick="nav(1)" id="btn-next">下一题</button>
                </div>
            </div>
            <button class="btn" onclick="submitExam()" id="btn-submit-exam" style="width:100%; margin-top:20px; background:#c0392b; display:none;">🏁 交卷</button>
        </div>

        <div id="result-panel" class="card hidden">
            <h2>📊 成绩单</h2>
            <div id="score-board"></div>
            <button class="btn" onclick="location.reload()" style="width:100%">再来一次</button>
        </div>

        <div class="card" style="border-top: 4px solid #f1c40f;">
            <h3>📥 题库更新工具</h3>
            <p style="font-size:14px; color:#666;">如果想加入全部真题：请复制文档全文 -> 粘贴到下面 -> 点击解析 -> <b>解析成功后会自动加载到当前系统</b>。</p>
            <textarea id="import-text" rows="3" placeholder="在此粘贴《生化真题.docx》的全部内容..."></textarea>
            <button class="btn btn-outline" onclick="importQuestions()">解析并载入题库</button>
            <p id="import-status" style="font-size:12px; margin-top:5px;"></p>
        </div>
    </div>

    <script>
        // ================= 数据区 (预设部分题目) =================
        let questionBank = [
            {id: 1, year: "1995", type: "名词解释", question: "肽单元", answer: "肽链中的酰胺基团称为肽单位，由四个原子（CHON）及相连的两个α-碳原子组成。"},
            {id: 2, year: "1995", type: "判断题", question: "DNA复制时，前导链的合成是连续的，滞后链的合成是不连续的。", answer: "对。前导链沿着解链方向 5'->3' 连续合成，而滞后链则需要合成冈崎片段再连接。"},
            {id: 3, year: "2024", type: "填空题", question: "人体内嘌呤核苷酸分解代谢的最终产物是___。", answer: "尿酸"},
            {id: 4, year: "2024", type: "问答题", question: "简述蛋白质二级结构的类型及其特点。", answer: "主要包括α-螺旋、β-折叠、β-转角和无规卷曲。α-螺旋是右手螺旋，氢键维持稳定；β-折叠是多肽链平行或反平行排列..."}
        ];

        // ================= 逻辑区 =================
        let currentMode = 'training';
        let quizList = [];
        let currIdx = 0;
        let userAns = {}; // {id: "答案"}
        let timerInterval;

        // 模式切换
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-train').className = mode === 'training' ? 'btn' : 'btn btn-outline';
            document.getElementById('mode-exam').className = mode === 'exam' ? 'btn' : 'btn btn-outline';
            document.getElementById('exam-time-box').className = mode === 'exam' ? '' : 'hidden';
        }

        // 开始答题
        function startQuiz() {
            // 1. 抽题
            const types = {
                noun: parseInt(document.getElementById('num-noun').value) || 0,
                fill: parseInt(document.getElementById('num-fill').value) || 0,
                judge: parseInt(document.getElementById('num-judge').value) || 0,
                essay: parseInt(document.getElementById('num-essay').value) || 0
            };

            const pool = {
                noun: questionBank.filter(q => q.type.includes('名词')),
                fill: questionBank.filter(q => q.type.includes('填空')),
                judge: questionBank.filter(q => q.type.includes('判断')),
                essay: questionBank.filter(q => !q.type.includes('名词') && !q.type.includes('填空') && !q.type.includes('判断')) // 其他都算简答/论述
            };

            quizList = [
                ...shuffle(pool.judge).slice(0, types.judge),
                ...shuffle(pool.fill).slice(0, types.fill),
                ...shuffle(pool.noun).slice(0, types.noun),
                ...shuffle(pool.essay).slice(0, types.essay)
            ];

            if (quizList.length === 0) {
                alert("题库为空或未找到对应题目，请先在下方导入题库！");
                return;
            }

            // 2. 初始化UI
            currIdx = 0;
            userAns = {};
            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('quiz-panel').classList.remove('hidden');
            renderQuestion();

            // 3. 考试模式倒计时
            if (currentMode === 'exam') {
                document.getElementById('timer').classList.remove('hidden');
                document.getElementById('btn-check').classList.add('hidden'); // 考试不能立马看答案
                document.getElementById('btn-submit-exam').style.display = 'block'; // 显示交卷
                startTimer(parseInt(document.getElementById('exam-time').value) * 60);
            } else {
                document.getElementById('timer').classList.add('hidden');
                document.getElementById('btn-check').classList.remove('hidden');
                document.getElementById('btn-submit-exam').style.display = 'none';
            }
        }

        // 渲染题目
        function renderQuestion() {
            const q = quizList[currIdx];
            const total = quizList.length;
            document.getElementById('progress').innerText = `第 ${currIdx + 1} / ${total} 题`;
            
            // 按钮状态
            document.getElementById('btn-prev').disabled = currIdx === 0;
            if (currentMode === 'training') {
                 document.getElementById('btn-next').disabled = currIdx === total - 1;
            } else {
                 document.getElementById('btn-next').disabled = currIdx === total - 1;
            }

            // 输入框提示
            let placeholder = "请输入答案...";
            if (q.type.includes("判断")) placeholder = "请输入'对'或'错'，若为错请说明理由...";

            const savedAns = userAns[q.id] || "";
            const isChecked = q.checked === true; // 训练模式下是否已提交

            let html = `
                <div class="question-box">
                    <div>
                        <span class="meta">${q.type}</span>
                        ${(currentMode==='training' && isChecked) || currentMode==='exam' ? '' : '<span class="meta">年份隐藏</span>'}
                        ${(currentMode==='training' && isChecked) ? `<span class="meta" style="color:#e67e22">${q.year}年</span>` : ''}
                    </div>
                    <h3 style="text-align:left; margin:10px 0;">${q.question}</h3>
                    <textarea id="ans-input" rows="5" placeholder="${placeholder}" oninput="userAns[${q.id}] = this.value">${savedAns}</textarea>
                </div>
            `;

            // 训练模式：显示解析区
            if (currentMode === 'training') {
                html += `
                    <div id="feedback-area" class="${isChecked ? '' : 'hidden'} ai-feedback">
                        <h4>📖 参考答案：</h4>
                        <p>${q.answer}</p>
                        <div id="ai-box-${q.id}">
                            <button class="btn btn-outline" onclick="callAI(${q.id})" style="font-size:12px;">🤖 召唤 AI 老师严格判卷</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('question-display').innerHTML = html;
        }

        // 导航
        function nav(dir) {
            currIdx += dir;
            renderQuestion();
        }

        // 训练模式：提交单题
        function checkAnswer() {
            const q = quizList[currIdx];
            q.checked = true; // 标记为已看答案
            renderQuestion(); // 重新渲染以显示答案
        }

        // 考试模式：交卷
        function submitExam() {
            if(!confirm("确认交卷？")) return;
            clearInterval(timerInterval);
            
            // 渲染结果页
            document.getElementById('quiz-panel').classList.add('hidden');
            document.getElementById('result-panel').classList.remove('hidden');
            
            let html = '';
            quizList.forEach((q, i) => {
                html += `
                    <div class="card" style="border-left:5px solid #bdc3c7;">
                        <span class="meta">${q.year}</span> <span class="meta">${q.type}</span>
                        <p><b>Q${i+1}: ${q.question}</b></p>
                        <div style="background:#f1f1f1; padding:10px; margin:5px 0;">你的回答：${userAns[q.id] || "未作答"}</div>
                        <div style="background:#eafaf1; padding:10px; margin:5px 0;">参考答案：${q.answer}</div>
                        <div id="result-ai-${q.id}" style="margin-top:10px;">
                            <button class="btn btn-outline" onclick="callAI(${q.id}, 'result-ai-${q.id}')">🤖 AI 判分</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('score-board').innerHTML = html;
        }

        // ================= AI 判卷核心 (Prompt 在这里!) =================
        async function callAI(qid, divId) {
            const q = questionBank.find(item => item.id === qid);
            const ans = userAns[qid] || "未作答";
            const target = document.getElementById(divId || `ai-box-${qid}`);
            const apiKey = document.getElementById('api-key').value;

            target.innerHTML = '<span class="loading">🧠 AI 正在像考研阅卷组长一样审视你的答案...</span>';

            // 🔴 重点：这里就是你问的提示词 (Prompt) 设置 🔴
            // 你可以修改 content 里的文字来改变 AI 的性格
            const systemPrompt = "你是一位极度严格的生物化学考研阅卷专家。你的任务是根据题目类型、标准答案，对考生的回答进行打分（0-10分）。";
            
            let typeInstruction = "";
            if (q.type.includes("判断")) {
                typeInstruction = "这是一道判断题。如果考生的判断（对/错）错误，直接给0分。如果判断正确但理由缺失或错误，给3-5分。只有判断和理由都准确才给高分。";
            } else {
                typeInstruction = "对于填空题，必须精准。对于名词解释和简答题，要检查关键点（Keywords），漏一个关键点扣相应分数，不要给同情分。";
            }

            const userPrompt = `
【题目】(${q.type})：${q.question}
【标准答案】：${q.answer}
【考生回答】：${ans}

请给出：
1. **得分**：X / 10
2. **点评**：指出错误之处，并给出更专业的表述建议。
`;

            try {
                const res = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "qwen-plus",
                        messages: [
                            { role: "system", content: systemPrompt + typeInstruction },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });
                const data = await res.json();
                if (data.choices) {
                    target.innerHTML = marked.parse(data.choices[0].message.content);
                } else {
                    target.innerHTML = `<span style="color:red">AI 报错: ${data.message}</span>`;
                }
            } catch (e) {
                target.innerHTML = `<span style="color:red">网络错误，请检查 API Key。</span>`;
            }
        }

        // ================= 工具函数 =================
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startTimer(seconds) {
            let t = seconds;
            const display = document.getElementById('timer');
            timerInterval = setInterval(() => {
                const m = Math.floor(t / 60).toString().padStart(2, '0');
                const s = (t % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;
                if (t-- <= 0) {
                    clearInterval(timerInterval);
                    alert("考试结束，强制交卷！");
                    submitExam();
                }
            }, 1000);
        }

        function exitQuiz() {
            if(confirm("确定退出当前答题？进度将丢失。")) location.reload();
        }

        // ================= 题库解析器 =================
        function importQuestions() {
            const text = document.getElementById('import-text').value;
            if (!text.trim()) { alert("请先粘贴内容！"); return; }
            
            try {
                const lines = text.split('\n');
                let newBank = [];
                let curr = null;
                let year = "未知";
                let type = "未知";

                // 简单的状态机解析
                lines.forEach(line => {
                    line = line.trim();
                    if(!line) return;
                    
                    // 匹配年份 "1995年..."
                    if (line.match(/\d{4}年/)) {
                        year = line.match(/(\d{4})/)[1];
                        return;
                    }
                    // 匹配大题类型 "一、名词解释"
                    if (line.match(/^[一二三四五]、/)) {
                        type = line.replace(/^[一二三四五]、/, '').trim();
                        return;
                    }
                    // 匹配具体题目 "1. 题目..."
                    const qMatch = line.match(/^(\d+)\.(.*)/);
                    if (qMatch) {
                        if (curr) newBank.push(curr);
                        curr = {
                            id: newBank.length + Date.now(), // 唯一ID
                            year: year,
                            type: type,
                            question: qMatch[2].trim(),
                            answer: ""
                        };
                    } else if (curr) {
                        // 剩下的行都算作上一题的答案
                        curr.answer += line + "\n";
                    }
                });
                if (curr) newBank.push(curr);

                // 更新全局题库
                questionBank = newBank;
                document.getElementById('import-status').innerText = `✅ 成功导入 ${newBank.length} 道题目！现在点击上方“开始答题”即可使用新题库。`;
                document.getElementById('import-status').style.color = "green";
                alert(`成功识别 ${newBank.length} 道题！\n年份示例：${newBank[0].year}\n类型示例：${newBank[0].type}`);
                
            } catch (e) {
                alert("解析出错，请检查文本格式。");
                console.error(e);
            }
        }
    </script>
</body>
</html>
