留原来的菌落平板作对照，取出已经长有菌落的膜，用碱液处理，使菌落发生裂解，DNA随之变性。\n\n②接着用蛋白酶K处理硝酸纤维素膜去除蛋白质，形成菌落DNA的印迹。80°烘烤滤膜，将DNA固定在膜上，随后将滤膜与放射性标记的DNA或RNA探针杂交，通过放射性自显影显示杂交结果。在X光底片上显黑色斑点就是寻找的目的基因，可以通过对应于平板上的位置找到相应菌落。\n\n2） PCR筛选\n\n前提是已知足够的序列信息并获得基因特异性引物。首先将整个文库保存在多孔培养板上，用设计好的目的基因探针对每个孔进行PCR筛选，鉴定出阳性的孔，把每个阳性孔中的克隆再稀释到次级多孔板中进行PCR筛选。重复以上程序，直到鉴定出与目的基因对应的单个克隆为止。\n\n3） 免疫筛选\n\n免疫筛选法是基于抗原抗体特异性结合原理，所以该法适用于对表达文库的筛选。也就是说如果该DNA或者cDNA文库是用表达载体构建的，每个克隆都可以在宿主细胞中表达，产生所编码的蛋白质，就可以用免疫筛选法进行筛选。即使实验中靶基因的序列完全未知，只要拥有针对该基因产物的特异性抗体，也能用这个方法进行筛选。\n\n先将菌落或噬菌斑影印到硝酸纤维素膜上，原位溶解菌落释放抗原蛋白，再用抗体与固定了抗原的膜杂交，抗原抗体结合后，再用标记的二抗与之反应，通过对标记物的检测，就可以找到阳性克隆。"},{"year":"2002","type":"名词解释","number":"1","question":"沉降系数","answer":"是描述大分子或颗粒在离心场中沉降速度的物理量，与大分子的大小，形状和密度有关，也与溶剂的密度和黏度有关。"},{"year":"2002","type":"名词解释","number":"2","question":"脂蛋白","answer":"是由脂质和蛋白质构成的复合体，蛋白质部分又称脱辅基脂蛋白或载脂蛋白。因其广泛分布于血浆中，所以又称为血浆脂蛋白。根据密度由低到高分为乳糜微粒，极低密度脂蛋白，低密度脂蛋白和高密度脂蛋白。脂蛋白大多都是球状颗粒，由一个疏水脂质（甘油三酯或胆固醇脂）为核心，极性脂（磷脂或游离脂肪酸）和载脂蛋白组成的外壳层构成。载脂蛋白的主要功能包括，运载脂质；稳定脂蛋白结构；疏水脂质的增溶剂；细胞膜上脂蛋白识别位点；激活脂蛋白酶。"},{"year":"2002","type":"名词解释","number":"3","question":"酶的专一性","answer":"是酶分子和底物分子相互识别的结果，即酶对所催化的底物具有一定专一性。可分为结构专一性和立体异构专一性。结构专一性包括绝对专一性和相对专一性，前者只能识别一种底物，如DNA聚合酶I和脲酶；后者可以识别结构类似的一类底物，如α-D-葡糖苷酶。立体异构专一性包括旋光异构专一性（L-氨基酸氧化酶只能作用于L-氨基酸），顺反异构专一性（琥珀酸脱氢酶只能催化琥珀酸生成延胡索酸）以及构象异构专一性。酶和底物的专一性是由于结构互补，诱导契合和分子之间相互识别实现的。酶分子是高柔性的动态构象分子，当酶分子和底物分子相互靠近时，酶蛋白受底物分子诱导，其构象发生有利于底物分子结合的变化，底物分子也发生形变，二者在此基础上互补契合进行反应。"},{"year":"2002","type":"名词解释","number":"4","question":"3\\'\\--\\>5\"磷酸二酯键","answer":"一分子磷酸和两分子醇（羟基）结合形成两个酯键，这个酯键成了两个醇之间的桥梁。例如一个核苷的5-羟基和另一个核苷的3-羟基与同一个磷酸酯化，就形成磷酸二酯键。"},{"year":"2002","type":"名词解释","number":"5","question":"克隆","answer":"在多细胞生物水平上，克隆是指具有相同基因型，同一物种的两个或多个个体组成的群体，例如由同一个受精卵分裂而来的单卵双生子为一个克隆；细胞水平上，由同一个祖细胞分裂衍生而来的具有相同遗传物质的一群子细胞；在DNA水平上，是指将限制酶切片段连接到自主复制载体上，导入宿主细胞，进行无性繁殖，使DNA片段得到扩增。"},{"year":"2002","type":"名词解释","number":"6","question":"RT-PCR","answer":"即反转录PCR，是一种将逆转录和PCR结合的技术，也就是将mRNA逆转录出的第一条cDNA作为PCR的模板进行扩增，逆转录反应和PCR可以分开进行，也可以合在同一个系统中进行。功能是：特异cDNA的扩增，制备cDNA探针，构建cDNA文库；分析基因转录产物。"},{"year":"2002","type":"名词解释","number":"7","question":"等电聚焦","answer":"IEF，又称电聚焦技术，是一种高分辨率的蛋白质分离技术，主要用于测定蛋白质的等电点。利用特殊缓冲液（两性电解质）在聚丙烯酰胺凝胶电泳中形成pH梯度，蛋白质在电泳时迁移到他的等电点PI时，即蛋白质到达梯度中某一pH时，蛋白质就不再带有净的正电荷或负电荷了，停止迁移，实现蛋白质的分离。目前常用的凝胶包括聚丙烯酰胺凝胶，葡聚糖凝胶，琼脂糖凝胶等。这种方法常用于分离同工酶，分子量接近但等电点不同的蛋白质。"},{"year":"2002","type":"名词解释","number":"8","question":"Co-Chaperone","answer":"分子伴侣"},{"year":"2002","type":"名词解释","number":"9","question":"脂肪酸的α-氧化02/17","answer":"脂肪酸的氧化作用发生在α-碳原子上，在脂肪酸过氧化酶的催化下分解放出CO2，生成比原来少一个碳原子的脂肪酸，不消耗也不产生ATP，这种氧化作用称为α-氧化作用，可以用于降解不能直接进行β-氧化的支链或奇数脂肪酸，不需要活化，在过氧化物酶体中进行。典型底物为植烷酸，其β-碳原子上有一位被甲基取代，因此需要先进行α-氧化脱掉α-碳原子形成降植烷酸，再进行β氧化彻底降解，长时间不降解导致积累，可能引发外周神经炎型运动失调及视网膜炎症。"},{"year":"2002","type":"名词解释","number":"10","question":"一碳单位","answer":"在代谢过程中，某些化合物（如氨基酸）可以分解产生具有一个碳原子的基团，如甲基-CH3、亚甲基-CH2-、次甲基-CH=、羟甲基-CH2OH、甲酰基-OC-H、亚氨甲基-CH=NH，称为一碳单位，是生物体内各种化合物甲基化的主要来源，在体内不能游离存在，需要以四氢叶酸作为载体。能够形成一碳单位的氨基酸包括Gly、Ser、Thr、Met、His以及Trp等，主要参与嘌呤、嘧啶以及磷脂的生物合成。其中Met参与形成的S-腺苷甲硫氨酸SAM参与诸多甲基化反应，是很活泼的甲基化供体，如磷脂酰乙醇胺连续三次甲基化生成磷脂酰胆碱，每一步都以S-腺苷甲硫氨酸（SAM）为甲基供体。"},{"year":"2002","type":"填空题","number":"1","question":"肌球蛋白本身具有 **ATP酶** 酶的活性，释放能量时引起肌肉收缩。","answer":""},{"year":"2002","type":"填空题","number":"2","question":"蛋白质二级和三级结构之间经常存在两种结构组合叫 **超二级结构** 和\n**结构域**","answer":""},{"year":"2002","type":"填空题","number":"3","question":"溴氰化氢作用于 **Met** 羧基形成的肽键，裂解后该残基变为\n**高半胱氨酸内酯**","answer":""},{"year":"2002","type":"填空题","number":"4","question":"协同效应的结构基础是 **蛋白质分子的缔合作用（多个亚基）**","answer":""},{"year":"2002","type":"填空题","number":"5","question":"镶刀形细胞贫血病是最早被认识的一种 **分子** 病 。","answer":""},{"year":"2002","type":"填空题","number":"6","question":"当底物浓度等于0.25Km 时，反应速度与最大速度的比为 **1:5**","answer":""},{"year":"2002","type":"填空题","number":"7","question":"磺胺药抑制 **二氢叶酸合成酶** 酶，而导致对细菌繁殖的抑制。","answer":""},{"year":"2002","type":"填空题","number":"8","question":"辅酶与酶的结合比辅基与酶的结合更为 **松弛**","answer":""},{"year":"2002","type":"填空题","number":"9","question":"在酶的双倒数作图中，只改变斜率不改变纵轴截距的抑制为 **竞争性抑制**","answer":""},{"year":"2002","type":"填空题","number":"10","question":"寡聚酶的基本结构单位是 **三级结构** ,多酶体系的基本结构单位是\n**亚基**","answer":""},{"year":"2002","type":"填空题","number":"11","question":"酶具有高效催化效应的因素有 **邻近效应和定向效应**\n、**底物形变和诱导契合** 、**多元催化和协同效应** 和\n**酶活性部位的微环境**","answer":""},{"year":"2002","type":"填空题","number":"12","question":"核酸在 **260** nm 处有最大吸收峰。","answer":""},{"year":"2002","type":"填空题","number":"13","question":"染色质中DNA与 **组蛋白八聚体** 结合成复合体，并形成串珠状的\n**核小体** 结构。\n\n14二硝基苯酚能抑制 **氧化磷酸化的解偶联剂**","answer":""},{"year":"2002","type":"填空题","number":"15","question":"生物体内CO2的生成不是碳与氧的直接结合，而是 **有机化合物的氧化脱羧**","answer":""},{"year":"2002","type":"填空题","number":"16","question":"糖酵解过程中催化一摩尔六碳糖裂解为两摩尔三碳糖的反应的酶是 **醛缩酶**","answer":""},{"year":"2002","type":"填空题","number":"17","question":"糖原合成的关键酶是 **糖原合酶**","answer":""},{"year":"2002","type":"填空题","number":"18","question":"丙酮酸激酶是 **糖酵解** 的关键酶。\n\n19一次三羧酸循环可有 **4** 次脱氢过程和 **1** 次底物水平的磷酸化过程。","answer":""},{"year":"2002","type":"填空题","number":"20","question":"脂肪酸生物合成时乙酰CoA从线粒体转运至胞液的循环是 **三羧酸穿梭**","answer":""},{"year":"2002","type":"填空题","number":"21","question":"脂酰CoA经一次β氧化可生成一分子乙酰CoA和 **少了两个碳原子的脂酰辅酶A**","answer":""},{"year":"2002","type":"填空题","number":"22","question":"尿素循环的部位是 **肝细胞的线粒体和细胞溶胶**\n\n23嘧啶核苷酸从头合成的的原料有 **PRPP** 、 **天冬氨酸** 、 **谷氨酰胺**\n和 CO₂。","answer":""},{"year":"2002","type":"填空题","number":"24","question":"DNA复制时与DNA解链有关的酶和蛋白质是 **DNA解旋酶 、 DNA拓扑异构酶II\n、 单链结合蛋白SSB 。**","answer":""},{"year":"2002","type":"填空题","number":"25","question":"乳糖操纵子的调节基因是 **lacI（阻遏物基因）** 和 **lacO（操纵基因**\n。","answer":""},{"year":"2002","type":"填空题","number":"26","question":"生长因子与其相应受体结合后可激活受体自身具有的 **酪氨酸激酶**\n活性，从而使 **受体自身酪氨酸残基** 磷酸化。","answer":""},{"year":"2002","type":"简答题","number":"1","question":"如何从血红蛋白的结构解释它的呼吸功能?","answer":"蛋白质的结构和功能密切相关，结构是功能的基础，结构的改变往往导致功能的改变，蛋白质的生物学功能通常取决于它的构象。\n\n脊椎动物血红蛋白分子近似球形，由四个多肽亚基组成，每个亚基都含有一个血红素基和一个氧结合部位，四个亚基依靠八个离子键连接。成人的Hb分子大多为HbA（亚基组成为α2β2），其次为HbA2（亚基组成为α2δ2），不同种亚基间相互作用力大，用尿素处理血红蛋白，得到两个Hbα-Hbβ二聚体，二聚体保持完整。\n\n血红蛋白与氧结合时表现出协同效应，即当第一个亚基与一分子氧结合后，引起八个离子键断裂，血红蛋白分子构象改变，由T态变成R态，其他亚基结合结合氧气的速率大大提高，氧气与氧气的结合是互利的。除此之外血红蛋白和氧结合还表现出波尔效应，即H+和CO2影响血液中血红蛋白与氧气结合亲和力的效应。当环境中pH下降（氢离子浓度升高）或二氧化碳浓度升高会降低血红蛋白和氧气的亲和力，氢离子与血红蛋白β亚基His结合使其质子化，与α亚基中的Asp形成链内盐桥，稳定血红蛋白T态，二氧化碳与血红蛋白中每个珠蛋白链的氨基端结合，形成的氢离子贡献于波尔效应，形成的氨甲酸也构成盐桥稳定T态，降低对氧的亲和力，促进氧气释放，氧合曲线向右移动，氧气和氢离子、二氧化碳与血红蛋白的结合是互斥的。\n\n当血液流经肺部时，由于氧气浓度高，血红蛋白构象转化为R态，不仅有利于结合O2还能促进CO2和H+的释放，大大提高了血红蛋白结合和运输氧气的能力，形成大量氧和血红蛋白；当血液流经二氧化碳含量高，pH低的组织如肌肉时，血红蛋白构象转化为T态，氧气被释放，而氧气的释放又有利于结合CO2和H+，补偿因呼吸作用产生二氧化碳和氢离子而下降的pH，起到缓冲血液pH的作用。\n\nBPG也是血红蛋白一个重要的别构效应物，其上携带的负电荷与β亚基携带的正电荷形成盐桥，有助于稳定T态，因而降低血红蛋白对氧的亲和力，促进氧的释放。当Hb和氧结合转变为R态后，BPG结合口袋变小，容纳不了BPG。胎儿的Hb分子主要为HbF（亚基组成为α2γ2），丝氨酸取代成人中的组氨酸，减少正电荷，降低对BPG的亲和力，进而增强对氧的亲和力。因此能胎盘血液流动从母体中获得氧。\n\n协同效应，波尔效应和别构效应共同使血红蛋白运输氧气协助呼吸能力达到最高水平。"},{"year":"2002","type":"简答题","number":"2","question":"八肽的氨基酸组成为Asp,Ser,Gly,Ala,Met,Phe和Lys2。","answer":"**①FDNB 与之反应再酸水解得DNP-Ala。**\n\n**②胰凝乳蛋白酶消化后分出一个四肽，其组成为Asp,Gly,Lys和Met,此四肽与FDNB反应生成DNP-Gly。胰蛋白酶消化八肽后得到组成为Lys,Ala,Ser及\nPhe,Lys,Gly 两个三肽及一个二肽，此二肽被 CNBr\n处理游离出Asp,请写出八肽顺序及推知过程。**\n\nN-C：Ala-Ser-Lys-Phe-Gly-Lys-Met-Asp"},{"year":"2002","type":"简答题","number":"3","question":"简述核酸的组成、结构及生物学功能","answer":"核酸是一种多聚核苷酸，它的基本结构单位是核苷酸，核苷酸由核苷和无机磷酸基组成。核苷是戊糖和碱基通过β-N-糖苷键连接而成，碱基和糖环平面垂直，戊糖包括核糖和脱氧核糖，DNA中碱基包括腺嘌呤，鸟嘌呤，胞嘧啶，胸腺嘧啶。RNA中尿嘧啶代替了胸腺嘧啶。\n\n**DNA：**\n\n结构：一级结构：由数量极其庞大的4种脱氧核糖核苷酸通过3，5-磷酸二酯键连接起来的直线形或环形多聚体。二级结构：在一级结构的基础上通过次级键形成的双股或多股螺旋结构，一般DNA为双股螺旋，呈现不同并可在一定条件下发生转换的构象。最常见的是B型双螺旋，维持双螺旋最主要的力是碱基堆积力以及氢键。三级结构：双螺旋DNA分子扭曲折叠形成的特定构象，包括二级结构单元之间的相互作用，单链与二级结构单元之间的相互作用以及DNA拓扑学特征。最常见的三级结构是超螺旋。四级结构：真核生物DNA以核小体为单位形成高度有序致密结构，DNA与蛋白质复合物。\n\n功能：作为遗传物质，携带遗传信息\n\n**RNA：**\n\n（1）mRNA\n\n结构：以DNA为模板，多种NTP为原料形成的线状多聚核苷酸，各种mRNA长度不一。mRNA上每相邻三个核苷酸序列形成遗传密码或称三联体密码，编码一个氨基酸。原核生物的转录多以操纵子为单位，一条mRNA上有多个编码区，为多顺反子，其上结构为5端（有SD序列，半衰期短），3端，各编码区之间为非编码区。真核生物为单顺反子，5端帽子结构，5非编码区，编码区，3非编码区，3polyA尾\n\n功能：蛋白质合成和翻译过程的模板，从DNA处获得信息，决定氨基酸的组成，数量，排列顺序。mRNA上每一个密码子通过与tRNA上反密码子配对决定氨基酸排序。真核生物5段帽子结构可能与翻译起始有关，它能促进核糖体识别和结合起始密码子AUG\n\n（2）tRNA\n\n结构特征：含有较多稀有碱基，半衰期长\n\n一级结构：核苷酸排列顺序，单链RNA\n\n二级结构：三叶草型，包括五部分结构\n\n氨基酸臂：七对碱基组成，tRNA3、5端富含G的序列组成双螺旋区域，3端有-CCA-OH，可以结合活化的氨基酸\n\n二氢尿嘧啶环：有两个二氢尿嘧啶，与氨酰tRNA合成酶的结合有关\n\n反密码子环：七个核苷酸，中间三个构成反密码子，识别并结合mRNA上相应的密码子\n\nTφC环：茎环含有七对核苷酸，可识别并结合核糖体rRNA\n\n可变环：也叫附加叉，位于反密码子环和TφC环之间，与tRNA的分类有关\n\n三级结构：倒L型，碱基组成倾向于增强碱基平面间的疏水堆积力，和氢键一起维持构象稳定。氨基酸臂和TφC环位于一横，CCA位于一端，其他三个位于一竖，反密码子位于一端\n\n功能：形成氨酰tRNA，携带活化的氨基酸到核糖体上，其反密码子识别并结合模板mRNA上相应密码子，起翻译作用。参与基因表达调控和细胞代谢，还参与了很多物质的合成，还是转录酶的引物。\n\n作用机制：在肽链生成过程中，第一个进入核糖体的称为起始tRNA，起延伸作用的称为延伸tRNA，按照mRNA上的密码子依次进入核糖体，氨基酸合成到肽链上后离开，称作tRNA循环。反密码子和密码子不是严格的一一对应关系，在遗传密码特性中称为摆动性。\n\n（3）rRNA\n\n结构：由大亚基和小亚基构成，原核生物为5S，16S，26S；真核生物为5S，5.8S，18S，28S\n\n功能：蛋白质合成过程中核糖体的重要组分；肽基转移酶活性在23srRNA/28srRNA；参与tRNA和mRNA的结合\n\n（4）反义RNA\n\n是一种调节型RNA，具有与特定mRNA翻译起始位点互补的序列，结合位点也可以位于mRNA下游。通过与mRNA结合，阻断核糖体小亚基对起始密码子的识别和与SD序列的结合，也可以使靶RNA降解或失活。大肠杆菌转座子Tn10在合成转座酶mRNA的同时还合成出一条与其5撇端序列互补的小RNA即反义RNA，从而抑制mRNA的活性，使转座酶维持在一定水平，避免转座频率过高而导致宿主死亡。利用反义RNA进行调节的现象在原核和真核生物中均十分普遍。\n\n（5）miRNA\n\n由内源非编码pre-mRNA经过剪切修饰而来的单链小RNA，含有茎环结构，形成RISC在靶mRNA上扫描，与目标mRNA部分互补，达到抑制翻译的效果。\n\n（6）siRNA\n\n来自内源或外源的双链小RNA，dsRNA被Dicer切割成多个具有特定长度的双链RNA即siRNA。组装形成RISC，招募Argonaute蛋白降解为单链，在靶mRNA上扫描，与目标mRNA完全互补，识别并切割，或者招募组蛋白甲基转移酶到特定染色质区域，使该区域His甲基化，导致该区域异染色质化，基因沉默。可以调节基因的表达并保护基因组免受外源核酸侵入。\n\n（7）其他小RNA\n\nsnoRNA：核仁小RNA，指导真核生物rRNA前体的甲基化，假尿嘧啶化和切割\n\nsnRNA：核内小RNA，参与hnRNA的剪接\n\ngRNA：指导RNA，与被编辑的RNA结合，作为编辑的模板，可决定尿苷酸的插入和删除"},{"year":"2002","type":"简答题","number":"4","question":"比较原核生物与真核生物内RNA生物合成的异同点","answer":"相同点：\n\n1.  都是以DNA为模板\n\n2.  都遵循建基互补配对原则\n\n3.  都从模板链5-3\n\n4.  聚合过程每次都只延伸一个核苷酸，且核苷酸之间以磷酸二酯键相连\n\n5.  真核和原核tRNA和rRNA转录后加工机制类似，rRNA都为先甲基化再被切割\n\n不同点：\n\n1.  RNA聚合酶不同：原核生物如大肠杆菌中的RNA聚合酶。是一个由五种亚基构成的六聚体（α2ββ撇σω）。无σ亚基为核心酶，有σ则为全酶。α：酶的装配，与启动子上游元件活化因子结合；β：结合核苷酸，促进磷酸二酯键的合成；β撇：与DNA模板结合；σ：与启动子结合，促进转录起始；ω：未知。真核生物中RNA聚合酶分为三种，I、II、III。I：转录rRNA（5.8s，18s，28s），对鹅膏蕈碱耐受，对放线菌最敏感；II：转录产物为hnRNA，snRNA，microRNA，最活跃，对鹅膏蕈碱极敏感；III：转录产物为5srRNA，tRNA，snRNA，scRNA。对鹅膏蕈碱中度敏感\n\n2.  是否需要转录因子：原核生物中，RNA聚合酶直接识别启动子。真核生物中需要转录因子的协助，识别启动子起始转录。\n\n3.  单/多顺反子：原核生物多顺反子，真核生物单顺反子\n\n4.  终止方式：原核生物终止包括依赖于ρ因子的终止子和不依赖于ρ因子的终止子。真核生物终止更加复杂。\n\n5.  转录产物mRNA修饰：真核生物中mRNA为断裂基因，需要经过特定的剪切，拼接，去掉内含子，连接外显子，形成成熟有生物活性的的mRNA，半衰期长。原核生物mRNA没有内含子，半衰期短。\n\n6.  转录调节区距离：原核生物转录调节区位于启动子附近如-10，-35.真核生物调节区较远，包括GC框，CAAT框，影响起始频率，增强子可远距离控制等。\n\n7.  原核生物转录翻译同时进行，真核生物独自进行。"},{"year":"2002","type":"简答题","number":"5","question":"有一真核生物的微量活性蛋白，它具有很好的药用前景，请你谈一谈如何才能获得大量的此微量活性蛋白去进行药理实验。","answer":"（1）获取基因序列并确定修饰需求\n\n首先进行蛋白质测序，根据氨基酸序列从DNA文库中找到相应的DNA，转录成mRNA后，并进行密码子优化。\n\n（2）选择合适的表达体系\n\n随后要明确该蛋白是否需要真核特有的翻译后修饰（如糖基化、二硫键形成或分泌信号），为选择合适的表达体系提供依据。若蛋白不需要复杂修饰，可先在大肠杆菌中快速表达以评估可溶性与活性；若需要二硫键或简单糖基化，可采用酵母系统（如毕赤酵母）；若对折叠与糖基化要求更高，则应选用昆虫细胞或哺乳动物细胞（如CHO）。\n\n（3）构建表达载体并建立表达体系\n\n选择含强启动子的表达载体，加入适当信号肽以实现分泌表达，并在N端或C端加上可切除的亲和标签（如His标签），方便后续纯化。经转化或转染宿主细胞后，优化表达条件（温度、诱导剂浓度等）以获得最高表达量。\n\n（4）发酵放大与蛋白纯化\n\n当确定条件后，可采用发酵罐或细胞培养反应器进行大规模生产。纯化通常遵循\"亲和层析---离子交换---凝胶过滤\"三步法，以获得高纯度蛋白；分泌型表达可直接从培养基上清液中获得，细菌源则需裂解并去除内毒素。\n\n（5）活性检测与质量控制\n\n纯化后需进行SDS-PAGE、Western\nblot、HPLC或质谱确认分子量与纯度；同时检测蛋白的生物活性，确保与天然蛋白等效，并检测稳定性与宿主杂质。\n\n（6）制剂与储存\n\n根据蛋白性质筛选合适的缓冲液和稳定剂，可进行冻干处理以便长期保存。最终获得可用于药理实验的大量高纯度活性蛋白。"},{"year":"2002","type":"简答题","number":"6","question":"动物体内合成一摩尔18碳饱和脂肪酸需要消耗多少摩尔ATP?","answer":"首先需要经过8次循环，8个乙酰CoA在乙酰CoA羧化酶的作用下活化成丙二酸单酰CoA，参与脂肪酸链的延伸，消耗8个ATP，16个NADPH。相当于16\\*2.5+8=48"},{"year":"2003","type":"名词解释","number":"1","question":"沉降系数02/03","answer":"**2.双向电泳**\n\n指IEF和SDS-PAGE相结合的分离技术。将蛋白质在薄胶条上用IEF进行第一次分离，再把胶条水平铺设在PAGE上用SDS-PAGE第二次分离。得到的双向电泳谱水平向分离反应PI的差别，垂直向分离反应分子量的差别。可在多种蛋白质的混合物中分离PI相近但分子量不同或分子量相近但PI不同的蛋白质。"},{"year":"2003","type":"名词解释","number":"3","question":"糖蛋白","answer":"是一类糖和蛋白质的共价缀合物，含有一个或几个不同复杂度的寡糖链（较短）。糖蛋白的聚糖和蛋白聚糖的糖胺聚糖相比，分子小，分支和结构多样化。寡糖链富含结构信息，能够形成高度专一的识别位点，被其他蛋白质如凝集素高亲和结合。糖蛋白中寡糖链还原端和蛋白质氨基酸残基共价连接的键称为糖肽键，分为N-糖肽键（N-乙酰葡糖胺和天冬氨酸N原子）和O-糖肽键（N-乙酰半乳糖胺-丝氨酸/苏氨酸O原子）。糖蛋白大多是膜蛋白和分泌蛋白，存在于胞外基质和血液、细胞质膜或细胞内某些特殊细胞器内。"},{"year":"2003","type":"名词解释","number":"4","question":"蛋白质工程","answer":"是以已知的对蛋白质结构和功能的认识，借助计算机辅助设计，利用基因定位诱变的技术，对蛋白质的氨基酸序列、结构和功能进行有目的的改造，使其获得新的性质或增强原有活性的一门技术。蛋白质工程的主要方法大体可分为两类：基于理性设计的方法和基于随机变异的方法。前者根据蛋白的结构或功能信息，直接对关键氨基酸做定点突变或拼接改造；后者先用随机突变、错误PCR等方法制造大量变异，再通过筛选挑出性能更好的蛋白。两类方法往往结合使用：理性设计提供方向，定向进化负责\"微调\"，共同实现对目标蛋白的有效优化。蛋白质工程在工业酶改造、抗体药物优化、疫苗设计、生物材料研发和代谢工程中发挥着重要作用，是现代生物技术与生物医药领域中最具应用价值的技术之一。"},{"year":"2003","type":"名词解释","number":"5","question":"米氏常数Km98/99/03与Ks","answer":"Km就是米氏常数，是米氏酶的特征常数。底物浓度用\\[S\\]表示，vmax表示当酶被完全饱和时，酶促反应最大速率。当\\[S\\]=Km时，v0=vmax/2，即Km指当酶促反应达到最大反应速率一半时的底物浓度，单位为，mol/L。Km的大小只与酶的性质有关，与酶的浓度无关，随反应的底物，温度，pH和离子强度的改变而改变。Km代表酶与底物的亲和力，Km值越小，亲和力越大。Km值可以判断酶的专一性和天然底物，还可以帮助推断某一代谢反应的方向。\n\nKs为ES的解离常数，表示酶和底物亲和力大小。当底物浓度远远大于酶浓度，ES分解成产物的速度不足以破坏E和ES的快速平衡的时候，由于Ks=k2/k1、Km=（k2+k3）/k1，Ks=Km，此时Km也可以表示酶和底物亲和力大小。\n\n![文本 AI\n生成的内容可能不正确。](media/image4.jpeg){width=\"3.986111111111111in\"\nheight=\"0.6003641732283465in\"}"},{"year":"2003","type":"名词解释","number":"6","question":"新陈代谢03/04/23","answer":"是生物体内进行的所有化学变化的总称，是生物体一切生命活动的基础，生命机体和无生命物体的根本区别在于前者能通过新陈代谢不断进行自我更新。包括生物体与外界环境之间的物质能量交换以及生物体内的物质能量转变。分为合成代谢和分解代谢，前者是指利用贮存在ATP或NADH中的能量，将小分子前体合成大分子细胞成分或将外界环境中取得的物质转化为自身组成物质的需能反应，也称同化作用。后者指将有机营养物质降解成中间物进而降解成小分子终产物或将自身组成物质转化成外界环境中的物质，并将过程中产生的能量贮存于ATP和NADH分子中的产能反应，也称作异化作用。"},{"year":"2003","type":"名词解释","number":"7","question":"RNA的发卡结构","answer":"RNA是线性单链分子，只有局部区域是双链结构即发夹结构。这些结构是由于RNA作为单链分子存在二重对称结构，通过自身回折使得互补的碱基配对，通过氢键结合而形成的。作用是：控制转录终止，翻译效率以及mRNA的稳定性。"},{"year":"2003","type":"名词解释","number":"8","question":"RNA的编辑","answer":"是mRNA前体的一种加工方式，通过碱基的替换，插入或删除，改变和扩大原有模板携带的遗传信息，从而编码出更多不同氨基酸序列的蛋白质。介导RNA编辑的方式有两种：位点特异性脱氨基作用，如A→I，C→U；被编辑的mRNA序列与指导RNA（gRNA）互补，与蛋白质结合构成复合体，即编辑体，gRNA可以作为RNA编辑模板指导尿嘧啶的插入和删除。生理意义包括：消除移码突变等基因突变带来的危害，增加基因产物的种类，影响生物发育和分化，是基因表达调控的一种方式。"},{"year":"2003","type":"名词解释","number":"9","question":"双功能mRNA","answer":"双功能mRNA常指在同一条mRNA分子上同时存在两个功能性ORF（开放阅读框），它们可以在不同起始密码子位置开始翻译，从而产生两种氨基酸序列不同、功能不同的蛋白质，使得一条mRNA具备\"一个模板，两种产物\"的特性，因此被称为双功能mRNA。"},{"year":"2003","type":"名词解释","number":"10","question":"乙醛酸循环","answer":"植物、某些微生物（如大肠杆菌和酵母）以及无脊椎动物能够使用乙酸或者其他一些能够在细胞内转化为乙酰CoA的物质作为唯一碳源和生物合成前体。因为在他们体内存在一种特殊的代谢途径，即乙醛酸循环，该途径实际上是TCA循环的变化形式。存在乙醛酸循环体中的两种酶：异柠檬酸裂合酶和苹果酸合酶。每次循环需要两个乙酰CoA进入，不产生CO2、FADH2和ATP，只生成NADH，没有碳单位的损失，而是净生成琥珀酸，进入TCA循环。"},{"year":"2003","type":"填空题","number":"1","question":"当氨基酸溶液的pH=pI时，氨基酸以 **兼性**\n离子形式存在；当pH\\>pI时，氨基酸以 **负离子** 的形式存在。","answer":""},{"year":"2003","type":"填空题","number":"2","question":"脯氨酸是 **亚** 氨基酸，与茚三酮反应生成 **黄** 色物质。","answer":""},{"year":"2003","type":"填空题","number":"3","question":"变性蛋白质的主要特征是 **生物活性** 丧失，其次是 **物化** 性质改变和\n**溶解度** 降低","answer":""},{"year":"2003","type":"填空题","number":"4","question":"稳定蛋白质胶体状态的因素是 **水化层** 及 **双电层**","answer":""},{"year":"2003","type":"填空题","number":"5","question":"氢键有两个特征即 **方向性** 和 **饱和性**","answer":""},{"year":"2003","type":"填空题","number":"6","question":"同工酶是 **催化的化学反应** 相同， **蛋白质分子结构** 不同的一类酶。","answer":""},{"year":"2003","type":"填空题","number":"7","question":"7.EC3.1.1.11 应为 **水解酶** 酶。","answer":""},{"year":"2003","type":"填空题","number":"8","question":"调节酶主要分为 **可逆共价修饰** 酶、 **別构调节酶** 酶两大类。","answer":""},{"year":"2003","type":"填空题","number":"9","question":"碱基与戊糖间以C-C连接的是 **假尿嘧啶** 核苷。","answer":""},{"year":"2003","type":"填空题","number":"10","question":"在 **退火** 条件下，互补的单链核酸将缔结成双链分子。","answer":""},{"year":"2003","type":"填空题","number":"11","question":"tRNA的氨基酸臂的主要功能是 **携带活化氨基酸** ；反密码环的功能是\n**识别并结合mRNA上相应的密码子** ;TφC环的功能是\n**识别并促进与核糖体结合**","answer":""},{"year":"2003","type":"填空题","number":"12","question":"核小体单位包括 **200** bp左右的DNA和 **组蛋白** 八聚体。","answer":""},{"year":"2003","type":"填空题","number":"13","question":"引起疯牛病的病原体是一种 **朊病毒（蛋白质）** ,它的结构发生了\n**空间构象改变（α螺旋为主变成β折叠为主）** 变化。","answer":""},{"year":"2003","type":"填空题","number":"14","question":"生物化学中的反应大体可分为 **加成反应、消除反应、取代反应、重排反应**\n四类。","answer":""},{"year":"2003","type":"填空题","number":"15","question":"磷酸葡萄糖异构酶具有绝对的 **底物** 专一性和 **立体** 专一性。","answer":""},{"year":"2003","type":"填空题","number":"16","question":"琥珀酸脱氢酶在真核生物位于细胞的 **线粒体内膜** 而在原核生物中位于\n**细胞质膜**","answer":""},{"year":"2003","type":"填空题","number":"17","question":"羧化酶的辅基是 **生物素**","answer":""},{"year":"2003","type":"填空题","number":"18","question":"在糖原的生物合成中糖基的供体是 **UDP-葡萄糖**","answer":""},{"year":"2003","type":"填空题","number":"19","question":"氨基酸的脱氨基作用主要有 **转氨基、氧化脱氨基、联合脱氨基**","answer":""},{"year":"2003","type":"填空题","number":"20","question":"在生物体内一碳单位是 **四氢叶酸** 的衍生物。","answer":""},{"year":"2003","type":"填空题","number":"21","question":"在核苷酸的生物合成中，嘌呤环的第一位氮原子来自于 **天冬氨酸**","answer":""},{"year":"2003","type":"填空题","number":"22","question":"脱氧核糖核苷酸是 **核糖核苷酸** 形成的。","answer":""},{"year":"2003","type":"填空题","number":"23","question":"在DNA复制过程中形成的不连续片段被称为 **冈崎片段**","answer":""},{"year":"2003","type":"填空题","number":"24","question":"在原核生物负责DNA复制的酶是 **DNA聚合酶III**\n;在真核生物中负责DNA复制的酶是 **DNA聚合酶δ**","answer":""},{"year":"2003","type":"填空题","number":"25","question":"原核生物基因表达调控的主要调控模型是 **操纵子模型**","answer":""},{"year":"2003","type":"填空题","number":"26","question":"以RNA为模板合成DNA单链的酶被称为 **逆转录酶**","answer":""},{"year":"2003","type":"填空题","number":"27","question":"核糖体中的P位点是指 **肽酰tRNA/起始氨酰tRNA结合位点**","answer":""},{"year":"2003","type":"填空题","number":"29","question":"在原核生物中，酶的可逆共价修饰主要是 **腺苷酸化和去腺苷酸化**\n;而在真核生物中，酶的可逆共价修饰主要是 **磷酸化和去磷酸化**","answer":""},{"year":"2003","type":"简答题","number":"1","question":"为什么DNA和RNA的稳定性不同，但能与它们的功能相适应?","answer":"**（1）DNA和RNA稳定性差异的原理：**\n\n1.  结构\n\nDNA为双螺旋结构，和组蛋白结合形成核小体串珠结构，再盘绕螺旋形成螺线管，进一步螺旋形成超螺线管，最后在组蛋白、非组蛋白以及少量RNA的帮助下折叠形成染色体高级结构，结构更稳定。RNA为单链结构，tRNA的最高结构形式为倒L型，rRNA形成核蛋白体，均没有DNA结构复杂。\n\n2.  酸碱耐受\n\nRNA在弱碱条件下更容易分解，RNA分子中的核糖含有2\\'-OH，这个羟基在碱性条件下容易发生自催化的核糖骨架内切反应：2\\'-OH会攻击相邻的3\\'-磷酸二酯键，使链发生断裂；而DNA由于没有这个2\\'-OH（被氢取代），不会发生这种自发的碱解作用，结构更稳定。\n\n3.  分解酶\n\nRNA酶（RNase）是非常稳定的酶，能够耐受高温高压，很难除去，而DNase在高温下易失活。因此体外贮存的RNA比DNA更容易受酶污染而降解，需要更严格的贮存条件。\n\n4.  位置：真核生物中，DNA多存在于核膜包裹的细胞核中，RNA多位于细胞质中。\n\n**（2）功能相适应**\n\n以上性质决定了DNA比RNA更加稳定，这一性质与他们的功能是相适应的。由于DNA是遗传物质，需要将遗传信息从亲代传递给子代，并指挥细胞各种生命活动，若是DNA不稳定性增加，则会导致基因突变甚至致死，难以维持个体或种族的延续。而RNA的功能是指导细胞中蛋白质的合成，这一过程受到多重调控以适应内外环境变化，RNA在细胞中不稳定使其具有半衰期的特点为这种调控提供了机会。如在翻译水平上，mRNA作为蛋白质合成的模板，翻译后即可被降解，避免多余蛋白质产生造成的浪费以及对细胞功能的破坏。rRNA作为核糖体的重要组分相对稳定。tRNA携带氨基酸进入核糖体，完成一次功能后不会被降解，需要进行下一轮的氨基酸转运。"},{"year":"2003","type":"简答题","number":"2","question":"别构酶有何特点?03/13/23","answer":"酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性，具有这种调节作用的酶称作别构酶。一般都是寡聚酶，由多个亚基构成。含有催化部位和调节部位，它们可以位于一个亚基的不同位置也可以位于不同亚基上。每个别构酶分子可以有一个以上的催化部位和调节部位。\n\n凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物（多为产物）。当酶的别构效应涉及催化部位和催化部位相互作用称为同促效应即一个效应物与酶结合后影响同一效应物与酶的结合，促进则为同促正协同，反之则为同促负协同；涉及调节部位与活化部位的相互作用称为异促效应即一个效应物与酶结合后影响另一效应物与酶的另一部位结合，促进则为异促正协同，反之则为异促负协同。例如天冬氨酸转氨甲酰酶被终产物CTP反馈抑制，被ATP别构激活；3-磷酸甘油醛脱氢酶，具有负协同效应，具有四个亚基，可以和4个NAD+结合，但是结合两个后，酶分子构象发生改变，很难再结合第三、四个。\n\n由于协同效应，协同效应别构酶动力学中S对v的动力学曲线不是双曲线，而是S形曲线（正协同）或双曲线（负协同），二者均不符合米氏方程。正协同效应时，增加正调节物浓度，S形曲线向双曲线漂移，Km减小，亲和力增大，协同性减小；增加负调节物浓度，S形曲线加深，Km增大，亲和力减小，协同性增大。用协同指数CI或Hill系数鉴别不同类型协同作用以及协同作用程度，前者为酶分子的结合位点被90%饱和时的底物浓度和被10%饱和时的底物浓度之比Rs，典型米氏酶Rs=81，\\>81为负协同，\\<81为正协同；后者典型米氏酶n=1，\\>1为正协同，\\<1为负协同。别构酶经过加热或化学试剂等处理，会发生解离，失去别构活性，催化活性仍然保留，称为脱敏作用，动力学曲线为米氏酶的双曲线。\n\n**3某肽氨基酸组成为 Lys,Val,Arg,Ala,Phe,Tyr和Ser。**\n\n**1）用FDNB处理，未给出α-DNP-AA，除非用胰凝乳蛋白酶预先处理，从Ala、Tyr、Ser和Lys，Phe，Val，Arg二肽段中得到DNP-Ser，DNP-Arg**\n\n**2）用胰蛋白酶处理，得到组成为Lys，Val和Phe，Ala，Ser，Arg，Tyr二肽段。**\n\n环状七肽N-C：Ser-Ala-Tyr-Arg-Val-Lys-Phe\n\n没有N端代表该肽为环状！"},{"year":"2003","type":"简答题","number":"4","question":"简述原核生物与真核生物基因表达调控在翻译水平上的差异。","answer":"真核生物翻译水平进行基因表达调节主要是控制mRNA的稳定性、mRNA的运输和有选择的进行翻译，mRNA的5-帽子结构和3-PolyA尾都有利于RNA分子的稳定性。mRNA通常只在完成加帽，剪接和加尾等加工过程后才被载体蛋白由核内运输到细胞质。起始因子的磷酸化也具有调控作用，如eIF2磷酸化抑制或选择性的加强蛋白质的合成，eIF4磷酸化对翻译具有起始激活作用。\n\n原核生物：\n\n1）mRNA自身结构元件的调节作用\n\n1.  起始密码子\n\n大多数氨基酸由于密码子的简并性而具有多种密码子，对应的tRNA浓度差别很大。同时采用常用密码子的mRNA翻译速度快，而稀有密码子比例高的mRNA翻译速度慢。\n\n2.  5-端非翻译区（5-UTR）：\n\n其中的核糖体结合位点RBS，是包含SD序列的一段特殊序列，位于AUG上游，其与核糖体结合的强弱程度取决于SD序列与AUG的距离，一般为4-10个核苷酸，9个最佳。结合作用强则翻译起始频率高。\n\n其中的核糖开关：是一段具有复杂结构的RNA序列，可以通过感受细胞内代谢物浓度，离子浓度和温度等的变化调节自身二级结构和功能，通过影响转录的起始，延伸和终止；mRNA稳定性以及mRNA与核糖体结合强度来调控基因表达。在真核生物中还可以控制mRNA的剪接来调节基因表达。\n\n2）mRNA自身的稳定性和二级结构的调节作用：mRNA的稳定性越高、半衰期越长，它在细胞中存在的时间越久，核糖体就能有更多机会在这条mRNA上反复起始翻译，从而显著提高翻译水平。此外mRNA的二级结构如果存在茎环结构则会降低翻译效率。\n\n3）调节蛋白的调控作用：细胞中rRNA和核糖体蛋白的浓度比例保持平衡，当细胞中rRNA浓度降低，核糖体蛋白过量，以游离态形式存在时即会结合到自身mRNA上，引起翻译阻遏。操纵子中还常存在非核糖体蛋白质，不受核糖体蛋白的束缚，按自身需要速度合成。\n\n4）小RNA的调节作用：如siRNA，通过碱基互补配对结合到靶mRNA特定序列上，改变mRNA的结构和稳定性，阻断或暴露RBS，调节基因的表达。部分小RNA结合后还会招募RNase形成复合体，降解RNA特定序列。\n\n5）稀有密码子的调节作用：稀有密码子比例较高时，核糖体移动过程中需要等待招募对应的tRNA，翻译速率下降，蛋白质合成量降低。如DnaG基因，编码DNA复制时的引物酶，需求量少，因此通过含有大量的稀有碱基控制其表达量。\n\n6）重叠基因的调节作用：在原核生物中，多数重叠基因没有独立的SD序列，下游基因无法单独招募核糖体，只能依赖上游基因正在翻译的核糖体，上游翻译进行，下游才翻译；上游不翻译，下游也关闭。\n\n7）魔斑核苷酸的调节作用：当细菌处于贫瘠环境时，代谢作用下降，细胞进入严禁控制状态，氨基酸含量下降，形成大量空载tRNA，因此产生ppGpp和pppGpp（鸟苷五磷酸），在色谱上显示出黑色斑点称为魔斑。魔斑核苷酸可以结合RNA聚合酶影响其与启动子结合，抑制rRNA/tRNA的转录来降低核糖体数量，进而调节基因的翻译。\n\n8）反义RNA：是一种调节型RNA，具有与特定mRNA翻译起始位点互补的序列，结合位点也可以位于mRNA下游。通过与mRNA结合，阻断核糖体小亚基对起始密码子的识别和与SD序列的结合，也可以使靶RNA降解或失活。大肠杆菌转座子Tn10在合成转座酶mRNA的同时还合成出一条与其5撇端序列互补的小RNA即反义RNA，从而抑制mRNA的活性，使转座酶维持在一定水平，避免转座频率过高而导致宿主死亡。"},{"year":"2003","type":"简答题","number":"5","question":"用简图表示生物体内糖类和脂类在物质代谢网络中的每一步不可逆反应途径及相应的酶。","answer":"糖脂转化过程中决定方向性不可逆步骤\n\n1.  糖原n+1在糖原磷酸化酶的作用下生成1-磷酸葡萄糖和糖原n，反之先UDP-葡萄糖焦磷酸化酶生成UDP-葡萄糖，随后在糖原合酶作用下生成糖原。\n\n2.  葡萄糖在己糖激酶/葡萄糖激酶的作用下生成6-磷酸葡萄糖；反之6-磷酸葡萄糖磷酸酶。\n\n3.  6-磷酸果糖在磷酸果糖激酶-1（PFK-1）作用下生成1,6-二磷酸果糖，反之1,6-二磷酸果糖磷酸酶。\n\n4.  磷酸烯醇式丙酮酸PEP在丙酮酸激酶的作用下生成丙酮酸，反之丙酮酸羧化酶生成草酰乙酸，随后PEP羧激酶生成PEP。\n\n5.  丙酮酸在丙酮酸脱氢酶复合体作用下生成乙酰CoA，无法返回\n\n6.  乙酰CoA在乙酰CoA羧化酶的作用下生成丙二酸单酰CoA，反之则为丙二酸单酰CoA脱羧酶\n\n7.  乙酸在硫激酶作用下生成乙酰CoA，反之为硫酯酶。"},{"year":"2003","type":"简答题","number":"6","question":"分离生物大分子的方法有哪些?它们的理论依据是什么?","answer":"（1）透析：是利用蛋白质分子不能通过半透膜的性质，使蛋白质和其他小分子物质分开。透析是把待纯化的蛋白质溶液装在半透膜的透析袋里，放入透析液中进行的，透析液可以更换，直至透析袋内无机盐等小分子物质降低到最小值为止。\n\n（2）超滤法：是利用压力或离心力，强行使水和其他小分子溶质通过半透膜，而蛋白质被截留在膜上，以达到浓缩和脱盐的目的。\n\n（3）凝胶过滤：称大小排阻层析、分子筛，指根据多孔介质对不同大小和形状的分子排阻能力不同而分离蛋白质混合物的方法。不同大小和形状的分子流经凝胶柱时，比凝胶孔径大的分子不能进入凝胶珠，随溶剂沿凝胶珠间隙向下流动，流动距离最短，最先流出；比凝胶孔径小的分子不同程度选择性进入凝胶珠，流动距离较长，后流出。同大小的分子，线状分子在前，球状分子在后。常用的凝胶为交联葡聚糖（也叫sephadexG-n，后面的数字越大，交联程度越低，凝胶孔径越大，分子量分离范围越大）\n\n（4）密度梯度离心：蛋白质在具有密度梯度的介质中离心时，质量和密度大的颗粒沉降得快，并且每种蛋白质颗粒沉降到与自身密度相等的介质后停滞不前，最后各种蛋白在离心管中被分离成各自独立的区带，此时可以在管底刺一个小孔逐滴放出，分步收集。\n\n（5）盐溶：中性盐对球状蛋白质的溶解度有显著的影响。低浓度时，中性盐可增加蛋白质的溶解度，这种现象称为盐溶盐溶作用主要是由于蛋白质分子吸附某种盐离子后，能部分中和或屏蔽蛋白质分子表面的电荷，减弱带相同电荷的蛋白质分子间的静电排斥力，使蛋白质分子更容易靠近水分子，同时盐离子能吸引水分子增强水化作用从而加强蛋白质表面的水化层稳定性，防止聚集。\n\n（6）盐析：离子强度上升到一定水平时，蛋白质溶解度开始下降，在水溶液中聚集沉淀析出，这种现象称为盐析。盐析的原理是大量的中性盐离子降低水的活度，使溶液中大部分或全部的自由水转变为盐离子的水化水。此时原先被迫与蛋白质表面疏水基团结合并掩盖的水分子也形成了盐离子的水化水，蛋白质疏水基团暴露出来，随着盐离子浓度升高，蛋白质疏水基团由于疏水作用而聚集发生沉淀。最先沉淀的蛋白质是表面疏水基团数量最多的。盐析是蛋白质分离的一种常见的方法，常用的盐离子是硫酸铵，沉淀后的蛋白质仍保留天然构象。（7）有机溶剂分级分离：与水互溶的有机溶剂能使蛋白质在水中的溶解度显著降低。在室温下，这些有机溶剂不仅能引起蛋白质的沉淀，而且伴随着变性。产生这种作用的主要原因是去除水化层，导致介电常数降低，引起蛋白质沉淀。但如果预先将有机溶剂冷却到-40℃至-60°C，然后在不断的搅拌下加入有机溶剂以防止局部浓度过高，很大程度上可以解决蛋白质变性问题。\n\n（8）电泳：根据荷电分子在外电场中移动方向和移动速率不同而达到分离的技术。在外电场作用下，荷电分子向与其电荷符号相反的电极移动。利用介质中蛋白分子所带电荷、分子大小以及形状不同，而使蛋白分子在电泳体系中向不同方向以不同速率移动。目前最广泛使用的区带电泳是凝胶电泳，他最常用的支持介质是聚丙烯酰胺凝胶电泳PAGE（适用于分离蛋白质）和琼脂糖凝胶电泳（适用于分离核酸）。\n\n（9）等电聚焦：IEF，又称电聚焦技术，是一种高分辨率的蛋白质分离技术，主要用于测定蛋白质的等电点。利用特殊缓冲液（两性电解质）在聚丙烯酰胺凝胶电泳中形成pH梯度，蛋白质在电泳时迁移到他的等电点PI时，即蛋白质到达梯度中某一pH时，蛋白质就不再带有净的正电荷或负电荷了，停止迁移，实现蛋白质的分离。目前常用的凝胶包括聚丙烯酰胺凝胶，葡聚糖凝胶，琼脂糖凝胶等。这种方法常用于分离同工酶，分子量接近但等电点不同的蛋白质。\n\n（10）离子交换层析：根据在给定pH下蛋白质分子净电荷符号和数量不同实现分离的技术。它以离子交换剂作为固定相，蛋白分子与其结合的强弱取决于相反电荷之间的静电相互作用，两者的电离程度取决于溶液的pH。离子交换剂由带电荷的树脂或纤维素组成，带有负电荷的为阳离子交换树脂：反之为阴离子交换树脂。层析洗脱可以采用洗脱液成分一直不变的方式洗脱，也可以采用跳跃式分段或渐进式连续的形式，改变洗脱液中的盐浓度或pH值的方式洗脱。\n\n（11）亲和层析：是利用蛋白质分子对其配体分子特有的生物学亲和力实现分离的一种纯化方法。是将待纯化的某一蛋白的特异配体通过适当的化学反应共价连接到载体表面的官能团上，当蛋白混合物加到该层析柱时，待纯化蛋白则被吸附到层析柱上，其他蛋白不被吸附通过洗涤除去，被特异结合的蛋白质可用含游离的配体溶液从柱上洗脱。\n\n（12）疏水层析：根据蛋白质表面疏水性差别实现分离的一种纯化技术。在疏水作用层析中，利用连接在支持介质上的疏水基团与蛋白质表面暴露的疏水基团结合，利用结合程度的不同再进行洗脱分离蛋白质。\n\n（13）高效液相层析HPLC：实际上是在分配层析、亲和层析、离子交换层析和凝胶过滤等技术的基础上新发展出的一种效率更高、分辨率更高和过柱速度更快的层析技术。HPLC也是溶质在固定相和流动相之间进行的一种连续多次交换过程。他借助溶质在两相间分配系数，亲和力、吸附力或分子大小不同而引起的排阻作用的差别得以分离。"},{"year":"2004","type":"名词解释","number":"1","question":"同源蛋白","answer":"在不同生物体中，行使相同或相似功能的蛋白质称为同源蛋白质，如各种脊椎动物中的氧转运蛋白-血红蛋白，同源蛋白的氨基酸序列明显相同，所以具有明显相同的氨基酸序列的蛋白质也称为同源蛋白质。同源蛋白质的氨基酸序列中，有些位置的氨基酸序列在所有物种中是不变的称为不变残基，其他位置上的氨基酸残基在不同物种中差别较大称为可变残基。"},{"year":"2004","type":"名词解释","number":"2","question":"卵磷脂","answer":"甘油磷脂的一种，也叫磷脂酰胆碱PC，和磷脂酰乙醇胺一起被认为是细胞膜上最丰富的脂质。胆碱作为一种很重要的甲基供体，在代谢中常被认为和磷脂酰胆碱都具有防治脂肪肝的作用。胆碱对脂肪有亲和力，可促进脂肪以磷脂的形式由肝脏通过血液运输出去或改善脂肪酸本身在肝中的利用，并防止脂肪在肝脏里的异常聚集。卵磷脂在蛋黄和大豆中较丰富。"},{"year":"2004","type":"名词解释","number":"3","question":"别构模型","answer":"别构效应或称别构调控，酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。为解释别构效应提出的别构模型包括齐变模型和序变模型。前者不能解释负协同，因为负协同效应过程中别构酶的第一个亚基和底物结合后，转变为R态，引起其他亚基构象转变为T态，3个T，1个R不符合齐变模型的全T或全R。后者内容为亚基之间相互作用可以是正协同也可以是负协同效应，前者导致下一亚基对配体有更高的亲和力，后者则降低亲和力。该模型可以解释负协同。"},{"year":"2004","type":"名词解释","number":"4","question":"生物酶工程","answer":"是酶学和以DNA重组技术为主的现代分子生物学技术相结合的产物，因此亦可称为高级酶工程。主要包括三方面内容：用基因工程技术大量生产酶（克隆酶）；对酶基因进行修饰，产生遗传修饰酶（突变酶）；设计新酶基因，合成自然界中不曾有的新酶。化学酶工程称为初级酶工程，包括化学修饰酶，固定化酶，模拟酶（人工酶）以及杂交酶。"},{"year":"2004","type":"名词解释","number":"5","question":"H-DNA","answer":"即铰链DNA，是一种分子内折叠形成的三股螺旋，当DNA的一段多聚嘧啶核苷酸或多聚嘌呤核苷酸组成镜像重复（如5′-AGCTTTCGA-3′），即可回折产生H-DNA，该重复序列又叫H-回文结构。在酸性或负超螺旋张力的情况下，即发生B→H-DNA，酸性环境下促使胞嘧啶质子化，提高了形成三股螺旋时与G配对结合的氢键能力。H-DNA存在于基因调控区，具有重要生物学意义。"},{"year":"2004","type":"名词解释","number":"6","question":"免疫印迹04/05/16/24","answer":"蛋白印迹（Western\nblotting）是一种电泳分离与免疫反应相结合，将经SDS-PAGE分离的蛋白质转移到固相载体（如硝酸纤维素膜或PVDF膜）上，再通过特异性抗体识别目标蛋白并显色的技术。该方法可用于检测特定蛋白是否表达、比较不同样品中蛋白的表达差异、分析蛋白的分子量、修饰状态（如磷酸化）等，是常用的蛋白定性与半定量分析方法。\n\n基本步骤：\n\n样品制备与电泳分离：提取蛋白并经SDS-PAGE按分子量分离；\n\n电转膜：将分离的蛋白转移到硝酸纤维素膜或PVDF膜上；\n\n封闭：用脱脂奶粉或BSA封闭膜上非特异性结合位点；\n\n一抗孵育：加入能特异识别目标蛋白的一抗，与目的蛋白结合；\n\n二抗孵育：加入与一抗来源种属相应、带有酶标的二抗；\n\n显色或发光检测：利用底物反应（如电化学发光ECL法）显现目标蛋白条带。"},{"year":"2004","type":"名词解释","number":"7","question":"新陈代谢03/04","answer":"**8.酮体**\n\n指脂肪酸氧化分解的中间产物乙酰乙酸，D-β-羟丁酸和丙酮的统称。饥饿或糖尿病状态下，肝外组织不能从血液中获取充分的葡萄糖，为获取能量，糖异生和脂肪酸氧化加速。脂肪酸在肝细胞中氧化产生大量乙酰CoA，而且肝细胞的草酰乙酸离开TCA循环进入糖异生合成葡萄糖，因此乙酰CoA无法进入TCA循环，只能转向生成酮体为机体供能。\n\n酮体合成主要发生在肝脏细胞线粒体中，2分子乙酰CoA在硫解酶的作用下缩合形成乙酰乙酰CoA，随后在HMGCoA合酶的作用下生成HMGCoA（羟甲基戊二酰辅酶A，限速步骤），最后在HMGCoA裂解酶的作用下生成乙酰CoA和乙酰乙酸，不仅可以自身脱羧生成丙酮（量很少，由肺部呼出），还可以再β-羟丁酸脱氢酶的作用下生成D-β-羟丁酸（该酶具有立体专一性）。\n\n在肝中生成酮体的酶很多但是没有利用酮体的酶，因此生成的酮体迅速透过线粒体进入血液循环，送至全身。在肝外组织中，D-β-羟丁酸被β-羟丁酸脱氢酶催化生成乙酰乙酸（生成1分子NADH，脂肪酸氧化产生大量NADH，因此在肝细胞中倾向于使乙酰乙酸被还原为β-羟丁酸后再运输出来），随后由TCA循环中间产物琥珀酰CoA供给CoA，通过转移酶生成乙酰乙酰CoA，最后被硫解酶裂解成两个乙酰CoA进入TCA循环被利用（肝外组织不缺草酰乙酸）。\n\n严重饥饿或未经治疗的糖尿病病人体内可产生大量乙酰乙酸。生成的酮体超过机体利用限度，导致血液中酮体积累，引起酮中毒，血液和尿中酮体显著增高的情况称为酮症。\n\n酮体是肝输出的一种特殊形式的能源物质，容易运输和利用，可被肝外其他部位快速利用产生能量，肾和心肌具有很强的乙酰乙酸氧化的酶系，其次是大脑；肌肉组织利用酮体可减少蛋白质的大量分解损耗。由于血脑屏障的存在，除了葡萄糖和酮体之外的物质是无法进入大脑为脑组织功能的。酮体属于应急能源，当葡萄糖不足时，血糖浓度降低，酮体输出节省葡萄糖供脑和红细胞利用。"},{"year":"2004","type":"名词解释","number":"9","question":"复制体replicon=复制子","answer":"基因组能够独立进行复制的单位称为复制子，每个复制子都含有复制起始的起点，可能还有终点，复制在起始阶段进行控制，一旦开始便会进行下去，直到复制完成。原核生物、病毒以及大多数真核生物的细胞器DNA为环状双链分子，只包含一个复制起点，为单复制子，通常是双向对称复制。真核生物DNA为线性双链分子，有多个复制起点，可以分段复制，称为多复制子。真核生物形成的复制叉移动速度由于染色体的高级结构，比原核生物慢，核小体解聚和组装需要时间。"},{"year":"2004","type":"填空题","number":"1","question":"支链淀粉和糖原除 **α-1,4-糖苷键** 键外，尚有 **α-1,6-糖苷键**\n糖苷键，但糖原的分支程度比支链淀粉 **更高** ; 而纤维素是由\n**β-1,4-糖苷键** 连接而成的。","answer":""},{"year":"2004","type":"填空题","number":"2","question":"血红蛋白含有 **血红素** 辅基；它的氧合曲线是 **S**\n型的，这意味着氧的结合是 **协同** 性的\n\n3蛋白质由于含有 **Phe、Tyr和Trp** 氨基酸，它在280 nm\n波长处有紫外吸收；而核酸的紫外吸收峰在 **260** nm 附近。","answer":""},{"year":"2004","type":"填空题","number":"4","question":"酶的化学本质除催化活性的 **RNA** 外都是 **蛋白质**","answer":""},{"year":"2004","type":"填空题","number":"5","question":"某某 **合酶synthase**\n酶在催化反应中没有ATP直接参加反应，如需ATP直接参与反应，就称某某\n**合成酶synthetase** 酶。","answer":""},{"year":"2004","type":"填空题","number":"6","question":"因为\n**DNA是脱氧核糖核苷酸，2-位点没有羟基，不会攻击相邻3-位点的磷酸二酯键**\n，DNA比RNA不易被水解","answer":""},{"year":"2004","type":"填空题","number":"7","question":"核酸的一级结构是指 **核苷酸的共价结构** ，他们利用 **3,5-磷酸二酯键**\n键相连；DNA的二级结构为 **双螺旋** 结构；三级结构是指\n**双螺旋DNA分子通过扭曲折叠** 形成特定构象； **DNA** 与 **蛋白质**\n的结构是DNA的四级结构。","answer":""},{"year":"2004","type":"填空题","number":"8","question":"沉降系数S把 **10^-13^** 秒作为一个单位，它用来表示生物分子的大小。","answer":""},{"year":"2004","type":"填空题","number":"9","question":"Tm定义为\n**通常把DNA热变性引起物化性质改变一半时的温度称为该DNA的熔解温度**。","answer":""},{"year":"2004","type":"填空题","number":"10","question":"在物质代谢过程中常见的化学反应机制有\n**氧化还原反应、加成反应、消除反应、异构化反应** 四大类。","answer":""},{"year":"2004","type":"填空题","number":"11","question":"根据高能化合物的键型特点可分为 **酸酐键、烯醇磷酸键、硫酯键、胺键**\n四大类。","answer":""},{"year":"2004","type":"填空题","number":"12","question":"从葡萄糖开始产生丙酮酸的过程称为 **EMP** 途径。","answer":""},{"year":"2004","type":"填空题","number":"13","question":"丙酮酸脱氢酶系的第一个酶是 **丙酮酸脱氢酶** ,它的功能是\n**丙酮酸氧化脱羧**","answer":""},{"year":"2004","type":"填空题","number":"14","question":"胞浆内的NADH进入线粒体的途径有\n**3-磷酸甘油穿梭途径和苹果酸-天冬氨酸穿梭途径**","answer":""},{"year":"2004","type":"填空题","number":"15","question":"脂肪酸β-氧化的限速酶是 **肉碱脂酰移位酶I（CPI1）**","answer":""},{"year":"2004","type":"填空题","number":"16","question":"在脂肪酸合成过程中，超过16C的脂肪酸主要通过 **内质网酶系** 和\n**线粒体酶系** 的酶系参与碳链的延长。","answer":""},{"year":"2004","type":"填空题","number":"17","question":"在尿素形成过程中，尿素分子中的两个N原子分别来自 **Asp** 和\n**氨甲酰磷酸**","answer":""},{"year":"2004","type":"填空题","number":"18","question":"氨酰-tRNA合成酶对底物的选择性主要是由 **氢** 键来定。","answer":""},{"year":"2004","type":"填空题","number":"19","question":"真核生物蛋白质的翻译后修饰主要有 **化学修饰、加工修饰、空间构象修饰**","answer":""},{"year":"2004","type":"填空题","number":"20","question":"不连续体系的聚丙烯酰胺凝胶电泳有三种效应：\n**堆积效应、分离效应、展开效应**","answer":""},{"year":"2004","type":"简答题","number":"1","question":"下列变化对肌红蛋白和血红蛋白的O₂亲和力有什么影响?","answer":"**（a）血浆pH从7.4降到7.2**\n\n**（b）肺中CO2分压从45torr降到15torr**\n\n**（c）BPG水平从4.5mmol/L增到7.5mmol/L**\n\n（a）中血红蛋白对O2亲和力下降，肌红蛋白不变\n\n（b）中血红蛋白对O2亲和力增加，肌红蛋白不变\n\n（c）中血红蛋白对O2亲和力下降，肌红蛋白不变\n\n肌红蛋白是哺乳动物体内贮存和分送氧的蛋白质，存在于需要贮存氧的肌肉细胞中。属于珠蛋白家族，由一条多肽链和一条血红素辅基组成，没有多个亚基，因此不具有别构效应和波尔效应，与O2亲和力不受外界环境影响。肌红蛋白和O2可逆结合，在肌肉组织中，血红蛋白释放的氧气透过质膜进入肌细胞中，并与质膜内表面的肌红蛋白组成氧合肌红蛋白，随后在细胞溶胶中扩散到线粒体，当线粒体中O2浓度下降时，氧合肌红蛋白把贮存的氧释放给线粒体，自身变回去氧肌红蛋白并回到质膜处，由于这里氧气充足，又变成氧合肌红蛋白。\n\n血红蛋白与氧结合时表现出协同效应，即当第一个亚基与一分子氧结合后，引起八个离子键断裂，血红蛋白分子构象改变，由T态变成R态，其他亚基结合结合氧气的速率大大提高，氧气与氧气的结合是互利的。除此之外血红蛋白和氧结合还表现出波尔效应，即H+和CO2影响血液中血红蛋白与氧气结合亲和力的效应。当环境中pH下降（氢离子浓度升高）或二氧化碳浓度升高会降低血红蛋白和氧气的亲和力，氢离子与血红蛋白β亚基His结合使其质子化，与α亚基中的Asp形成链内盐桥，稳定血红蛋白T态，二氧化碳与血红蛋白中每个珠蛋白链的氨基端结合，形成的氢离子贡献于波尔效应，形成的氨甲酸也构成盐桥稳定T态，降低对氧的亲和力，促进氧气释放，氧合曲线向右移动，氧气和氢离子、二氧化碳与血红蛋白的结合是互斥的。BPG也是血红蛋白一个重要的别构效应物，其上携带的负电荷与β亚基携带的正电荷残基形成盐桥，有助于稳定T态，因而降低血红蛋白对氧的亲和力，促进氧的释放。当Hb和氧结合转变为R态后，BPG结合口袋变小，容纳不了BPG。"},{"year":"2004","type":"简答题","number":"2","question":"什么是酶的共价修饰?其特点和类型。01/04","answer":"**3.如何看待RNA功能的多样性?它的核心作用是什么。96/97/04**\n\n写各类RNA的定义和功能\n\n核心：指导细胞中蛋白质的合成，遗传信息从DNA到蛋白质的中间传递体。"},{"year":"2004","type":"简答题","number":"4","question":"简述真核生物RNA的转录后加工","answer":"各种基因转录产物如rRNA、mRNA、tRNA等初级转录产物经加工修饰形成有生物功能的活性分子。\n\nmRNA前体需要经过带帽，加尾，剪接，内部甲基化得到成熟的mRNA分子，不同转录起点和终点的产物，经过内部不同的剪切拼接以及不同的编辑得到不同的mRNA，编码不同的基因表达产物。首先带帽，发生在细胞核内，磷酸酶的作用下先将5-端磷酸基水解掉，再加上鸟苷三磷酸形成GpppN结构，再对G进行甲基化，最终形成帽子结构m^7^G^5-^ppp^5-^N。帽子结构是mRNA在细胞核和细胞质中的稳定因素，如果没有帽子结构会很快被核酸酶水解。同时帽子结构可以促进蛋白质生物合成起始复合物的形成，提高翻译强度。其次加尾，也发生在细胞核内，首先由核酸外切酶切去3-端一些过剩的核苷酸，由多聚腺苷酸酶催化，ATP为底物，逐个添加腺苷酸，形成polyA。该结构是mRNA从细胞核进入细胞质所必需，维持mRNA的稳定性。然后剪接，真核生物结构基因一般为断裂基因，其中能编码多肽链合成的基因称为外显子，非编码序列则为内含子。hnRNA的剪接一般需要snRNA参与构成的核蛋白体参加，形成套索结构将内含子切除（II型内含子剪切）。最后内部甲基化，主要是m^6^A，甲基化酶催化。\n\nrRNA：RNA聚合酶I催化前体rRNA合成，包括5.8S，18S和28SrRNA，RNA聚合酶III催化生成5SrRNA。真核生物的rRNA是一类中度重复基因。其加工过程包括：前体rRNA与蛋白质结合，随后被甲基化切割，甲基化位点在核糖体2-OH上，其甲基化，假尿苷酸和切割是由snoRNA指导的，剪接方式一般为内含子I型剪接方式，不过大多数真核生物rRNA不含有内含子。\n\ntRNA：RNA聚合酶III转录生成的tRNA前体。首先核酸内切酶在tRNA两端切断，由核酸外切酶在3-端逐个切去附加序列进行修剪，在3-端添加CCA-OH。随后在甲基转移酶和异构酶的作用下添加稀有碱基形成二级结构，最后自组装形成倒L形特定空间构象。"},{"year":"2004","type":"简答题","number":"5","question":"用简图简述糖代谢过程中所有与能量代谢有关的过程","answer":"糖酵解，糖原合成和降解，TCA循环，丙酮酸到乙酰CoA，磷酸戊糖途径，糖异生"},{"year":"2005","type":"名词解释","number":"1","question":"等电点和等离子点","answer":"等电点：蛋白质分子除了两端的氨基和羧基可解离外，氨基酸残基的侧链中某些基团在一定溶液pH下都可解离成带负电荷或正电荷的基团。当蛋白质溶液处于某一pH时，蛋白质分子解离成正负离子的趋势相等，即成为兼性离子，净电荷为零，此时溶液的pH称为该蛋白质的等电点。在等电点时，蛋白质溶解度最小，在电场中不移动。\n\n等离子点：在没有其他盐类干扰时，当蛋白质溶液处于某一pH时，蛋白质质子供体基团解离出来的质子数和质子受体基团结合的质子数相等，此时溶液的pH称为该蛋白质的等离子点，是蛋白质的一种特征常数。"},{"year":"2005","type":"名词解释","number":"2","question":"氢键的方向性和饱和性","answer":"氢键具有两个重要特征，方向性和饱和性。方向性是指氢供体，氢和氢解纳体呈一直线时键的强度最大。饱和性是指一般情况下X-H只能和一个Y原子结合，因为氢原子非常小，而供体和接纳体原子都特别大，这样将形成空间位阻，排斥另一接纳体和H原子结合。氢键的形成具有协同性，即一个氢键的形成能促进其他氢键的形成。"},{"year":"2005","type":"名词解释","number":"3","question":"合成酶与合酶","answer":"合成酶：又称连接酶，催化两分子底物合成一分子化合物，一般伴随ATP磷酸键断裂，如谷氨酰胺合成酶、氨基酸-tRNA连接酶等。\n\n合酶：又称裂合酶，催化一个底物分子分解为两个化合物或两个化合物合成为一个化合物，一般涉及双键的合成和消失。如柠檬酸合酶、醛缩酶，水合酶等。"},{"year":"2005","type":"名词解释","number":"4","question":"氨基酸臂与反密码子环","answer":"**5.增色效应和减色效应99/05/13**\n\n嘌呤碱和嘧啶碱具有芳香共轭体系，使得核酸分子在紫外波段有一强烈吸收峰，最大值在260nm附近。单链多核苷酸的εP（摩尔磷吸光系数）大于双螺旋多核苷酸的εP，因此当核酸发生变性时，εP值升高，这种现象称为增色效应，主要原因是核酸变性后，双螺旋区的氢键遭到破坏，双链解开形成单链后，更多的共轭双键暴露出来。若变形DNA复性恢复双螺旋结构后，其紫外吸收会降低，这种现象称为减色效应。\n\n**6磷氧比值**\n\n每消耗一个O原子合成的ATP数，即一对电子通过呼吸链传至氧气所产生的ATP数。NADH为2.5，FADH2为1.5"},{"year":"2005","type":"名词解释","number":"7","question":"脂肪酸β-氧化","answer":"脂肪酸在肝脏中逐步氧化最终生成乙酰CoA和水的代谢过程，因为从羧基端断下一个二碳物即β位碳原子首先氧化，故称β氧化。包括五个步骤：活化，氧化，水合、氧化和硫解。首先脂肪酸在细胞质中活化，在脂酰CoA合酶的作用下生成脂酰CoA，消耗一个ATP，相当于两个高能磷酸键。随后转入线粒体基质，在脂酰CoA脱氢酶的作用下生成烯酰CoA，在水化酶的作用下生成羟脂酰CoA，又在脱氢酶作用下生成酮脂酰CoA，最后在硫解酶的作用下生成乙酰CoA和少两个碳原子的脂酰CoA，由此不断循环，每次循环产生一分子NADH和一分子FADH2。"},{"year":"2005","type":"名词解释","number":"8","question":"衰减子96/97/05/06","answer":"**9.RAPD 05/11**\n\nRAPD，Random Amplified Polymorphic\nDNA，即随机扩增多态性DNA是一种利用随机引物在未知序列模板上进行PCR扩增，以检测基因组DNA多态性的方法。该技术无需事先了解DNA序列信息，使用长度约为10个碱基的随机引物扩增出若干DNA片段，不同个体由于基因组序列存在差异，引物结合位点不同，从而产生具有特征性的电泳条带图谱。常用来判断不同个体、品种或物种之间的遗传关系，比如区分植物品种、鉴定亲缘关系、分析群体遗传多样性和物种鉴定等。"},{"year":"2005","type":"填空题","number":"1","question":"构成蛋白质的氨基酸除\\_\\_\\_\\_**脯氨酸**\\_\\_\\_\\_外，均为\\_\\_**L**\\_\\_\\_\\_\\_\\_构型为。**脯氨酸**\n是亚氨基酸。","answer":""},{"year":"2005","type":"填空题","number":"2","question":"谷氨酸的pK₁为2.6，pK₂为4.6，pK₃为9.6，其pI是\\_\n**3.6（酸性氨基酸，前两个相加除二）**","answer":""},{"year":"2005","type":"填空题","number":"3","question":"\\_\\_\\_\\_**溴化氢**\\_\\_\\_\\_试剂能切断Met羧基形成的肽键。\\_\\_**FDNB**\\_\\_\\_\\_法和\n\\_\\_**\\_Edman**\\_\\_\\_\\_\\_ 法是多肽 N 端氨基酸分析的常用方法。","answer":""},{"year":"2005","type":"填空题","number":"4","question":"\\_\\_\\_**胶原**\\_\\_\\_\\_\\_是具有三股螺旋结构的。","answer":""},{"year":"2005","type":"填空题","number":"5","question":"在pH7.5的缓冲液中，细胞色素C（pI10.6）带有的电荷\\_\\_\\_\\_**正电荷**\\_\\_\\_\\_","answer":""},{"year":"2005","type":"填空题","number":"6","question":"酶促反应决定酶的专一性的组成部分是：**底物结合部位**","answer":""},{"year":"2005","type":"填空题","number":"7","question":"反应速率为最大速度的80%时，Km= **1/4S**","answer":""},{"year":"2005","type":"填空题","number":"8","question":"\\_\\_\\_\\_**竞争性**\\_\\_\\_\\_\n抑制剂不改变酶促反应Vmax，\\_\\_**非竞争性**\\_\\_抑制剂不改变酶促反应 Km。","answer":""},{"year":"2005","type":"填空题","number":"9","question":"\\_\\_\\_\\_\\_**核酶**\\_\\_\\_ 是不以酶原的形式分泌的酶。","answer":""},{"year":"2005","type":"填空题","number":"10","question":"假尿苷中的糖苷键是 **-C-C-** 键","answer":""},{"year":"2005","type":"填空题","number":"11","question":"NAD+、FAD、CoA 三种物质均属于\n\\_\\_**腺嘌呤二核苷酸**\\_\\_\\_\\_\\_\\_的衍生物。","answer":""},{"year":"2005","type":"填空题","number":"12","question":"DNA 分子的 G-C 含量高，分子较稳定，熔解温度 \\_\\_**高**\\_\\_\\_\\_\\_\\_。","answer":""},{"year":"2005","type":"填空题","number":"13","question":"刚转录出的 mRNA，其 5′ 端是\n\\_**m^7^G^5^pppN^m^p^N^p**\\_\\_\\_\\_\\_\\_\\_，其 3′ 端是 \\_**PolyA尾**","answer":""},{"year":"2005","type":"填空题","number":"14","question":"RNA 是 **RNA** 病毒和 **逆转录** 病毒的遗传物质\n\n15\\. tRNA 的反密码子是IGC，它可以识别的密码子有 **GCC、GCU、GCA**。","answer":""},{"year":"2005","type":"填空题","number":"16","question":"引起核酸变性的因素：\n**加热，极端pH，离子强度降低以及特殊的化学试剂（尿素，盐酸胍和甲醛等）**","answer":""},{"year":"2005","type":"填空题","number":"17","question":"DNA分子通过分子折叠形成的三股螺旋叫\\_**H-DNA**\\_\\_\\_，它存在于\\_**基因调控区**\\_，有重要生物学意义。","answer":""},{"year":"2005","type":"填空题","number":"18","question":"由 **3-磷酸甘油醛** 生成 **1,3-二磷酸甘油酸**\n的反应是糖酵解途径中唯一的脱氢反","answer":""},{"year":"2005","type":"填空题","number":"19","question":"磷酸戊糖途径从\\_\\_**6-磷酸葡萄糖**\\_\\_开始，反应可分为\\_**氧化脱羧**\\_阶段和\\_**分子重排**\\_阶段。","answer":""},{"year":"2005","type":"填空题","number":"20","question":"丙酮酸羧化酶位于 **线粒体** 内，辅基是 \\_**生物素**\\_\\_\\_\\_\\_\\_\\_。","answer":""},{"year":"2005","type":"填空题","number":"21","question":"生物氧化是通过代谢物 **氧化还原**\n反应来实现的。生物氧化产生的水是通过 **氧气接收电子后被还原** 形成的。","answer":""},{"year":"2005","type":"填空题","number":"22","question":"氰化物和CO抑制电子从 **细胞色素氧化酶** 向 **氧气** 传递。","answer":""},{"year":"2005","type":"填空题","number":"23","question":"脂肪酸β氧化的限速酶是 \\_**肉碱脂酰移位酶I**\\_\\_\\_\\_","answer":""},{"year":"2005","type":"填空题","number":"24","question":"胆固醇生物合成原料是 \\_\\_**乙酰CoA**\\_\\_\\_，合成胆固醇的限速酶是\n\\_\\_**HMG-CoA还原酶**","answer":""},{"year":"2005","type":"填空题","number":"25","question":"高等动物合成甘油三酯所需要的前体是 **3-磷酸甘油和脂肪酸**","answer":""},{"year":"2005","type":"填空题","number":"26","question":"生酮氨基酸经代谢后可产生 **乙酰乙酰CoA** ，它是合成酮体的原料","answer":""},{"year":"2005","type":"填空题","number":"27","question":"催化dUMP转化为dTMP的酶是 **胸腺嘧啶核苷酸合酶 ，**此酶的辅酶是\n**N^5^，N^10^-亚甲基四氢叶酸** ，他转运 **一碳单位** 给dUMP生成dTMP","answer":""},{"year":"2005","type":"填空题","number":"28","question":"把基因中不编码的序列称为\n\\_\\_**内含子**\\_\\_，把被间隔的编码蛋白的基因部分称为 **外显子**","answer":""},{"year":"2005","type":"填空题","number":"29","question":"拓扑异构酶能够使DNA产生拓扑学的种种变化，最常见的是产生 **负超螺旋**\n和消除超螺旋。","answer":""},{"year":"2005","type":"填空题","number":"30","question":"PCR反应中的每一个循环都需要经过高温变性， **低温退火**\n和中温延伸三个阶段。","answer":""},{"year":"2005","type":"简答题","number":"1","question":"有一个五肽，加酸水解得Leu,Ala,Tyr和Lys。用羧肽酶水解得酪氨酸。用胰蛋白酶水解得三组分(1)Lys(2)Tyr(3)Lys、Leu、Ala。用丹磺酰氯处理，再用酸水解得亮氨酸的荧光衍生物。试说明此肽的氨基酸序列。","answer":"丹磺酰氯是一种强荧光剂，可用于测定肽链的氨基末端，它能专一的与肽链N端结合形成丹磺酰肽，再经过水解生成丹磺酰-氨基酸，具有很强的荧光，利用电泳法或层析法鉴定其为何种氨基酸。\n\nN-C：Leu-Ala-Lys-Lys-Tyr\n\n**2写出NAD^+^的结构式。它是何种维生素的衍生物?作为何种酶的辅酶?在催化反应中起什\n么作用**\n\nNAD+是维生素PP/维生素B3的衍生物。维生素PP在色氨酸代谢过程中产生，大多以烟酸/烟酰胺的形式存在。NAD+和NADP+（烟酰胺腺嘌呤二核苷酸/烟酰胺腺嘌呤二核苷酸磷酸）是由烟酰胺与核糖，磷酸，腺嘌呤组成的作为脱氢酶、氧化酶、DNA连接酶以及依赖于NAD+的组蛋白去乙酰化酶等的辅酶，其还原形式为NADH/NADPH。可以参加多种氧化还原反应，作为氢或电子的受体或供体起着递氢或递电子的作用。\n\n![图示, 示意图 AI\n生成的内容可能不正确。](media/image5.png){width=\"3.2987543744531935in\"\nheight=\"1.805061242344707in\"}"},{"year":"2005","type":"简答题","number":"3","question":"简述核酸的结构02/05","answer":"**4.简述生物体内细胞代谢的调节网络05/07/15/20**\n\n不同的代谢途径可通过交叉点上共同的中间代谢物而相互转化，使各代谢途径得以沟通，形成经济有效、运转良好的代谢网络通路。其中三个最关键的中间代谢物是：6-磷酸葡萄糖、丙酮酸和乙酰辅酶A。细胞内4类主要生物分子糖、脂类、蛋白质和核酸在代谢过程中相互转化，密切相关。柠檬酸循环不仅是各类物质共同的代谢途径，而且也是它们之间相互联系的渠道。不同代谢途径之间虽然相互沟通，但它们存在各自的调节与控制。\n\n![图示 AI\n生成的内容可能不正确。](media/image6.jpeg){width=\"3.395683508311461in\"\nheight=\"2.5436953193350833in\"}\n\n**（一） 分子水平**\n\n**1、 酶水平的调节**\n\n1.  **前馈与反馈的调节**\n\n在代谢途径中前面的底物对其后面某一催化反应的调节酶起激活作用，称为正前馈作用。如1,6-二磷酸果糖和磷酸烯醇式丙酮酸对丙酮酸激酶的激活是正前馈作用。在某些特殊情况下，为避免代谢途径的过分拥挤，过量的底物对代谢过程也可以呈现负前馈作用。高浓度的乙酰-CoA是乙酰-CoA羧化酶的变构抑制剂，避免生成过多丙二酸单酰-CoA。\n\n当生物合成或分解代谢产物大量积累时，产物对代谢途径第一步反应的酶或关键步骤的酶活性发生抑制作用，这就是反馈抑制。反馈抑制可以节省底物和能量，受抑制的酶一般为别构酶。不同代谢途径之间可以通过共同中间产物反馈抑制实现相互协调。例如，柠檬酸可反馈抑制磷酸果糖激酶-1，防止糖酵解过度进行。\n\n2.  **ATP/ADP Pi的调节**\n\n通常产能反应与ADP的磷酸化相偶联，需能反应则与ATP高能磷酸键的水解相偶联。因此ATP与ADP和Pi的浓度比值\\[ATP\\]/\\[ADP\\]\\[Pi\\]，成为细胞能量状态的一种指标，而且还是许多重要调节酶的变构效应物。因此，该比值发生任何变化都将迅速引起相应调节酶活性的改变，进而调节各种代谢反应。当细胞能量充足、\\[ATP\\]升高时，ATP作为别构抑制剂抑制糖酵解限速酶PFK-1的活性，减少葡萄糖的分解；而当能量不足、\\[ADP\\]和\\[AMP\\]升高时，AMP则作为别构激活剂增强PFK-1活性，促进糖酵解以加速ATP的生成。\n\n3.  **酶活性的调节**\n\n**别构调节**：\n\n或称别构调控，酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性，具有这种调节作用的酶称作别构酶。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物（多为产物）。例如天冬氨酸转氨甲酰酶被终产物CTP反馈抑制，被ATP别构激活；3-磷酸甘油醛脱氢酶，具有负协同效应，具有四个亚基，可以和4个NAD+结合，但是结合两个后，酶分子构象发生改变，很难再结合第三、四个。\n\n**可逆共价修饰和级联反应**\n\n共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。其中最普遍的调节是蛋白激酶催化的磷酸化和蛋白磷酸酶催化的去磷酸化。磷酸化反应具有级联放大效应。一个活化的激酶能够在很短时间内催化数百个靶蛋白的磷酸化，新被激活的激酶又能激活下一个激酶，由此引起级联激活，信号呈指数递增，迅速达到生理效果。酶的磷酸化和去磷酸作用，主要在真核生物细胞信号转导途径中进行。如糖原代谢中，糖原磷酸化酶b专一性丝氨酸可被糖原磷酸化酶b激酶磷酸化，由此转变为有活性的糖原磷酸化酶a，启动糖原降解；有活性糖原合酶a可被GSK3磷酸化形成无活性的糖原合酶b，抑制糖原的合成，PP可去除糖原合酶b的磷酸基团，使其变成有活性的糖原合酶a，从而促进糖原的合成。\n\n**酶原激活**\n\n酶原激活：是一种不可逆的共价调节。体内合成出的蛋白质有时不具有酶的活性，需要蛋白水解酶专一性作用后，形成酶的活性部位，变成活性蛋白。这个无活性的蛋白质称为前体，如果活性蛋白质是酶，则这个前体称为酶原。例如胰凝乳蛋白酶，弹性蛋白酶和羧肽酶都具有很强的蛋白质水解能力，但是他们在胰腺中以酶原的形式合成，防止胰腺被破坏，在小肠中的胰蛋白酶的作用下切割成有活性的酶，保证酶在特定的时空表现出活性。\n\n**激活剂或抑制剂的调节**\n\n某些离子或小分子通过直接作用于酶的活性中心或稳定其催化构象，从而增强或降低酶的活性。Mg²⁺常以Mg-ATP复合物形式参与反应，促进磷酸基团转移，是己糖激酶、磷酸果糖激酶、丙酮酸激酶等多种酶反应中必需的辅助因子；Ca²⁺可直接结合并激活异柠檬酸脱氢酶、α-酮戊二酸脱氢酶等关键酶，协调能量代谢与信号传导；而钙调蛋白CaM，可以感受细胞内钙离子浓度变化，浓度升高时与钙离子结合被激活，进而激活很多酶和靶蛋白，使酶能在准确条件下表现出活性。\n\n4.  **酶量的调节**\n\n在一定的反应条件下，酶活性取决于酶分子的数量。酶活性的调节通常都是快速的、可逆的，随着胞内外环境的变化而发生适应性的改变。酶数量的变化则比较缓慢，但较为持久。酶的数量是酶的生成和酶的降解两方面作用的结果。在乳糖操纵子中，阻遏蛋白能够与操纵基因结合，从而阻止β-半乳糖苷酶、β-半乳糖苷透过酶、β-半乳糖苷转乙酰基酶的表达。当以乳糖为唯一碳源时，乳糖异构化形成别乳糖，别乳糖与阻遏蛋白结合，使阻遏蛋白构象发生改变，以致不能与操纵基因结合而失去阻遏作用，启动相关基因的表达，进而酶量上升，酶活性增强。\n\n**2、 基因表达调控**\n\n基因表达可以看作遗传信息的转录和翻译过程。这个过程是受到严密的自我调节控制的，无论是转录或翻译过程都有一定的调节机制。但主要在转录水平上进行调节。\n\n真核生物基因表达调控包括众多水平：\n\n①转录前水平调控：基因扩增、染色质片段丢失、基因重排、DNA甲基化和异染色质化等。\n\n②转录水平的调控：染色质的活化、启动子与增强子的顺式作用元件及反式作用因子\n\n③转录后RNA前体加工及转运的调控\n\n④翻译水平及翻译后水平的调控。"},{"year":"2005","type":"简答题","number":"3","question":"激素的调节","answer":"激素通过与靶细胞受体结合，调控信号转导途径，从而影响代谢反应和基因表达。胰岛素激活PI3K-Akt通路，促进GLUT4上膜，加快葡萄糖摄取；同时激活糖原合酶、抑制糖原磷酸化酶，促进糖原合成，并诱导糖酵解关键酶表达、抑制糖异生。胰高血糖素和肾上腺素经cAMP-PKA途径作用，激活糖原磷酸化酶、抑制糖原合酶和糖酵解关键酶，促进糖原分解与糖异生。在脂肪代谢中，胰岛素促进乙酰CoA羧化酶和脂蛋白脂肪酶活性，促进脂肪酸合成；而胰高血糖素和肾上腺素激活激素敏感性脂肪酶，加速脂肪分解。糖皮质激素促进蛋白质分解以供糖异生，生长激素和甲状腺激素促进蛋白质合成和细胞生长。\n\n**（二）细胞水平的调节15**\n\n**1、 酶的区域化**\n\n无论是原核细胞还是真核细胞，各代谢途径的酶类常组成酶复合物，分布于膜结构或胞内各分化区域，以使代谢有条不紊、彼此协调的进行。如真核生物中糖酵解与糖异生，糖酵解的所有步骤发生在细胞质基质中，糖异生的第一步反应由丙酮酸在丙酮酸羧化酶的作用下生成草酰乙酸的发生在线粒体中，糖异生最后一步，6-磷酸葡萄糖在6-磷酸葡糖磷酸酶的作用下重新变为葡萄糖是发生在内质网中的。\n\n![手机屏幕截图 AI\n生成的内容可能不正确。](media/image7.png){width=\"3.7493383639545055in\"\nheight=\"2.6447583114610675in\"}\n\n**2、 细胞膜结构对代谢的调节**\n\n1.  控制跨膜离子浓度梯度和电位梯度以及控制物质的跨膜运输，有效控制能量转换和信息传递，维持内环境的稳定和细胞内的物质代谢；\n\n2.  膜与酶的可逆结合，有些酶能可逆地与膜结合，并以其膜结合型与可溶型的互变来影响酶的活性，这种酶称为双关酶。正常情况下，PKC存在于细胞质基质中没有活性；当细胞内Ca2+浓度升高，引导PKC转位至细胞质膜上，在Ca2+、PS和DAG的共同作用下激活，活化的PKC可磷酸化多种底物蛋白，应答细胞反应。\n\n**3、 信号途径对代谢的调节**\n\n细胞外信号分子（亲水性信号分子：肽类激素、神经递质）通过与膜表面或细胞内的受体结合，从而激活受体启动一系列信号转导，直接作用于酶来调节代谢或者将信号传递到核内，激活或抑制基因表达来调节代谢。常见的细胞表面受体有离子通道偶联受体、G蛋白偶联受体、酶联受体。常见的第二信使有：cAMP、IP3、DAG等。亲脂性信号分子，常见的有甾醇类激素和甲状腺素，它们可直接穿过细胞质膜进入细胞质或细胞核内完成信号传递。\n\n**（三）机体在整体水平上对细胞代谢的调节控制**\n\n各器官间在代谢上相互协调。从小肠消化、吸收的营养物先送到肝，经由肝加工和转运然后再分送各组织。肌肉利用ATP作机械功，并以脂肪酸、酮体和葡萄糖作为能源物质，必要时可以分解和利用肌糖原、磷酸肌酸和非关键的蛋白质。脑利用能量传递电脉冲，在静息时主要消耗葡萄糖用于脑的能量供应，必要时也能利用β-羟丁酸作为能源物质。血液通过运送氧、代谢物和激素，从而将所有器官连在一起。"},{"year":"2005","type":"简答题","number":"5","question":"蛋白质生物合成的加工修饰方式有哪些00/05","answer":"**6.比较真核生物和原核生物在基因表达调控方面的异同点99/01/05/19**"},{"year":"2006","type":"名词解释","number":"1","question":"兼性离子和两性电解质06/15","answer":"兼性离子：指在同一个分子上能带有释放质子的正离子基团和能接受质子的负离子基团，兼性离子本身既是酸又是碱。两性电解质：指在水溶液中既能电离出H⁺（表现酸性），又能电离出OH⁻（表现碱性）的物质。兼性离子强调的是分子结构上同时具有酸碱基团并能带双电荷；两性电解质强调的是物质在溶液中能既作酸又作碱进行电离。氨基酸既是兼性离子，也是典型的两性电解质。"},{"year":"2006","type":"名词解释","number":"2","question":"超二级结构和结构域06/20/22","answer":"超二级结构域：蛋白质分子，特别是球状蛋白质分子中，经常能看见由两个或者多个相邻的二级结构单元（通常是α-螺旋和β-折叠）及其连接部件组合在一起，形成种类不多，内能降低、有规则的二级结构组合。几种基本组合形式有α-α、β-α-β、β-β。\n\n结构域：在多肽链的二级结构或超二级结构的基础上形成的三级结构局部折叠区，一般是几个基序结构单元的组合，是在空间相对独立的紧密球状实体，也是生物大分子中具有特异结构和独立功能的区域。包括全α类，全β类，α/β类，α+β类以及富含金属或二硫键的结构域等。"},{"year":"2006","type":"名词解释","number":"3","question":"诱导契合学说","answer":"诱导契合学说是酶的专一性假说之一。内容包括：酶分子是高柔性的动态构象分子，当酶分子和底物分子相互靠近时，酶蛋白受底物分子诱导，其构象发生有利于底物分子结合的变化，底物分子也发生形变，转变为过渡态，二者在此基础上互补契合进行反应，降低了反应活化能，是酶具有高效催化能力的原因之一。"},{"year":"2006","type":"名词解释","number":"4","question":"琼脂糖凝胶电泳","answer":"琼脂糖凝胶电泳是一种区带电泳，以琼脂糖为支持介质，在外电场的作用下，根据荷电分子的移动方向和移动速度不同而实现分离的技术。移动速度与被分离的分子所携带电荷大小及种类、分子大小及形状有关。由于琼脂糖凝胶孔径较大以及在非变性条件下利用分子的电荷和构象差异进行分离，同时保持酶活性，便于后续活性检测，适合分离同工酶和大分子核酸，它兼有分子筛和电泳的双重作用。是常用的分离鉴定DNA、RNA混合物的方法，DNA分子在高于等电点的溶液中带负电，在电场作用下向阳极移动，在一定电场强度下，DNA分子迁移速度取决于分子筛即分子的大小和构型。"},{"year":"2006","type":"名词解释","number":"5","question":"丙酮酸脱氢酶复合体06/08/24","answer":"丙酮酸脱氢酶复合体又称丙酮酸脱氢酶酶系，是一种催化丙酮酸不可逆脱羧形成乙酰CoA的多酶复合体，由三种酶和五种辅因子（TPP、硫辛酰胺、CoASH、FAD、NAD^+^）组成。首先由丙酮酸脱氢酶（E1）催化，TPP（焦磷酸硫胺素）为辅基，丙酮酸生成羟乙基-TPP，随后在辅因子硫辛酰胺的作用下生成乙酰二氢硫辛酰胺。其次在二氢硫辛酰胺转乙酰基酶（E2）的催化下生成乙酰CoA和二氢硫辛酰胺。最后二氢硫辛酰胺在二氢硫辛酰胺脱氢酶的作用下生成硫辛酰胺，FAD生成FADH2，随后又在E3的作用下将氢原子转移给NAD^+^。最终生成NADH和乙酰CoA。砷化物与硫辛酰胺的巯基共价结合，使其失去活性。E1可被磷酸化修饰实现活性与非活性的互变，胰岛素和钙离子可以激活E1磷酸酶，使E1去磷酸化而活化。"},{"year":"2006","type":"名词解释","number":"6","question":"氧化磷酸化和底物水平磷酸化95/00/06/15","answer":"氧化磷酸化是需氧生物产生ATP的主要方式，与细胞对ATP的需要相适应。是指还原型辅酶的电子经呼吸链传递给氧气，并利用产生的能量将ADP磷酸化形成ATP的偶联过程。电子传递过程包括电子从还原型辅酶（NADH、FADH2）通过一系列按电子亲和力递增排列的电子载体组成的电子传递链，最终传递给氧气的过程，他们被重新氧化并生成水。电子传递链也叫呼吸链，主要由四种蛋白质复合体构成，NADH-Q还原酶，琥珀酸-Q还原酶，细胞色素还原酶以及细胞色素氧化酶。主要发生在线粒体内膜。\n\n底物水平磷酸化：是指在代谢途径中，底物在酶的催化下发生脱氢或脱水反应，形成高能代谢物并将其高能磷酸基团直接转移到ADP/GDP形成ATP/GTP的不需氧的过程。"},{"year":"2006","type":"名词解释","number":"7","question":"酮尿症和酸中毒","answer":"严重饥饿或未经治疗的糖尿病病人体内肝外组织不能从血液中获取充分葡萄糖，糖异生和脂肪酸氧化加速，产生大量乙酰CoA，但草酰乙酸用于糖异生，因此乙酰CoA不能进入TCA循环，转向生成大量酮体。生成的酮体超过机体利用限度，导致酮体积累，尿液和中酮体显著增高，引起酮中毒，这样的症状称为酮尿症。\n\n酸中毒是指血液中乳酸含量过多，导致血液酸度提高，pH下降。pH过低时，会抑制磷酸果糖激酶-1的活性，进而抑制糖酵解，减少丙酮酸的生成，最终减少乳酸的生成，缓解酸中毒。"},{"year":"2006","type":"名词解释","number":"8","question":"RFLP和SSR","answer":"RFLP即限制性片段长度多态性，是基于DNA序列中限制性内切酶识别位点的差异所产生的多态性。当DNA序列中由于碱基替换、插入或缺失导致某个酶切位点消失或新生成时，经过限制性内切酶切割后，不同个体的DNA会被切成不同长度的片段。\n\nSSR即微卫星DNA或简单重复序列，是指DNA中由1～6bp的短序列重复若干次的区域。由于不同个体在重复次数上存在差异，PCR扩增该区域后可得到不同长度的片段。\n\n二者都是典型的共显性分子标记（检测结果中同时显示出杂合体两种等位基因信号的分子标记，因此能准确区分纯合体与杂合体）"},{"year":"2006","type":"名词解释","number":"9","question":"增强子98/00/01/06/12和衰减子","answer":"一种位于结构基因上游前导区的终止子，可以通过调控核糖体在mRNA上移动速度来行使终止转录信号的的功能，进而进行基因表达调控。转录产物含有茎环结构和一串U序列，受某一氨酰tRNA的调节。例如在色氨酸操纵子中，色氨酸浓度高时，衰减子表现出终止子活性，浓度中等时，部分核糖体发生停滞转录终止，部分继续翻译，基因转录量随浓度呈连续梯度变化。"},{"year":"2006","type":"名词解释","number":"10","question":"抗体酶","answer":"抗体酶是一种具有催化能力的蛋白质，其本质上是免疫球蛋白，但在易变区被赋予了酶的属性，所以又称为催化性抗体。它既具有抗体的高度选择性，又具有酶的高效催化性。通过使底物构象朝向过渡态变化而起作用。使用设计的过渡态类似物为半抗原，通过免疫动物筛选出的有催化作用的单抗。"},{"year":"2006","type":"填空题","number":"1","question":"二肽Ser-Lys的 α-羧基 pKa 值为 3.7，α-氨基 pKa 值为 7.6，侧链 ε-氨基\npKa 值为 10.2。该二肽的 pI = \\_\\_**8.9\\_**\\_\\_\\_\\_\\_","answer":""},{"year":"2006","type":"填空题","number":"2","question":"Cys 的化学结构式为\\_\\_\\_**COOH-C-C-SH**\\_\\_\\_\\_\\_，两个 Cys\n残基之间可以形成 \\_**二硫键**","answer":""},{"year":"2006","type":"填空题","number":"3","question":"含有组件组织（SH2组件、SH3组件），可以通过蛋白-蛋白相互作用识别并结合其它蛋白的蛋白质称为\n\\_\\_\\_**接头蛋白**\\_\\_\\_\\_\\_。","answer":""},{"year":"2006","type":"填空题","number":"4","question":"肽键是一个共振杂化体，肽键的结果是使肽键具有\n\\_\\_**部分双键**\\_\\_\\_\\_\\_\\_ 的性质。","answer":""},{"year":"2006","type":"填空题","number":"5","question":"α螺旋的旋光性主要是 **α-碳构型不对称性** 和 **α-螺旋构象不对称性**\n的总反映","answer":""},{"year":"2006","type":"填空题","number":"6","question":"膜内 \\_\\_**整合膜蛋白**\\_\\_\\_\\_\\_\\_\n是与膜脂双层强缔和的蛋白，它们有的部分或大部分埋入脂双层，有的横跨脂双层，该类蛋白在脂双层疏水核心内的部分只由\n\\_**疏水性氨基酸形成 α-螺旋或 β-折叠结构**\\_\\_组成。","answer":""},{"year":"2006","type":"填空题","number":"7","question":"将电泳技术、抗体-抗原相互作用和酶促反应相结合在一起的生化方法是\n**Western Blotting**","answer":""},{"year":"2006","type":"填空题","number":"8","question":"利用蛋白质分子大小的不同分离蛋白质的层析技术是 **凝胶过滤**\n。在此方法中，最早被洗脱下来的蛋白质分子量 **大**\n\n9\\. 来自 HIV-1 的 protease 是一种\n\\_**逆转录酶**\\_\\_\\_\\_\\_\\_\\_，它的活性部位位于 \\_**N端**\\_\\_\\_\\_\\_\\_\\_。\n\n10\\. 催化各种同分异构体之间互相转变反应的酶称为\n\\_**异构酶**\\_\\_\\_\\_\\_\\_\\_，催化化合物某些基团的转移反应的酶为\n\\_\\_**转移酶**\\_\\_\\_\\_\\_\\_。\n\n11\\. 与底物竞争酶的结合部位，使酶可逆失活的抑制剂称为 **竞争性抑制剂**\n,使酶不可逆的失活的抑制剂称为\\_\\_**专一性不可逆抑制剂**\\_\\_\\_\\_\\_\\_。\n\n12\\. 酶的磷酸化和去磷酸化在酶活性调节中属于\n\\_\\_**酶的可逆共价修饰调节**\\_\\_\\_\\_\\_\\_。\n\n13\\.\n\\_\\_\\_**脱氧核糖**\\_\\_\\_\\_\\_是指分子的一个或多个羟基被氨原子取代的单糖，可在细胞核中参与合成生物大分子。","answer":""},{"year":"2006","type":"填空题","number":"14","question":"纤维素是线性葡聚糖，残基间通过\\_**β-1,4-糖苷键**\n连接的纤维二糖可看作是它的二糖单位。\n\n15\\. 过氧化氢、单线态氧等统称为\n\\_**氧自由基**\\_\\_\\_\\_\\_\\_\\_，它们可导致脂质\n\\_**氧化**\\_\\_\\_\\_\\_\\_作用。\n\n16\\. FMN 和 FAD 是生物体内 \\_**脱氢酶**\\_\\_\\_\\_\\_\\_\\_ 酶的辅基。\n\n17\\. 由 **3-磷酸甘油醛** 生成 **1,3-二磷酸甘油酸**\n的反应是糖酵解途径中唯一的脱氢反应，反应脱下的氢被递氢体\\_\\_**NAD^+^**\\_\\_\\_\\_\\_\\_\n接受。","answer":""},{"year":"2006","type":"填空题","number":"18","question":"糖酵解途径的关键酶有 \\_\\_**己糖激酶，磷酸果糖激酶-1，丙酮酸激酶**\\_\\_","answer":""},{"year":"2006","type":"填空题","number":"19","question":"将酮糖的二碳单位转移到醛糖的 C1上的酶是\n\\_**转酮酶**\\_\\_\\_\\_\\_\\_\\_。将酮糖的三碳单位转移到醛糖C1上的酶是\n**转醛酶**","answer":""},{"year":"2006","type":"填空题","number":"20","question":"葡萄糖参与合成糖原的活性形式是 \\_**UDPG**\\_\\_\\_\\_\\_\\_\\_。","answer":""},{"year":"2006","type":"填空题","number":"21","question":"丙酮酸羧化酶位于 \\_**线粒体基质**\\_\\_\\_\\_\\_\\_\\_ 内，它的辅基是\n\\_\\_**生物素**\\_\\_\\_\\_\\_\\_。","answer":""},{"year":"2006","type":"填空题","number":"22","question":"代谢物在细胞内的氧化与在体外燃烧的主要区别是：\n\\_**混合条件下进行、有无酶的参加、能量逐级释放、部分能量储存在ATP中**\\_\\_\\_\\_\\_\\_","answer":""},{"year":"2006","type":"填空题","number":"23","question":"呼吸链中氧化磷酸化生成 ATP 的偶联部位是\n\\_**NADH-Q还原酶、细胞色素还原酶、细胞色素氧化酶**\\_\\_\\_\\_\\_\\_\\_。","answer":""},{"year":"2006","type":"填空题","number":"24","question":"由尿素循环过程中产生的两种氨基酸分别是\n\\_**瓜氨酸、精氨酸和鸟氨酸**\\_\\_\\_不参与人体内蛋白质合成。","answer":""},{"year":"2006","type":"填空题","number":"25","question":"dTMP 只能由 \\_\\_**dUMP**\\_\\_\\_\\_\\_\\_ 甲基化产生。","answer":""},{"year":"2006","type":"填空题","number":"26","question":"操纵子包括调节基因、启动基因、**结构基因**\\_\\_\\_\\_\\_\\_\\_\\_ 和\n\\_\\_**操纵基因**\\_\\_\\_\\_\\_\\_","answer":""},{"year":"2006","type":"填空题","number":"27","question":"原核生物的启动子序列存在两个共同的序列： **-10区** 和 **-35区** 。","answer":""},{"year":"2006","type":"简答题","number":"1","question":"简述酶高效催化效率有关的因素及其机理","answer":"目前认为酶的催化能力之所以比非酶催化剂高，主要有以下一些因素在降低活化自由能方面起作用。\n\n1.  邻近效应和定向效应\n\n邻近效应是由于酶和底物的亲和性，使底物有向酶活性部位靠近和结合的倾向，直接结果是酶活性部位附近的底物有效浓度比底物在溶液中的浓度高得多，酶的催化效率大大增加。\n\n定向效应是指反应物的反应基团之间，或酶的催化基团与反应基团之间，通过正确的空间取向产生的催化效应，本质上是两个底物分子被束缚在酶的活性中心，使一个分子间反应转变为一个类似分子内反应。\n\n2.  底物形变和诱导契合\n\n酶分子是高柔性的动态构象分子，当酶分子和底物分子相互靠近时，酶蛋白受底物分子诱导，其构象发生有利于底物分子结合的变化，底物分子也发生形变，转变为过渡态，二者在此基础上彼此互补契合进行反应，降低了反应活化能。\n\n3.  多元催化和协同效应\n\n在催化反应中，常常是几个基元催化反应配合在一起共同起作用。例如胰凝乳蛋白酶，通过Asp，His，Ser构成电荷中继网，也叫催化三联体。\n\n基元催化反应：\n\n酸碱催化：是通过瞬时的向反应物提供质子和从反应物接受质子以稳定过渡态，加速催化反应的一类催化机制。常见的酸碱催化基团包括Ser的羟基，Cys的巯基和His的咪唑基，以及碱性氨基酸的氨基和酸性氨基酸的羧基。His是酸碱催化中最活泼的一个催化功能团，可以作为质子供体，也可以质子受体，其给出或得到电子的速度也最快。\n\n共价催化：又称亲核催化或亲电子催化。催化时，亲核基团或亲电子基团分别放出或汲取电子并作用于酶分子的缺电子中心或负电子中心，迅速形成不稳定的中间态复合物，降低反应活化能，加速催化反应。常见的亲核基团包括Ser的羟基，Cys的巯基和His的咪唑基。常见的亲电子基团包括磷酸吡哆醛和焦磷酸硫胺素TPP。天冬氨酸转氨酶就属于共价催化范畴。\n\n金属离子催化：金属离子作为酶的催化剂，紧密结合金属离子的酶称为金属酶，松散结合金属离子的酶称为金属激活酶。金属离子通常以3种方式参加作用：通过结合底物使其在反应中正确定向；通过自身氧化态变化发生氧化还原反应，通过静电相互作用稳定或屏蔽净电荷，稳定过渡态。\n\n4.  活性部位微环境\n\n酶的活性中心部位位于疏水环境裂缝中，是一个非极性环境，其介电常数较低，从而使处于其中的带相反电荷的基团之间的静电作用力比在极性环境中显著增高，因此有利于催化反应。"},{"year":"2006","type":"简答题","number":"2","question":"分别以血红蛋白和天冬氨酸转氨甲酰酶为例解释蛋白质别构调控","answer":"血红蛋白04：协同效应，波尔效应，別构调节\n\n天冬氨酸转氨甲酰酶：即ATCase，催化天冬氨酸和氨甲酰磷酸生成氨甲酰-天冬氨酸并释放一分子磷酸。它是一种正协同性酶，有12个亚基，6个为催化亚基C，6个为调节亚基R。对底物天冬氨酸和氨甲酰磷酸都呈S形曲线，这种正协同效应使底物浓度在一个很窄的范围内开启氨甲酰天冬氨酸的合成，结合位点在C亚基。此外，该反应途径终产物CTP是它的异促负效应物，ATP是它的异促正效应物，结合位点都在R亚基。\n\n**3简述生物体进行糖原代谢整体调节的各种调节机制**\n\n关键酶：糖原磷酸化酶以及糖原合酶的调节\n\n糖原磷酸化酶和糖原合酶都通过专一性丝氨酸磷酸化和去磷酸化实现活性和非活性的互变，包括a、b两种存在形式。糖原磷酸化酶中：a是有活性的磷酸型，b是无活性的去磷酸型，糖原磷酸化酶激酶GPK3是它的强烈激活剂。糖原合酶中：a是有活性的去磷酸型，b是无活性的磷酸型，糖原合酶激酶GSK3是它的强烈抑制剂。这两种存在形式还各自都有两种别构状态，活化状态R和钝化状态T，不同构象之间也有一定的平衡关系，磷酸化酶a平衡偏向于活化的R构象，磷酸化酶b几乎完全偏向于钝化的T构象，糖原合酶与之相反。\n\n1.  ATP、6-磷酸葡萄糖以及AMP对糖原代谢的别构调节\n\nAMP是糖原磷酸化酶的别构激活剂，可使其发生b→a的转变。ATP、6-磷酸葡萄糖是糖原合酶的别构激活剂，同时对糖原磷酸化酶有抑制效应。在静息的肌肉细胞中，高浓度的ATP和6-磷酸葡萄糖与AMP对抗，使磷酸化酶失活，糖原合酶活化，糖原积累。当肌肉开始运动后，AMP含量升高，ATP和6-磷酸葡萄糖减少，磷酸化酶活化，引发糖原的迅速降解。肝脏中的磷酸化酶不受AMP/ATP的影响，肝糖原用来维持血糖恒定。\n\n2.  磷酸化酶激酶、PKA、蛋白磷酸酶PP对糖原代谢的调节作用\n\n体内cAMP含量升高激活PKA，活化的PKA磷酸化糖原磷酸化酶激酶GPK使其活化，进而磷酸化糖原磷酸化酶GP，促进糖原磷酸化降解；磷酸化糖原合酶GS使其失活，抑制糖原合成。磷酸化（磷蛋白磷酸酶抑制蛋白）IP使其活化，进而抑制PP（磷蛋白磷酸酶）。PP能够催化GS，GP和GPK去磷酸化，促进糖原合成。6-磷酸葡萄糖结合到糖原合酶的一个别构部位后，使其更容易被PP去磷酸化而激活。\n\n3.  肾上腺素、胰高血糖素和胰岛素对糖原代谢的调节\n\n肾上腺素、胰高血糖素可以激活特定的GPCR，进而激活Gs蛋白，引起细胞中特定信号通路，体内cAMP含量升高激活PKA，活化糖原磷酸化酶，抑制糖原合酶，最终抑制糖原合成。胰岛素通过激活PI3K-Akt（PKB）信号通路，抑制GSK3活性同时促使PP活化，解除对糖原合酶的抑制，使糖原磷酸化酶失活，刺激糖原的合成。"},{"year":"2006","type":"简答题","number":"4","question":"简述sanger法测定DNA序列的基本原理和构成","answer":"Sanger提出，又叫双脱氧链终止法，反应体系包含待测序的单链DNA模板、引物、四种dNTP（其中一种用放射性同位素标记：每个片段至少含一个放射性核苷酸，使其都能被检测到）和DNA聚合酶。共分为四组，每组按一定比例加入一种底物类似物2,3-双脱氧核苷三磷酸ddNTP。它能随机掺入合成的DNA链，一旦掺入后DNA合成立即终止。最后各组样品在含有变性剂（破坏氢键、保持DNA链为单链状态）的聚丙烯酰胺凝胶上进行电泳，从放射自显影的图谱上推测DNA的核苷酸序列。（片段越小走的越快，越靠近凝胶底部）聚丙烯酰胺凝胶具有很高的分辨率，可以精确区分相差1个碱基的DNA片段，这是琼脂糖凝胶无法做到的。"},{"year":"2006","type":"简答题","number":"5","question":"激素如何影响细胞的新陈代谢和基因的表达调控","answer":"激素在体内通过内分泌系统分泌，作用于特定的靶细胞。不同类型的激素通过不同的机制调节细胞的新陈代谢，包括糖代谢、脂肪代谢、蛋白质代谢等\n\n（1）糖代谢\n\n根据激素对血糖水平的调控，将激素分为升糖激素和降糖激素。升糖激素主要包括胰高血糖素和肾上腺素，降糖激素为胰岛素。\n\n**葡萄糖的摄取：**胰岛素首先通过与细胞表面的胰岛素受体结合，激活受体的酪氨酸激酶活性。启动了细胞内一系列相应的信号转导，激活PI3K-Akt（PKB）信号通路。进而促进GLUT4转运蛋白的转运到细胞膜，使细胞膜上的数量大大增加，尤其是在肌肉和脂肪细胞中，促进葡萄糖进入细胞。\n\n**糖原合成：**肾上腺素、胰高血糖素可以激活特定的GPCR，进而激活Gs蛋白，引起细胞中特定信号通路，体内cAMP含量升高激活PKA，活化的PKA磷酸化糖原磷酸化酶激酶GPK使其活化，进而磷酸化糖原磷酸化酶GP，促进糖原磷酸化降解；磷酸化糖原合酶GS使其失活，抑制糖原合成；磷酸化（磷蛋白磷酸酶抑制蛋白）IP使其活化，进而抑制PP（磷蛋白磷酸酶）。胰岛素通过激活PI3K-Akt（PKB）信号通路，抑制GSK3活性同时促使PP活化，PP能够催化GS，GP和GPK去磷酸化，解除对糖原合酶的抑制，使糖原磷酸化酶失活，刺激糖原的合成。\n\n**糖酵解：**胰岛素通过激活PI3K-Akt（PKB）信号通路，促进多种糖酵解关键酶的表达与活性，包括诱导己糖激酶、磷酸果糖激酶-1和丙酮酸激酶等的合成，促进葡萄糖的分解；同时，胰岛素促进磷酸果糖激酶-2的去磷酸化，使其激酶活性增强，促进2,6-二磷酸果糖的生成，作为磷酸果糖激酶-1的强效激活剂，从而进一步增强糖酵解。而在饥饿、应激状态下，胰高血糖素和肾上腺素通过cAMP依赖的PKA途径，磷酸化并抑制磷酸果糖激酶-2，降低2,6-二磷酸果糖浓度，减弱对磷酸果糖激酶-1的激活作用，从而抑制糖酵解；此外，PKA还可直接磷酸化丙酮酸激酶，抑制其活性，阻断糖酵解末端步骤。\n\n**糖异生：**胰岛素通过激活PI3K-Akt（PKB）信号通路，抑制PEP羧激酶、1,6-二磷酸果糖磷酸酶和6-磷酸葡萄糖磷酸酶等糖异生关键酶的基因表达；同时促进2,6-二磷酸果糖的合成，增强其对1,6-二磷酸果糖磷酸酶的抑制作用；此外还可抑制丙酮酸羧化酶的表达，降低肝脏糖异生活性。而胰高血糖素与肾上腺素则通过激活PKA，促使糖异生关键酶的基因表达上调；同时，PKA抑制磷酸果糖激酶-2的活性，使2,6-二磷酸果糖水平下降，解除对1,6-二磷酸果糖磷酸酶的抑制作用，增强糖异生。\n\n**三羧酸循环：**在能量充足、血糖升高时，胰岛素促进糖酵解生成丙酮酸，并通过激活丙酮酸脱氢酶复合体（PDH），加速其转化为乙酰辅酶A，增强三羧酸循环供能。而在饥饿状态下，胰高血糖素和肾上腺素间接通过促进脂肪酸氧化增加乙酰辅酶A与NADH的供给，反馈抑制丙酮酸脱氢酶活性。\n\n（2）脂肪代谢\n\n在饥饿、应激或运动状态下，胰高血糖素和肾上腺素通过激活PKA，进而磷酸化并激活激素敏感性脂肪酶（HSL），促进脂肪组织内三酰甘油的水解，释放游离脂肪酸和甘油进入血液供其他组织氧化利用；同时抑制乙酰CoA羧化酶的活性。相反，在进食状态下，胰岛素促进葡萄糖进入脂肪细胞，增强丙酮酸脱氢酶和乙酰CoA羧化酶的活性，促进丙酮酸生成乙酰CoA，并转化为丙二酸单酰CoA，作为脂肪酸合成的起始底物；同时，丙二酸单酰CoA可抑制肉碱酰基转移酶I，阻断脂肪酸进入线粒体，从而抑制β-氧化；胰岛素还诱导脂蛋白脂肪酶（LPL）的表达，促进循环中脂蛋白释放脂肪酸并进入脂肪细胞储存。另如糖皮质激素可通过促进脂肪动员并增强脂肪酸氧化能力。\n\n在胆固醇合成过程中，胰高血糖素使HMG-CoA还原酶磷酸化而失活，抑制胆固醇的合成；胰岛素激活PP，使HMG-CoA还原酶去磷酸化，促进胆固醇合成。\n\n（3）其他\n\n与糖代谢和脂肪代谢相比，激素对氨基酸和核酸代谢的调控较为间接。胰岛素通过促进蛋白质合成与抑制分解，间接调节氨基酸的利用；糖皮质激素则在应激或饥饿时通过促进蛋白分解释放氨基酸。生长激素则在细胞增殖过程中促进氨基酸的利用。在核酸代谢中，激素主要通过调节细胞增殖影响DNA和RNA合成，生长激素、甲状腺激素能增强细胞增殖，间接促进核酸合成，而糖皮质激素则抑制RNA合成与细胞增殖。"},{"year":"2006","type":"简答题","number":"6","question":"已知蛋白质X是一种真核生物蛋白质。某实验室利用大肠杆菌对该蛋白质进行了表达，以获得一定量的高纯度的蛋白质进行研究。蛋白质X\n特性如下：","answer":"**①相对分子质量49500**\n\n**②等电点为4.2**\n\n**③具有磷酸水解酶活性，(最适PH=8.0)**\n\n**④在大肠杆菌中表达时容易形成包涵体**\n\n**请为该蛋白质设计一套最有效的纯化方案。要求：**\n\n**①纯化方案开始于收集菌体，终止于蛋白质X的鉴定，实验分步进行。**\n\n**②充分利用已知条件**\n\n**③解释每一步操作的理由。**\n\n（1）菌体收集与包涵体提取\n\n首先，在大肠杆菌中表达蛋白质X之后，通过低速离心收集菌体沉淀。由于蛋白质X在表达过程中倾向于形成包涵体，即不溶性的错误折叠聚集体，因此在破碎细胞时需采用超声波震荡法，有效破裂细胞壁并释放胞内组分。随后采用差速离心方法去除细胞碎片及可溶性蛋白，保留沉淀即包涵体。该步骤的核心目的在于通过物理方式富集蛋白质X，提高后续纯化的效率和起始蛋白含量。\n\n（2）包涵体溶解与蛋白质变性\n\n将所得包涵体沉淀重悬于强变性条件的缓冲液中，如含有6--8mol/L尿素或5--8\nmol/L盐酸胍的溶液，同时可辅以少量SDS及碱性的Tris缓冲体系。可以破坏包涵体中的疏水作用和非特异性聚集，使蛋白质X从错误折叠状态转化为线性链状的变性蛋白，并溶解于液相中。只有彻底解聚为单体状态，目标蛋白才能在后续复性过程中恢复正确的构象与功能。\n\n（3）蛋白质复性与粗样品获取\n\n将变性后的蛋白通过透析或分子筛层析（如Sephadex\nG-25）进行缓慢复性，即逐渐降低变性剂的浓度，使蛋白质在温和条件下自然折叠。为防止复性过程中形成错误构象或聚集，可在缓冲液中加入甘油、精氨酸、金属离子或低浓度还原剂等助折叠组分。在这一过程中，蛋白质X有可能恢复其天然三维结构，并重新获得生物活性。透析后的溶液即为复性后的粗蛋白样品，是进一步纯化与活性验证的基础。\n\n（4）酶活性与比活力初测\n\n将粗蛋白样品制备成合适浓度，在pH\n8.0的缓冲液中进行酶活性测定，检测其磷酸水解酶功能。常用的方法为利用合适底物反应生成无机磷，通过比色法进行定量分析，测定酶活力。随后测定蛋白浓度（如Bradford法或BCA法），可计算该粗样品的比活力（每mg蛋白质所含的酶活力单位数），以此判断复性效率及活性恢复程度，为后续分离提供定量指标，也可作为后期纯化倍数计算的基础数据。\n\n（5）高分辨分离提纯蛋白质X\n\n根据蛋白质X的等电点为4.2及分子量49500的特性，可采用双向电泳，即IEF和SDS-PAGE相结合的分离技术。将粗样品在薄胶条上用IEF进行第一次分离，再把胶条水平铺设在PAGE上用SDS-PAGE第二次分离。得到的双向电泳谱水平向分离反应PI，垂直向分离反应分子量。通过比较电泳条带位置，可判断目标蛋白的位置与纯度，进一步剪切回收所需蛋白。这种方法尤其适合小规模实验室条件下的精细分析与分离。\n\n（6）最终活性与纯化效果检验\n\n对上述分离得到的蛋白质X样品再次进行酶活性测定和蛋白定量，计算其比活力，并与粗样品进行比较。通过总酶活（单位活力×总体积）和比活（单位活力/蛋白质量）可分别得出回收率和纯化倍数。其中，回收率反映目标蛋白在整个流程中的保留效率，纯化倍数则衡量纯度提升幅度。最终若在SDS-PAGE上呈现单一主带，且比活力显著升高，即表明目标蛋白已被成功纯化并保持活性，可用于进一步的结构与功能研究。"},{"year":"2007","type":"名词解释","number":"1","question":"蛋白质四级结构99/00/07","answer":"蛋白质的四级结构是指由两条或多条具有完整一二三级结构的多肽链（亚基）通过非共价力（主要是疏水相互作用，其次为氢键和盐键，无共价键）相互连接形成的一般为球形的立体结构。涉及亚基的组成，数量，各亚基在整个分子中的空间排布以及亚基与亚基之间相互作用。"},{"year":"2007","type":"名词解释","number":"2","question":"酶的总活力与比活力","answer":"酶活力单位：在一定条件下，一定时间内将一定量底物转化为产物所需的酶量。\n\n总活力U：溶液中所含总的酶活力单位数。\n\n比活力U/mg：代表酶的纯度，用每mg蛋白质所含的酶活力单位数来表示，对同一种酶来说，比活力越大，酶的纯度越高。比活力=总活力U/总蛋白mg"},{"year":"2007","type":"名词解释","number":"3","question":"亲和层析03/07/20","answer":"亲和层析是利用蛋白质分子对其配体分子特有的生物学亲和力实现分离的一种纯化方法。是将待纯化的某一蛋白的特异配体通过适当的化学反应共价连接到载体表面的官能团上，当蛋白混合物加到该层析柱时，待纯化蛋白则被吸附到层析柱上，其他蛋白不被吸附通过流动相洗脱除去，被特异结合的蛋白质可用含游离的配体溶液从柱上洗脱。"},{"year":"2007","type":"名词解释","number":"4","question":"蛋白质的变性与复性","answer":"变性：指天然蛋白分子受到某些物化因素如有机溶剂、酸、碱等的影响，发生生物活性丧失，溶解度降低，不对称增高（空间构象更加扭曲、不对称，从而使得蛋白质旋光性质发生增强）以及其他物化性状发生改变的协同过程。实质是蛋白质中的次级键被破坏，引起天然构象解体，不涉及共价键（肽键、二硫键）的破裂，一级结构保持完好。\n\n复性：指变性分子由于除去引起其变性的因素而恢复原天然构象和生物活性及其他各种性质的现象。一般认为蛋白质变性程度很低的时候才能发生复性，多采用透析或超滤等方法去除变性剂。"},{"year":"2007","type":"名词解释","number":"5","question":"限制性内切酶95/07/18","answer":"一类能够识别DNA双链上某一特定核苷酸序列并在此切割的核酸内切酶。分为三类，I、II、III型。I型和III型都是在同一蛋白质中同时具有修饰酶活性和ATP依赖性限制内切酶活性，I型结合在识别位点随机切割，III型在识别位点下游24～26bp处切割。II型是由甲基修饰酶和限制内切酶两种酶分子组成的复合体，修饰和切割同一特异位点，识别位点通常是二重对称结构（4～6bp的回文序列），是最常见的一种。"},{"year":"2007","type":"名词解释","number":"6","question":"苹果酸-天冬氨酸穿梭","answer":"细胞溶胶中的NADH将电子通过苹果酸脱氢酶传递给草酰乙酸，生成苹果酸，苹果酸通过苹果酸-α-酮戊二酸转运体进入线粒体基质，同时转出α-酮戊二酸。随后苹果酸再次脱去电子转变成草酰乙酸，并生成NADH，进入电子传递链。由于草酰乙酸不能自由透过线粒体内膜，所以需要转氨基为天冬氨酸。草酰乙酸和谷氨酸在谷草转氨酶的作用下生成α-酮戊二酸和天冬氨酸，天冬氨酸通过谷氨酸/天冬氨酸转运体转出线粒体基质进入细胞溶胶，同时转入谷氨酸，天冬氨酸和α-酮戊二酸在谷草转氨酶的作用下生成草酰乙酸，完成补充。该反应可逆转，但细胞溶胶中的NADH浓度需大于线粒体基质，NADH才能转入。NADH通过此途径产生2.5个ATP，该途径主要发生在肝脏和心脏中。"},{"year":"2007","type":"名词解释","number":"7","question":"复制子04/07","answer":"基因组能够独立进行复制的单位称为复制子，每个复制子都含有复制起始的起点，可能还有终点，复制在起始阶段进行控制，一旦开始便会进行下去，直到复制完成。原核生物、病毒以及大多数真核生物的细胞器DNA为环状双链分子，只包含一个复制起点，为单复制子，通常是双向对称复制。真核生物DNA为线性双链分子，有多个复制起点，可以分段复制，称为多复制子。真核生物形成的复制叉移动速度由于染色体的高级结构，比原核生物慢，核小体解聚和组装需要时间。"},{"year":"2007","type":"名词解释","number":"8","question":"DNA损伤的错配修复","answer":"错配修复是指DNA损伤一种修复机制，主要用于识别并纠正DNA复制过程中未被聚合酶校对功能去除的错配碱基，以防止突变积累、维持基因组稳定性。在原核生物中，错配修复依赖MutS识别错配，MutL介导复合物形成，MutH识别半甲基化GATC序列并切开新链，然后由外切酶切除新链上的错误区段，DNA聚合酶和连接酶完成修复。而在真核生物中，由MSH识别错配，MLH介导修复过程，但不依赖甲基化识别新旧链，而是通过识别新链上暂时存在的缺口（冈崎片段之间的缺口）或由PCNA（增殖细胞核抗原）提供方向性信号来完成链辨别，在DNA复制过程中进行修复。错配修复系统是DNA复制后重要的\"第二道保真机制\"，其缺陷与多种疾病（如Lynch综合征）密切相关。"},{"year":"2007","type":"名词解释","number":"9","question":"多核糖体","answer":"核糖体在细胞内不仅可以单个独立执行功能，而且通常还由多个核糖体串联在一条mRNA上高效地合成肽链，这种具有特殊功能和形态结构的核糖体与mRNA的聚合体称为多核糖体。每种多核糖体所包含的核糖体数量是由mRNA的长度决定的，mRNA越长，合成的多肽分子量越大，核糖体的数目也就越多。\n\n**10谷草转氨酶**\n\n谷草转氨酶GOT，又称天冬氨酸氨基转移酶AST。是肝细胞中一种极为活跃的酶，心肌中活性最高，它存在于线粒体和细胞质基质中，其重要性在于维持细胞内两大氨基酸库即谷氨酸库和天冬氨酸库之间的平衡。还是苹果酸-天冬氨酸穿梭途径必不可少的酶。能够催化谷氨酸和草酰乙酸反应生成α-酮戊二酸和天冬氨酸，且反应可逆。"},{"year":"2007","type":"填空题","number":"1","question":"丙酮酸激酶** 等\n\n30\\. 生物体内催化核糖核酸还原生成脱氧核糖核酸的酶和蛋白为\n**核糖核苷酸还原酶、硫氧还蛋白还原酶、硫氧还蛋白酶** 等。","answer":""},{"year":"2007","type":"简答题","number":"1","question":"什么是疏水作用?为什么说熵增加是疏水作用的主要动力?简述疏水作用在维系蛋白质","answer":"**结构与生物功能方面所起的作用**\n\n疏水相互作用是指水相环境中的疏水分子或分子集团倾向于相互聚集的现象。是发生在非极性分子之间一种弱的非共价相互作用，这些非极性分子在水相环境具有避开水而相互聚集的倾向。疏水相互作用是一个熵增的自发过程，在维持大分子的三维构象方面具有重要作用。\n\n疏水作用是由水分子体系熵的增加所驱动。当非极性分子分散在水中时，周围的水分子为了减少与其接触，会形成有序的笼状结构，使体系熵降低；而当这些非极性分子聚集在一起后，原本被束缚的水分子重新获得自由运动的机会，整个体系熵显著增加，从而降低自由能，使过程自发进行。\n\n疏水作用是维系和稳定蛋白质三、四级结构的主要作用力之一，并且疏水环境也对生物功能的执行方面有重要作用。蛋白质分子多为球状，带有疏水侧链的残基处于分子内部，蛋白质活性部位一般也位于其内部疏水环境中。例如酶的活性中心一般位于酶表面的一个疏水环境裂缝中，是一个非极性环境，其介电常数较低，从而使处于其中的带相反电荷的基团之间的静电作用力比在极性环境中显著增高，因此有利于酶和底物的结合进而催化反应进行。血红蛋白和肌红蛋白内部有一个疏水区域，血红素结合位点在此区域，维持Fe2+不被氧化，保持价态不变，进而维持其结合并运输氧气的能力。当存在尿素、盐酸胍等变性剂时，蛋白质内部疏水作用被破坏，使肽链伸展，溶解度降低，生物活性丧失，蛋白质易降解。\n\n**2在生物体内存在很多通过改变酶的结构从而调节其活性的方法，请举出其中的四中方法，并分别举例说明**\n\n酶活性的调节方式有多种，活性调节如下：\n\n1.  **别构调节**：\n\n或称别构调控，酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性，具有这种调节作用的酶称作别构酶。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物（多为产物）。例如天冬氨酸转氨甲酰酶被终产物CTP反馈抑制，被ATP别构激活；3-磷酸甘油醛脱氢酶，具有负协同效应，具有四个亚基，可以和4个NAD+结合，但是结合两个后，酶分子构象发生改变，很难再结合第三、四个。\n\n2.  **共价调节**：\n\n共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。常见的共价修饰包括，磷酸化，腺苷酸化，尿苷酸化，甲基化，乙酰化，二硫键的形成等。这种调节方式比别构调节慢，而且一般需要耗能，与其他调节方式不同的是，它能对更多的效应物刺激作出反应，调节形式更灵活，能对效应物浓度变化做出更强烈的反应，存在级联放大效应，是一种经济，快速，节能的调节方式。例如糖原磷酸化酶因专一性丝氨酸是否磷酸化实现活性和非活性互变，大肠杆菌中的谷氨酰胺合成酶因专一性酪氨酸是否结合AMP实现活性和非活性的互变。\n\n3.  **酶原激活：**\n\n是一种不可逆的共价调节。体内合成出的蛋白质有时不具有酶的活性，需要蛋白水解酶专一性作用后，形成酶的活性部位，变成活性蛋白。这个无活性的蛋白质称为前体，如果活性蛋白质是酶，则这个前体称为酶原。例如胰凝乳蛋白酶，弹性蛋白酶和羧肽酶都具有很强的蛋白质水解能力，但是他们在胰腺中合成，防止胰腺被破坏，以酶原的形式合成，在小肠中的胰蛋白酶的作用下切割成有活性的酶，保证酶在特定的时空表现出活性。\n\n4.  **激活剂和抑制剂**：\n\n某些离子或小分子通过直接作用于酶的活性中心或稳定其催化构象，从而增强或降低酶的活性。Mg²⁺常以Mg-ATP复合物形式参与反应，促进磷酸基团转移，是己糖激酶、磷酸果糖激酶、丙酮酸激酶等多种酶反应中必需的辅助因子；Ca²⁺可直接结合并激活异柠檬酸脱氢酶、α-酮戊二酸脱氢酶等关键酶，协调能量代谢与信号传导；而钙调蛋白CaM，可以感受细胞内钙离子浓度变化，浓度升高时与钙离子结合被激活，进而激活很多酶和靶蛋白，使酶能在准确条件下表现出活性。\n\n5.  **通过亚基聚合和解离调节寡聚酶活性**\n\n这种作用既包括使无活性的寡聚体解离，使部分亚基获得催化活性，也包括使无活性的单体聚合形成有催化活性的寡聚体。前者的例子是cAMP激活PKA，该酶包括两个催化亚基和两个调节亚基，表现为无活性，cAMP与调节亚基结合后，引起解离，游离的催化亚基获得生物活性。后者的例子是表皮生长因子激活表皮生长因子受体，该受体通常在细胞膜上以无活性的单体形式存在，被激活后形成活性二聚体。"},{"year":"2007","type":"简答题","number":"3","question":"在纯化一种蛋白质并研究其性质的实验过程中，你遇到了一些问题，请利用你所掌握的知识解决这些问题：","answer":"**(1)实验开始阶段，你已经获得大量可高效表达此蛋白的细菌菌体，请写出两种破碎菌体的方法；**\n\n1.  超声波震荡法：用一定功率的超声波处理细胞悬液，使其急剧震荡破裂，缺点是产生大量热，不适用于超声波和热敏感性蛋白。\n\n2.  溶菌酶法：特异性地水解细菌细胞壁中肽聚糖的β-1,4-糖苷键，使细胞壁破裂而释放细胞内容物。该方法操作温和，缺点是反应时间较长、成本较高，对细胞壁较厚或革兰氏阴性菌效果较差\n\n**(2)通过粗纯化，你得到100毫升样品，你计划用离子交换层析法纯化这些样品，已知该蛋白质的等电点是5.0,你所使用的缓冲液的pH为7.5,为了使该蛋白质能与离子交换剂结合，你应使用阴离子交换剂还是阳离子交换剂?**\n\n阴离子交换剂：pH＞PI，蛋白质带负电，选择阴离子交换剂。\n\n**(3)得到纯化好的蛋白质样品后，你需要检验该样品的纯度并确定其分子量，简述如何进行试验**\n\n利用SDS-PAGE技术，将蛋白质样品进行分离，若出现单一条带，则说明纯度很高。再议标准蛋白的相对分子量和电泳迁移率绘制标准曲线，将样品蛋白的电泳迁移率带入即可得出其相对分子量。（电泳迁移率=样品迁移距离/燃料迁移距离）\n\n**(4)接下来，你计划研究该蛋白质的变性与复性特性，你发现蛋白质样品浓度很低，不能满足试验要求，请写出两种可用于提高蛋白质浓度的方法**\n\n1.  透析浓缩法：将蛋白质溶液装入透析袋中，外液为高渗溶液（如含有聚乙二醇或蔗糖的缓冲液），利用渗透作用使水分从袋内移出，从而达到浓缩目的。该方法温和，不易导致蛋白质变性。\n\n2.  超滤法：利用分子量截断膜（如10 kDa或30\n    kDa滤膜）在压力或离心力作用下让小分子和水透过，而保留大分子蛋白质，从而实现快速浓缩。该法操作简便、效率高，适用于后续结构与功能研究。\n\n这两种方法都会由于被膜吸附使蛋白样品量减少\n\nTCA沉淀法：向蛋白质溶液中加入终浓度约为10%的三氯乙酸（TCA），充分混匀后放置于冰浴中约30分钟，使蛋白质因酸变性而沉淀析出。随后在低温下离心，将沉淀收集并用预冷丙酮或乙醇洗涤，以去除残余酸和杂质，再用适当的缓冲液（如Tris或PBS）重新溶解即可得到高浓度蛋白溶液。会破坏蛋白质的构象，不适用于需要保持天然构象或酶活性的样品"},{"year":"2007","type":"简答题","number":"4","question":"简述生物体内葡萄糖生物合成的代谢途径。","answer":"1.  糖异生：\n\n2丙酮酸通过**丙酮酸羧化酶**（生物素，-2ATP，线粒体基质）生成2草酰乙酸，通过**PEP羧激酶（溶胶/线粒体基质）**（-2GTP）生成2PEP，通过烯醇化酶生成2个2-磷酸甘油酸，通过磷酸甘油酸变位酶生成2个3-磷酸甘油酸，通过3-磷酸甘油酸激酶生成2个1,3-二磷酸甘油酸（-2ATP），通过3-磷酸甘油醛脱氢酶生成2个3-磷酸甘油醛（-2NADH），通过丙糖磷酸异构酶实现磷酸二氢丙酮DHAP的互变，通过醛缩酶生成1，6-二磷酸果糖，通过**1,6-二磷酸果糖磷酸酶（细胞溶胶）**生成6-磷酸果糖，通过磷酸葡萄糖异构酶生成6-磷酸葡萄糖，通过**6-磷酸葡萄糖磷酸酶（内质网标志酶，只存在于肝肾细胞溶胶）**生成葡萄糖。\n\n乳酸通过乳酸脱氢酶生成丙酮酸，丙氨酸通过谷丙转氨酶生成丙酮酸\n\n2.  肝糖原分解：（糖原分解90%1-磷酸葡萄糖，10%葡萄糖）\n\n**糖原磷酸化酶**从还原性末端断裂α-1,4-糖苷键，直到分支前4个糖残基位置，得到1-磷酸葡萄糖；**糖原脱支酶**将这四个中的三个转移到另一个分支的非还原性末端或糖原的核心链上，暴露出分支点的α-1,6-糖苷键，将其断裂水解得到葡萄糖（10%）；1-磷酸葡萄糖通过磷酸葡萄糖变位酶生成6-磷酸葡萄糖；通过6-磷酸葡萄糖磷酸酶生成葡萄糖。"},{"year":"2007","type":"简答题","number":"5","question":"简述人体内物质代谢的调控机制05/07/15/20","answer":"**6.请你设计实验来证明：大肠杆菌在葡萄糖和乳糖共同存在的培养基中，它会首先利用谁作为碳源物质?为什么**\n\n直接在化学成分明确的含葡萄糖和乳糖的基本无机盐培养基中培养E.coli，测定生长曲线，同时取样进行HPLC分析糖的剩余情况，即可得知优先利用哪个糖，其生长曲线应该是典型的二次生长曲线。\n\n当培养基中有多种能源物质时，微生物首先利用更易分解利用的能源物质，而首先被利用的这种物质对利用其他能源物质的酶具有阻遏作用。葡萄糖是第一个被发现有这种阻遏效应的物质，因此又被称为葡萄糖效应。在这种途径中，有一种分解物激活蛋白CAP，它具有两个位点，cAMP结合位点和DNA结合位点。只有当cAMP与其结合，CAP构象发生改变，才能进一步和DNA启动子结合并促进RNA聚合酶的结合，如结合在Lac上游的CAP结合位点，增强转录。葡萄糖进入细胞后，细胞中cAMP含量下降，抑制CAP活性，进而抑制Lac结构基因的转录，进而抑制对乳糖的利用。"},{"year":"2008","type":"名词解释","number":"1","question":"糖苷键与糖肽键","answer":"**糖苷键**是指一个环状单糖分子或糖链还原端的半缩醛（半缩酮）羟基与另一个分子（醇、糖、嘌呤或嘧啶）的羟基或胺基之间缩合形成的缩醛键（缩酮键），常见的包括O-糖苷键和N-糖苷键。如淀粉和糖原主链都是通过α-1,4-糖苷键连接，分支通过α-1,6-糖苷键连接；纤维素通过β-1,4-糖苷键连接。\n\n**糖肽键**是指糖蛋白中寡糖链的还原端异头碳与多肽链的氨基酸残基共价连接形成的化学键。主要包括N-糖肽键（N-乙酰葡糖胺-天冬酰胺）、O-糖肽键（N-乙酰半乳糖胺-丝氨酸/苏氨酸）、S-糖肽键（半胱氨酸）以及脂糖肽键（天冬氨酸/谷氨酸）等。"},{"year":"2008","type":"名词解释","number":"2","question":"别构效应","answer":"广义上指蛋白质的非活性部分与某些化合物可逆的非共价结合后，发生构象的改变，进而改变蛋白质的活性，称为别构效应。多表现为酶的别构效应，具有这种调节作用的酶称作别构酶。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物（多为产物）。例如天冬氨酸转氨甲酰酶被终产物CTP反馈抑制，被ATP别构激活；3-磷酸甘油醛脱氢酶，具有负协同效应，具有四个亚基，可以和4个NAD+结合，但是结合两个后，酶分子构象发生改变，很难再结合第三、四个。"},{"year":"2008","type":"名词解释","number":"3","question":"离子交换层析03/08/17/23","answer":"离子交换层析是指根据在给定pH下蛋白质分子净电荷符号和数量不同实现分离的技术。它以离子交换剂作为固定相，蛋白分子与其结合的强弱取决于相反电荷之间的静电相互作用，两者的电离程度取决于溶液的pH。离子交换剂由带电荷的树脂或纤维素组成，带有负电荷的为阳离子交换树脂：反之为阴离子交换树脂。层析洗脱可以采用洗脱液成分一直不变的方式洗脱，也可以采用跳跃式分段或渐进式连续的形式，改变洗脱液中的盐浓度或pH值的方式洗脱。"},{"year":"2008","type":"名词解释","number":"4","question":"亮氨酸拉链","answer":"在一段α螺旋结构中，每隔七个氨基酸（即一个螺旋的两圈）出现一个亮氨酸，这些亮氨酸沿着螺旋的一侧排列。当两条这样的α螺旋靠近时，亮氨酸的疏水侧链相互嵌合，类似拉链咬合，从而稳定形成二聚体。这种结构使蛋白质能通过二聚化形成稳定的DNA结合结构域。亮氨酸拉链的C端一般负责二聚化，N端常含有碱性氨基酸（如Lys、Arg），用于与DNA的特定序列结合，因此这种蛋白也称为碱性亮氨酸拉链蛋白。功能上，亮氨酸拉链结构广泛存在于转录因子中，能够特异性识别并结合DNA序列并调控基因转录，是原核与真核生物中重要的转录调控机制之一"},{"year":"2008","type":"名词解释","number":"5","question":"DNA的熔解温度","answer":"通常把DNA热变性引起物化性质改变一半时的温度称为该DNA的熔解温度。DNA的Tm受溶液离子强度、pH、极性溶质、DNA均一性、G-C含量和核酸长度等各种因素的影响。一般来说，在离子强度较低的溶液中DNA的Tm较低，且变性过程发生在较宽的温度范围内，在离子强度适当高的溶液中Tm较高，且变性过程发生在一个很窄的温度范围内。双链RNA比同样的双链DNA更稳定，Tm更高。单链RNA可以通过回折形成局部双链螺旋区，变性过程中逐渐解开，Tm较低。"},{"year":"2008","type":"名词解释","number":"6","question":"糖原磷酸解","answer":"糖原磷酸化酶从还原性末端断裂α-1,4-糖苷键，直到分支前4个糖残基位置，得到1-磷酸葡萄糖；糖原脱支酶将这四个中的三个转移到另一个分支的非还原性末端或糖原的核心链上，暴露出分支点的α-1,6-糖苷键，将其断裂水解得到葡萄糖（10%），被利用时比1-磷酸葡萄糖多需要一个ATP；1-磷酸葡萄糖通过磷酸葡萄糖变位酶生成6-磷酸葡萄糖，这个过程不消耗ATP，进而进入糖酵解通路利用或糖异生途径生成葡萄糖。由于分解过程中涉及磷酸基团的加入，所以称为糖原的磷酸解。"},{"year":"2008","type":"名词解释","number":"7","question":"α-互补与蓝白筛选","answer":"α-互补与蓝白筛选是分子克隆中常用的重组筛选体系。其原理是利用大肠杆菌β-半乳糖苷酶（LacZ）的分段互补表达：宿主菌株（如E.coli）染色体上含有部分lacZ基因，编码酶的ω片段；质粒载体上含有另一部分lacZ基因，编码酶的α片段（N端）。两者单独表达均无活性，但当质粒进入宿主后，α与ω片段互补形成活性β-半乳糖苷酶，这一过程称为α-互补。在含有X-gal（人工乳糖）和诱导剂IPTG的平板上，IPTG模拟乳糖作用，解除阻遏蛋白抑制，使lacZ得以表达；若质粒的lacZα序列完整，互补产生活性酶可分解X-gal生成蓝色产物；若外源DNA插入多克隆位点破坏lacZα，互补作用失效，菌落呈白色。由此可通过菌落颜色快速筛选出重组克隆。"},{"year":"2008","type":"名词解释","number":"8","question":"酶原和酶原的激活08/17/24","answer":"酶原激活是一种不可逆的共价调节。体内合成出的蛋白质有时不具有酶的活性，需要蛋白水解酶专一性作用后，形成酶的活性部位，变成活性蛋白。这个无活性的蛋白质称为前体，如果活性蛋白质是酶，则这个前体称为酶原。例如胰凝乳蛋白酶，弹性蛋白酶和羧肽酶都具有很强的蛋白质水解能力，但是他们在胰腺中合成，防止胰腺被破坏，以酶原的形式合成，在小肠中的胰蛋白酶的作用下切割成有活性的酶，保证酶在特定的时空表现出活性。"},{"year":"2008","type":"名词解释","number":"9","question":"丙酮酸脱氢酶系06/08/24","answer":"**10.鸟苷四磷酸(ppGpp)和鸟苷五磷酸(pppGpp)**\n\n当细菌处于贫瘠的生长环境，缺乏氨基酸供给蛋白质合成，出现很多空载tRNA，这种tRNA会激活焦磷酸转移酶，大量生成鸟苷四磷酸(ppGpp)和鸟苷五磷酸(pppGpp)作为信号分子，引起很多基因关闭（尤其是结合RNA聚合酶，抑制rRNA合成），也会打开一些合成氨基酸的基因应对紧急情况。最终关闭大部分代谢的活性，这种现象称为严紧控制，即细菌通过节省其贮存物而将代谢活性降到最低，借此度过艰难时期，等待条件的改善。"},{"year":"2008","type":"填空题","number":"1","question":"甘油磷脂的极性头基包括 **磷酸** 基与酯化的醇部分，非极性尾部包括\n**两条脂肪酸** ，甘油磷脂通常参与形成 **脂双层结构**\n，用以作为生物膜的结构主体。","answer":""},{"year":"2008","type":"填空题","number":"2","question":"侧链R基在生理pH下带负电荷的氨基酸是 **Asp** 和 **Glu**\n，其侧链基团可作为质子受体参与酶的 **酸碱**\n催化作用。（第3章氨基酸的分类）","answer":""},{"year":"2008","type":"填空题","number":"3","question":"一种三肽用胰蛋白酶处理后，得到Trp与Arg两种氨基酸，则该三肽的氨基序列应为\n**Arg-Arg-Trp** 。\n\n4．在蛋白质的α螺旋结构中，氨基酸残基的侧链位于螺旋的 **外部**\n，氢键的取向几乎与螺旋轴 **平行** ；在DNA双螺旋结构中，碱基位于螺旋的\n**内部** ，氢键的取向几乎与中心轴 **垂直** 。第5章 第13章","answer":""},{"year":"2008","type":"填空题","number":"5","question":"可用于测定蛋白质相对分子质量的方法包括\n**凝胶过滤**、**SDS-PAGE**和**沉降过滤法** 等。","answer":""},{"year":"2008","type":"填空题","number":"6","question":"脊椎动物激素可分为 **肽类激素**\n，固醇类激素与脂肪酸衍生物激素三类，激素主要通过与其靶细胞膜上或细胞内的\n**特异性受体蛋白** 结合，产生作用。（第17章)","answer":""},{"year":"2008","type":"填空题","number":"7","question":"蛋白激酶在分类上属于六大类酶中的 **转移酶**\n，其与蛋白磷酸酶共同参与的酶活性调控作用称为 **可逆的共价修饰**\n第8，10章","answer":""},{"year":"2008","type":"填空题","number":"8","question":"磷酸吡哆醛是维生素 **B6** 的衍生物，可在氨基酸的代谢反应中起到转移\n**氨基** 的作用。","answer":""},{"year":"2008","type":"填空题","number":"9","question":"Western blotting 法与Southern blotting法的共同点是二者均使用\n**电泳分离** 方法分离待测样品，区别是Western blotting 法利用\n**抗原抗体** 之间的作用检测样品，Southern blotting法利用\n**核酸互补链之间的碱基配对** 之间的作用检测样品。","answer":""},{"year":"2008","type":"填空题","number":"10","question":"核苷酸通过 **3，5-磷酸二酯键**\n键连接成为核酸分子，核苷酸中的碱基使核苷酸与核酸在 **260nm**\nnm附近具有最大紫外吸收值。第14章","answer":""},{"year":"2008","type":"填空题","number":"11","question":"在DNA的复制过程中，大肠杆菌以 **NAD+** 为能源，动物以 **ATP** 为能源\n。","answer":""},{"year":"2008","type":"填空题","number":"12","question":"生物体合成DNA的方式有 **DNA半不连续复制、DNA修复、逆转录** 三种","answer":""},{"year":"2008","type":"填空题","number":"13","question":"大肠杆菌不依赖于ρ因子的转录终止子具有\n**回文对称的发夹结构和一连串U序列** 结构特点。第36章","answer":""},{"year":"2008","type":"填空题","number":"14","question":"氯霉素通过与 **原核生物核糖体50S亚基** 结合，抑制 **肽酰tRNA**\n合成而起到抗菌作用。","answer":""},{"year":"2008","type":"填空题","number":"15","question":"真核生物在转录水平上的调控主要是通过特定的\n**顺式作用元件和反式作用因子** 的复杂相互作用来实现。","answer":""},{"year":"2008","type":"填空题","number":"16","question":"磷脂分为 **甘油** 磷脂和 **鞘** 磷脂两大类。","answer":""},{"year":"2008","type":"填空题","number":"17","question":"催化糖酵解途径中脱氢反应的酶是 **3-磷酸甘油醛脱氢酶** ，氢受体是\n**NAD+** 。\n\n18\\. **柠檬酸合酶，异柠檬酸脱氢酶，α-酮戊二酸脱氢酶**\n酶调节三羧酸循环的速率。","answer":""},{"year":"2008","type":"填空题","number":"19","question":"催化乙醛酸循环途径的特有酶是 **异柠檬酸裂解酶** 和 **苹果酸合酶** 。","answer":""},{"year":"2008","type":"填空题","number":"20","question":"软脂酸合成的限速酶是 **乙酰CoA羧化酶** 。","answer":""},{"year":"2008","type":"填空题","number":"21","question":"泛酸是 **酰基载体蛋白ACP**\n的组成部分而在脂代谢过程中起着十分重要的作用 。\n\n22\\. **丙氨酸、天冬氨酸和谷氨酸**\n三种氨基酸能够通过EMP-TCA途径中间代谢物直接合成。","answer":""},{"year":"2008","type":"填空题","number":"23","question":"由ATP提供磷酸基团，催化胞嘧啶核苷生成胞嘧啶核苷酸的酶是 **尿苷激酶**","answer":""},{"year":"2008","type":"填空题","number":"24","question":"在核苷酸代谢中，别嘌呤醇抑制 **黄嘌呤氧化酶** 的活性。","answer":""},{"year":"2008","type":"简答题","number":"1","question":"简述蛋白质结构的组织层次，并指出在每级结构中用于维系和稳定该结构的主要作用力（共价键或非共价键）。","answer":"1.  一级结构：蛋白质的一级结构通常是指多肽链中氨基酸组成，数量、排列顺序以及二硫键的数量和位置，也称化学结构。对于缀合蛋白来说还应包括共价连接的辅基部分。一级结构很大程度上决定了二级结构、三级结构以及蛋白质的功能。主要作用力：肽键（共价键）\n\n2.  二级结构：多肽链局部肽段借氢键沿一定方向盘曲折叠形成的有规则周期性结构，即该段肽链主链原子和基团的空间排布，而不涉及氨基酸残基侧链的定位和与其他肽段的关系。形成结果是疏水基团埋藏在蛋白质分子内部，亲水基团暴露在蛋白分子表面。它是蛋白质复杂三维结构的基础，主要包括α-螺旋、β-折叠、β-转角、无规卷曲等。主要作用力：氢键\n\n3.  超二级结构域：蛋白质分子，特别是球状蛋白质分子中，经常能看见由两个或者多个相邻的二级结构单元（通常是α-螺旋和β-折叠）及其连接部件组合在一起，形成种类不多，内能降低、有规则的二级结构组合。几种基本组合形式有α-α、β-α-β、β-β。主要作用力：氢键，疏水相互作用\n\n4.  结构域：在多肽链的二级结构或超二级结构的基础上形成的三级结构局部折叠区，一般是几个基序结构单元的组合，是在空间相对独立的紧密球状实体，也是生物大分子中具有特异结构和独立功能的区域。包括全α类，全β类，α/β类，α+β类以及富含金属或二硫键的结构域等。主要作用力：氢键，疏水相互作用\n\n5.  三级结构：多肽链在二级结构、超二级结构和结构域的基础上因序列相隔较远的氨基酸残基侧链的相互作用而进行进一步范围更广的盘曲折叠，形成的包括多肽链主、侧链所有原子和基团在内的整体空间排布。主要作用力：疏水作用力。还有二硫键，唯一共价键\n\n6.  四级结构：蛋白质的四级结构是指由两条或多条具有完整一二三级结构的多肽链（亚基）通过非共价力（主要是疏水相互作用，其次为氢键和盐键，无共价键）相互连接形成的一般为球形的立体结构。涉及亚基的组成，数量，各亚基在整个分子中的空间排布以及亚基与亚基之间相互作用。"},{"year":"2008","type":"简答题","number":"2","question":"（1）蛋白质的功能通常跟蛋白质与其配体的相互作用相联系，蛋白质与配体的相互作用具有什么特点?请列举至少三种特点并分别举例说明；（2）蛋白质与核酸之间也可以相互作用，举例说明蛋白质-核酸之间的相互作用（列举至少两种相互作用）","answer":"**（1）**蛋白质与配体相互作用的特点包括专一性、可逆性、饱和性、协同性四个基本特点，部分情况下还包括别构调节性。\n\n1.  专一性：蛋白质与配体的结合具有高度结构互补性，只能识别特定分子，这是由结合位点的空间构型、电荷分布及疏水性决定的。比如，乳酸脱氢酶只能催化L-乳酸生成丙酮酸；又如抗体可特异识别抗原，体现出极高的专一性。\n\n2.  可逆性：蛋白质与配体主要通过非共价键（如氢键、范德华力、静电作用、疏水作用）相互作用，因此结合和解离可随环境条件变化而可逆进行。典型如血红蛋白与氧的结合与释放：在肺泡高氧时结合，在组织低氧时解离；再如酶与底物形成的ES复合物，在反应完成后产物可解离，酶恢复原状。\n\n3.  饱和性：蛋白质结合位点有限，当配体浓度升高到所有位点都被占据时，结合达到饱和，不再增加。典型例子有酶催化反应的米氏动力学，当底物浓度升高至一定程度后反应速率达到最大值Vmax；又如血红蛋白的氧饱和曲线，在高氧分压区趋于平稳，表现出饱和性。\n\n4.  协同性：多亚基蛋白中，一个亚基与配体结合后可改变其他亚基的构象，从而影响其对配体的亲和力，表现为正协同或负协同效应。最典型的是血红蛋白与氧结合的正协同效应，一个亚基结合氧后，其余亚基更容易结合氧，使氧解离曲线呈S形；再如别构酶如3-磷酸甘油醛脱氢酶的多亚基间对NAD+的负协同性。\n\n**（2）**蛋白质与核酸之间的相互作用在细胞生命过程中十分重要，既包括结构性的结合，也包括功能性的调控。\n\n1.  组蛋白与DNA的结合：DNA为双螺旋结构，和组蛋白结合形成核小体串珠结构，再盘绕螺旋形成螺线管，进一步螺旋形成超螺线管，最后在组蛋白、非组蛋白以及少量RNA的帮助下折叠形成染色体高级结构，结构更稳定。\n\n2.  转录因子与DNA的结合：转录因子可识别并结合DNA上特定序列（如启动子、增强子），从而调节基因的转录。例如，TATA结合蛋白（TBP）与TATA盒结合帮助RNA聚合酶识别起始位点；又如p53蛋白特异结合DNA以调控细胞周期相关基因如p21的转录。\n\n3.  RNA结合蛋白与RNA的相互作用：RNA结合蛋白能识别mRNA或rRNA上的特定序列或二级结构，对RNA的剪接、修饰、运输、翻译及稳定性等过程起调控作用。例如，Poly(A)结合蛋白（PABP）与mRNA的Poly(A)尾结合，随后结合到eIF4G上，促进翻译起始；核糖体蛋白与rRNA结合则形成核糖体核心，是蛋白质合成的结构基础。"},{"year":"2008","type":"简答题","number":"3","question":"已知乳酸脱氢酶催化如下反应；","answer":"**乳酸＋NAD+↔丙酮酸＋NADH＋H+**\n\n**（1）试利用以下试剂与仪器中的一部分设计一种测定乳酸脱氢酶活力的方法，并简要给出设计依据；**\n\n**试剂；丙酮酸、NAD﹢、NADH、Na2HPO4、NaH2PO4;**\n\n**仪器；天平、ph计、核酸∕蛋白检测仪、紫外可见光分光光度计、荧光光谱仪、圆二色光谱仪、垂直板电泳槽、电泳仪。**\n\n该反应中，NADH在340nm波长处具有特征吸收峰，而NAD⁺在该波长几乎无吸收，因此可利用紫外分光光度法测定乳酸脱氢酶活力。\n\n实验时，以丙酮酸为底物，使反应按生成乳酸的方向进行，即NADH被氧化为NAD⁺。反应体系通常包括：磷酸缓冲液（pH\n7.5）、NADH溶液、丙酮酸溶液及乳酸脱氢酶酶液。以缓冲液为空白，在340nm波长下用紫外分光光度计连续记录吸光度的变化。反应进行过程中，NADH的消耗使A₃₄₀随时间下降，其下降速率（ΔA₃₄₀/Δt）即代表酶促反应速率。根据Lambert--Beer定律，可计算NADH消耗速率，从而得出单位时间内催化1μmolNADH氧化所需的酶量，即为1个酶活单位（U）。\n\n该方法的设计依据是：①NADH与NAD⁺在紫外区吸收差异显著，便于比色定量；②磷酸缓冲液维持最适pH以保持酶活性；③反应体系简明、灵敏度高，可用于求取乳酸脱氢酶的比活力与动力学常数。\n\n**（2）通过测定，得知在最适反应条件下，在0.1ml酶样品的作用下，每10分钟有0.3摩尔的丙酮酸分子被还原为乳酸，试计算1ml酶样品所含的酶活力国际单位（IU）数；**\n\n国际单位IU表示酶活力，规定为：在最适反应条件（25℃）下，每分钟催化1μmol底物转化为产物所需的酶量定义为一个酶活力单位，即1IU=1μmol/min\n\n0.3mol=300μmol,300/10/0.1=300，即为300IU\n\n**（3）已知有机小分子A是该酶的抑制剂，试设计一种方法检测A是该酶的可逆抑制剂还是不可逆抑制剂；**\n\n不可逆抑制是指抑制剂与酶的必需基团以共价键结合而引起酶活力丧失，不能用透析、超滤等物理方法除去抑制剂而使酶复活。可逆抑制是指抑制剂与酶以非共价键结合而引起酶活力丧失或降低，能用物理方法除去抑制剂而使酶复活，这种抑制作用是可逆的。可逆抑制和不可逆抑制可以用动力学方法进行区分。向反应体系中加入一定量的抑制剂和底物，对照组加入相同浓度的底物，不加入抑制剂。然后向两系统中加入不同量的酶，分别测定它们在不同酶浓度下的反应初速率v~0~，并以v0对Et作图，进而判断抑制剂属于可逆或者不可逆。\n\n对照组：一条通过原点的直线\n\n实验组：若是可逆抑制剂：通过原点但斜率低于对照组；若是不可逆抑制剂：不通过原点，但斜率与对照组相同，类似对照组平行下移的一条直线。由于一定量酶失去活性，因此加入酶量超过抑制剂剂量时才表现出活力。\n\n**（4）假设A是该酶的可逆抑制剂，试设计一种方法检测A是否为丙酮酸在该酶的竞争性抑制剂。**\n\n若A为可逆抑制剂，可进一步判断其抑制类型。大多数竞争性抑制剂I与底物结构类似，因此能与酶的活性部位结合形成可逆的EI复合物，但EI复合物不能产生产物P，因此酶活性下降。这种抑制作用的强弱取决于抑制剂与底物的相对浓度，可通过提高底物浓度来解除。\n\n实验设计如下：\n\n① 在保持酶量和NADH浓度恒定的条件下，分别设置不同丙酮酸浓度的反应体系；\n\n②\n在每组体系中再分别加入固定浓度的抑制剂A和不加A的对照组，用紫外分光光度法测定酶促反应初速度；\n\n③ 作出L--B双倒数作图（1/v对1/\\[S\\]）；\n\n④\n若加入A后图线交于纵轴（1/v~max~）处，斜率增加（v~max~不变，Km增加），说明A与底物竞争结合酶活性中心，为竞争性抑制剂；若两条线平行（v~max~降低，Km不变）则为非竞争性抑制；若交于横轴左侧（Km增加，v~max~降低）则为混合型抑制。"},{"year":"2008","type":"简答题","number":"4","question":"乙酰辅酶A是生物代谢过程中的关键物质，请简要说明在动物体内，有哪些物质通过什么代谢途径可产生乙酰辅酶A，同时它又可通过什么代谢途径转化成哪些代谢物？","answer":"来源：\n\n1.  由丙酮酸经丙酮酸脱氢酶复合体催化生成。\n\n2.  由脂肪酸β氧化生成，脂肪酸每轮氧化会形成乙酰CoA和比原脂酰CoA少两个碳原子的脂酰CoA，产物继续β氧化。\n\n3.  由酮体（乙酰乙酸、β-羟丁酸）在肝外组织代谢时，裂解生成乙酰CoA进入TCA循环。\n\n4.  由生酮氨基酸（Phe，Trp、Tyr、Lys、Leu）分解生成乙酰乙酰CoA，硫解酶的作用下生成乙酰CoA。\n\n去路：\n\n1.  进入TCA循环，与草酰乙酸结合通过柠檬酸合酶生成柠檬酸，最终彻底氧化分解成CO2和H2O，并产生ATP。\n\n2.  作为类固醇的前体生成胆固醇，乙酰CoA通过硫解酶生成乙酰乙酰CoA，通过HMG-CoA合酶生成HMG-CoA，随后通过HMG-CoA还原酶（内质网）生成甲羟戊酸C6，随后生成异戊二烯衍生物C5，进一步合成鲨烯C30，由于其不溶于水，结合固醇载体蛋白生成羊毛固醇C30进行转运至内质网上，最终生成胆固醇。\n\n3.  在饥饿或糖尿病等状态下，过量的乙酰CoA在肝细胞线粒体中转换为酮体：乙酰CoA-乙酰乙酰CoA------HMG-CoA------乙酰乙酸------β-羟丁酸\n\n4.  作为脂肪酸合成的前体：乙酰CoA------丙二酸单酰CoA---缩合、还原、脱水、还原\n\n5.  合成神经递质乙酰胆碱\n\n6.  作为乙酰基供体参与乙酰化反应"},{"year":"2008","type":"简答题","number":"5","question":"在基因工程中获得目的基因的实验方法有哪些？请简述其中一种实验方法的基本原理与操作流程。01/08","answer":"**6.何谓基因表达的时序控制？请举例说明。**\n\n基因表达的时序控制是指在细胞生命活动过程中，不同基因的表达按照一定的时间顺序启动或终止，以保证生物体各阶段功能活动的协调与有序进行。不同阶段的基因产物常常相互调控，形成一个层层递进的调控网络。\n\n以λ噬菌体为例，其感染大肠杆菌后的基因表达具有明显的时序性。噬菌体DNA进入宿主后，首先转录早期基因产生N和Cro蛋白，其中N蛋白使RNA聚合酶越过终止信号继续转录中期基因，生成调节蛋白CII。CII可促进CI阻遏蛋白的合成，若宿主条件不佳，CII稳定、CI积累，噬菌体DNA整合到宿主染色体进入溶原状态；若宿主代谢旺盛，CII被降解，CI难以形成，Cro抑制CI合成，后期基因启动，噬菌体进入裂解状态。\n\n在真核生物细胞周期调控中，细胞周期蛋白（Cyclin）及其依赖性激酶（CDK）的基因表达也呈时序性：G₁期表达Cyclin\nD，S期表达Cyclin A，M期表达Cyclin B，使细胞周期过程按序推进。"},{"year":"2009","type":"名词解释","number":"1","question":"甘油磷脂与鞘磷脂09/18/25","answer":"甘油磷脂是机体中含量最多的一类磷脂，由sn-3-磷酸衍生而来，也称磷酸甘油酯。在甘油磷脂中，甘油的两个羟基和脂肪酸形成酯，第三个羟基被磷酸基酯化，形成磷脂酸，磷酸基上连接不同的X基团形成不同的甘油磷脂，如磷脂酰胆碱，磷脂酰丝氨酸，磷脂酰乙醇胺和磷脂酰肌醇等。它除了构成生物膜外，还是胆汁和膜表面活性物质等成分之一，并参与细胞膜对蛋白质的识别和信号转导。\n\n鞘磷脂也称鞘氨醇磷脂，脂肪酸通过酰胺键与鞘氨醇C2上的氨基结合形成神经酰胺，神经酰胺C1位羟基与磷脂酰胆碱（少数是磷脂酰乙醇胺）结合，形成新的极性头部。鞘磷脂存在于动物细胞质膜，特别是髓鞘（延伸的质膜中）。"},{"year":"2009","type":"名词解释","number":"2","question":"分子伴侣00/02/09/12/14","answer":"**3.透析法与超滤法**\n\n透析：是利用蛋白质分子不能通过半透膜的性质，使蛋白质和其他小分子物质分开。透析是把待纯化的蛋白质溶液装在半透膜的透析袋里，放入透析液中进行的，透析液可以更换，直至透析袋内无机盐等小分子物质降低到最小值为止。\n\n超滤法：是利用压力或离心力，强行使水和其他小分子溶质通过半透膜，而蛋白质被截留在膜上，以达到浓缩和脱盐的目的。"},{"year":"2009","type":"名词解释","number":"4","question":"共价催化","answer":"共价催化又称亲核催化或亲电子催化。催化时，亲核基团或亲电子基团分别放出或汲取电子并作用于酶分子的缺电子中心或负电子中心，迅速形成不稳定的中间态复合物，降低反应活化能，加速催化反应。常见的亲核基团包括Ser的羟基，Cys的巯基和His的咪唑基。常见的亲电子基团包括磷酸吡哆醛和焦磷酸硫胺素TPP。天冬氨酸转氨酶就属于共价催化范畴。"},{"year":"2009","type":"名词解释","number":"5","question":"Northern印迹法","answer":"一种通过核酸分子杂交检测RNA分子量和数量的技术。首先将通过琼脂糖凝胶电泳将待测RNA样品按分子量大小进行分离，随后按照其在凝胶中的位置转移到硝酸纤维素薄膜上，固定后用带有放射性标记的DNA或RNA探针进行杂交。如果样品中含有与探针互补的序列，则标记探针会与其通过碱基互补配对原则而结合。洗涤游离探针后通过放射自显影或其他技术进行检测，从而显示出待检片段及其相对大小。"},{"year":"2009","type":"名词解释","number":"6","question":"生物氧化","answer":"生物氧化是指有机分子在机体氧化分解成二氧化碳和水并释放出能量的过程。特点包括：活的细胞中（pH中性、体温），在一系列酶、辅酶和中间传递体参与下进行；能量逐步释放，其中一部分直接由高能化合物如ATP捕获，另一部分形成还原性辅酶如NADH，经过电子传递途径，脱氢和氧气结合生成水同时生成ATP；不会因为氧化过程中能量骤然释放而伤害机体，又能使释放的能量尽可能得到有效的利用。"},{"year":"2009","type":"名词解释","number":"7","question":"葡萄糖-丙氨酸循环09/16","answer":"葡萄糖-丙氨酸循环指葡萄糖和Ala反复地在肌肉和肝之间进行氨的转运的循环过程。具体过程为：肌肉中的氨基酸将氨基转移给丙酮酸生成Ala，后者经血液循环转运至肝脏经过联合脱氨基作用再脱氨基，放出来的氨用于合成尿素，生成的丙酮酸通过糖异生途径再转变为葡萄糖，再经血液循环转运至肌肉，经EMP途径分解产生丙酮酸，再接受氨基生成Ala。生理意义：肌肉和肝之间氨的转运形式，使肌肉中的氨以无毒的Ala形式转运至肝，同时肝也为肌肉提供了生成丙酮酸的葡萄糖，反应可逆。"},{"year":"2009","type":"名词解释","number":"8","question":"SH2结构域","answer":"SH2结构域是一种存在于多种信号转导蛋白中的保守性结构域。它的主要功能是识别并特异性结合含有磷酸化酪氨酸残基的多肽序列。在细胞信号转导过程中，当受体酪氨酸激酶被激活后，其胞内区上的酪氨酸残基被磷酸化，即可被SH2结构域识别并结合，从而将下游信号蛋白招募到受体复合体上，实现信号的级联传递。例如PI3K-PKB信号通路。"},{"year":"2009","type":"名词解释","number":"9","question":"RNA干扰技术09/17/21","answer":"RNA干扰是一种由小分子RNA介导的特异性基因沉默现象，通过降解靶mRNA或抑制其翻译，从而抑制基因表达。该过程通常由Dicer酶将双链RNA（dsRNA）切割成小RNA分子启动，主要包括两种形式：siRNA途径：由外源或人工双链RNA经Dicer切割产生的siRNA（双链）与RISC复合体结合，通过与靶mRNA完全互补配对，引导RISC特异性切割并降解靶mRNA，实现外源基因沉默；miRNA途径：由细胞自身基因编码的前体RNA经Dicer加工形成miRNA（单链），与RISC结合，通过与靶mRNA部分互补配对，引导RISC特异性切割并降解靶mRNA，实现内源基因沉默。"},{"year":"2009","type":"名词解释","number":"10","question":"噬菌体表面展示技术","answer":"噬菌体表面展示技术是指将外源基因片段插入噬菌体衣壳蛋白基因中，使外源肽段或蛋白在噬菌体表面表达展示的一种重组DNA技术。展示的肽段或蛋白能保持正确构象，可与靶分子（如抗原或受体）发生特异结合，从而筛选获得高亲和力的肽或抗体分子。该技术常用于抗体工程、受体配体研究和药物筛选等领域。"},{"year":"2009","type":"填空题","number":"3","question":"已知一种蛋白质的等电点为4.5,当蛋白质水溶液的PH值为8.0时，该蛋白质应带\n**负** 电荷，并 **不能** 能(能或不能)结合阳离子交换剂。\n\n4\\. **氢键**\n是带正电荷的氢核与另一个电负性强的原子之间的非共价作用，它是稳定\n**二级** 结构的主要作用力。","answer":""},{"year":"2009","type":"填空题","number":"5","question":"在球状蛋白与纤维状蛋白质中，蛋白质表面具有较多疏水性氨基酸残基的是\n**纤维状蛋白**含有多种二级结构元件的是 **球状蛋白**","answer":""},{"year":"2009","type":"填空题","number":"6","question":"使用中性盐使蛋白质沉淀的方法称为 **盐析法**\n，用该方法获得的沉淀与上清液通常可以使用 **离心** 方法分离。","answer":""},{"year":"2009","type":"填空题","number":"7","question":"通过测定蛋白质分解产生的氨的量检测蛋白质含量的方法称为 **凯氏定氮法**\n,该方法的最大缺点就是 **测定的是总有机物中的N，不只是蛋白质的**","answer":""},{"year":"2009","type":"填空题","number":"8","question":"抗体的重链与轻链通过 **二硫键**\n共价连接成复合体，重链与轻链的高变区共同形成的功能区称为抗体的\n**抗原抗体结合部位**\n，该功能区在结合其配体的时候，可以在配体的作用下发生构象的变化，称为\n**诱导契合**","answer":""},{"year":"2009","type":"填空题","number":"9","question":"酶通过降低反应的 **活化能** 使反应速率加快，酶作为生物催化剂，具有\n**催化能力高** 和 **专一性强** 两大特点。","answer":""},{"year":"2009","type":"填空题","number":"10","question":"酶促反应动力学的Lineweaver-Burk双倒数作图法中，所得到的直线在横轴上的截距为\n\n\\-**1/Km** 斜率为 **Km/Vmax**","answer":""},{"year":"2009","type":"填空题","number":"11","question":"DNA 分子的G-C 含量与Tm 值成正比的原因是\n**G-C有三个氢键，A-T有两个，前者对DNA双链稳定性影响更大**","answer":""},{"year":"2009","type":"填空题","number":"12","question":"具有催化功能的RNA 称为 **核酶**","answer":""},{"year":"2009","type":"填空题","number":"13","question":"生物化学中研究代谢途径和代谢机制最有效的方法是 **同位素示踪法**\n\n14\\.\n糖酵解作用的生物学意义是\\_\\_\\_**无氧的条件下供能**\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_。\n\n15\\.\n柠橡酸循环既是需氧生物提供能量的重要代谢系统，又为许多生物合成提供前提物质，因此它具有\\_\\_\\_**分解代谢**\\_\\_\\_\\_和\\_**合成代谢**\\_\\_\\_\\_\\_\\_双重作用。\n\n16\\.\n乙醛酸循环在植物细胞中的部位是\\_\\_**线粒体**\\_\\_\\_\\_\\_和\\_\\_\\_**过氧化物酶体**\\_\\_\\_\\_。\n\n17\\.\n细胞质中的NADH必须通过\\_\\_**3-磷酸甘油穿梭**\\_\\_\\_\\_\\_或\\_\\_**苹果酸-天冬氨酸穿梭**\\_\\_\\_\\_\\_途径才能进入线粒体内进行再氧化。\n\n18\\. 生物体合成双糖和多糖时，糖基的供体是\\_\\_**UDPG**\\_\\_\\_\\_\\_。\n\n19\\.\n在高等动物体内，氨基酸脱氨基后形成的氨可转化成\\_\\_**尿素**\\_\\_\\_\\_\\_或\\_**谷氨酰胺**\\_\\_\\_\\_\\_\\_而成为无毒的物质。\n\n20\\.\n胸腺嘧啶核苷酸的生物合成是由尿嘧啶脱氧核糖核苷酸经甲基化而生成的，催化该反应的酶是\\_\\_\\_\\_**胸腺嘧啶核苷酸合成酶\\_**\\_\\_。\n\n21\\.\n密码子的基本特性有\\_\\_**简并性**、**通用性和变异性**、**连续性和安全性**、**摆动性**\n等。\n\n22\\.\n某些RNA病毒侵入宿主细胞后可借助于RNA指导的RNA聚合酶进行病毒RNA的\\_\\_\\_**复制**\\_\\_\\_\\_。\n\n23\\.\n在原核生物基因表达调节的乳糖操纵子模型中，\\_\\_**阻遏蛋白**\\_\\_\\_\\_\\_起着负调节作用，而\\_**cAMP-CAP**\\_\\_\\_\\_\\_\\_起着正调节作用。\n\n24\\.\n生物体内错综复杂的酶促反应受到严格的调控，可概括地将该调控分为\\_**酶量调节**\\_\\_\\_\\_\\_\\_、\\_**酶活性调节**\\_\\_\\_\\_\\_\\_和\\_**底物浓度调节**\\_\\_\\_\\_\\_\\_三个水平。\n\n25\\.\n真核生物在翻译水平的调节主要包括影响\\_**mRNA稳定性**\\_\\_\\_\\_\\_\\_、\\_**运输**\\_\\_\\_\\_\\_\\_和\\_\\_\\_**有选择的进行翻译**\\_\\_\\_\\_。","answer":""},{"year":"2009","type":"简答题","number":"1","question":"回答以下关于蛋白质结构与功能的问题：","answer":"**(1)请列举两个例子证明\"蛋白质的一级结构决定高级结构\"这一基本原理；01/09/15**\n\n蛋白质的一级结构通常是指多肽链中氨基酸组成，数量、排列顺序以及二硫键的数量和位置，也称化学结构。对于缀合蛋白来说还应包括共价连接的辅基部分。一级结构很大程度上决定了二级结构、三级结构以及蛋白质的功能。主要作用力：肽键（共价键）\n\n牛胰核糖核酸酶A（RNase\nA）经典的复性实验。先用尿素和β-巯基乙醇处理该酶，使非共价键和二硫键断裂、蛋白质完全变性并失去活性；随后通过透析除去变性剂后，酶分子能在体外自发折叠并恢复原有活性。该实验表明，蛋白质的三维结构和功能完全由其一级结构决定，不依赖外界模板或辅助因子。\n\n例如镰刀型贫血症是最早被认识的一种分子病，这是由于HbAβ链上N端开始第六位氨基酸残基由Glu突变为Val，HbA转换成HbS，这一单个氨基酸的改变导致分子表面疏水性增强，使去氧状态下血红蛋白异常聚集，形成纤维状结构，使红细胞变形为镰刀状并失去正常功能。该现象说明，一级结构的微小变化即可导致高级结构和生物学功能的显著改变。\n\n**(2)血红蛋白的α、β亚基和肌红蛋白并不具有相同的一级结构，但具有相似的生物学功能(都能够结合氧分子)，为什么?**\n\n虽然肌红蛋白和血红蛋白不具有相同的一级结构，但二者折叠后的三维结构非常相似，且都结合一个血红素辅基，故而具有相似的生物学功能。\n\n**(3)同样都是氧结合蛋白，为什么肌红蛋白的氧结合曲线是一双曲线，而血红蛋白的氧结合曲线是S形曲线?**\n\n肌红蛋白是哺乳动物体内贮存和分送氧的蛋白质，存在于需要贮存氧的肌肉细胞中。属于珠蛋白家族，由一条多肽链和一个血红素辅基组成，没有多个亚基，因此不具有协同效应，与O~2~亲和力不受外界环境影响。肌红蛋白和O~2~可逆结合，在肌肉组织中，血红蛋白释放的氧气透过质膜进入肌细胞中，并与质膜内表面的肌红蛋白组成氧合肌红蛋白，随后在细胞溶胶中扩散到线粒体，当线粒体中O~2~浓度下降时，氧合肌红蛋白把贮存的氧释放给线粒体，自身变回去氧肌红蛋白并回到质膜处，由于这里氧气充足，又变成氧合肌红蛋白。\n\n血红蛋白与氧结合时表现出正协同效应，即当第一个亚基与一分子氧结合后，引起八个离子键断裂，血红蛋白分子构象改变，由T态变成R态，其他亚基结合氧气的速率大大提高，氧气与氧气的结合是互利的。当血液流经肺部时，由于氧气浓度高，血红蛋白构象转化为R态，不仅有利于结合O2还能促进CO2和H+的释放，大大提高了血红蛋白结合和运输氧气的能力，形成大量氧和血红蛋白；当血液流经二氧化碳含量高，pH低的组织如肌肉时，血红蛋白构象转化为T态，氧气被释放，而氧气的释放又有利于结合CO2和H+，补偿因呼吸作用产生二氧化碳和氢离子而下降的pH，起到缓冲血液pH的作用。"},{"year":"2009","type":"简答题","number":"2","question":"(1)简述酶的竞争性抑制剂的作用机制，同样作为竞争性抑制剂，为什么过渡态底物类似物比基态底物类似物具有更高的抑制效率?","answer":"竞争性抑制剂：大多数抑制剂I与底物结构类似，代替底物与酶活性部位相结合，形成可逆的EI复合物，但EI不能分解成产物P，酶活力降低。该抑制作用强弱取决于底物和抑制剂的相对浓度，可以通过增加抑制剂浓度接触。常见的有磺胺类药物是对氨基苯甲酸类似物，是二氢叶酸合成酶的竞争性抑制剂；丙二酸、戊二酸是琥珀酸脱氢酶抑制剂，过渡态类似物是最常见的竞争性抑制剂。km增大，vmax不变。\n\n过渡态是指底物和酶结合成中间复合物后被活化的过渡态形式，势能比基态的低。过渡态底物类似物对酶的亲和力远远大于底物，故其抑制效率比基态底物类似物高很多倍。\n\n**(2)列举酶的反竞争性抑制剂与别构抑制剂在抑制作用上的异同点。**\n\n反竞争抑制剂：只有当酶和底物结合后才能与抑制剂结合，降低酶的催化活性。km变小，vmax减小，比值不变。\n\n别构抑制剂：酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性，具有这种调节作用的酶称作别构酶。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物或别构抑制剂（多为产物）。\n\n相同点：对酶促反应产生抑制作用，使酶的催化活性降低，改变代谢反应速率\n\n不同点：反竞争抑制剂不与游离酶酶结合，别构抑制剂可以结合；反竞争抑制剂不改变酶的构象，别构抑制剂改变酶的构象；反竞争抑制剂对酶的性质没有要求，别构抑制剂只作用于别构酶；"},{"year":"2009","type":"简答题","number":"3","question":"你从一种植物中制备得到一种具有潜在药用价值的生物分子，你需要对它进行鉴定与进一步的研究：","answer":"**(1)请设计两种不同的实验方案证明该生物分子是蛋白质；**\n\n双缩脲反应：是肽和蛋白质所特有的，氨基酸没有的一个颜色反应。一般含有两个或两个以上肽键的多肽化合物与硫酸铜碱性溶液都能发生双缩脲反应生成紫红色或蓝紫色化合物，可用分光光度计在540nm处进行检测，测定蛋白质含量。\n\n茚三酮反应：可以检测和定量氨基酸。茚三酮在弱酸条件下，与α-氨基酸共热，引起α-氨基氧化脱氨，产生的氨和还原茚三酮与另一个茚三酮分子反应生成紫色产物，可用分光光度计在570nm处进行检测，用测压法测量二氧化碳释放量，可以计算出参加反应的α-氨基酸含量。脯氨酸和羟脯氨酸可以与茚三酮反应生成亮黄色产物。\n\n若双缩脲反应和茚三酮反应均呈阳性，即可进一步确认该生物分子具有蛋白质的化学特征。\n\n**(2)在已经证明该生物分子是蛋白质的前提下，你用SDS-PAGE方法测得其相对分子质量为45000，用凝胶过滤法测得相对分子质量为90000，请解释原因；**\n\nSDS是一种变性剂，它可以破坏蛋白质分子中的氢键和疏水相互作用，而巯基苏糖醇可打开二硫键。在它们处理下蛋白质的二级、三级、四级结构被破坏，蛋白质解离成亚基，并且亚基的多肽链处于伸展状态。因此SDS-PAGE实验中测定的是单个亚基的分子量，所以是凝胶过滤分子量的一半。\n\n**(3)为了今后能更方便地对其进行纯化，你计划利用大肠杆菌表达该蛋白质，并往其末端连接6个His残基，请给出这样做的理由。**\n\n在目标蛋白质的末端连接6个组氨酸（His）残基是常用的亲和标签（His-tag）。其主要目的是为了在后续纯化中利用金属离子亲和层析（IMAC）实现高效分离。6个连续的His残基具有很强的与二价金属离子（如Ni²⁺、Co²⁺）配位的能力，能特异性地与固定在层析介质上的金属离子结合，而杂蛋白缺乏这种结构，不会被吸附。通过将含His标签的融合蛋白表达于大肠杆菌中，可在裂解后将上清通过Ni²⁺-NTA（硝基三乙酸，以四个配位点牢固地结合一个Ni²⁺离子）琼脂糖柱，目标蛋白与Ni²⁺结合，而杂质蛋白被洗脱去除；随后用含咪唑的缓冲液洗脱即可得到高纯度的目标蛋白。该方法操作简便、特异性强、可重复利用，且His标签体积小，对蛋白质结构与功能影响较小
