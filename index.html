<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生化考研答题系统</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2c5f2d;
            --primary-light: #4a8b4d;
            --primary-dark: #1a3a1b;
            --secondary: #d4af37;
            --accent: #c41e3a;
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0d8cc;
            --shadow: rgba(44, 95, 45, 0.15);
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f5f1e8 100%);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(44, 95, 45, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            padding: 3rem 0;
            position: relative;
        }
        
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px var(--shadow);
            letter-spacing: 0.05em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        
        .mode-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .mode-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px var(--shadow);
            border-color: var(--primary);
        }
        
        .mode-card:hover::before {
            transform: scaleX(1);
        }
        
        .mode-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        
        .mode-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .mode-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        
        .mode-features {
            list-style: none;
            margin-top: 1rem;
        }
        
        .mode-features li {
            padding: 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
            position: relative;
            padding-left: 1.5rem;
        }
        
        .mode-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }
        
        .config-panel {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
            display: none;
        }
        
        .config-panel.active {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }
        
        .question-type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .type-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .type-option:hover {
            background: white;
            border-color: var(--primary-light);
        }
        
        .type-option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .type-option input[type="number"] {
            width: 70px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-size: 1rem;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: border-color 0.2s;
        }
        
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(44, 95, 45, 0.3);
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(44, 95, 45, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--text-secondary), #888);
            margin-left: 1rem;
        }
        
        .quiz-container {
            display: none;
        }
        
        .quiz-container.active {
            display: block;
        }
        
        .question-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        
        .question-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        
        .info-badge {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .timer {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }
        
        .timer.warning {
            color: var(--accent);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .question-content {
            margin: 2rem 0;
        }
        
        .question-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 2rem;
            font-weight: 500;
        }
        
        .answer-area {
            margin-top: 2rem;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1.5rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .answer-feedback {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }
        
        .answer-feedback.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        .answer-feedback.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        
        .answer-feedback.partial {
            background: #fff8e1;
            border: 2px solid #ffc107;
        }
        
        .answer-feedback.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        
        .feedback-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        
        .reference-answer {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid var(--primary);
        }
        
        .reference-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }
        
        .ai-analysis {
            background: #f0f7ff;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid #2196f3;
        }
        
        .ai-title {
            font-weight: 600;
            color: #2196f3;
            margin-bottom: 0.75rem;
        }
        
        .results-panel {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
            display: none;
        }
        
        .results-panel.active {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        .score-display {
            text-align: center;
            padding: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            color: white;
            margin-bottom: 2rem;
        }
        
        .score-number {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }
        
        .score-label {
            font-size: 1.2rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .stat-card {
            background: var(--bg);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        
        .review-list {
            margin-top: 2rem;
        }
        
        .review-item {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
        }
        
        .review-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .review-question {
            font-weight: 600;
            color: var(--text);
        }
        
        .review-score {
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .review-score.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .review-score.partial {
            background: #fff8e1;
            color: #f57c00;
        }
        
        .review-score.incorrect {
            background: #ffebee;
            color: #c62828;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            margin: 2rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.3s ease;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .mode-selector {
                grid-template-columns: 1fr;
            }
            
            .question-type-grid {
                grid-template-columns: 1fr;
            }
            
            .btn-secondary {
                margin-left: 0;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>生化考研答题系统</h1>
            <p class="subtitle">Biochemistry Examination System</p>
        </header>
        
        <!-- 模式选择 -->
        <div id="modeSelection" class="mode-selector">
            <div class="mode-card" onclick="selectMode('exam')">
                <div class="mode-icon">📝</div>
                <h2 class="mode-title">考试模式</h2>
                <p class="mode-desc">模拟真实考试环境，限时答题，全面检验实力</p>
                <ul class="mode-features">
                    <li>限定答题时间</li>
                    <li>完成后统一判分</li>
                    <li>AI智能评阅</li>
                    <li>成绩分析报告</li>
                </ul>
            </div>
            
            <div class="mode-card" onclick="selectMode('practice')">
                <div class="mode-icon">💡</div>
                <h2 class="mode-title">训练模式</h2>
                <p class="mode-desc">逐题练习，即时反馈，稳步提升知识掌握</p>
                <ul class="mode-features">
                    <li>无时间限制</li>
                    <li>即时查看答案</li>
                    <li>年份标注</li>
                    <li>详细解析</li>
                </ul>
            </div>
        </div>
        
        <!-- 考试配置 -->
        <div id="examConfig" class="config-panel">
            <h2 class="mode-title">考试配置</h2>
            
            <div class="form-group">
                <label>选择题型和数量：</label>
                <div class="question-type-grid">
                    <div class="type-option">
                        <input type="checkbox" id="type-noun" value="名词解释" checked>
                        <label for="type-noun">名词解释</label>
                        <input type="number" id="num-noun" min="0" max="20" value="5">
                    </div>
                    <div class="type-option">
                        <input type="checkbox" id="type-fill" value="填空题" checked>
                        <label for="type-fill">填空题</label>
                        <input type="number" id="num-fill" min="0" max="20" value="5">
                    </div>
                    <div class="type-option">
                        <input type="checkbox" id="type-short" value="简答题" checked>
                        <label for="type-short">简答题</label>
                        <input type="number" id="num-short" min="0" max="10" value="3">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="timeLimit">考试时长（分钟）：</label>
                <input type="number" id="timeLimit" min="10" max="180" value="60">
            </div>
            
            <div>
                <button class="btn" onclick="startExam()">开始考试</button>
                <button class="btn btn-secondary" onclick="backToModeSelection()">返回</button>
            </div>
        </div>
        
        <!-- 训练配置 -->
        <div id="practiceConfig" class="config-panel">
            <h2 class="mode-title">训练配置</h2>
            
            <div class="form-group">
                <label for="practiceType">题型选择：</label>
                <select id="practiceType">
                    <option value="all">全部题型</option>
                    <option value="名词解释">名词解释</option>
                    <option value="填空题">填空题</option>
                    <option value="简答题">简答题</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="practiceYear">年份选择：</label>
                <select id="practiceYear">
                    <option value="all">全部年份</option>
                </select>
            </div>
            
            <div>
                <button class="btn" onclick="startPractice()">开始训练</button>
                <button class="btn btn-secondary" onclick="backToModeSelection()">返回</button>
            </div>
        </div>
        
        <!-- 答题界面 -->
        <div id="quizContainer" class="quiz-container">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            
            <div class="question-card">
                <div class="question-header">
                    <div class="question-info">
                        <span id="questionNumber" class="info-badge">第 1 题</span>
                        <span id="questionType" class="info-badge">名词解释</span>
                        <span id="questionYear" class="info-badge" style="display: none;">年份</span>
                    </div>
                    <div id="timer" class="timer" style="display: none;">60:00</div>
                </div>
                
                <div class="question-content">
                    <div id="questionText" class="question-text"></div>
                    
                    <div class="answer-area">
                        <textarea id="answerInput" placeholder="请输入您的答案..."></textarea>
                    </div>
                    
                    <div id="answerFeedback" class="answer-feedback"></div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button id="submitAnswerBtn" class="btn" onclick="submitAnswer()">提交答案</button>
                    <button id="nextQuestionBtn" class="btn" style="display: none;" onclick="nextQuestion()">下一题</button>
                    <button id="finishExamBtn" class="btn" style="display: none;" onclick="finishExam()">完成考试</button>
                </div>
            </div>
        </div>
        
        <!-- 成绩展示 -->
        <div id="resultsPanel" class="results-panel">
            <h2 class="mode-title">考试成绩</h2>
            
            <div class="score-display">
                <div class="score-number" id="finalScore">0</div>
                <div class="score-label">综合得分</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">答对题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="timeUsed">0</div>
                    <div class="stat-label">用时（分钟）</div>
                </div>
            </div>
            
            <h3 style="margin: 2rem 0 1rem; font-family: 'Noto Serif SC', serif;">答题回顾</h3>
            <div id="reviewList" class="review-list"></div>
            
            <div style="margin-top: 2rem;">
                <button class="btn" onclick="restartQuiz()">重新开始</button>
            </div>
        </div>
    </div>
    
    <script>
const QUESTION_BANK = [{"year":"1995","type":"名词解释","number":"1","question":"肽单元","answer":"肽单位，肽链中的酰胺基团称为肽单位，也叫做肽基。即组成肽键的四个原子（CHON）以及与之相连的两个α-碳原子共同组成的基团。也是肽链主链上的重复结构，与氨基酸残基不同的是，肽单位侧重于研究蛋白质的高级结构。在肽链中，由于肽键的共振杂化性质，肽单位具有刚性和平面特性，使多肽链的可能构象范围受到限制。"},{"year":"1995","type":"名词解释","number":"2","question":"启动子","answer":"启动子是指起始转录一段特殊的DNA序列，属于顺式作用元件。它的结构不对称，决定转录的方向。在原核生物中，RNA聚合酶识别并结合启动子起始转录，启动子的-35序列突变降低RNA聚合酶和启动子结合速度，-10序列突变降低转录起点附近双链解开速度。在真核生物中，启动子不是由RNA聚合酶，而是由转录因子识别，多种转录因子和RNA聚合酶在起点形成起始复合物，而后进行转录。真核生物启动子有三类，分别由RNA聚合酶I，II，III进行转录，其中类型II启动子涉及众多编码蛋白质基因表达的控制。包括5类控制元件，基本启动子（-25～-30之间的TATA框：RNA聚合酶II和通用转录因子的主要装配点）、起始子，上游元件（CAAT、GC框影响起始频率）、下游元件和各类应答元件。"},{"year":"1995","type":"名词解释","number":"3","question":"退火","answer":"热变性DNA缓慢冷却后可发生复性，称为退火。也是PCR即聚合酶链式反应的步骤之一。PCR是一种DNA体外酶促扩增的方法，其步骤包括变性，退火和延伸。首先高温94℃使DNA双链打开即变性；随后温度降低至50～60℃，对特定基因设计好的引物与DNA模板结合即退火；最后温度升高至72℃，在耐高温的DNA聚合酶催化下，四种脱氧核苷三磷酸沿模板链延伸即延伸。不断循环实现对目标基因扩增。"},{"year":"1995","type":"名词解释","number":"4","question":"反义RNA","answer":"是一种调节型RNA，具有与特定mRNA翻译起始位点互补的序列，结合位点也可以位于mRNA下游。通过与mRNA结合，阻断核糖体小亚基对起始密码子的识别和与SD序列的结合，也可以使靶RNA降解或失活。大肠杆菌转座子Tn10在合成转座酶mRNA的同时还合成出一条与其5撇端序列互补的小RNA即反义RNA，从而抑制mRNA的活性，使转座酶维持在一定水平，避免转座频率过高而导致宿主死亡。利用反义RNA进行调节的现象在原核和真核生物中均十分普遍。"},{"year":"1995","type":"名词解释","number":"5","question":"分子活力","answer":"又称kcat、TN、转换数。是指一定条件下，每秒钟每个酶分子转换底物的分子数，或每秒钟每微摩尔转换的底物微摩尔数。可以反应酶的催化效率。"},{"year":"1995","type":"名词解释","number":"6","question":"构型与构象","answer":"构型是指一个有机分子中各原子特有的固定的空间排列。对于旋光异构体来说，是指不对称碳原子的四个取代基在空间中的相对取向。构型的改变需要经过共价键的断裂和重新形成以及蛋白分子光学活性改变。有D型和L型之分。\n\n构象是指一个分子所采取的特定的空间形态，用来描述有机分子的动态立体化学，反映了分子中各原子在任一瞬间的实际相对位置，所以构象也称作空间结构，三维结构，立体结构。由于分子中单键可以自由旋转，因此相同结构和构型的分子可以采取不同形态，分子所采取的特定形态称作构象。构象的改变不需要共价键的断裂和重新形成，蛋白分子的光学活性也不会发生改变。"},{"year":"1995","type":"名词解释","number":"7","question":"电泳迁移率Rm","answer":"同一电场条件下，各种带电粒子在单位时间内的迁移距离，即电泳分子在电场作用下的迁移速率，称为电泳迁移率。"},{"year":"1995","type":"名词解释","number":"8","question":"酶的活性部位","answer":"与酶活力直接相关的部位称为酶的活性部位或活性中心。其中有些必需基团在一级结构上相距较远，但在形成空间结构过程中相互靠近，聚集在一起，形成有一定空间结构的区域，并与底物特异性结合，使底物转化为产物。通常分为结合部位和催化部位，前者负责与底物结合，决定酶的专一性（与km有关），后者负责底物键的断裂和重新形成，与酶的催化能力有关（与kcat有关），二者也可以合二为一。活性中心之外酶还有调节部位，与某些分子发生某种程度的结合，引起酶的空间构象改变，激活或抑制酶活性。对于缀合酶，辅因子也是酶活性部位的组成成分。"},{"year":"1995","type":"名词解释","number":"9","question":"持留时间HPLC中的TR","answer":"也叫保留时间，是指从样品流入色谱柱到流出色谱柱所需的时间。不同样品在不同色谱柱用不同的流动相洗脱的保留时间不同，因此保留时间是色谱分析法的重要参数之一。"},{"year":"1995","type":"名词解释","number":"10","question":"氧化磷酸化作用","answer":"需氧生物产生ATP的主要方式，与细胞对ATP的需要相适应。是指还原型辅酶的电子经呼吸链传递给氧气，并利用产生的能量将ADP磷酸化形成ATP的偶联过程。电子传递过程包括电子从还原型辅酶（NADH、FADH2）通过一系列按电子亲和力递增排列的电子载体组成的电子传递链，最终传递给氧气的过程，他们被重新氧化并生成水。电子传递链也叫呼吸链，主要由四种蛋白质复合体构成，NADH-Q还原酶，琥珀酸-Q还原酶，细胞色素还原酶以及细胞色素氧化酶。主要发生在线粒体内膜。"},{"year":"1995","type":"名词解释","number":"11","question":"限制性核酸内切酶","answer":"一类能够识别DNA双链上某一特定核苷酸序列并在此切割的核酸内切酶。分为三类，I、II、III型。I型和III型都是由同一蛋白质具有修饰酶活性和ATP依赖性限制内切活性，I型结合在识别位点随机切割，III型在识别位点下游24～26bp处切割。II型是由甲基修饰酶和限制内切酶两种酶分子组成的复合体，修饰和切割同一特异位点，识别位点通常是二重对称结构（4～6bp的回文序列），是最常见的一种。"},{"year":"1995","type":"名词解释","number":"12","question":"等电聚焦载体两性电解质","answer":"理想的两性电解质载体在PI处应有足够的缓冲能力和电导，前者保证pH梯度形成的稳定性，后者保证电流能够顺利通过。不同PI的两性电解质应具有相似的电导系数，使整个体系电导均匀。两性电解质载体应尽可能小，便于通过分子筛和透析等方法与被分离的高分子物质脱离，同时不应与其发生相互作用或使其变性。常见的两性电解质载体是脂肪族多胺、多羧类同系物，具有相似但不同的pKa和PI，在外加电场下形成均匀的pH梯度。常见的凝胶介质为聚丙烯酰胺凝胶，琼脂糖凝胶和葡聚糖凝胶。"},{"year":"1995","type":"填空题","number":"1","question":"体外合成一RNA短片段pApUpGpApCpCpUpUpApG，如在\\[y-^32^p\\]存在时转录，被标记的磷酸基团是（\n）；如在\\[α-^32^p\\]存在时转录，被标记的磷酸基团是","answer":""},{"year":"1995","type":"填空题","number":"2","question":"稳定蛋白质分子构象的主要作用力有：氢键，盐键，疏水作用力，范德华力。","answer":""},{"year":"1995","type":"填空题","number":"3","question":"一个蛋白质分子，在pH 高于其等电点(pI)的溶液中，其净电荷为 负 值。在pH\n低于其等电点(pl)的溶液中其净电荷为 正 值。\n\n4\\. 克里克 提出分子遗传的中心法则.","answer":""},{"year":"1995","type":"填空题","number":"5","question":"ECI.1.1.27的含义：乳酸脱氢酶（氧化还原酶EC1\n，EC3为水解酶类，EC5异构酶类，EC4为裂合酶类。苹果酸脱氢酶（EC1.1.1.37）仅末位不同）\n\n6\\. 证明了三狻酸循环中氧化磷酸化的P:O比为 2.5 。","answer":""},{"year":"1995","type":"填空题","number":"7","question":"与 mRNA上AUG密码子结合的tRNA 的反密码子为 CAU 。","answer":""},{"year":"1995","type":"填空题","number":"8","question":"聚丙烯酰胺凝胶电泳是根据生物高分子的 分子量大小 和 分子电荷和形状\n来对它进行分离的。","answer":""},{"year":"1995","type":"填空题","number":"9","question":"影响蛋白质电泳的主要因素有 分子量大小 、 分子形状 、 分子所带电荷 、\n电压大小 、\n\n凝胶介质种类 .","answer":""},{"year":"1995","type":"填空题","number":"10","question":"在 k~+2~远小于k-t时，KmKs,Km值可以表示酶和底物的 亲和力 。\n\n11\\. 用盐析法沉淀蛋白质时，在选用等于其pl的pH值时该蛋白质 大部分或全部\n沉淀；而选用远离其pl的pH值时，该蛋白质 几乎不 沉淀。","answer":""},{"year":"1995","type":"简答题","number":"1","question":"凝胶过滤法的基本原理是什么?如何用来测定一个蛋白质的分子量?","answer":"基本原理：又称大小排阻层析、分子筛，指根据多孔介质对不同大小和形状的分子排阻能力不同而分离蛋白质混合物的方法。不同大小和形状的分子流经凝胶柱时，比凝胶孔径大的分子不能进入凝胶珠，随溶剂沿凝胶珠间隙向下流动，流动距离最短，最先流出；比凝胶孔径小的分子不同程度选择性进入凝胶珠，流动距离较长，后流出。同大小的分子，线状分子在前，球状分子在后。\n\n方法：根据以上原理可知，凝胶过滤的过柱速度不直接取决于分子大小，而是蛋白质分子的斯托克半径。斯托克半径是指一个蛋白质分子与某一个非水化球凝胶过滤时具有相同的过柱速度即洗脱体积，则认为这个分子具有与该球体相同的半径。因此利用凝胶过滤法测定分子量时，标准蛋白（已知分子量和斯托克半径）和待测蛋白应接近球状分子，线状或者与凝胶有吸附作用的分子结果不准。利用公式lgMr=a-bVe，Ve为洗脱体积，a、b为常数。只需测出几种标准蛋白的Ve和Mr，绘制lgMr和Ve的标准曲线，再测出待测蛋白的Ve，即可算出其分子量。凝胶过滤还有一个优点是待测样品可以是不纯的，只要有特定的生物活性，找到他的洗脱峰位置，即可得到他的洗脱体积。常用的凝胶为交联葡聚糖（也叫sephadexG-n，后面的数字越大，交联程度越低，凝胶孔径越大，分子量分离范围越大）"},{"year":"1995","type":"简答题","number":"2","question":"^1^⁴C标记的丙氨酸 Co0\n在动物组织中氧化后，所得到的α-酮戊二酸将在哪个C原子上被标记?","answer":"丙氨酸首先在谷丙转氨酶的作用下，与α-酮戊二酸反应生成丙酮酸（含被标记碳原子）和谷氨酸，随后在丙酮酸脱氢酶复合体的作用下生成乙酰辅酶A进入三羧酸循环，生成柠檬酸，然后异柠檬酸，然后生成α-酮戊二酸。"},{"year":"1995","type":"简答题","number":"3","question":"什么是遗传密码?试述其基本特性。(8 分","answer":"遗传密码是指DNA或RNA中核苷酸序列与蛋白质氨基酸序列之间的对应关系，以三联体或密码子形式存在。\n\n特点：1、简并性：一个氨基酸有两个或多个密码子的现象，只有Met和Trp只有一个密码子。对应同一个氨基酸的密码子称为同义密码子。生物学意义是减少有害突变，增加了碱基突变仍编码原来氨基酸的可能，为碱基组成提供更大变动余地，促进物种稳定方面起作用。2、摆动性：密码子的摆动性往往体现在第三位碱基上，专一性取决于第一、二位碱基且严格配对，第三位碱基不严格配对。A对U，C对G，U对A、G，G对C、U，I对U、C、A。生物学意义是保证翻译的速率，第三位碱基不严格配对，结合不紧密，较松散，易解开；保证翻译准确性，第三位碱基突变也有可能编码正确蛋白质。3、通用性和变异性：所有生物包括真核生物、原核生物、细菌、病毒都共用一套遗传密码。线粒体DNA编码方式和正常方式不太一样，一个tRNA识别2个或4个密码子。4、连续性：编码氨基酸序列的各个三连体密码连续阅读，无间隔也无重叠，方向由5到3。5、安全性：这种编码方式使得密码子中一个碱基被置换后，往往由相同或物理化学性质相近的氨基酸取代"},{"year":"1995","type":"简答题","number":"4","question":"试计算一个含有88个氨基酸的α-螺旋的轴长是多少?(2分)","answer":"α-螺旋每圈3.6个氨基酸残基，沿螺旋轴上升0.54nm，每个氨基酸残基旋转100°，上升0.15nm，88个氨基酸上升88\\*0.15=13.2nm"},{"year":"1995","type":"简答题","number":"5","question":"酶的可逆抑制作用常见的有哪几种类型?请用双倒数作图法区分其中任意两种类型，并\n加以简要说明。(5分）","answer":"抑制剂通过非共价键与酶结合引起酶活力降低或丧失，通过物理方法可除去抑制剂而使酶复活，这个过程是可逆的因此称可逆抑制。包括竞争性抑制，非竞争性抑制，反竞争性抑制和混合抑制。双倒数作图法是米氏方程两侧都取倒数，1/v为纵坐标，1/s为横坐标的一次函数，表达式为1/v=km/vmax·1/s+1/vmax。竞争性抑制剂：大多数抑制剂I与底物结构类似，代替底物与酶活性部位相结合，形成可逆的EI复合物，但EI不能分解成产物P，酶活力降低。该抑制作用强弱取决于底物和抑制剂的相对浓度，可以通过增加抑制剂浓度接触。常见的有磺胺是对氨基苯甲酸类似物，丙二酸、戊二酸是琥珀酸脱氢酶抑制剂，过渡态类似物是最常见的竞争性抑制剂。km增大，vmax不变。非竞争性抑制剂：这类竞争性抑制剂的特点是底物和抑制剂可以同时和酶结合，二者没有竞争作用。酶与抑制剂结合后仍然可以和底物结合，但是形成的三元复合物不能产生产物，因此酶活力降低。抑制剂与酶活性部位以外的基团结合，与底物结构没有类似之处，不能通过增加底物浓度解除。vmax降低，km不变。反竞争抑制剂：只有当酶和底物结合后才能与抑制剂结合。km变小，vmax减小，比值不变。混合抑制：抑制剂影响酶和底物的结合，结果位于竞争性和非竞争性之间。\n\n![图示 AI\n生成的内容可能不正确。](media/image1.jpeg){width=\"5.768055555555556in\"\nheight=\"2.763888888888889in\"}"},{"year":"1995","type":"简答题","number":"6","question":"CO₂\n是脂肪酸生成的必需原料，CO2的功能是什么?假若用肝脏的可溶部分与¹⁴CO₂及\n其它脂肪酸合成所需组分，生成的软脂酸中是否含有¹⁴C?(5 分 )","answer":"二氧化碳在脂肪酸合成起始步骤中，与乙酰辅酶A在乙酰辅酶A羧化酶的作用下，消耗一分子ATP，生成丙二酸单酰辅酶A，是脂肪酸合成的限速步骤。生成的软脂酸中不含有标记碳原子。理由：在脂肪酸合成过程中，第一步启动引发，乙酰辅酶A的乙酰基转移到ACP上，随后转移到脂肪酸合酶的KS组分（β-酮酰ACP合酶）上，反应由AT催化（乙酰辅酶A：ACP转酰酶）。第二步装载，在MT（丙二酸单酰辅酶A：ACP转酰酶）作用下，丙二酸单酰辅酶A生成丙二酸单酰-ACP。第三步缩合反应，在KS作用下发生缩合生成乙酰乙酰-ACP，同时脱掉一分子二氧化碳，恰好是第一步被添加上去的。因此被标记的二氧化碳不参与软脂酸的合成。"},{"year":"1995","type":"简答题","number":"7","question":"画出底物存在时别构酶的S\n型动力学曲线，及同时有别构激活剂或别构抑制剂存在时的曲线。标出坐标及必要的说明文字，并进行简要的讨论。(5分)","answer":"因别构酶有协同效应，因此它的图像不是普通的双曲线，对于正协同效应的酶，图像为S形曲线，负协同为双曲线。正协同效应酶的典型代表是天冬氨酸转氨甲酰酶ATCasa，嘧啶核苷酸CTP生物合成的多酶体系中第一个酶。被终产物CTP反馈抑制，ATP别构激活。他们通过调节酶T态和R态之间转换来影响酶活性。CTP稳定T态，ATP稳定R态。\n\n![图示 AI\n生成的内容可能不正确。](media/image2.jpeg){width=\"5.768055555555556in\"\nheight=\"2.3506944444444446in\"}"},{"year":"1995","type":"简答题","number":"8","question":"有一个A肽经酸水解后，分析结果得知是由Lys、His、Asp、Glu2、Ala以及Val、Tyr和两个NH₃分子组成的。当A肽与Sanger\n试剂反应后，得到DNP-ASP。当用羧肽酶处理后，得到游离的缬氨酸。如果我们在实验室中将\nA 肽用胰蛋白酶降解时，得到两种肽，其中一种(Lys 、Asp 、Glu 、Ala 、Tyr)\n在pH6.4 时，净电荷为零。另一种(His、Glu、及 VaL)可给出DNP-His,在 pH6.4\n时带正电荷。此外A\n肽用胰凝乳蛋白酶降解时，糜蛋白也得到两种肽，其中一种(Asp、Ala、Tyr)在pH6.4\n时呈中性，另一种(Lys、His、Glu2、以及Val)在 pH6.4 时带正电荷。问A\n肽氨基酸排列顺序如何?(9分)","answer":"N\\~C：Asp（Sanger试剂检测最N端氨基酸）～Ala（排除）～Tyr（胰凝乳蛋白酶切割位点）～Glu（排除）～Lys（胰蛋白酶切割位点）～His（第二段的N端）～Ala（排除）～Val（羧肽酶C端水解）\n\n1测蛋白质N端：\n\nSanger/DNFB法（在碱性条件下，2、4-二硝基甲苯与多肽链N端游离氨基反应并结合，形成二硝基苯衍生物DNP，在酸性条件下，水解产生黄色的DNP-氨基酸，可以用乙醚抽提再通过色谱检测氨基酸种类。）\n\nPITC法：PITC与肽链反应标记并除去N端一个氨基酸，新的N端暴露出来进行下一轮的循环反应。PITC和氨基端结合形成PTC-蛋白质复合物，再在酸性条件下水解成不稳定的PTC-氨基酸复合物，在酸性条件下萃取后形成稳定的PTH衍生物，利用HPLC检测鉴定。在实验过程中常将多肽的羧基端偶联在不溶性树脂上，这样每轮循环通过过滤就可回收肽链。\n\n2测蛋白质C端：羧肽酶（要水解倒数第二位Pro，A\\|B都不行，C行）\n\n羧肽酶A：断裂除了Pro（通常倒数第二位）、Arg、Lys之外的所有氨基酸\n\n羧肽酶B：只断裂Arg、Lys\n\n羧肽酶C：除了羟脯氨酸之外的所有\n\n羧肽酶Y：所有氨基酸\n\n3多肽链裂解成小片段的酶解法\n\n胰蛋白酶：只断裂Lys和Arg的羧基端\n\n糜蛋白酶：只断裂Phe、Trp和Tyr的羧基端\n\n胃蛋白酶：只断裂Phe、Trp、Tyr、Leu和Val的氨基端\n\n4pH6.4时不带电荷说明肽片段里不含带电荷氨基酸或者酸碱抵消，带负电荷说明含有酸性氨基酸，带正电荷说明含有碱性氨基酸。"},{"year":"1996","type":"名词解释","number":"1","question":"离子交换剂","answer":"离子交换剂指的是含有若干离子基团的不溶性高分子物质，是通过在不溶性高分子物质（母体）上引入可交换离子（活性基团）而制成，具有离子交换能力。根据活性基团可分为阳离子交换剂和阴离子交换剂。根据母体种类不同可分为离子交换纤维、离子交换树脂和离子交换凝胶。"},{"year":"1996","type":"名词解释","number":"2","question":"持留时间HPLC中的TR","answer":"也叫保留时间，是指从样品流入色谱柱到流出色谱柱所需的时间。不同样品在不同色谱柱用不同的流动相洗脱的保留时间不同，因此保留时间是色谱分析法的重要参数之一。"},{"year":"1996","type":"名词解释","number":"3","question":"电泳迁移率Rm","answer":"同一电场条件下，各种带电粒子在单位时间内迁移距离即电泳分子在外加电场中的迁移速率称作电泳迁移率Rm"},{"year":"1996","type":"名词解释","number":"4","question":"肽","answer":"肽就是由氨基酸的α氨基和α羧基缩合形成肽键或酰胺键的聚合物。包括寡肽（20个氨基酸以下）多肽（20～100个氨基酸）和蛋白质（100个氨基酸以上）。每个构成肽的氨基酸都称作氨基酸残基，氨基酸残基通过肽键构成的链状结构成为肽链，方向为N端到C端。"},{"year":"1996","type":"名词解释","number":"5","question":"寡聚蛋白","answer":"有些蛋白质由两条或者多条多肽链构成，如血红蛋白和己糖激酶，称作寡聚蛋白或多聚蛋白。各个亚基之间通过非共价键缔合而成，多数寡聚蛋白的亚基排列平行且数目为偶数。有些蛋白质的亚基之间是共价键结合如胰岛素，则不是寡聚蛋白。"},{"year":"1996","type":"名词解释","number":"6","question":"波尔效应","answer":"H+和CO2影响血液中血红蛋白与氧气结合亲和力的效应。当环境中pH下降（氢离子浓度升高）或二氧化碳浓度升高会降低血红蛋白和氧气的亲和力，促进氧气的释放，氧合曲线向右移动，氧气和氢离子、二氧化碳与血红蛋白的结合是互斥的。\n\n原理\n\n1血红蛋白中pK值为7附近的可解离基团（如His）的解离与否影响血红蛋白的构象\n\n2氢离子与血红蛋白β亚基His结合使其质子化，与α亚基中的Asp形成链内盐桥，稳定血红蛋白T态，降低对氧的亲和力，促进氧气释放\n\n3二氧化碳与血红蛋白中每个珠蛋白链的氨基端结合，形成的氢离子贡献于波尔效应，形成的氨甲酸也构成盐桥稳定T态\n\n生物学效应\n\n1当血液流经二氧化碳含量高，pH低的组织如肌肉时，血红蛋白结合二氧化碳，补偿因呼吸作用产生二氧化碳和氢离子而下降的pH，起到缓冲血液pH的作用。\n\n2当血液流经氧气含量丰富的组织如肺泡，血红蛋白吸收氧气形成氧和血红蛋白"},{"year":"1996","type":"名词解释","number":"7","question":"初速度","answer":"如果反应开始时只有A存在，且初始浓度为A0，则图像原点（或A0点）的斜率称为初速率或初速度。测定酶活力通常测定酶促反应初速度，通常以底物浓度的变化在起始浓度5%以内的速率称为初速率。"},{"year":"1996","type":"名词解释","number":"8","question":"辅酶和辅基","answer":"根据酶的化学组成可分为单纯蛋白质和缀合蛋白质。单纯蛋白质是指除了蛋白质之外不含有任何其他物质的酶，包括脲酶，蛋白酶，淀粉酶，脂肪酶以及核酸酶等。缀合蛋白质不仅包含蛋白质，还包含一些热稳定的非蛋白质有机小分子和金属离子，前者称为脱辅酶，后者称为辅因子。根据二者的结合程度可分为辅酶和辅基。辅酶是指与脱辅酶结合较松弛，一般以非共价键结合的小分子有机物质，可以通过透析等方法除去，如辅酶I和辅酶II。辅基是指与脱辅酶结合较紧密，以共价键相结合的辅因子，通过某些化学方法除去，不能通过透析除去，如细胞色素氧化酶中的铁卟啉，丙酮酸氧化酶的黄素腺嘌呤二核苷酸FAD。"},{"year":"1996","type":"名词解释","number":"9","question":"乒乓机制","answer":"多底物酶促反应动力学机制之一，这类反应的特点是酶E与第一个底物A结合并生成产物P，同时E被修饰形成E撇，E撇结合第二个底物B，生成第二个产物Q，同时E撇转换回E。例如氨基转移酶。除此之外的多底物酶促反应包括有序反应和随机反应。"},{"year":"1996","type":"名词解释","number":"10","question":"半不连续复制","answer":"当DNA复制时，一条链是连续的，另一条链是不连续的，称为半不连续复制。以复制叉移动方向为标准，模板链为3到5方向的，子链沿5到3连续合成称作前导链；模板链为5到3方向的，子链合成也是5到3，和复制叉移动方向相反，形成很多不连续的片段称为冈崎片段，由DNA连接酶连接合成一整条链，称为后随链。"},{"year":"1996","type":"名词解释","number":"11","question":"RNA聚合酶","answer":"以DNA/RNA为模板，四种核糖核苷酸为底物，通过磷酸二酯键聚合形成RNA链的酶。在转录过程中发挥重要作用，又称转录酶。原核生物和真核生物中RNA聚合酶有共同点，但在结构和功能上不完全相同。\n\n1原核生物如大肠杆菌中的RNA聚合酶。是一个由五种亚基构成的六聚体（α2ββ撇σω）。无σ亚基为核心酶，有σ则为全酶。\n\nα：酶的装配，与启动子上游元件活化因子结合\n\nβ：结合核苷酸，促进磷酸二酯键的合成\n\nβ撇：与DNA模板结合\n\nσ：与启动子结合，促进转录起始\n\nω：未知\n\n2真核生物中RNA聚合酶分为三种，I、II、III。\n\nI：转录rRNA（5.8s，18s，28s），对鹅膏蕈碱耐受，对放线菌最敏感\n\nII：转录产物为hnRNA，snRNA，microRNA，最活跃，对鹅膏蕈碱极敏感\n\nIII：转录产物为5srRNA，tRNA，snRNA，scRNA。对鹅膏蕈碱中度敏感"},{"year":"1996","type":"名词解释","number":"12","question":"DNA变性","answer":"核酸在加热，极端pH，离子强度降低或特殊化学试剂（盐酸胍，尿素，甲醛）作用下，其双螺旋区氢键被破坏而解链，双链变成单链，一级结构不被破坏，丧失生物学活性，这个过程叫做变性。DNA变性后260nm处紫外吸光度增高，黏度下降，浮力密度增高，比旋下降，酸碱滴定曲线改变，超速离心沉降系数改变，流动双折射现象消失。DNA变性的特点是爆发式的，在一个很窄的温度范围内变性，是一个相变过程。DNA在纯水中会发生变性。"},{"year":"1996","type":"名词解释","number":"13","question":"衰减子","answer":"一种位于结构基因上游前导区的终止子，可以通过调控核糖体在mRNA上移动速度来行使终止转录信号的的功能，进而进行基因表达调控。转录产物含有茎环结构和一串U序列，受某一氨酰tRNA的调节。例如在色氨酸操纵子中，色氨酸浓度高时，衰减子表现出终止子活性，色氨酸处于中等水平，则部分核糖体停顿、部分继续翻译，基因转录量随之呈连续梯度变化。"},{"year":"1996","type":"名词解释","number":"14","question":"信号识别蛋白体(SRP)","answer":"识别信号肽的一种核蛋白体称作信号识别蛋白体，有两个功能域，结合信号肽和终止肽链的延伸。在含信号肽的多肽进入内质网过程中发挥重要作用。N端新生肽链（信号肽）刚一合成，便被SRP识别并结合，终止延伸或延伸速度大大降低，SRP引导新生肽链及其核糖体至内质网膜，与SRP受体（停泊蛋白）结合，带有新生肽链的核糖体被运送到多肽转运装置上，内质网膜上通道打开，SRP解离返回胞质，肽链继续延伸进入内质网腔，被信号肽酶切割，整个肽链合成完成全部进入内质网，进行折叠、糖基化和二硫键形成等加工过程。"},{"year":"1996","type":"名词解释","number":"15","question":"激素反应元件 (HRE)","answer":"能与激素-受体复合物二聚体结合的一段特殊的DNA序列，结合后能够调节相邻基因的转录（激活或抑制），进而调节基因编码蛋白的合成。"},{"year":"1996","type":"填空题","number":"1","question":"测定天然蛋白质分子量的层析方法是 凝胶过滤法 ,电泳方法是 SDS-PAGE法\n;而测 定蛋白质亚基的分子量的层析方法是 ,电泳方法是 。","answer":""},{"year":"1996","type":"填空题","number":"2","question":"牛胰岛素由 2 条肽链构成，A 链 由 21 个氨基酸残基组成，B 链由 30\n个氨基酸残基组成，链面和链内共含 3 个二硫键。","answer":""},{"year":"1996","type":"填空题","number":"3","question":"在 ρ~a+2~\\<\\<ρ~a-1~,Km\\<\\<Ks,Km可以用来衡量酶和底物的 亲和力","answer":""},{"year":"1996","type":"填空题","number":"4","question":"解释别构酶作用机理的两个重要分子模型是 齐变模型 和 序变模型 模型。","answer":""},{"year":"1996","type":"填空题","number":"5","question":"常见的酶的可逆抑制作用类型是 竞争性抑制 和 非竞争性抑制","answer":""},{"year":"1996","type":"填空题","number":"6","question":"在酶学研究史上第一个被结晶出来的酶是 脲酶 。\n\n7\\. 在 Watson-Crick DNA 结构模型中，连接戊糖和磷酸是 酸酐键\n键，连接各核苷酸的是 磷酸二酯键 键，连接戊糖和碱基的是 糖苷键\n键，两条单链之间搭桥的是 氢 键。","answer":""},{"year":"1996","type":"填空题","number":"8","question":"化学渗透学说由英国生物化学家 米切尔 提出的。\n\n9\\. 酶解途径中的调节酶是 变构酶 、 共价调节酶 和 同工酶","answer":""},{"year":"1996","type":"简答题","number":"1","question":"在生物化学的研究中，为什么要使用缓冲液?在使用缓冲液的时候要注意哪些问题?","answer":"因为生物体内都是有稳态的，比如人体的内环境，细胞的细胞质，都具有相对稳定的理化性质，能抵御一定外界环境的变化，这样生物样品不会失去它原有的活性。因此在体外分析生物样品时，必须提供这样的环境来保证实验的准确性，这就需要能够提供生物自身稳态环境的缓冲液。生物化学体外分析的生物大分子往往具有两性，例如蛋白质，他的基本结构单位是氨基酸，氨基酸是两性电解质，其某些基团的解离取决于周围环境pH的变化，结构的变化影响蛋白质的性质和功能，对于研究工作来说，多数需要测定特定生物活性下蛋白质的性质，因此需要能够维持和稳定pH的缓冲液。\n\n选择缓冲液首先要根据目标待测组分选择合适的缓冲范围，其次缓冲液不能和待测组分发生相互作用或者化学反应。例如缓冲液是某种酶的激活剂或抑制剂，常用的磷酸缓冲液不能在研究ATP时使用，水解的磷酸基团会影响缓冲液组分。"},{"year":"1996","type":"简答题","number":"2","question":"某八肽的氨基酸组成是Lys2 Asp Tyr Phe Gly Ser和Ala, 此八肽与FDNB\n反应，酸水解后释放DNP-Ala,用胰蛋白酶水解该八肽得到两个三肽和一个二肽，其三肽氨基酸组成是Lys\nAla 、Ser和 Gly Phe\nLys。用胰凝乳蛋白酶(糜蛋白酶)水解该八肽，释放出游离的Asp\n和及一个四肽和一个三肽，四肽的氨基酸组成是Lys Ser Phe Ala, 三肽与FDNB\n反应后，经酸水解后释放出DNP-Gly, 根据上述结果分析，写出该八肽的\n氨基酸排列顺序，要说明原因。","answer":"N\\~C：Ala～Ser～Lys～Phe～Gly～Lys～Tyr～Asp"},{"year":"1996","type":"简答题","number":"3","question":"什么是酶?","answer":"酶是由活细胞产生的一类具有催化功能的蛋白质或核酸，亦称为生物催化剂。\n\n从化学组成上来看\n\n酶可分为单纯蛋白质和缀合蛋白质。\n\n单纯蛋白质中除了蛋白质之外不含有任何其他物质，如脲酶，蛋白酶，淀粉酶，脂肪酶以及核酸酶等。缀合蛋白质包括蛋白质以及热稳定的有机小分子物质或金属离子。前者称为脱辅酶，后者称为辅因子，二者结合后称为全酶。根据辅因子和蛋白质结合的紧密程度可分为辅酶和辅基。辅酶指的是与蛋白质结合较松散，一般是非共价键，可以通过透析等方法除去的有机小分子物质，如辅酶I和辅酶II。辅基是指与蛋白质结合紧密，一般是共价键，不能通过透析除去，只能通过特定化学方法除去的辅因子，如细胞色素氧化酶的铁卟啉和丙酮酸氧化酶的FAD。\n\n根据酶分子亚基数目分为单体酶，寡聚酶，多功能酶以及多酶复合物\n\n单体酶是一般由一条肽链组成，如牛胰核糖核酸酶，溶菌酶，羧肽酶A。有些单体酶由多条多肽链构成，如胰凝乳蛋白酶，有三条多肽链，通过二硫键结合形成一个共价整体。（一条多肽链上有多个功能的酶称为多功能酶，如逆转录酶。）寡聚酶一般由两条或多条多肽链构成，多数为別构调节酶，亚基之间靠次级键相连，数目一般为偶数个，亚基可以是相同的也可以是不同的，大多数寡聚酶聚合形式为活性型，如乳酸脱氢酶，丙酮酸激酶。多酶复合物是指几种不同的酶依靠非共价键彼此嵌合在一起，使反应依次进行，保证一系列反应的连续性。如丙酮酸脱氢酶。\n\n根据酶的功能分为：\n\n氧化还原酶类：具有氧化还原能力，分为氧化酶和还原酶，如脱氢酶\n\n转移酶类：催化底物之间进行某些基团的转移或交换，如氨基转移酶，己糖激酶\n\n水解酶类：催化底物发生水解反应的酶，如蛋白酶\n\n裂合酶类：催化一个底物分解为两个化合物或者两个化合物聚合成一个化合物，往往涉及双键的合成或消失，如醛缩酶，裂解酶，水合酶\n\n异构酶类：催化各种同分异构体之间相互转化，如消旋酶，变位酶\n\n连接酶类：催化两个化合物聚合成一个化合物，一般涉及ATP磷酸键的断裂，这是和裂合酶的区别，如谷氨酰胺合成酶\n\n酶作为生物催化剂的反应特点\n\n1.  易失活：酶是由细胞产生的生物大分子，凡事能使生物大分子失活的因素都能使酶失活\n\n2.  催化效率高：酶催化反应速率对非催化反应速率的比例称为酶的催化力。是非催化反应速率的10^8^～10^20^倍，比非生物催化剂高10^7^～1013倍\n\n3.  高度专一性：酶对作用的反应物和催化的反应具有严格的选择性，这是他和其他催化剂最主要的差别。\n\n4.  催化速率受调节：调节酶的浓度（通过诱导或抑制酶的合成，调节酶的降解）；通过激素调节酶的活性：通过激活剂或抑制剂调节酶的活性；通过反馈抑制调节酶的活性；酶原激活，共价修饰，别构调节等。\n\n5.  反应条件温和\n\n6.  许多酶活性还依靠辅助因子的存在\n\n酶的活性指标：酶活力的大小用酶单位U表示，在一定条件下，一定时间内将一定量底物转换为产物所需的酶量。国际酶单位IU指在最适反应条件下，每分钟催化1微摩尔底物转化为产物所需的酶量定义为一个IU"},{"year":"1996","type":"简答题","number":"4","question":"试述各种核苷酸在蛋白质合成过程中已知的主要作用。","answer":"（1）mRNA\n\n蛋白质合成和翻译过程的模板，从DNA处获得信息，决定氨基酸的组成，数量，排列顺序\n\nmRNA上每一个密码子通过与tRNA上反密码子配对决定氨基酸排序\n\n（2）tRNA\n\n形成氨酰tRNA，携带活化的氨基酸到核糖体上，其反密码子识别并结合mRNA上相应密码子，起翻译作用\n\n（3）rRNA\n\n蛋白质合成过程中核糖体的重要组分。\n\n肽基转移酶活性在23srRNA/28srRNA上\n\n参与tRNA和mRNA的结合\n\n（4）反义RNA\n\n是一种调节型RNA，具有与特定mRNA翻译起始位点互补的序列，结合位点也可以位于mRNA下游。通过与mRNA结合，阻断核糖体小亚基对起始密码子的识别和与SD序列的结合，也可以使靶RNA降解或失活。大肠杆菌转座子Tn10在合成转座酶mRNA的同时还合成出一条与其5撇端序列互补的小RNA即反义RNA，从而抑制mRNA的活性，使转座酶维持在一定水平，避免转座频率过高而导致宿主死亡。利用反义RNA进行调节的现象在原核和真核生物中均十分普遍。\n\n（5）miRNA\n\n由内源非编码pre-mRNA经过剪切修饰而来的单链小RNA，含有茎环结构，形成RISC在靶mRNA上扫描，与目标mRNA部分互补，达到抑制翻译的效果。\n\n（6）siRNA\n\n来自内源或外源的双链小RNA，dsRNA被Dicer切割成多个具有特定长度的双链RNA即siRNA。组装形成RISC，招募Argonaute蛋白降解为单链，在靶mRNA上扫描，与目标mRNA完全互补，识别并切割，或者招募组蛋白甲基转移酶到特定染色质区域，使该区域His甲基化，导致该区域异染色质化，基因沉默。可以调节基因的表达并保护基因组免受外源核酸侵入。\n\n（7）其他小RNA\n\nsnoRNA：核仁小RNA，指导真核生物rRNA前体的甲基化，假尿嘧啶化和切割\n\nsnRNA：核内小RNA，参与hnRNA的剪接\n\ngRNA：指导RNA，与被编辑的RNA结合，决定尿苷酸的插入和删除"},{"year":"1996","type":"简答题","number":"5","question":"如果必要的氨基酸、ATP 和 GTP\n都充分供给，血红蛋白的β-珠蛋白链(146个氨基酸残基)生物合成时，将消耗多少高能磷酸基?写出其步骤","answer":"146\\*2+145\\*2+2+1=585"},{"year":"1997","type":"名词解释","number":"1","question":"构象","answer":"是指一个分子所采取的特定空间形态，用来描述有机分子的动态立体化学，反映了分子中各原子任一瞬间的实际相对位置，因此又称空间结构，三维结构或立体结构。由于分子中单键可以自由旋转，同一构型和结构的分子可以采取不同的形态，分子所采取的特定形态称为构象。构象的改变不需要共价键的断裂和重新形成，蛋白质的光学活性不会改变。"},{"year":"1997","type":"名词解释","number":"2","question":"肽键","answer":"指由氨基酸的α氨基和α羧基缩合生成一分子水，形成结构为-CONH-的酰胺键。肽链中的每个氨基酸分子都由于肽键的形成而被破坏变成不完整结构，称为氨基酸残基。肽键是一个共振杂化体。肽键具有一定的双键性质，长度短于单键，长于双键。肽键中CONH和Cα1和Cα2六个原子不能自由转动，位于同一平面，形成肽链主链的平面称为肽平面，也叫酰胺平面。肽键多为反式构型，反式：顺式为1000:1，脯氨酸可以增加顺式构型的比例。"},{"year":"1997","type":"名词解释","number":"3","question":"转换值","answer":"又称TN、kcat、分子活力，指在一定条件下，单位时间内一个酶分子转换底物的分子数或1微摩尔酶分子转换底物的微摩尔数，可以表示酶的催化效率。"},{"year":"1997","type":"名词解释","number":"4","question":"乒乓机制","answer":"多底物酶促反应机制之一，底物A与酶分子E反应形成第一个产物P，同时酶分子E被修饰为E撇，与第二个底物B反应，生成第二个产物Q，同时酶分子被还原成正常形态E，完成循环。例如氨基转移酶。多底物酶促反应机制还有有序反应和随机反应。"},{"year":"1997","type":"名词解释","number":"5","question":"回文结构","answer":"双链DNA中含有的结构相同，方向相反的序列称为回文结构，每一条链从任一方向阅读的序列都与另一条链沿相反方向阅读的序列相同，如5～3：-GGTACC-。回文结构是旋转对称结构，轴的两侧序列相同且相反，这两个反向重复序列不一定连续。短的回文结构可以作为某种信号，例如II型限制性内切核酸酶识别位点。长的回文结构可以形成发夹结构。回文结构在某些因素的作用下可以转换成茎环式的十字结构或发夹结构，这些结构可以相互转换。回文结构常见于DNA序列中，参与遗传信息表达调控和基因转移。"},{"year":"1997","type":"名词解释","number":"6","question":"断裂基因","answer":"断裂基因是指真核生物中的一种基因结构，其编码序列（外显子）被非编码序列（内含子）所分隔。这类基因结构的特点是编码序列不是连续的，而是被插入的非编码序列打断。在转录过程中，需要经过特定的剪接方式除去非编码序列，使编码序列连续起来，形成成熟的mRNA"},{"year":"1997","type":"名词解释","number":"7","question":"信号肽","answer":"每个需要转运的多肽N端都含有的一段短肽序列，可以引导多肽进入不同的转运系统。由信号肽N端，C端和疏水核心区域组成。可以被胞质中的SRP识别并结合，SRP又与内质网膜上的停泊蛋白结合，引导多肽进入内质网腔，使其被信号肽酶切割。信号肽对于蛋白质的跨膜转运和细胞内定位起重要作用。"},{"year":"1997","type":"名词解释","number":"8","question":"衰减子","answer":"一种位于结构基因上游前导区的终止子，通过调节核糖体在mRNA上的移动速度来表达转录终止信号，进而调节基因表达。其转录产物具有茎环结构和一连串U序列，活性受某种氨酰tRNA浓度调节，例如色氨酸操纵子中，色氨酸浓度高时表现出终止子活性，色氨酸处于中等水平，则部分核糖体停顿、部分继续翻译，基因转录量随之呈连续梯度变化。"},{"year":"1997","type":"名词解释","number":"9","question":"等速电泳","answer":"是一种不连续介质电泳技术，早期称为置换电泳，离子移动法，恒电泳。是在自由界面电泳基础上发展起来的一种分析分离新技术，不同于一般的区带电泳，在电泳分离达到平衡后，区带长度和迁移速度恒定，故称等速电泳IEP，分辨率高，分析速度快，适用于常规分析。"},{"year":"1997","type":"名词解释","number":"10","question":"Southern 印迹","answer":"检测基因组DNA特定序列定位的一种核酸分子杂交技术。其基本过程：首先将待测的DNA片段用/不用限制性核酸内切酶处理，通过琼脂糖凝胶电泳进行分离，将其变性，按照在凝胶中的位置转移到硝酸纤维素薄膜/尼龙膜上。然后利用携带同位素或其他标记的DNA/RNA探针检测。如果待测物中含有与探针互补的序列，则二者通过碱基互补配对原则进行结合，洗去游离探针，用放射自显影或其他合适技术检测，从而显现出待测序列及其相对大小。"},{"year":"1997","type":"填空题","number":"1","question":"最早提出蛋白质变性理论的是 **吴宪**","answer":""},{"year":"1997","type":"填空题","number":"2","question":"抗体就是\n**一类可溶性的血清糖蛋白，又称免疫球蛋白，具有四条多肽链的对称结构，与抗原专一而紧密的结合**","answer":""},{"year":"1997","type":"填空题","number":"3","question":"胰岛素原是由 **2** 条肽链组成的","answer":""},{"year":"1997","type":"填空题","number":"4","question":"肌球蛋白本身具有 **ATP** 酶的活性，所以当ATP\n释放能量时，就会引起肌肉收缩。\n\n5\\. **蛋白酶** 催化蛋白质生成氨基酸。","answer":""},{"year":"1997","type":"填空题","number":"6","question":"某酶的 Km\n为2.5×10²克/分子，当该酶被底物饱和的百分数为50%时，其底物浓度为","answer":""},{"year":"1997","type":"填空题","number":"7","question":"酶的竞争性抑制、非竞争性抑制作用都属于 **可逆抑制**","answer":""},{"year":"1997","type":"填空题","number":"8","question":"米氏方程中，当 **k2\\>\\>k3** 时，Km≈Ks,K可以用来衡量酶与底物的亲和力","answer":""},{"year":"1997","type":"填空题","number":"9","question":"氨基酰tRNA 中的氨基酰以 **酯键** 键与氨基酸相连。","answer":""},{"year":"1997","type":"填空题","number":"10","question":"组成核酸的基本单位 **核苷酸** 。","answer":""},{"year":"1997","type":"填空题","number":"11","question":"DNA复制时，DNA 聚合酶的底物是 **脱氧核糖核苷酸** ，而转录时，DNA\n指导RNA 聚合酶以 **核糖核苷酸** 作为底物。","answer":""},{"year":"1997","type":"填空题","number":"12","question":"线粒体内膜是 **呼吸** 系统的主要部位。","answer":""},{"year":"1997","type":"填空题","number":"13","question":"研究氧化磷酸化过程常用的解偶联剂分为三类\n**脂溶性质子载体、离子载体，天然的解偶联蛋白** ,但是解偶联机理不同。","answer":""},{"year":"1997","type":"填空题","number":"14","question":"DEAE 纤维素为 **阴离子** 交换纤维素，主要用于 **碱性** 蛋白质的分离；\n羟甲基纤维素 **阳离子** 交换纤维素，主要用于 **酸性** 蛋白质的分离。","answer":""},{"year":"1997","type":"简答题","number":"1","question":"中性核苷酸在水溶液呈酸性?它们的pl值大概在什么范围?它们的兼性离子上带有什么电荷?在电场中有何行为?欲使中性氨基酸在水溶液中的氨基酸带上正负相等的电荷，需要加入何种物质?","answer":"中性核苷酸分子中含有磷酸基，具有两个电离常数pK₁和pK₂，分别约为1.0和6.0，因此在水溶液中表现为弱酸性。磷酸基团在糖环上的位置对其pk值有影响，距离越近，pk值越大，酸性越强。由于核苷酸带有磷酸基团和碱基，在不同pH环境下解离程度不同，当溶液中含负电荷的磷酸基和含正电荷的含氮环数量相等时，形成兼性离子，此时的pH称为等电点。\n\n在等电点（pI）时，碱基上带正电，磷酸基部分解离带负电，正负电荷相等，pI\n一般在 pH 2～4 范围内。核苷酸在电场中的迁移方向随 pH 变化：当 pH \\< pI\n时带正电，向阴极移动；当pH \\> pI 时带负电，向阳极移动。\n\n欲使中性核苷酸带上正负相等的电荷，应加入酸性物质调节溶液pH至其等电点（约2～4）。"},{"year":"1997","type":"简答题","number":"2","question":"某一肽经酸水解组成分析为5种氨基酸。该肽链的N-末端容易环化，经溴化氢处理得到\n一个游离碱性氨基酸，并与pauly呈阳性。若用胰蛋白酶作用产生则得到两个肽段，一个在\n坂口反应呈阳性，另一个在280nm\n处有强的紫外吸收，并呈Millon氏阳性，求此肽的氨基\n酸排列顺序，并指出它的等电点应该是大于、小于还是等于7。","answer":"N～C：Gln～Arg～Lys～Met～His\n\n（1）谷氨酰胺：位于N端末端易环化\n\n（2）化学法将多肽链水解成较小片段：\n\n溴化氢选择性切割甲硫氨酸的羧基端；NH2OH专一切割Asn-Gly\n\n（3）Pauly反应：酪氨酸的酚基和组氨酸的咪唑基可以和重氮化合物反应生成橘黄色物质\n\n（4）胰蛋白酶专一性水解Lys，Arg\n\n（5）坂口反应：碱性溶液中，胍基和α-萘酚、次氯酸钠反应生成红色物质，通常检测Arg\n\n（6）芳香族氨基酸均在280nm附近有强的紫外吸收\n\n（7）米伦反应：酪氨酸和亚硝酸汞、硝酸汞和硝酸的混合溶液作用生成红色沉淀"},{"year":"1997","type":"简答题","number":"3","question":"什么是酶?（96/97）","answer":"**4.依5\\'-\\>3'顺序写出一下寡核苷酸的互补寡核苷酸顺序**\n\n注意方向，反着写"},{"year":"1997","type":"简答题","number":"5","question":"试述RNA的分类，各类RNA的结构特点及其在蛋白质合成之中的作用。","answer":"（1）mRNA\n\n结构：以DNA为模板，多种NTP为原料形成的线状多聚核苷酸，各种mRNA长度不一。mRNA上每相邻三个核苷酸序列形成遗传密码或称三联体密码，编码一个氨基酸。原核生物的转录多以操纵子为单位，一条mRNA上有多个编码区，为多顺反子，其上结构为5端（有SD序列，半衰期短），3端，各编码区之间为非编码区。真核生物为单顺反子，5端帽子结构，5非编码区，编码区，3非编码区，3polyA尾\n\n功能：蛋白质合成和翻译过程的模板，从DNA处获得信息，决定氨基酸的组成，数量，排列顺序。mRNA上每一个密码子通过与tRNA上反密码子配对决定氨基酸排序。真核生物5段帽子结构可能与翻译起始有关，它能促进核糖体识别和结合起始密码子AUG\n\n（2）tRNA\n\n结构特征：含有较多稀有碱基，半衰期长\n\n一级结构：核苷酸排列顺序，单链RNA\n\n二级结构：三叶草型，包括五部分结构\n\n氨基酸臂：七对碱基组成，tRNA3、5端富含G的序列组成双螺旋区域，3端有-CCA-OH，可以结合活化的氨基酸\n\n二氢尿嘧啶环：有两个二氢尿嘧啶，与氨酰tRNA合成酶的结合有关\n\n反密码子环：七个核苷酸，中间三个构成反密码子，识别并结合mRNA上相应的密码子\n\nTfaiC环：茎环含有七对核苷酸，可识别并结合核糖体rRNA\n\n可变环：也叫附加叉，位于反密码子环和TfaiC环之间，与tRNA的分类有关\n\n三级结构：倒L型，碱基组成倾向于增强碱基平面间的疏水堆积力，和氢键一起维持构象稳定。氨基酸臂和TfaiC环位于一横，CCA位于一端，其他三个位于一竖，反密码子位于一端\n\n功能：形成氨酰tRNA，携带活化的氨基酸到核糖体上，其反密码子识别并结合模板mRNA上相应密码子，起翻译作用。参与基因表达调控和细胞代谢，还参与了很多物质的合成，还是转录酶的引物。\n\n作用机制：在肽链生成过程中，第一个进入核糖体的称为起始tRNA，起延伸作用的称为延伸tRNA，按照mRNA上的密码子依次进入核糖体，氨基酸合成到肽链上后离开，称作tRNA循环。反密码子和密码子不是严格的一一对应关系，在遗传密码特性中称为摆动性。\n\n（3）rRNA\n\n结构：由大亚基和小亚基构成，原核生物为5S，16S，26S；真核生物为5S，5.8S，18S，28S\n\n功能：蛋白质合成过程中核糖体的重要组分；肽基转移酶活性在23srRNA/28srRNA；参与tRNA和mRNA的结合\n\n（4）反义RNA\n\n是一种调节型RNA，具有与特定mRNA翻译起始位点互补的序列，结合位点也可以位于mRNA下游。通过与mRNA结合，阻断核糖体小亚基对起始密码子的识别和与SD序列的结合，也可以使靶RNA降解或失活。大肠杆菌转座子Tn10在合成转座酶mRNA的同时还合成出一条与其5撇端序列互补的小RNA即反义RNA，从而抑制mRNA的活性，使转座酶维持在一定水平，避免转座频率过高而导致宿主死亡。利用反义RNA进行调节的现象在原核和真核生物中均十分普遍。\n\n（5）miRNA\n\n由内源非编码pre-mRNA经过剪切修饰而来的单链小RNA，含有茎环结构，形成RISC在靶mRNA上扫描，与目标mRNA部分互补，达到抑制翻译的效果。\n\n（6）siRNA\n\n来自内源或外源的双链小RNA，dsRNA被Dicer切割成多个具有特定长度的双链RNA即siRNA。组装形成RISC，招募Argonaute蛋白降解为单链，在靶mRNA上扫描，与目标mRNA完全互补，识别并切割，或者招募组蛋白甲基转移酶到特定染色质区域，使该区域His甲基化，导致该区域异染色质化，基因沉默。可以调节基因的表达并保护基因组免受外源核酸侵入。\n\n（7）其他小RNA\n\nsnoRNA：核仁小RNA，指导真核生物rRNA前体的甲基化，假尿嘧啶化和切割\n\nsnRNA：核内小RNA，参与hnRNA的剪接\n\ngRNA：指导RNA，与被编辑的RNA结合，决定尿苷酸的插入和删除"},{"year":"1997","type":"简答题","number":"6","question":"若将¹⁵N 标记的铵盐加入肝匀浆中，开始只有一个¹⁵N\n原子出现在生成的尿素中，而过一 段时间，有两个¹⁵N\n均出现在尿素中，这是为什么?","answer":"这是因为在肝脏的尿素循环（鸟氨酸循环）中，尿素分子中的两个氮原子来源不同：一个来自游离的氨（NH₃），另一个来自天冬氨酸Asp的氨基。\n\n当将 ¹⁵N 标记的铵盐（如\n¹⁵NH₄Cl）加入肝匀浆中时，最初只有游离氨途径参与尿素合成，因此只有一个\n¹⁵N 原子被直接用于生成尿素中的第一个氮（即由氨和 CO₂\n经氨基甲酰磷酸形成的氮）。此时尿素仅含一个 ¹⁵N。随着时间推移，¹⁵N\n标记的铵离子被用于合成谷氨酸和天冬氨酸等氨基供体（通过谷氨酸脱氢酶、谷草转氨酶等反应），这使得第二个氮源------来自天冬氨酸的氨基------也逐渐被¹⁵N\n标记。这样，尿素分子中的两个氮原子都可以来自 ¹⁵N，从而出现了尿素中两个\n¹⁵N 原子均被标记的情况。"},{"year":"1997","type":"简答题","number":"7","question":"类固醇激素的作用机制，下述情况哪些是正确的?(5分)","answer":"类固醇激素分子小且脂溶性，可直接透过细胞膜进入细胞。有的激素如糖皮质激素，与膜上受体结合形成激素受体复合物，再进入核内与核受体结合，调节基因转录新的mRNA，合成新的蛋白质，引起相应的生物学效应，有些激素如性激素，可直接进入核内调节基因表达。"},{"year":"1997","type":"简答题","number":"8","question":"有一个10Kb 的DNA\n片段，经不同限制性内切酶作用，电泳后，得到以下电泳图谱。根\n据此电泳图谱，画出此DNA 片段的限制性酶切图谱**，**并写出推断过程。","answer":"![图片包含 图示 AI\n生成的内容可能不正确。](media/image3.png){width=\"3.0283114610673665in\"\nheight=\"2.8277854330708663in\"}\n\n（）claI（）（）（）EcoRI（）BamHI（）claI（）HindII（）（）BamHI（）"},{"year":"1998","type":"名词解释","number":"1","question":"构象","answer":"是指一个分子所采取的特定空间形态，用来描述有机分子动态立体化学，反映了分子中各个原子在任一瞬间的实际相对位置，因此又称为空间结构，立体结构，三维结构。由于分子中单键可以自由旋转，所以结构和构型相同的分子也可以采取特定的不同的形态，这种特定的形态称为构象。构象的改变不涉及共价键的断裂和重新形成，也不会影响蛋白质的光学活性。"},{"year":"1998","type":"名词解释","number":"2","question":"肽平面98/16","answer":"由构成肽键的六个原子CONH和Cα1、Cα2，不能自由旋转，位于同一个平面，形成肽链主链的平面称为肽平面，也叫酰胺平面。肽键具有一定程度的双键性质，长度短于单键长于双键，是一种共振杂化体，一般是反式构型。"},{"year":"1998","type":"名词解释","number":"3","question":"半保留复制","answer":"在DNA复制过程中，。每个子代链仅保留一条亲代链，另一条链是新合成的，即在复制过程中，首先碱基间氢键发生断裂，双螺旋解开而分离，每条亲代链可作为模板，在其上合成新的互补链，结果由一条链可以形成互补的两条链。即便是单链DNA分子在复制过程中也要形成双链复制形式。这种模式也说明了DNA在代谢上的稳定性。这个结论是通过同位素标记法和密度梯度离心实验验证得出的。"},{"year":"1998","type":"名词解释","number":"4","question":"核酸杂交","answer":"是一种利用核酸分子变性和复性的性质，将来源不同核酸片段按照碱基互补配对原则形成异源双链，对特定的目标核酸定性定量分析的一种技术。异源双链可以发生在DNA和DNA之间，也可以发生在DNA和RNA之间。（序列要相似）利用核酸杂交检测的技术包括southern\nblot，northern blot，基因探针等。"},{"year":"1998","type":"名词解释","number":"5","question":"转肽作用","answer":"肽基转移作用，指肽链从一个化合物上转移到另一个化合物上的过程。蛋白质翻译过程中，在肽基转移酶的作用下，核糖体中P位（肽酰位）上肽酰tRNA的羧基和A位（氨酰位）上氨酰tRNA的氨基端缩合形成肽键，肽链从P位转移到A位，完成转肽作用。"},{"year":"1998","type":"名词解释","number":"6","question":"米氏常数","answer":"Km就是米氏常数，是米氏酶的特征常数。底物浓度用\\[S\\]表示，vmax表示当酶被完全饱和时，酶促反应最大速率。当\\[S\\]=Km时，v0=vmax/2，即Km指当酶促反应达到最大反应速率一半时的底物浓度，单位为，mol/L。Km的大小只与酶的性质有关，与酶的浓度无关，随反应的底物，温度，pH和离子强度的改变而改变。Km代表酶与底物的亲和力，Km值越小，亲和力越大。Km值可以判断酶的专一性和天然底物，还可以帮助推断某一代谢反应的方向。"},{"year":"1998","type":"名词解释","number":"7","question":"过渡态","answer":"过渡态是指由反应物体系转变为产物体系的过程中，经过的能量最高状态。过渡态中，键的状况是旧键未完全断裂，新键未完全形成。过渡态物质不稳定，不能分离出来。过渡态和反应物的能量差称为活化能，不同反应体系的活化能不同，活化能越大，反应越困难。"},{"year":"1998","type":"名词解释","number":"8","question":"空体积 (V₀)","answer":"是一个凝胶过滤体积的术语，空隙体积，指离子交换树脂柱中树脂小球之间空隙的总和。又称孔隙体积或外水体积，即柱床中凝胶珠外孔隙的水相体积。"},{"year":"1998","type":"名词解释","number":"9","question":"共价修饰调节","answer":"共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。常见的共价修饰包括，磷酸化，腺苷酸化，尿苷酸化，甲基化，乙酰化，二硫键的形成等。这种调节方式比别构调节慢，而且一般需要耗能，与其他调节方式不同的是，它能对更多的效应物刺激作出反应，调节形式更灵活，能对效应物浓度变化做出更强烈的反应，存在级联放大效应，是一种经济，快速，节能的调节方式。"},{"year":"1998","type":"名词解释","number":"10","question":"盐析作用","answer":"离子强度上升到一定水平时，蛋白质溶解度开始下降，在水溶液中聚集沉淀析出，这种现象称为盐析。盐析的原理是大量的中性盐离子降低水的活度，使溶液中大部分或全部的自由水转变为盐离子的水化水。此时原先被迫与蛋白质表面疏水基团结合并掩盖的水分子也形成了盐离子的水化水，蛋白质疏水基团暴露出来，随着盐离子浓度升高，蛋白质疏水基团由于疏水作用而聚集发生沉淀。最先沉淀的蛋白质是表面疏水基团数量最多的。盐析是蛋白质分离的一种常见的方法，常用的盐离子是硫酸铵，沉淀后的蛋白质仍保留天然构象。"},{"year":"1998","type":"名词解释","number":"11","question":"转录增强子","answer":"主要存在于真核生物基因组中，最早发现的SV40增强子在转录起始位点上游200bp处，属于顺式作用元件，能大大增强启动子的转录活性。其特点为：能很远距离对启动子产生影响；无论在启动子上游或下游都能发挥作用；功能与序列取向无关；没有基因专一性，但具有组织和细胞特异性；受分化和发育影响。"},{"year":"1998","type":"填空题","number":"1","question":"蛋白质元素组成的特点是平均含 **CHON** , N为 **16** %.\n\n2\\. 聚丙烯酰胺凝胶电泳的分辨力之所以很高，是因为它具有\n**筛分效应、分配效应、电泳效应** 三种效应。\n\n3\\. 蛋白质多肽链主链构象的结构单元包括 **α螺旋、β折叠**\n等等，维系蛋白质二 级结构的主要作用力是 **氢** 键。","answer":""},{"year":"1998","type":"填空题","number":"4","question":"真核生物mRNA的5'帽子结构是 **7-甲基鸟苷** ，其3'末端有 **PolyA尾巴**\n结构。","answer":""},{"year":"1998","type":"填空题","number":"5","question":"tRNA 的二级结构是 **三叶草** 形。","answer":""},{"year":"1998","type":"填空题","number":"6","question":"新生肽链每增加一个氨基酸单位都需要经过 **进位、转肽、移位** 三步反应。","answer":""},{"year":"1998","type":"填空题","number":"7","question":"六大酶类 **氧化还原酶、转移酶、水解酶、裂合酶、异构酶、连接酶**","answer":""},{"year":"1998","type":"填空题","number":"8","question":"分离纯化生物高分子的主要理论依据是 **分子的理化性质差异** 和\n**不同分子之间的特异性反应**","answer":""},{"year":"1998","type":"填空题","number":"9","question":"Northern blotting是用于 **检测和分析特定RNA分子** 技术；而Eastern\nblotting是用于 **检测蛋白质的翻译后修饰（如糖基化）** 的技术。","answer":""},{"year":"1998","type":"简答题","number":"1","question":"水解肽A 时，发现其含有等量的Arg,Val,Tyr,Glu 、Lys,Ala 和 Gly\n七种氨基酸(5分)","answer":"**(1)用胰蛋白酶水解肽A 时，得到如下物质：Arg,Ala-Lys\n和含有Glu,Gly,Tyr,Val 的肽\nB;用胰凝乳蛋白酶水解肽B,产生两个二肽：Val-Tyr,-和 Glu-Gly。**\n\n**(2)肽A 用羧肽酶短时间处理，产生游离的Glu 是第一个可鉴定的氨基酸**\n\n**(3)肽A 用DNFB 法分析N 端氨基酸，产生出DNP-Ala 问该肽A\n的氨基酸排列顺序是怎样的?**\n\nN\\~C：Ala-Lys-Arg-Val-Tyr-Gly-Glu"},{"year":"1998","type":"简答题","number":"2","question":"试述遗传密码的基本特点95/98","answer":"**3.什么是酶的活性部位，如何用来解释酶的专一性?**\n\n与酶活力直接相关的部位称为酶的活性部位或活性中心。其中有些必需基团在一级结构上相距较远，但在形成空间结构过程中相互靠近，聚集在一起，形成有一定空间结构的区域（空穴或裂缝），并与底物特异性结合，使底物转化为产物。通常分为结合部位和催化部位，前者负责与底物结合，决定酶的专一性（与km有关），后者负责底物键的断裂和重新形成，与酶的催化能力有关（与kcat有关），二者也可以合二为一。活性中心之外酶还有调节部位，与某些分子发生某种程度的结合，引起酶的空间构象改变，激活或抑制酶活性。对于缀合酶，辅因子也是酶活性部位的组成成分。\n\n酶和底物的专一性是由于结构互补，诱导契合和分子之间相互识别实现的。酶分子是高柔性的动态构象分子，当酶分子和底物分子相互靠近时，酶蛋白受底物分子诱导，其构象发生有利于底物分子结合的变化，底物分子也发生形变，二者在此基础上互补契合进行反应。"},{"year":"1998","type":"简答题","number":"4","question":"简述分子筛层析的基本原理。","answer":"又称大小排阻层析、分子筛，指根据多孔介质对不同大小和形状的分子排阻能力不同而分离蛋白质混合物的方法。不同大小和形状的分子流经凝胶柱时，比凝胶孔径大的分子不能进入凝胶珠，随溶剂沿凝胶珠间隙向下流动，流动距离最短，最先流出；比凝胶孔径小的分子不同程度选择性进入凝胶珠，流动距离较长，后流出。同大小的分子，线状分子在前，球状分子在后。常用的凝胶为交联葡聚糖（也叫sephadexG-n，后面的数字越大，交联程度越低，凝胶孔径越大，分子量分离范围越大）"},{"year":"1998","type":"简答题","number":"5","question":"试述DNA 重组概念及DNA 重组的步骤及用途。","answer":"DNA分子内或分子间发生遗传信息的重新组合称为遗传重组或基因重排。包括同源重组，特异位点重组以及转座重组。\n\n（1）步骤\n\n①提取目标DNA：从源细胞或组织中通过酸处理、酶处理和离心等方法提取目标DNA\n\n②DNA片段的切割：使用限制性内切酶选择性地切割目标DNA和载体DNA，形成互补的黏性末端或平末端。\n\n③DNA片段的连接：通过DNA 连接酶将切割的DNA 片段连接起来，形成重组DNA。\n\n④重组 DNA的导入：将重组 DNA导入宿主细胞，常用的方法有转化、病毒转染等。\n\n⑤重组 DNA\n的复制和表达：在宿主细胞中，重组DNA可以经过复制和转录/翻译过程，产生相应的蛋白质。\n\n（2）用途\n\n①生产重组蛋白质：通过插入外源基因，改变宿主细胞的代谢途径，使其表达目标蛋白质，用于药物生产、工业生产等。\n\n②基因治疗：将健康的基因插入患者的细胞中，用于治疗遗传性疾病等。\n\n③基因敲除和敲入：通过重组DNA技术，在宿主细胞中删除或替换特定基因，研究基因功能和相关疾病的发生机制。\n\n④基因工程作物：通过插入外源基因，改变植物的性状，使其具有抗虫、抗病、抗逆境等特性。\n\n⑤DNA检测和诊断：包括PCR扩增、基因测序、基因突变检测等，用于疾病诊断、亲子鉴定、犯罪学等领域。"},{"year":"1998","type":"简答题","number":"6","question":"试述基因工程药物的概念和研究进展.","answer":"基因工程药物又称生物技术药物，即通过DNA重组技术制得的蛋白质、多肽、疫苗、激素、单克隆抗体及细胞生长因子等药物，是根据人们愿望设计的基因片段，在体外切割，与载体DNA连接形成重组DNA，导入宿主细胞，在细胞内表达，将生成的目标蛋白质纯化并做成制剂，形成疫苗或蛋白类药，如果目的基因直接在人体靶细胞内表达，则称为基因治疗。\n\n研究进展主要体现在以下几个方面：一是重组表达系统不断优化，如CHO细胞和酵母系统的高效表达与糖基化修饰控制；二是抗体工程技术成熟，出现了人源化抗体、双特异性抗体和抗体偶联药物（ADC）；三是核酸药物和mRNA疫苗崛起，推动了精准治疗的发展；四是基因编辑和细胞治疗（如CAR-T嵌合抗原受体T细胞）在肿瘤和遗传病治疗中取得突破。总体来看，基因工程药物正朝着高效、安全、个体化和智能化方向发展，已成为现代生物医药的重要支柱"},{"year":"1998","type":"简答题","number":"7","question":"假如膳食中含有丰富的丙氨酸，但缺乏天冬氨酸，问是否出现天冬氨酸缺乏的现象?为什么?","answer":"不会出现天冬氨酸缺乏的现象。因为天冬氨酸属于非必需氨基酸，机体可以通过转氨反应自行合成。当膳食中丙氨酸丰富时，丙氨酸可在丙氨酸转氨酶作用下将氨基转移给草酰乙酸，生成天冬氨酸和丙酮酸，因此即使饮食中缺乏天冬氨酸，机体仍能利用丙氨酸合成所需的天冬氨酸。"},{"year":"1998","type":"简答题","number":"8","question":"将C6标有14C的葡萄糖加入含有磷酸戊糖途径和辅因子的溶液中，14C的分布情况如何？","answer":"首先进入戊糖磷酸途径第一步氧化脱羧阶段，6-磷酸葡萄糖酸脱氢酶的催化下（限速步骤），生成5-磷酸核酮糖，14C位于C5。进入第二阶段分子重排阶段，5-磷酸核酮糖在差向异构酶的作用下生成5-磷酸木酮糖，异构酶作用下生成5-磷酸核糖，5-磷酸核糖和5-磷酸木酮糖在转酮酶的作用下生成7-磷酸景天庚酮糖和3-磷酸甘油醛，二者在转醛酶的作用下生成4-磷酸赤藓糖和6-磷酸果糖，4-磷酸赤藓糖和5-磷酸木酮糖在转酮酶的作用下生成3-磷酸甘油醛和6-磷酸果糖。产物进入糖酵解、糖异生或戊糖磷酸途径逆过程，标记的14C慢慢标记这些产物，与磷酸基团同位点。"},{"year":"1999","type":"名词解释","number":"1","question":"增色效应","answer":"嘌呤碱和嘧啶碱具有芳香共轭体系，使得核酸分子在紫外波段有一强烈吸收峰，最大值在260nm附近。单链多核苷酸的εP（摩尔磷吸光系数）大于双螺旋多核苷酸的εP，因此当核酸发生变性时，εP值升高，这种现象称为增色效应，主要原因是核酸变性后，双螺旋区的氢键遭到破坏，双链解开形成单链后，更多的共轭双键暴露出来。"},{"year":"1999","type":"名词解释","number":"2","question":"蛋白质的变构作用","answer":"变构作用是指一些生理性小分子物质作用于具有四级结构的蛋白质，与活性部位之外的其他部位结合，引起该亚基中某些键的断裂或形成，进而调整亚基与亚基之间的空间排布和接触，引起蛋白质构象的轻微改变，包括蛋白质分子变得更松散或紧密，最终引发其生物活性的增高或降低的现象。蛋白质的变构作用使其在生物体内能调整生物活性，以更好的适应环境的变化，充分实现生理功能。蛋白质具有变构作用是进化到四级结构水平的显著特点。"},{"year":"1999","type":"名词解释","number":"3","question":"米氏常数98/99","answer":"Km就是米氏常数，是米氏酶的特征常数。米氏方程为v=vmax\\*\\[S\\]/Km+\\[S\\]。底物浓度用\\[S\\]表示，vmax表示当酶被完全饱和时，酶促反应最大速率。当\\[S\\]=Km时，v0=vmax/2，即Km指当酶促反应达到最大反应速率一半时的底物浓度，单位为mol/L。Km的大小只与酶的性质有关，与酶的浓度无关，随反应的底物，温度，pH和离子强度的改变而改变。Km代表酶与底物的亲和力，Km值越小，亲和力越大。Km值可以判断酶的专一性和天然底物，还可以帮助推断某一代谢反应的方向。"},{"year":"1999","type":"名词解释","number":"4","question":"转换值95/99","answer":"**5.持留时间95/96/99**"},{"year":"1999","type":"名词解释","number":"6","question":"空体积98/99","answer":"**7.衰减调节**\n\n是细菌辅阻遏作用的一种精细调控，它不像阻遏蛋白那样\"开或关\"，而是在转录开始后根据代谢物浓度的变化实现连续控制，精细而迅速地调节基因的表达水平。典型例子为色氨酸操纵子的衰减调节：通过位于操纵子前导区类似于终止子结构的衰减子来实现。当色氨酸浓度足够时，衰减子转录出茎环结构和一连串U序列，表现出转录终止信号。如果色氨酸处于中等水平，则部分核糖体停顿、部分继续翻译，基因转录量随之呈连续梯度变化。"},{"year":"1999","type":"名词解释","number":"8","question":"DNA的半不连续复制96/99","answer":"**9.糖异生作用**\n\n指主要发生在在肝细胞线粒体或细胞溶胶中，将生物体内非糖物质转化为葡萄糖，对人类或动物必需的过程。主要发生在肝（90%）和肾（10%），是动物体内合成葡萄糖的唯一途径。常见的糖异生底物有丙酮酸，草酰乙酸，乳酸，甘油以及生糖氨基酸。乙酰CoA在动物体内不能作为底物，但在植物和微生物中由于乙醛酸循环可以作为糖异生的底物。糖异生并不是EMP的简单逆转，由丙酮酸开始的糖异生除了包括EMP途径中的七步可逆反应外，还有对三步不可逆反应的迂回措施。包括丙酮酸在丙酮酸羧化酶的作用下生成草酰乙酸，草酰乙酸在PEP羧激酶的作用下生成PEP（磷酸烯醇式丙酮酸）；1,6-二磷酸果糖在1,6-二磷酸果糖磷酸酶作用下生成6-磷酸果糖；6-磷酸葡萄糖在6-磷酸葡萄糖磷酸酶的作用下生成葡萄糖。糖异生保证机体内血糖平衡。"},{"year":"1999","type":"填空题","number":"1","question":"DNA 的二级结构为 **通过次级键形成的双螺旋或多股螺旋结构**","answer":""},{"year":"1999","type":"填空题","number":"2","question":"在真核细胞中 DNA 的三级结构为 （**负）超螺旋**\n结构，它由140bp的DNA缠绕于 **组蛋白** 组成的八聚体外，又以60bp的DNA及\n**H1组蛋白** 形成的细丝相连组成串珠状结构 **核小体**\n\n3\\. **限制性内切核酸酶** 酶具有极高的专一性，识别DNA\n上特定位点，将两条链都切断，形成粘末端或平末端。","answer":""},{"year":"1999","type":"填空题","number":"4","question":"组成 DNA 的基本单位是 **脱氧核糖核苷酸** ,组成RNA的基本单位是\n**核糖核苷酸**","answer":""},{"year":"1999","type":"填空题","number":"5","question":"一般来说DNA 分子中G-C 含量高，分子较稳定，熔解温度 **80～100 ℃**","answer":""},{"year":"1999","type":"填空题","number":"6","question":"蛋白质二级结构包括 **α螺旋** 和 **β折叠** 结构单元。","answer":""},{"year":"1999","type":"填空题","number":"7","question":"糖酵解途径又叫 **EMP** 途径。","answer":""},{"year":"1999","type":"填空题","number":"8","question":"分子反式 CH₃CH=CHCOOH 完全分解成CO2和H2O 共产生 **22（β氧化）**\n分子ATP。","answer":""},{"year":"1999","type":"填空题","number":"9","question":"有机体从头合成嘧啶核苷酸时先利用分子物质形成带有嘧啶环的 **乳清酸** ;\n再与 **PRPP** 生成 **乳清苷酸** ,再转化成 UMP.","answer":""},{"year":"1999","type":"填空题","number":"10","question":"脱氧核苷酸的生物合成是在 **核糖核苷酸** 的基础上还原生成的","answer":""},{"year":"1999","type":"填空题","number":"11","question":"在真核生物中DNA复制后组装成核小体时的组蛋白是\n**复制依赖型（除H1组蛋白）**的组蛋白","answer":""},{"year":"1999","type":"填空题","number":"12","question":"真核生物 RNA 聚合酶Ⅲ负责转录 **tRNA，5SrRNA，scRNA，snRNA**","answer":""},{"year":"1999","type":"填空题","number":"13","question":"在真核生物蛋白质合成起始时 **Met-tRNAᵢᴹᵉᵗ 和 eIF2-GTP**\n形成复合物，再和 **40S核糖体小亚基** 形成40S起始复合物。","answer":""},{"year":"1999","type":"填空题","number":"14","question":"根据原癌基因的产物可分为三类：第一类 **生长因子类** ,包括 **sis基因**\n；第二类 **受体及膜相关蛋白类** ,包括 **erbB基因** ;第三类\n**细胞内信号转导蛋白类** ,包括 **ras基因**","answer":""},{"year":"1999","type":"填空题","number":"15","question":"基因重排是指 **DNA分子内或分子间发生的遗传信息重新组合**\n，通过基因重排调节基因活性的典型例子是\n**免疫球蛋白基因重排形成多样性抗体**","answer":""},{"year":"1999","type":"简答题","number":"1","question":"用BrCN 处理含等量的Met,Phe,Asp,Ser,Thr\n的多肽，释放出肽和单一的高丝氨酸。原5肽用胰凝乳蛋白酶处理的两个碎片，一个比另一个酸性强，酸性碎片有甲硫氨酸，原来肽用羧肽酶A处理，迅速放出Ser,\n随后放在Thr, 推断该5肽的氨基酸排列顺序","answer":"高丝氨酸是苏氨酸和甲硫氨酸生物合成的一种中间产物\n\nN\\~C：Met（BrCN）-Phe-Asp（酸性强）- Thr-Ser"},{"year":"1999","type":"简答题","number":"2","question":"什么是蛋白质的四级结构?以血红蛋白为例说明之","answer":"蛋白质的四级结构是指由两条或多条具有完整一二三级结构多肽链（亚基）通过非共价力（主要是疏水相互作用，其次为氢键和盐键，无共价键）相互连接形成的一般为球形的立体结构。涉及亚基的组成，数量，各亚基在整个分子中的空间排布以及亚基与亚基之间相互作用。\n\n脊椎动物血红蛋白分子近似球形，由四个多肽亚基组成，每个亚基都含有一个血红素基和一个氧结合部位，四个亚基依靠八个离子键连接。成人的Hb分子大多为HbA（亚基组成为α2β2），其次为HbA2（亚基组成为α2δ2），不同种亚基间相互作用力大，用尿素处理血红蛋白，得到两个Hbα-Hbβ二聚体，二聚体保持完整。胎儿的Hb分子主要为HbF（亚基组成为α2γ2），丝氨酸取代成人中的组氨酸，减少正电荷，降低对BPG的亲和力。\n\n**3说明酶活力共价调节的基本原理**\n\n共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。常见的共价修饰包括，磷酸化，腺苷酸化，尿苷酸化，甲基化，乙酰化，二硫键的形成等。这种调节方式比别构调节慢，而且一般需要耗能，与其他调节方式不同的是，它能对更多的效应物刺激作出反应，调节形式更灵活，能对效应物浓度变化做出更强烈的反应，存在级联放大效应，是一种经济，快速，节能的调节方式。\n\n**4说明等电聚焦技术的基本原理**\n\nIEF，又称电聚焦技术，是一种高分辨率的蛋白质分离技术，主要用于测定蛋白质的等电点。利用特殊缓冲液（两性电解质）在聚丙烯酰胺凝胶电泳中形成pH梯度，蛋白质在电泳时迁移到他的等电点PI时，即蛋白质到达梯度中某一pH时，蛋白质就不再带有净的正电荷或负电荷了，停止迁移，实现蛋白质的分离。目前常用的凝胶包括聚丙烯酰胺凝胶，葡聚糖凝胶，琼脂糖凝胶等。这种方法常用于分离同工酶，分子量接近但等电点不同的蛋白质。\n\n**5简述人体内丙氨酸彻底分解成最终产物的过程，一分子Ala彻底分解共产生多少\nATP?**\n\n丙氨酸在谷丙转氨酶的作用下和α-酮戊二酸反应生成丙酮酸和谷氨酸，丙酮酸生成乙酰CoA后进入TCA循环，产生12.5个ATP，谷氨酸在谷氨酸脱氢酶的作用下生成α酮戊二酸，同时生成NH3和NADH，NH3进入尿素循环，降解一个氨分子消耗2个ATP，因此不考虑尿素为15个ATP，考虑尿素13个ATP。"},{"year":"1999","type":"简答题","number":"6","question":"试述植物基因工程的重要技术环节和取得的重要成就","answer":"（1）目的基因的获取与修饰：通过分子克隆、PCR扩增或人工合成获得目标基因，并根据植物表达特点添加启动子、终止子、信号肽等调控元件。\n\n（2）构建重组载体：常用的为 Ti\n质粒衍生的植物表达载体或基因枪载体，将目的基因插入载体的多克隆位点，并连接标记基因（如抗生素基因）。\n\n（3）基因导入植物细胞：常用方法包括农杆菌介导法、基因枪法、电穿孔法等。农杆菌介导法利用Ti质粒将T-DNA片段转入植物基因组，是目前最广泛应用的技术。\n\n（4）转化细胞的筛选与再生：通过含有选择剂（如卡那霉素）的培养基筛选出获得外源基因的细胞，再经组织培养和激素诱导再生完整植株。\n\n（5）外源基因的检测与表达分析：利用PCR、Southern blot、Northern\nblot或Western\nblot验证基因是否整合、转录及表达，确定转基因植株的遗传稳定性。\n\n**主要研究与应用成就**\n\n（1）培育了抗虫作物，如含有 Bt 基因的棉花、玉米，大幅减少了农药使用量；\n\n（2）培育了抗除草剂作物，如表达草甘膦抗性基因的转基因大豆；\n\n（3）培育了抗病、抗逆作物，如抗病毒番茄、抗盐碱水稻和抗旱玉米；\n\n（4）实现了营养品质改良，如\"黄金大米\"通过导入β-胡萝卜素合成基因提高了维生素A含量；\n\n（5）推动了农业可持续发展，实现了作物高产、高效与环境友好。。"},{"year":"2000","type":"名词解释","number":"1","question":"亚基","answer":"具有完整一、二、三级结构的多肽链称为亚基。由两条或多条亚基通过非共价力（主要是疏水相互作用，其次是盐键和氢键）相互连接形成的一般为球形的结构称为蛋白质的四级结构，涉及亚基的组成，数量，各类亚基在整个分子内的空间排布以及亚基与亚基之间的相互作用。亚基单独存在时没有生物活性，只有聚合成完整四级结构的蛋白质后才具有活性。"},{"year":"2000","type":"名词解释","number":"2","question":"酶的必需基团","answer":"酶的必需基团指与酶活性密切相关的基团，这些基团在一级结构上可能相距较远，但在形成空间结构时彼此靠近形成特定的空间结构区域。既可位于活性中心内部，也可位于活性中心外部。位于活性中心内部的必需基团分为结合部位和催化部位，前者负责与底物结合，决定酶的亲和力，与Km有关；后者负责底物键的断裂和重新形成，决定酶的催化效率，与kcat有关。位于活性中心外部的必需基团负责维持酶活性中心空间构象和酶的结构。\n\n**3修饰核苷**\n\n在生物中，除了含有鸟嘌呤核苷，腺嘌呤核苷，胞嘧啶核苷，胸腺嘧啶核苷和尿嘧啶核苷五大基本核苷外，还有一些碱基经过修饰（甲基化，巯基化，羟基化，乙酰化）或核糖经过修饰的核苷称为修饰核苷。各种类型的RNA中都含有修饰核苷，如tRNA含有大量稀有碱基，rRNA含有大量甲基化核糖，二者都含有假尿嘧啶核苷。"},{"year":"2000","type":"名词解释","number":"4","question":"酵解","answer":"糖酵解，即EMP，指在无氧条件下，一分子葡萄糖在细胞溶胶中生成两分子丙酮酸，并净生成两分子ATP和两分子NADH的一系列反应过程。这是生物体共经的葡萄糖分解代谢的前期途径，有些生物利用此途径在供氧不足的情况下给机体供能或供应急需要。以葡萄糖为起始物质，经过两个阶段十步反应，需要十种酶，其中三步不可逆反应，对应三种限速酶，分别为己糖激酶，6-磷酸果糖激酶和丙酮酸激酶，大部分过程都有镁离子作为辅因子。第一阶段葡萄糖磷酸化生成两个3-磷酸甘油醛，消耗两分子ATP；第二阶段转化成两分子丙酮酸，生成四分子ATP和两分子NADH。"},{"year":"2000","type":"名词解释","number":"5","question":"氧化磷酸化作用95/00/06/15","answer":"需氧生物产生ATP的主要方式，与细胞对ATP的需要相适应。是指还原型辅酶的电子经呼吸链传递给氧气，并利用产生的能量将ADP磷酸化形成ATP的偶联过程。电子传递过程包括电子从还原型辅酶（NADH、FADH2）通过一系列按电子亲和力递增排列的电子载体组成的电子传递链，最终传递给氧气的过程，他们被重新氧化并生成水。电子传递链也叫呼吸链，主要由四种蛋白质复合体构成，NADH-Q还原酶，琥珀酸-Q还原酶，细胞色素还原酶以及细胞色素氧化酶。主要发生在线粒体内膜。"},{"year":"2000","type":"名词解释","number":"6","question":"DNA的半不连续复制96/99/00","answer":"**7.聚合酶链式反应**\n\n即PCR，是一种DNA体外酶促扩增的方法，其步骤包括变性，退火和延伸。首先高温94℃使DNA双链打开即变性，便于与引物相连；随后温度降低至50～60℃，按照特定目的基因设计好的引物与DNA模板结合即退火；最后温度升高至72℃，在耐高温的DNA聚合酶催化下，四种脱氧核苷三磷酸为原料，按照碱基互补配对原则沿模板链延伸即延伸。不断循环实现对目的基因扩增，具有特异性强，灵敏度高，操作简便省时等特点。"},{"year":"2000","type":"名词解释","number":"8","question":"核酸杂交98/00","answer":"是一种利用核酸分子变性和复性的性质，将来源不同核酸片段按照碱基互补配对原则形成异源双链，对特定的目标核酸定性定量分析的一种技术。异源双链可以发生在DNA和DNA之间，也可以发生在DNA和RNA之间（序列要相似）。利用核酸杂交检测的技术包括southern\nblot，northern blot，基因探针等。"},{"year":"2000","type":"名词解释","number":"9","question":"分子伴侣00/02","answer":"分子伴侣是一类帮助蛋白质正确折叠、组装和防止错误聚集的蛋白质。他们是在序列上没有同源性但具有共同功能的保守性蛋白。他们通过简化正确折叠途径并提供折叠微环境，协助部分折叠的新生肽链折叠成正确三维构象或帮助已经错误折叠的蛋白质恢复到天然构象。分子伴侣通常不参与蛋白质最终功能状态，只是暂时性与蛋白质结合，维持其可溶性和功能性。例如热激蛋白Hsp家族成员，Hsp60和Hsp70就是典型的分子伴侣。"},{"year":"2000","type":"名词解释","number":"10","question":"增强子98/00/01/06/12","answer":"主要存在于真核生物基因组中，最早发现的SV40增强子在转录起始位点上游200bp处，属于顺式作用元件，能大大增强启动子的转录活性。其特点为：能很远距离对启动子产生影响；无论在启动子上游或下游都能发挥作用；功能与序列取向无关；没有基因专一性，但具有组织和细胞特异性；受分化和发育影响。"},{"year":"2000","type":"填空题","number":"1","question":"稳定蛋白质胶体状态的因素是蛋白质分子上的 **水化层** 层及 **双电层**","answer":""},{"year":"2000","type":"填空题","number":"2","question":"氢键有两个主要特征 **方向性** 和 **饱和性** 。","answer":""},{"year":"2000","type":"填空题","number":"3","question":"两条相当伸展的肽链或同一条肽链的两个伸展的片段之间形成氢键的二级结构称：**β折叠**","answer":""},{"year":"2000","type":"填空题","number":"4","question":"使酶具有高催化效应的因素有\n**邻近效应和定向效应**、**底物形变和诱导契合**、**多元催化和协同效应、活性部位微环境的影响**","answer":""},{"year":"2000","type":"填空题","number":"5","question":"tRNA的分子3端的碱基序列是 **CCA-OH**","answer":""},{"year":"2000","type":"填空题","number":"6","question":"酵母DNA按摩尔计含有32.8%的T,则A为 **32.8%** ,G为 **17.2%** 和C为\n**17.2%**","answer":""},{"year":"2000","type":"填空题","number":"7","question":"真核细胞核小体的组成是 **组蛋白八聚体和DNA**","answer":""},{"year":"2000","type":"填空题","number":"8","question":"核酸变性后可发生 **增色** 效应。","answer":""},{"year":"2000","type":"填空题","number":"9","question":"破坏α螺旋结构的氨基酸是 **Pro和Gly**\n\n10与mRNA密码子ACG相对应的tRNA的反密码子是 **CGU**","answer":""},{"year":"2000","type":"填空题","number":"11","question":"内含子是指 **断裂基因中，经转录被剪接去除的序列**\n\n12有机体的 **合成** 代谢和 **分解** 代谢是密切联系在一起的.","answer":""},{"year":"2000","type":"填空题","number":"13","question":"ATP在细胞的产能和储存传递能量过程中起着重要的 **载体** 作用。","answer":""},{"year":"2000","type":"填空题","number":"14","question":"电子传递链在原核细胞存在于 **细胞质膜** ;在真核生物中存在于\n**线粒体内膜**","answer":""},{"year":"2000","type":"填空题","number":"15","question":"磷酸果糖激酶是酵解途径中最关键的 **限速** 酶","answer":""},{"year":"2000","type":"填空题","number":"16","question":"TCA循环生物体内糖、脂、蛋白质代谢的 **共同途径**","answer":""},{"year":"2000","type":"填空题","number":"17","question":"生物体内卵磷脂合成的两种不同途径是 **甘油二酯途径（主要）** 和\n**CDP-二酰甘油途径**","answer":""},{"year":"2000","type":"填空题","number":"18","question":"在灵长类动物中，嘌呤分解代谢的最终产物是 **尿酸**","answer":""},{"year":"2000","type":"填空题","number":"19","question":"脱氧核苷酸的生物合成是在 **核糖核苷酸** 的基础上还原生成的。\n\n20在真核生物中DNA复制的主要酶是 **DNA聚合酶δ**\n\n21酶的磷酸化和脱磷酸化作用是 **可逆** 共价修饰调节酶活性的一种重要方式","answer":""},{"year":"2000","type":"填空题","number":"22","question":"操纵子包括 **启动子** 和 **操纵基因和结构基因** 。","answer":""},{"year":"2000","type":"填空题","number":"23","question":"所有原核生物的终止子之前均有一个 **回文结构** ,其产生的RNA可形成\n**茎环结构**","answer":""},{"year":"2000","type":"填空题","number":"24","question":"在转录过程中RNA聚合酶全酶的σ-因子负责 **识别启动子，起始合成RNA**\n，核心酶负责 **使已经开始合成的RNA链延长** 。","answer":""},{"year":"2000","type":"填空题","number":"25","question":"DNA拓扑异构酶是与 **DNA拓扑学性质** 有关的酶。","answer":""},{"year":"2000","type":"简答题","number":"1","question":"用 1mol\n酸水解五肽，得两个谷氨酸，一个赖氨酸；用胰蛋白酶裂解成两个碎片，在PH=7","answer":"**时电泳，碎片之一向阳极，另一个向阴极，碎片之一用DNP-\n谷氨酸，原五肽用胰凝乳蛋白水解产生两个二肽和一个游离的谷氨酸，写出五肽顺序**\n\nTrp易被酸水解，Gln和Asn也会被酸水解生成Glu和Asp\n\nN-C：Gln-Trp-Lys-Trp-Glu"},{"year":"2000","type":"简答题","number":"2","question":"简述如何用酶的竞争性抑制剂的理论来寻找或合成控制代谢的药物","answer":"竞争性抑制剂：抑制剂与酶的必需基团通过非共价键结合引起酶活力降低或丧失，可以使用物理方法如透析将抑制剂除去使酶复活，这种抑制作用是可逆的。大多数竞争性抑制剂I与底物结构类似，因此能与酶的活性部位结合形成可逆的EI复合物，但EI复合物不能产生产物P，因此酶活性下降。这种抑制作用的强弱取决于抑制剂与底物的相对浓度，可通过提高底物浓度来解除。\n\n抗代谢物在化学结构上与必需代谢物类似，竞争性拮抗正常代谢物从而影响生物体中正常代谢。典型药物包括磺胺类药物，氨甲蝶呤以及氮杂丝氨酸。在细菌中，对氨基苯甲酸在二氢叶酸合成酶的作用下生成二氢叶酸，随后在二氢叶酸还原酶的作用下生成四氢叶酸，四氢叶酸是核苷酸和某些氨基酸合成过程中重要的一碳单位载体。而在人体中，二氢叶酸可直接从叶酸还原而来。\n\n磺胺类药物是对氨基苯甲酸的类似物，竞争性抑制二氢叶酸合成酶的活性，影响四氢叶酸的合成进而抑制细菌的生长繁殖，而且对人类的副作用小。氨甲蝶呤是二氢叶酸的类似物，竞争性抑制二氢叶酸还原酶的活性，从而影响四氢叶酸的合成进而抑制细胞的增殖，可用于治疗癌症。氮杂丝氨酸是谷氨酰胺的类似物，在体内竞争性抑制嘌呤合成过程中PRPP酰胺转移酶的活性，从而抑制核苷酸的生物合成，抑制细胞增殖。"},{"year":"2000","type":"简答题","number":"3","question":"什么是遗传学中心法则?为什么说阮病毒的发现是对此法则提出了挑战?","answer":"Crick提出，内容包括：DNA为自身复制的模板；DNA通过转录作用将遗传信息传递给RNA；RNA通过翻译作用将遗传信息表达成蛋白质；随着科学研究进一步深入，在某些病毒中发现RNA可以自己复制，甚至有的病毒中RNA可以逆转录成DNA，对中心法则进行了扩展和补充。中心法则揭示了遗传信息的传递方向以及DNA、RNA和蛋白质之间的关系。朊病毒被发现仅由蛋白质构成，不含有核酸，复制过程以蛋白质为模板，以蛋白质为遗传信息，打破了传统的仅由核酸作为遗传信息。"},{"year":"2000","type":"简答题","number":"4","question":"在动物体内脂肪酸能转变成糖吗?为什么?","answer":"脂肪酸分为奇数脂肪酸和偶数脂肪酸。偶数脂肪酸分解代谢产生乙酰CoA，不能作为糖异生的底物转变为糖，因为动物体内缺少乙醛酸循环的关键酶即异柠檬酸裂合酶和苹果酸合酶，因此乙酰CoA进入TCA循环中只能以CO2的形式释放出去，没有其他产物的生成。奇数脂肪酸分解代谢产生乙酰CoA和一分子丙酰CoA，可被羧化生成琥珀酰CoA，进入TCA循环产生草酰乙酸，进入糖异生后转变成糖。"},{"year":"2000","type":"简答题","number":"5","question":"简述原核生物与真核生物蛋白质合成的区别","answer":"（1）起始tRNA不同\n\n真核生物起始tRNA为Met-tRNA~i~^Met^且不发生甲基化；原核生物起始tRNA为fMet-tRNA~i~^fMet^，其中甲酰基是在甲酰化酶作用下，加到甲硫氨酰tRNA上的。\n\n（2）参与的起始因子不同\n\n真核生物的核糖体较大，在翻译过程中有较多的起始因子参与，真核生物有eIF-1、eIF-2、eIF-3、5-帽子结合蛋白eIF-4E，衔接蛋白eIF-4G，3-PABP（聚腺苷酸结合蛋白）等；原核生物只有3种起始因子，分别为IF-1、IF-2和IF-3。\n\n（3）有无SD序列\n\n原核生物mRNA上有能与16SrRNA配对的SD序列，而真核生物没有这样的序列。\n\n（4）起始识别机制以及起始复合物形成顺序不同\n\n原核细胞中30S小亚基先与翻译起始因子IF-1、IF-3结合，通过SD序列与mRNA模板结合，起始因子IF-2-GTP帮助fMet-tRNA~i~^fMe^t落在小亚基的P位点。即起始复合物的形成顺序为小亚基-mRNA-tRNA；真核生物中40S小亚基先与翻译起始因子eIF1和eIF3结合，随后在eIF2-GTP的帮助下，Met-tRNA~i~^Met^进入核糖体P位，然后结合eIF3与通过eIF4E结合在mRNA5-端的eIF4G相连，40S小亚基开始沿mRNA5\\'端帽子结构扫描，直到核糖体结合位点发生较为稳定的相互作用，起始tRNA与AUG识别并结合。即起始复合物合成顺序为小亚基-tRNA-mRNA。\n\n（5）是否消耗能量\n\n原核生物起始过程中不需要消耗ATP解开mRNA三级结构，而真核生物需要消耗ATP。\n\n即真核生物消耗ATP和GTP，而原核生物只消耗GTP。\n\n（6）延伸\n\n真核生物多肽链合成的延伸循环与原核生物十分相似，三个延伸因子分别称为eEF1A、eEF1B和eEF2，分别相当于原核生物EF-Tu、EF-Ts和EF-G；真核生物核糖体无E位点，空载tRNA直接从P位点脱落。\n\n（7）终止\n\n原核生物有3个释放因子，RF-1识别UAA、UAG,RF2识别UAA、UGA,RF-3是GTP结合蛋白，结合核糖体后引起GTP水解，并使RF-1或RF-2脱落；真核生物是一个释放因子eRF1\n\n，可识别所有三个终止密码子并使多肽链水解下来，eRF3为GTP结合蛋白，进入A位点后水解GTP并使eRF1脱落。\n\n**6简述真核生物的基因表达调控?**\n\n真核细胞中存在两种类型的调控，一种短期可逆调控，另一种为长期不可逆调控。短期调控主要是细胞对环境变动，特别是对代谢调节或激素水平升降作出反应，表现出细胞内某些酶或特殊蛋白质合成的现象。长期调控则涉及发育进程中细胞决定和分化。\n\n(1) 转录前水平\n\n真核生物基因组DNA以致密的染色质形式存在，所有通过改变DNA序列和染色质结构从而影响基因表达的过程称为转录前水平调控。\n\n1.  基因扩增：某些基因的拷贝数专一性大大增加，通过基因数量调控基因表达，使某一表达产物在短时间内大大增加满足细胞生命活动所需。\n\n2.  基因重排：将一个基因从远离启动子的地方移到据他很近的位点从而启动转录，基因重排可使表达的基因发生切换，即从表达一个基因到表达另一个基因。\n\n3.  DNA甲基化：DNA碱基可以发生甲基化，如5-甲基胞嘧啶。生物体内有两种甲基转移酶，一类是保持性甲基转移酶，在模板链指导下使对应部位发生甲基化；另一类是从头合成甲基转移酶，无需模板链指导。DNA甲基化可以改变DNA分子构象，从而改变某些基因上游调控区与各种转录相关蛋白因子相互作用，被甲基化的基因不能表达。\n\n4.  异染色质化：凝缩状态的染色质称为异染色质，为非活性转录区。真核生物可以通过异染色质化关闭某些基因的表达，例如巴氏小体。\n\n5.  基因或染色质的丢失：在细胞分化过程中，可以通过丢掉一段DNA或整条染色体而去掉这些基因的活性。\n\n```{=html}\n<!-- -->\n```\n(2) 转录水平\n\n调控最主要的环节，主要是通过顺式作用元件、反式作用因子以及RNA聚合酶之间相互作用调节基因转录活性\n\n1.  染色质活化\n\n在真核生物体内，RNA聚合酶和启动子的结合受染色质结构的限制，需要通过染色质重塑来活化转录。组蛋白与DNA形成核小体抑制转录，转录因子激活转录，二者之间的竞争结果决定是否转录。组蛋白末端Lys可被乙酰化，中和正电荷，降低与DNA的亲和力，使核小体的构象转化为有利于转录因子与DNA结合的状态，从而降低其抑制作用，提高转录活性。\n\n2.  顺式作用元件\n\n指DNA上对基因表达有调节作用的序列，包括启动子，增强子，绝缘子、沉默子等及其应答元件。启动子：RNA聚合酶识别并结合，起始转录。增强子：作用于启动子，增加转录起始频率。绝缘子：阻断经过他的正或负调节信号。沉默子：与相应的反式作用因子结合后起负调控作用。\n\n3.  反式作用因子\n\n直接或间接地结合到各类顺式作用元件上，参与靶基因调控的蛋白质，包括DNA结合结构域和转录激活结构域。前者包括螺旋转角螺旋，螺旋环螺旋，锌指结构，亮氨酸拉链。后者包括带负电荷的螺旋结构、富含Gln结构和富含Pro结构。反式作用因子对基因表达的调控不是由单一因子完成的，而是不同因子组合发挥特定作用。一种反式作用因子可以调控不同的基因表达，同一个基因可以受多个因子调控，从而实现利用有限的反式作用因子调节基因的表达。\n\n4.  激素类物质对转录的诱导作用，如甾醇激素，与特定受体蛋白结合，受体蛋白活化后结合到DNA特定位点激活基因。\n\n```{=html}\n<!-- -->\n```\n(3) 转录后水平\n\n各种基因转录产物如rRNA、mRNA、tRNA等初级转录产物经加工修饰形成有生物功能的活性分子。\n\nmRNA前体需要经过带帽，加尾，剪接，内部甲基化得到成熟的mRNA分子，不同转录起点和终点的产物，经过内部不同的剪切拼接以及不同的编辑得到不同的mRNA，编码不同的基因表达产物。首先带帽，发生在细胞核内，磷酸酶的作用下先将5-端磷酸基水解掉，再加上鸟苷三磷酸形成GpppN结构，再对G进行甲基化，最终形成帽子结构m^7^G^5-^ppp^5-^N。帽子结构是mRNA在细胞核和细胞质中的稳定因素，如果没有帽子结构会很快被核酸酶水解。同时帽子结构可以促进蛋白质生物合成起始复合物的形成，提高翻译强度。其次加尾，也发生在细胞核内，首先由核酸外切酶切去3-端一些过剩的核苷酸，由多聚腺苷酸酶催化，ATP为底物，逐个添加腺苷酸，形成polyA。该结构是mRNA从细胞核进入细胞质所必需，维持mRNA的稳定性。然后剪接，真核生物结构基因一般为断裂基因，其中能编码多肽链合成的基因称为外显子，非编码序列则为内含子。hnRNA的剪接一般需要snRNA参与构成的核蛋白体参加，形成套索结构将内含子切除（II型内含子剪切）。最后内部甲基化，主要是m^6^A，甲基化酶催化。\n\nrRNA：RNA聚合酶I催化前体rRNA合成，包括5.8S，18S和28SrRNA，RNA聚合酶III催化生成5SrRNA。真核生物的rRNA是一类中度重复基因。其加工过程包括：前体rRNA与蛋白质结合，随后被甲基化切割，甲基化位点在核糖体2-OH上，其甲基化，假尿苷酸和切割是由snoRNA指导的，剪接方式一般为内含子I型剪接方式，不过大多数真核生物rRNA不含有内含子。\n\ntRNA：RNA聚合酶III转录生成的tRNA前体。首先核酸内切酶在tRNA两端切断，由核酸外切酶在3-端逐个切去附加序列进行修剪，在3-端添加CCA-OH。随后在甲基转移酶和异构酶的作用下添加稀有碱基形成二级结构，最后自组装形成倒L形特定空间构象。\n\n(4) 翻译水平\n\n翻译水平进行基因表达调节主要是控制mRNA的稳定性、mRNA的运输和有选择的进行翻译，mRNA的5-帽子结构和3-PolyA尾都有利于RNA分子的稳定性。翻译起始因子的磷酸化也具有调控作用，如eIF2磷酸化抑制或选择性的加强蛋白质的合成，eIF4磷酸化对翻译具有起始激活作用。\n\n(5) 翻译后水平\n\n①新生多肽链的折叠，多肽链的折叠在肽链合成没有结束时就已经开始了。分子伴侣用于新生肽的折叠，跨膜蛋白的解折叠和再折叠，变性或错误折叠蛋白的重折叠，以及蛋白质分子的装配\n\n②N端fMet或Met的切除。原核生物的甲酰基可被脱甲酰化酶水解，然后在氨肽酶作用下将Met切除。不论是真核还是原核，N端的Met在多肽链合成之前就被切除了\n\n③通过PDI进行二硫键的重新形成，以调整不正确的二硫键。PDI可以切断二硫键，形成自由能最低的蛋白质构象，从而帮助新合成的蛋白质重新形成二硫键并产生正确折叠构象，使肽链折叠速率大大加快。二硫键的正确形成对维持蛋白质的天然构象起重要作用。\n\n④特定氨基酸修饰\n\na、磷酸化：多种蛋白质激酶催化，将ATP的γ磷酸基团转移到底物蛋白的Ser、Thr、Lys等残基。蛋白质磷酸化是生物体内一种普通的调节方式，在信号转导过程中起重要作用。\n\nb、糖基化：多数由内质网中的糖基转移酶催化进行，如N-连接糖基化和O-连接糖基化。\n\nc、甲基化：主要由细胞质基质内的甲基转移酶催化，包括发生在Arg、His和Gln的侧链的N-甲基化以及Glu、Asp的O-甲基化。在组蛋白甲基转移酶的催化下，S-腺苷甲硫氨酸SAM的甲基转移到组蛋白，可以抑制或激活基因表达，从而形成表观遗传。\n\nd、 乙酰化：由乙酰基转移酶催化，主要发生在Lys侧链上。如组蛋白的乙酰化。\n\ne、\n泛素化和类泛素化修饰，泛素化是指泛素分子在泛素激活酶、结合酶、连接酶等作用下，将细胞内的蛋白质分类，选中靶蛋白分子进行特异性修饰。\n\nf、\n连接异戊二烯基，一些真核生物的蛋白质可通过连接异戊二烯基衍生物进行修饰。Ras蛋白以Cys与法尼基焦磷酸生成疏水酯键，阻止Ras蛋白的法尼基化可以使其失去致癌活性。\n\ng、\n连接辅基：缀合蛋白的活性与其辅基有关，多肽链合成后需要与辅基以共价键或配位键结合，如金属蛋白的金属离子、血红蛋白的血红素等。\n\n⑤切除新生肽链中的非功能片段，许多蛋白质最初合成较大的、无活性的前体蛋白质，合成后需经蛋白酶的酶解加工产生较小的、活性形式。如哺乳动物的脑肽。\n\n⑥信号肽的切除，真核生物中，信号肽引导蛋白质穿越内质网膜，并由内质网膜上的信号肽酶水解切除；原核生物中信号肽引导蛋白质穿越细胞质膜，然后被信号肽酶切除。"},{"year":"2000","type":"简答题","number":"7","question":"1mol C6=C714 碳不饱和单烯酸彻底氧化分解生成 CO₂ 和 H₂O 共产生多少\nmol ATP?","answer":"单不饱和脂肪酸最终实际少产生一个FADH2\n\n6\\*（1.5+2.5）-1.5+7\\*10-2（第一步活化）=90.5ATP\n\n6.  **大肠杆菌仅在有充足的丙氨酸提供能量的情况下能存活吗?为什么?**\n\n可以，Ala首先和α-酮戊二酸反应生成丙酮酸和Glu，丙酮酸进入糖异生，生成葡萄糖提供能量。"},{"year":"2001","type":"名词解释","number":"1","question":"蛋白质前体","answer":"真核生物中，经核糖体生成的蛋白质，未经内质网和高尔基体的加工和修饰，不具有生物学活性，称为蛋白质前体。核糖体新合成的多肽链在细胞内经过一系列加工修饰，生成有生物活性的蛋白质，这个过程称为翻译后加工。"},{"year":"2001","type":"名词解释","number":"2","question":"分子病","answer":"由于基因突变导致蛋白质分子结构或数量异常，引起机体功能障碍的一种疾病。蛋白质分子由基因编码。即DNA分子上碱基排布，一旦碱基种类或顺序改变，引起编码的相应蛋白质分子结构和数量异常，导致疾病的发生。例如镰刀型贫血症是最早被认识的一种分子病，这是由于HbAβ链上N端开始第六位氨基酸残基由Glu突变为Val，HbA转换成HbS，这一单个氨基酸的改变导致分子表面疏水性增强，使去氧状态下血红蛋白异常聚集，形成纤维状结构，使红细胞变形为镰刀状并失去正常功能。"},{"year":"2001","type":"名词解释","number":"3","question":"核糖体","answer":"核糖体是一种核糖核蛋白颗粒，是细胞中合成蛋白质的一种细胞器。它是一种不规则的颗粒状结构，主要成分为RNA和蛋白质，由大小两个亚基构成。真核生物核糖体的沉降系数为80S，大亚基为60S，小亚基为40S；原核生物沉降系数为70S，大亚基为50S，小亚基为30S。核糖体小亚基负责识别并结合mRNA翻译起始位点，大亚基具有肽酰转移酶活性，负责催化肽键的形成。核糖体能够识别mRNA上的遗传信息，以mRNA为模板，通过tRNA携带的氨基酸合成相应的多肽链。"},{"year":"2001","type":"名词解释","number":"4","question":"酶的催化基因","answer":"与酶活力直接相关的部位称为酶的活性部位或活性中心。其中有些必需基团在一级结构上相距较远，但在形成空间结构过程中相互靠近，聚集在一起，形成有一定空间结构的区域，并与底物特异性结合，使底物转化为产物。通常分为结合部位和催化部位，前者负责与底物结合，决定酶的专一性（与km有关），后者负责底物键的断裂和重新形成，与酶的催化能力有关（与kcat有关），二者也可以合二为一。活性中心之外酶还有调节部位，与某些分子发生某种程度的结合，引起酶的空间构象改变，激活或抑制酶活性。对于缀合酶，辅因子也是酶活性部位的组成成分。其中，组成催化部位的氨基酸序列对应的基因片段称为酶的催化基因。"},{"year":"2001","type":"名词解释","number":"5","question":"核酶","answer":"是具有催化功能的小分子RNA，其化学本质是核糖核酸，但却具有酶的催化活性，属于生物催化剂，可降解特异的RNA序列。核酶可以通过催化靶位点RNA链的磷酸二酯键断裂，使底物RNA分子被特异性切割，从而阻断靶基因的表达。如16/18SrRNA组成的肽基转移酶。"},{"year":"2001","type":"名词解释","number":"6","question":"顺式作用元件","answer":"指DNA上对基因表达有调节活性的序列，包括启动子，增强子，绝缘子、沉默子等及其应答元件。启动子：RNA聚合酶识别并结合，起始转录。增强子：作用于启动子，增加转录起始频率。绝缘子：阻断经过他的正或负调节信号。沉默子：与相应的反式作用因子结合后起负调控作用。"},{"year":"2001","type":"名词解释","number":"7","question":"增强子98/00/01/06/12","answer":"**8.受体**\n\n指位于细胞膜，细胞质或者细胞核中，识别并专一性结合某种生物活性分子（信号分子，配体），并将获得的信息传递给效应器，引起一系列生物学效应的生物大分子。大多数受体为蛋白质，其中大部分为糖蛋白，少部分为糖脂或糖蛋白-糖脂复合物。"},{"year":"2001","type":"名词解释","number":"9","question":"分子筛层析","answer":"称大小排阻层析、分子筛，指根据多孔介质对不同大小和形状的分子排阻能力不同而分离蛋白质混合物的方法。不同大小和形状的分子流经凝胶柱时，比凝胶孔径大的分子不能进入凝胶珠，随溶剂沿凝胶珠间隙向下流动，流动距离最短，最先流出；比凝胶孔径小的分子不同程度选择性进入凝胶珠，流动距离较长，后流出。同大小的分子，线状分子在前，球状分子在后。常用的凝胶为交联葡聚糖（也叫sephadexG-n，后面的数字越大，交联程度越低，凝胶孔径越大，分子量分离范围越大）"},{"year":"2001","type":"名词解释","number":"10","question":"PCR(聚合酶链式反应)00/01/19","answer":"即PCR，是一种DNA体外酶促扩增的方法，其步骤包括变性，退火和延伸。首先高温94℃使DNA双链打开即变性，便于与引物相连；随后温度降低至50～60℃，按照特定目的基因设计好的引物与DNA模板结合即退火；最后温度升高至72℃，在耐高温的DNA聚合酶催化下，四种脱氧核苷三磷酸为原料，按照碱基互补配对原则沿模板链延伸即延伸。不断循环实现对目的基因扩增，具有特异性强，灵敏度高，操作简便省时等特点。"},{"year":"2001","type":"填空题","number":"1","question":"血红蛋白与氧结合是通过 **协同**\n效应实现的，由组织产生的CO₂扩散到细胞从而影响Hb和O2的亲和力，这称为\n**波尔** 效应。","answer":""},{"year":"2001","type":"填空题","number":"2","question":"赖氨酸带三个可解离基团，它们pk分别为2.18、8.95、10.53其等电点为\n**9.74（8.95+10.53/2）**","answer":""},{"year":"2001","type":"填空题","number":"3","question":"糖肽连接的键是 **糖苷** 键，而脂质与蛋白质以 **酰胺或硫酯**\n键结合而成。","answer":""},{"year":"2001","type":"填空题","number":"4","question":"测定蛋白质中二硫键位置的经典方法 **对角线电泳**","answer":""},{"year":"2001","type":"填空题","number":"5","question":"破坏α-螺旋结构的氨基酸是 **Pro** 和 **Gly**","answer":""},{"year":"2001","type":"填空题","number":"7","question":"DNA变性后，紫外吸收能力 **增强** 黏度 **下降**","answer":""},{"year":"2001","type":"填空题","number":"8","question":"tRNA的反密码子为UGC,它识别的密码子为 **GCA**","answer":""},{"year":"2001","type":"填空题","number":"9","question":"染色体中DNA的构型主要是 **B** 型。","answer":""},{"year":"2001","type":"填空题","number":"10","question":"竞争性抑制剂使Vmax **不变** ,Km **增大**","answer":""},{"year":"2001","type":"填空题","number":"11","question":"生物氧化主要是通过代谢物 **脱氢** 反应实现的，生物氧化产生的水是通过\n**氢离子经电子呼吸链传递给氧气** 形成的","answer":""},{"year":"2001","type":"填空题","number":"12","question":"磷酸戊糖途径的生理意义是 **产生NADPH** 和 **不同结构糖分子**","answer":""},{"year":"2001","type":"填空题","number":"13","question":"糖原合成的关键酶是 **糖原合酶** ,糖原分解的关键酶是 **糖原磷酸化酶**","answer":""},{"year":"2001","type":"填空题","number":"14","question":"一分子脂肪酸活化后需经 极性**肉碱**\n转运才能由胞浆内进入线粒体内氧化，线粒体内的乙酰CoA需经 **三羧酸穿梭**\n才能将其带出线粒体参与脂肪酸合成","answer":""},{"year":"2001","type":"填空题","number":"15","question":"催化IMP的酶有 **磷酸核糖焦磷酸激酶（PRPP合酶）** 和\n**PRPP酰胺转移酶**","answer":""},{"year":"2001","type":"填空题","number":"16","question":"DNA复制，引发前体加 **DnaG** 构成 **引发体**","answer":""},{"year":"2001","type":"填空题","number":"17","question":"氨酰tRNA合成酶既能识别 **氨基酸** 又能识别 **含有对应反密码子的tRNA**","answer":""},{"year":"2001","type":"简答题","number":"1","question":"某九肽组成为两个Gly，两个Phe，Tyr、Met、Asp、Arg和Pro。经胰凝乳蛋白酶水解得五肽和四肽，四肽组成为Phe、Tyr、Gly和Pro。此九肽的CNBr处理产物经阳离子交换树脂层析并洗脱得一组成为Arg、Phe和Gly的三肽，此九肽经胰蛋白酶水解得Phe，如用FDNB反应后在水解测得DNP-Tyr，请写出此九肽顺序及解析过程","answer":"N-C：Tyr-Pro-Gly-Phe-Asp-Met-Gly-Arg-Phe\n\n（胰凝乳蛋白酶作用的肽键不能和脯氨酸结合）"},{"year":"2001","type":"简答题","number":"2","question":"简述血红蛋白的结构及其结构与功能的关系","answer":"脊椎动物血红蛋白分子近似球形，由四个多肽亚基组成，每个亚基都含有一个血红素基和一个氧结合部位，四个亚基依靠八个离子键连接。成人的Hb分子大多为HbA（亚基组成为α2β2），其次为HbA2（亚基组成为α2δ2），不同种亚基间相互作用力大，用尿素处理血红蛋白，得到两个Hbα-Hbβ二聚体，二聚体保持完整。胎儿的Hb分子主要为HbF（亚基组成为α2γ2），丝氨酸取代成人中的组氨酸，减少正电荷，降低对BPG的亲和力，进而增强对氧的亲和力。\n\n蛋白质的结构和功能密切相关，结构是功能的基础，结构的改变往往导致功能的改变，蛋白质的生物学功能通常取决于它的构象。首先蛋白质的一级结构改变会引起功能的差异。例如镰刀型贫血症是最早被认识的一种分子病，这是由于HbAβ链上N端开始第六位氨基酸残基由Glu突变为Val，HbA转换成HbS，导致血红蛋白功能异常。其次，空间构象的改变也会引起功能的改变。例如血红蛋白与氧结合时表现出协同效应，即当第一个亚基与一分子氧结合后，引起八个离子键断裂，血红蛋白分子构象改变，由T态变成R态，其他亚基结合结合氧气的速率大大提高。当四个亚基全部被氧气占据，血红蛋白分子仍会由于环境氧分压或其他因素导致其自身构象发生改变，进而改变其与氧的亲和力。"},{"year":"2001","type":"简答题","number":"3","question":"简述酶活性的调节方式有哪些?","answer":"酶活性的调节方式有多种，分为酶活性的调节和酶量的调节，活性调节如下：\n\n**别构调节**：或称别构调控，酶的非催化部位和某些化合物进行可逆的非共价结合引发构象的改变，进而改变酶活性，具有这种调节作用的酶称作别构酶。凡能使酶分子发生别构作用的物质称为效应物或别构剂，常为小分子代谢物或辅因子。如因别构作用导致酶活性增加的物质称为正效应物或别构激活剂（多为底物），反之则为负效应物（多为产物）。当酶的别构效应涉及催化部位和催化部位相互作用称为同促效应即一个效应物与酶结合后影响同一效应物与酶的结合，促进则为同促正协同，反之则为同促负协同；涉及调节部位与活化部位的相互作用称为异促效应即一个效应物与酶结合后影响另一效应物与酶的另一部位结合，促进则为异促正协同，反之则为异促负协同。例如天冬氨酸转氨甲酰酶被终产物CTP反馈抑制，被ATP别构激活；3-磷酸甘油醛脱氢酶，具有负协同效应，具有四个亚基，可以和4个NAD+结合，但是结合两个后，酶分子构象发生改变，很难再结合第三、四个。\n\n**共价调节**：共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。常见的共价修饰包括，磷酸化，腺苷酸化，尿苷酸化，甲基化，乙酰化，二硫键的形成等。这种调节方式比别构调节慢，而且一般需要耗能，与其他调节方式不同的是，它能对更多的效应物刺激作出反应，调节形式更灵活，能对效应物浓度变化做出更强烈的反应，存在级联放大效应，是一种经济，快速，节能的调节方式。例如糖原磷酸化酶因专一性丝氨酸是否磷酸化实现活性和非活性互变，大肠杆菌中的谷氨酰胺合成酶因专一性酪氨酸是否结合AMP实现活性和非活性的互变。\n\n**酶原激活：**是一种不可逆的共价调节。体内合成出的蛋白质有时不具有酶的活性，需要蛋白水解酶专一性作用后，形成酶的活性部位，变成活性蛋白。这个无活性的蛋白质称为前体，如果活性蛋白质是酶，则这个前体称为酶原。例如胰凝乳蛋白酶，弹性蛋白酶和羧肽酶都具有很强的蛋白质水解能力，但是他们在胰腺中合成，防止胰腺被破坏，以酶原的形式合成，在小肠中的胰蛋白酶的作用下切割成有活性的酶，保证酶在特定的时空表现出活性。\n\n**激活剂和抑制剂**：由于结合了专一性的激活蛋白质或抑制蛋白质而使得酶活性受到调控。例如钙调蛋白CaM，可以感受细胞内钙离子浓度变化，浓度升高时与钙离子结合被激活，进而激活很多酶和靶蛋白，使酶能在准确条件下表现出活性。\n\n**多酶复合物**是指几种不同的酶依靠非共价键彼此嵌合在一起，使反应依次进行，保证一系列反应的连续性。如丙酮酸脱氢酶。\n\n**多功能酶：**一条多肽链上有多个功能的酶称为多功能酶，如逆转录酶。"},{"year":"2001","type":"简答题","number":"4","question":"简述tRNA的结构特征及其作用与作用机制?","answer":"**结构特征**\n\n1）一级结构：由4种不同的核糖核苷酸NMP通过3,5-磷酸二酯键连接而成的核苷酸链即单股RNA，含有较多稀有碱基，占核苷酸总量5%-20%。\n\n2）二级结构：三叶草形，包括5部分结构，由于双螺旋结构占比大，因此二级结构很稳定\n\n1.  氨基酸臂：七对碱基组成，tRNA3、5端富含G的序列组成双螺旋区域，3端有-CCA-OH，可以结合活化的氨基酸\n\n2.  二氢尿嘧啶环：有两个二氢尿嘧啶，与氨酰tRNA合成酶的结合有关\n\n3.  反密码子环：七个核苷酸，中间三个构成反密码子，识别并结合mRNA上相应的密码子\n\n4.  TφC环：茎环含有七对核苷酸，含保守TφC序列，可识别并结合核糖体rRNA，促进tRNA与核糖体结合。\n\n5.  可变环：也叫附加叉，位于反密码子环和TφC环之间，与tRNA的分类有关\n\n3）三级结构：倒L型，碱基组成倾向于增强碱基平面间的疏水堆积力，和氢键一起维持构象稳定。氨基酸臂和TφC环位于一横，CCA位于一端，其他三个位于一竖，反密码子位于一端\n\n**作用机制：**形成氨酰tRNA，携带活化的氨基酸到核糖体上，其反密码子识别并结合模板mRNA上相应密码子，起翻译作用，合成相应蛋白质即将mRNA上具有编码意义的核苷酸顺序翻译成蛋白质中氨基酸顺序。在肽链生成过程中，第一个进入核糖体的称为起始tRNA，起延伸作用的称为延伸tRNA，按照mRNA上的密码子依次进入核糖体，氨基酸合成到肽链上后离开，称作tRNA循环。反密码子和密码子不是严格的一一对应关系，在遗传密码特性中称为摆动性。tRNA参与基因表达调控和细胞代谢，以及很多物质的合成，同时还是转录酶的引物。"},{"year":"2001","type":"简答题","number":"5","question":"比较原核生物与真核生物基因表达调控的异同点?99/01/05/19","answer":"**6.简述真核生物内糖类、脂类和蛋白质三大物质之间的主要转化关系?**\n\n在真核生物内，糖类、脂类和蛋白质三大物质之间存在着以\"乙酰辅酶A\"和\"三羧酸循环\"为中心的相互转化关系，它们通过多条代谢途径实现能量与物质的互相转换。\n\n糖类经糖酵解作用分解为丙酮酸，丙酮酸经脱羧进入线粒体生成乙酰辅酶A，再经三羧酸循环（TCA循环）彻底氧化为CO₂和H₂O，释放能量；当能量充足时，乙酰辅酶A可转向脂肪酸合成途径，进而生成甘油三酯，实现糖→脂的转化。反之，脂肪分解时，脂肪酸经β-氧化也生成乙酰辅酶A，供给TCA循环或在植物或微生物等具有乙醛酸循环途径的生物体中，可用于糖异生中间产物的生成，实现脂→糖的转化，动物细胞中不能脂-糖转换。蛋白质经分解产生的氨基酸在脱氨后，其碳骨架可转变为丙酮酸、乙酰辅酶A或TCA循环中间物，从而既能供能，又能转变为糖或脂。"},{"year":"2001","type":"简答题","number":"7","question":"在真核生物内由氨基酸原料合成含有100个氨基酸残基的多肽一共需要消耗多少ATP?","answer":"活化：100\\*2=200\n\n真核生物起始1ATP（解开mRNA三级结构）+2GTP（进位识别+大小亚基结合）\n\n延伸：99\\*2（进位+移位）\n\n终止：1GTP（解离释放因子）\n\n总：402个ATP"},{"year":"2001","type":"简答题","number":"8","question":"简述在基因工程中筛选目的基因的方法有哪些?请简述其中一种实验方法的基本原理与\n操作流程","answer":"基因工程的第一步就是获得目的DNA片段，按所需目的基因的来源，分为分离自然存在的基因或人工合成基因。常用的方法有PCR法、化学合成法、cDNA法及建立基因文库的方法来筛选。\n\n（1）当目的基因的序列已知吋\n\n①用化学方法合成目的基因：可采用固相亚磷酸三酯法进行合成。\n\n②聚合酶链式反应（PCR）\n\n是一种DNA体外酶促扩增的方法，其步骤包括变性，退火和延伸。首先高温94℃使DNA双链打开即变性，便于与引物相连；随后温度降低至50～60℃，按照特定目的基因设计好的引物与DNA模板结合即退火；最后温度升高至72℃，在耐高温的DNA聚合酶催化下，四种脱氧核苷三磷酸为原料，按照碱基互补配对原则沿模板链延伸即延伸。不断循环实现对目的基因扩增，具有特异性强，灵敏度高，操作简便省时等特点。\n\nPCR技术的操作流程\n\na、 模板DNA的制备：提取含有目的基因的DNA样本，作为PCR扩增的模板。\n\nb、\n引物的设计与合成：根据目的基因的核苷酸序列，设计并合成一对特异性引物。引物是与目的基因两端互补的寡核苷酸序列，能够引导DNA聚合酶从引物的3'端开始合成新的DNA链。\n\nc、\nPCR反应体系的建立：将模板DNA、引物、DNA聚合酶、dNTP（脱氧核糖核苷三磷酸）等反应成分混合在一起，形成PCR反应体系。反应体系中的成分和浓度需要严格控制，以确保PCR扩增的效率和特异性。\n\nd、 PCR扩增\n：将PCR反应体系置于PCR仪中进行扩增。PCR仪能够控制反应体系的温度，使DNA经历变性、复性和延伸三个过程。这三个过程循环进行多次，使目的基因的数量呈指数方式增加。\n\ne、\nPCR产物的检测与鉴定：扩增结束后，通过电泳等方法检测PCR产物的数量和大小。如果扩增成功，可以看到与目的基因大小一致的DNA片段。同时，还可以通过测序等方法进一步鉴定PCR产物的序列是否正确。\n\n（2）当目的基因序列未知时：建立一个包括目的基因在内的基因文库，从基因文库中提取目的基因。\n\n基因组文库是将某一生物的全部基因组DNA经限制性内切酶切割成适当大小、相互重叠的片段，接着选择适当的载体（如质粒、λ噬菌体等），用DNA连接酶将外源DNA片段与载体连接，形成重组DNA分子；再通过转化或转染将其导入宿主细胞（如大肠杆菌），获得大量重组克隆。所有含有不同基因组片段的克隆集合即为该生物的基因组文库，它包含了该生物全部的遗传信息。\n\n1）核酸杂交法\n\n①将圆形硝酸纤维素膜放在含有琼脂培养基的培养皿表面，将待筛选菌落从其生长的平板上转移到硝酸纤维素膜上，进行适当温育。同时保
