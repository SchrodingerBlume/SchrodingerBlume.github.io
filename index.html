<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生化考研答题系统</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2c5f2d;
            --primary-light: #4a8b4d;
            --primary-dark: #1a3a1b;
            --secondary: #d4af37;
            --accent: #c41e3a;
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0d8cc;
            --shadow: rgba(44, 95, 45, 0.15);
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f5f1e8 100%);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(44, 95, 45, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            padding: 3rem 0;
            position: relative;
        }
        
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px var(--shadow);
            letter-spacing: 0.05em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        
        .mode-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .mode-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px var(--shadow);
            border-color: var(--primary);
        }
        
        .mode-card:hover::before {
            transform: scaleX(1);
        }
        
        .mode-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        
        .mode-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .mode-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        
        .mode-features {
            list-style: none;
            margin-top: 1rem;
        }
        
        .mode-features li {
            padding: 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
            position: relative;
            padding-left: 1.5rem;
        }
        
        .mode-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }
        
        .config-panel {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
            display: none;
        }
        
        .config-panel.active {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }
        
        .question-type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .type-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .type-option:hover {
            background: white;
            border-color: var(--primary-light);
        }
        
        .type-option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .type-option input[type="number"] {
            width: 70px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-size: 1rem;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: border-color 0.2s;
        }
        
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(44, 95, 45, 0.3);
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(44, 95, 45, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--text-secondary), #888);
            margin-left: 1rem;
        }
        
        .quiz-container {
            display: none;
        }
        
        .quiz-container.active {
            display: block;
        }
        
        .question-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        
        .question-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        
        .info-badge {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .timer {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }
        
        .timer.warning {
            color: var(--accent);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .question-content {
            margin: 2rem 0;
        }
        
        .question-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 2rem;
            font-weight: 500;
        }
        
        .answer-area {
            margin-top: 2rem;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1.5rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .answer-feedback {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }
        
        .answer-feedback.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        .answer-feedback.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        
        .answer-feedback.partial {
            background: #fff8e1;
            border: 2px solid #ffc107;
        }
        
        .answer-feedback.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        
        .feedback-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        
        .reference-answer {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid var(--primary);
        }
        
        .reference-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }
        
        .ai-analysis {
            background: #f0f7ff;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid #2196f3;
        }
        
        .ai-title {
            font-weight: 600;
            color: #2196f3;
            margin-bottom: 0.75rem;
        }
        
        .results-panel {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 2px solid var(--border);
            margin: 2rem 0;
            display: none;
        }
        
        .results-panel.active {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        .score-display {
            text-align: center;
            padding: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            color: white;
            margin-bottom: 2rem;
        }
        
        .score-number {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }
        
        .score-label {
            font-size: 1.2rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .stat-card {
            background: var(--bg);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        
        .review-list {
            margin-top: 2rem;
        }
        
        .review-item {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
        }
        
        .review-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .review-question {
            font-weight: 600;
            color: var(--text);
        }
        
        .review-score {
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .review-score.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .review-score.partial {
            background: #fff8e1;
            color: #f57c00;
        }
        
        .review-score.incorrect {
            background: #ffebee;
            color: #c62828;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            margin: 2rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.3s ease;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .mode-selector {
                grid-template-columns: 1fr;
            }
            
            .question-type-grid {
                grid-template-columns: 1fr;
            }
            
            .btn-secondary {
                margin-left: 0;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>生化考研答题系统</h1>
            <p class="subtitle">Biochemistry Examination System</p>
        </header>
        
        <!-- 模式选择 -->
        <div id="modeSelection" class="mode-selector">
            <div class="mode-card" onclick="selectMode('exam')">
                <div class="mode-icon">📝</div>
                <h2 class="mode-title">考试模式</h2>
                <p class="mode-desc">模拟真实考试环境，限时答题，全面检验实力</p>
                <ul class="mode-features">
                    <li>限定答题时间</li>
                    <li>完成后统一判分</li>
                    <li>AI智能评阅</li>
                    <li>成绩分析报告</li>
                </ul>
            </div>
            
            <div class="mode-card" onclick="selectMode('practice')">
                <div class="mode-icon">💡</div>
                <h2 class="mode-title">训练模式</h2>
                <p class="mode-desc">逐题练习，即时反馈，稳步提升知识掌握</p>
                <ul class="mode-features">
                    <li>无时间限制</li>
                    <li>即时查看答案</li>
                    <li>年份标注</li>
                    <li>详细解析</li>
                </ul>
            </div>
        </div>
        
        <!-- 考试配置 -->
        <div id="examConfig" class="config-panel">
            <h2 class="mode-title">考试配置</h2>
            
            <div class="form-group">
                <label>选择题型和数量：</label>
                <div class="question-type-grid">
                    <div class="type-option">
                        <input type="checkbox" id="type-noun" value="名词解释" checked>
                        <label for="type-noun">名词解释</label>
                        <input type="number" id="num-noun" min="0" max="20" value="5">
                    </div>
                    <div class="type-option">
                        <input type="checkbox" id="type-fill" value="填空题" checked>
                        <label for="type-fill">填空题</label>
                        <input type="number" id="num-fill" min="0" max="20" value="5">
                    </div>
                    <div class="type-option">
                        <input type="checkbox" id="type-short" value="简答题" checked>
                        <label for="type-short">简答题</label>
                        <input type="number" id="num-short" min="0" max="10" value="3">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="timeLimit">考试时长（分钟）：</label>
                <input type="number" id="timeLimit" min="10" max="180" value="60">
            </div>
            
            <div>
                <button class="btn" onclick="startExam()">开始考试</button>
                <button class="btn btn-secondary" onclick="backToModeSelection()">返回</button>
            </div>
        </div>
        
        <!-- 训练配置 -->
        <div id="practiceConfig" class="config-panel">
            <h2 class="mode-title">训练配置</h2>
            
            <div class="form-group">
                <label for="practiceType">题型选择：</label>
                <select id="practiceType">
                    <option value="all">全部题型</option>
                    <option value="名词解释">名词解释</option>
                    <option value="填空题">填空题</option>
                    <option value="简答题">简答题</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="practiceYear">年份选择：</label>
                <select id="practiceYear">
                    <option value="all">全部年份</option>
                </select>
            </div>
            
            <div>
                <button class="btn" onclick="startPractice()">开始训练</button>
                <button class="btn btn-secondary" onclick="backToModeSelection()">返回</button>
            </div>
        </div>
        
        <!-- 答题界面 -->
        <div id="quizContainer" class="quiz-container">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            
            <div class="question-card">
                <div class="question-header">
                    <div class="question-info">
                        <span id="questionNumber" class="info-badge">第 1 题</span>
                        <span id="questionType" class="info-badge">名词解释</span>
                        <span id="questionYear" class="info-badge" style="display: none;">年份</span>
                    </div>
                    <div id="timer" class="timer" style="display: none;">60:00</div>
                </div>
                
                <div class="question-content">
                    <div id="questionText" class="question-text"></div>
                    
                    <div class="answer-area">
                        <textarea id="answerInput" placeholder="请输入您的答案..."></textarea>
                    </div>
                    
                    <div id="answerFeedback" class="answer-feedback"></div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button id="submitAnswerBtn" class="btn" onclick="submitAnswer()">提交答案</button>
                    <button id="nextQuestionBtn" class="btn" style="display: none;" onclick="nextQuestion()">下一题</button>
                    <button id="finishExamBtn" class="btn" style="display: none;" onclick="finishExam()">完成考试</button>
                </div>
            </div>
        </div>
        
        <!-- 成绩展示 -->
        <div id="resultsPanel" class="results-panel">
            <h2 class="mode-title">考试成绩</h2>
            
            <div class="score-display">
                <div class="score-number" id="finalScore">0</div>
                <div class="score-label">综合得分</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">答对题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="timeUsed">0</div>
                    <div class="stat-label">用时（分钟）</div>
                </div>
            </div>
            
            <h3 style="margin: 2rem 0 1rem; font-family: 'Noto Serif SC', serif;">答题回顾</h3>
            <div id="reviewList" class="review-list"></div>
            
            <div style="margin-top: 2rem;">
                <button class="btn" onclick="restartQuiz()">重新开始</button>
            </div>
        </div>
    </div>
    
    <script>
        // 题库数据将从question_bank.json加载
        let questionBank = [];
        let currentMode = '';
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let timer = null;
        let timeRemaining = 0;
        let startTime = null;
        
        // API配置
        const API_KEY = 'sk-b65219b6fe91460aae42bed7d5e166b4';
        const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
        
        // 加载题库
        async function loadQuestionBank() {
            try {
                const response = await fetch('question_bank.json');
                questionBank = await response.json();
                
                // 填充年份选择器
                const years = [...new Set(questionBank.map(q => q.year))].sort();
                const yearSelect = document.getElementById('practiceYear');
                years.forEach(year => {
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year + '年';
                    yearSelect.appendChild(option);
                });
                
                console.log('题库加载成功，共', questionBank.length, '道题');
            } catch (error) {
                console.error('题库加载失败:', error);
                alert('题库加载失败，请刷新页面重试');
            }
        }
        
        // 选择模式
        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('modeSelection').style.display = 'none';
            
            if (mode === 'exam') {
                document.getElementById('examConfig').classList.add('active');
            } else {
                document.getElementById('practiceConfig').classList.add('active');
            }
        }
        
        // 返回模式选择
        function backToModeSelection() {
            document.getElementById('examConfig').classList.remove('active');
            document.getElementById('practiceConfig').classList.remove('active');
            document.getElementById('modeSelection').style.display = 'grid';
            currentMode = '';
        }
        
        // 开始考试
        function startExam() {
            const selectedTypes = [];
            const typeCounts = {};
            
            // 获取选中的题型和数量
            if (document.getElementById('type-noun').checked) {
                const count = parseInt(document.getElementById('num-noun').value) || 0;
                if (count > 0) {
                    selectedTypes.push('名词解释');
                    typeCounts['名词解释'] = count;
                }
            }
            if (document.getElementById('type-fill').checked) {
                const count = parseInt(document.getElementById('num-fill').value) || 0;
                if (count > 0) {
                    selectedTypes.push('填空题');
                    typeCounts['填空题'] = count;
                }
            }
            if (document.getElementById('type-short').checked) {
                const count = parseInt(document.getElementById('num-short').value) || 0;
                if (count > 0) {
                    selectedTypes.push('简答题');
                    typeCounts['简答题'] = count;
                }
            }
            
            if (selectedTypes.length === 0) {
                alert('请至少选择一种题型');
                return;
            }
            
            // 按题型随机抽题
            currentQuestions = [];
            selectedTypes.forEach(type => {
                const typeQuestions = questionBank.filter(q => q.type === type);
                const shuffled = typeQuestions.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, typeCounts[type]);
                currentQuestions.push(...selected);
            });
            
            if (currentQuestions.length === 0) {
                alert('没有找到符合条件的题目');
                return;
            }
            
            // 设置时间
            const timeLimit = parseInt(document.getElementById('timeLimit').value) || 60;
            timeRemaining = timeLimit * 60; // 转换为秒
            
            // 初始化
            currentIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null).map(() => ({
                answer: '',
                score: 0,
                feedback: ''
            }));
            startTime = Date.now();
            
            // 显示答题界面
            document.getElementById('examConfig').classList.remove('active');
            document.getElementById('quizContainer').classList.add('active');
            document.getElementById('timer').style.display = 'block';
            document.getElementById('questionYear').style.display = 'none';
            
            // 开始计时
            startTimer();
            
            // 显示第一题
            showQuestion();
        }
        
        // 开始训练
        function startPractice() {
            const selectedType = document.getElementById('practiceType').value;
            const selectedYear = document.getElementById('practiceYear').value;
            
            // 筛选题目
            let filtered = questionBank;
            if (selectedType !== 'all') {
                filtered = filtered.filter(q => q.type === selectedType);
            }
            if (selectedYear !== 'all') {
                filtered = filtered.filter(q => q.year === selectedYear);
            }
            
            if (filtered.length === 0) {
                alert('没有找到符合条件的题目');
                return;
            }
            
            // 随机打乱
            currentQuestions = filtered.sort(() => 0.5 - Math.random());
            
            // 初始化
            currentIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null).map(() => ({
                answer: '',
                score: 0,
                feedback: ''
            }));
            
            // 显示答题界面
            document.getElementById('practiceConfig').classList.remove('active');
            document.getElementById('quizContainer').classList.add('active');
            document.getElementById('questionYear').style.display = 'inline-block';
            
            // 显示第一题
            showQuestion();
        }
        
        // 显示题目
        function showQuestion() {
            const question = currentQuestions[currentIndex];
            
            document.getElementById('questionNumber').textContent = `第 ${currentIndex + 1} / ${currentQuestions.length} 题`;
            document.getElementById('questionType').textContent = question.type;
            document.getElementById('questionText').textContent = question.question;
            
            if (currentMode === 'practice') {
                document.getElementById('questionYear').textContent = question.year + '年';
            }
            
            // 恢复之前的答案
            document.getElementById('answerInput').value = userAnswers[currentIndex].answer || '';
            
            // 清除反馈
            const feedback = document.getElementById('answerFeedback');
            feedback.classList.remove('show', 'correct', 'partial', 'incorrect');
            feedback.innerHTML = '';
            
            // 更新按钮显示
            if (currentMode === 'practice') {
                document.getElementById('submitAnswerBtn').style.display = 'inline-block';
                document.getElementById('nextQuestionBtn').style.display = 'none';
                document.getElementById('finishExamBtn').style.display = 'none';
            } else {
                document.getElementById('submitAnswerBtn').style.display = 'inline-block';
                document.getElementById('nextQuestionBtn').style.display = 'none';
                document.getElementById('finishExamBtn').style.display = 'none';
            }
            
            // 更新进度条
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        // 计时器
        function startTimer() {
            timer = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                const timerDisplay = document.getElementById('timer');
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // 最后5分钟警告
                if (timeRemaining <= 300 && timeRemaining > 0) {
                    timerDisplay.classList.add('warning');
                }
                
                // 时间到
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    alert('考试时间已到，系统将自动提交');
                    finishExam();
                }
            }, 1000);
        }
        
        // 提交答案
        async function submitAnswer() {
            const answer = document.getElementById('answerInput').value.trim();
            
            if (!answer) {
                alert('请输入答案');
                return;
            }
            
            // 保存答案
            userAnswers[currentIndex].answer = answer;
            
            // 显示加载状态
            const submitBtn = document.getElementById('submitAnswerBtn');
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = '<span class="loading"></span> AI判卷中...';
            submitBtn.disabled = true;
            
            // AI评分
            try {
                await gradeAnswer(currentIndex);
            } catch (error) {
                console.error('AI评分失败:', error);
                // 使用简单匹配作为备选
                simpleGrade(currentIndex);
            }
            
            // 恢复按钮
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            
            // 显示反馈
            showFeedback();
            
            // 更新按钮
            document.getElementById('submitAnswerBtn').style.display = 'none';
            
            if (currentMode === 'practice') {
                if (currentIndex < currentQuestions.length - 1) {
                    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('finishExamBtn').style.display = 'inline-block';
                }
            } else {
                if (currentIndex < currentQuestions.length - 1) {
                    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('finishExamBtn').style.display = 'inline-block';
                }
            }
        }
        
        // AI评分
        async function gradeAnswer(index) {
            const question = currentQuestions[index];
            const userAnswer = userAnswers[index].answer;
            
            const prompt = `你是一位严格的考研生物化学阅卷老师。请按照考研标准评判以下答案。

题目类型：${question.type}
题目：${question.question}

标准答案：
${question.answer}

学生答案：
${userAnswer}

请按以下格式返回JSON评分结果：
{
    "score": 分数(0-10),
    "feedback": "评语（指出答对了哪些要点，漏掉了哪些关键内容，以及表述是否准确）"
}

评分标准：
- 名词解释（10分）：完整准确定义6-8分，基本正确但不够完整4-5分，概念模糊或错误0-3分
- 填空题（10分）：完全正确10分，部分正确5分，错误0分
- 简答题（10分）：要点齐全、表述准确8-10分，要点基本齐全但表述欠缺5-7分，要点不全或有明显错误0-4分

请严格按照考研标准评判，不要过于宽容。`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'qwen-plus',
                    messages: [
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.3
                })
            });
            
            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            // 解析JSON结果
            try {
                const match = aiResponse.match(/\{[\s\S]*\}/);
                if (match) {
                    const result = JSON.parse(match[0]);
                    userAnswers[index].score = result.score;
                    userAnswers[index].feedback = result.feedback;
                } else {
                    // 如果无法解析，使用简单匹配
                    simpleGrade(index);
                }
            } catch (e) {
                simpleGrade(index);
            }
        }
        
        // 简单评分（备选方案）
        function simpleGrade(index) {
            const question = currentQuestions[index];
            const userAnswer = userAnswers[index].answer.toLowerCase();
            const standardAnswer = question.answer.toLowerCase();
            
            // 提取关键词
            const keywords = standardAnswer.match(/[\u4e00-\u9fa5]{2,}/g) || [];
            let matchCount = 0;
            
            keywords.forEach(keyword => {
                if (userAnswer.includes(keyword)) {
                    matchCount++;
                }
            });
            
            const ratio = keywords.length > 0 ? matchCount / keywords.length : 0;
            
            if (ratio >= 0.8) {
                userAnswers[index].score = 9;
                userAnswers[index].feedback = '答案基本正确，涵盖了大部分关键要点。';
            } else if (ratio >= 0.6) {
                userAnswers[index].score = 7;
                userAnswers[index].feedback = '答案部分正确，但遗漏了一些关键要点。';
            } else if (ratio >= 0.4) {
                userAnswers[index].score = 5;
                userAnswers[index].feedback = '答案涵盖了部分要点，但不够完整。';
            } else {
                userAnswers[index].score = 3;
                userAnswers[index].feedback = '答案与标准答案差异较大，建议重新学习相关知识点。';
            }
        }
        
        // 显示反馈
        function showFeedback() {
            const question = currentQuestions[currentIndex];
            const result = userAnswers[currentIndex];
            const feedback = document.getElementById('answerFeedback');
            
            let className = 'incorrect';
            let title = '需要改进';
            
            if (result.score >= 8) {
                className = 'correct';
                title = '优秀';
            } else if (result.score >= 6) {
                className = 'partial';
                title = '良好';
            }
            
            let html = `
                <div class="feedback-title">${title}（${result.score}/10分）</div>
                <div class="ai-analysis">
                    <div class="ai-title">AI评语</div>
                    <div>${result.feedback}</div>
                </div>
            `;
            
            if (currentMode === 'practice') {
                html += `
                    <div class="reference-answer">
                        <div class="reference-title">参考答案（${question.year}年）</div>
                        <div>${question.answer}</div>
                    </div>
                `;
            }
            
            feedback.innerHTML = html;
            feedback.classList.add('show', className);
        }
        
        // 下一题
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                finishExam();
            }
        }
        
        // 完成考试
        function finishExam() {
            if (timer) {
                clearInterval(timer);
            }
            
            // 计算成绩
            const totalScore = userAnswers.reduce((sum, a) => sum + a.score, 0);
            const maxScore = currentQuestions.length * 10;
            const finalScore = Math.round((totalScore / maxScore) * 100);
            const correctCount = userAnswers.filter(a => a.score >= 8).length;
            const accuracy = Math.round((correctCount / currentQuestions.length) * 100);
            
            // 计算用时
            const timeUsed = startTime ? Math.round((Date.now() - startTime) / 60000) : 0;
            
            // 显示成绩
            document.getElementById('quizContainer').classList.remove('active');
            document.getElementById('resultsPanel').classList.add('active');
            
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('totalCount').textContent = currentQuestions.length;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('timeUsed').textContent = timeUsed;
            
            // 生成回顾列表
            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '';
            
            currentQuestions.forEach((question, index) => {
                const result = userAnswers[index];
                let scoreClass = 'incorrect';
                let scoreText = '需改进';
                
                if (result.score >= 8) {
                    scoreClass = 'correct';
                    scoreText = '优秀';
                } else if (result.score >= 6) {
                    scoreClass = 'partial';
                    scoreText = '良好';
                }
                
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <div class="review-item-header">
                        <div class="review-question">
                            <strong>${index + 1}. [${question.type}]</strong> ${question.question.substring(0, 50)}...
                        </div>
                        <div class="review-score ${scoreClass}">${scoreText} (${result.score}/10)</div>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem;">
                        ${result.feedback}
                    </div>
                `;
                reviewList.appendChild(item);
            });
        }
        
        // 重新开始
        function restartQuiz() {
            document.getElementById('resultsPanel').classList.remove('active');
            document.getElementById('modeSelection').style.display = 'grid';
            currentMode = '';
            currentQuestions = [];
            currentIndex = 0;
            userAnswers = [];
        }
        
        // 页面加载时初始化
        window.addEventListener('load', loadQuestionBank);
    </script>
</body>
</html>
