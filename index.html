，因此成为蛋白纯化的常规手段。"},{"year":"2009","type":"简答题","number":"4","question":"简述真核生物中mRNA前体的加工过程。","answer":"mRNA前体需要经过带帽，加尾，剪接，内部甲基化得到成熟的mRNA分子，不同转录起点和终点的产物，经过内部不同的剪切拼接以及不同的编辑得到不同的mRNA，编码不同的基因表达产物。\n\n首先带帽，发生在细胞核内，磷酸酶的作用下先将5-端磷酸基水解掉，再加上鸟苷三磷酸形成GpppN结构，再对G进行甲基化，最终形成帽子结构m^7^G^5-^ppp^5-^N。帽子结构是mRNA在细胞核和细胞质中的稳定因素，如果没有帽子结构会很快被核酸酶水解。同时帽子结构可以促进蛋白质生物合成起始复合物的形成，提高翻译强度。\n\n其次加尾，也发生在细胞核内，首先由核酸外切酶切去3-端一些过剩的核苷酸，由多聚腺苷酸酶催化，ATP为底物，逐个添加腺苷酸，形成polyA。该结构是mRNA从细胞核进入细胞质所必需，维持mRNA的稳定性。\n\n然后剪接，真核生物结构基因一般为断裂基因，其中能编码多肽链合成的基因称为外显子，非编码序列则为内含子。hnRNA的剪接一般需要snRNA参与构成的核蛋白体参加，形成套索结构将内含子切除（II型内含子剪切）。\n\n最后内部甲基化，主要是m^6^A，甲基化酶催化。"},{"year":"2009","type":"简答题","number":"5","question":"简述参与真核生物蛋白质生物合成的酶和因子的作用。","answer":"（1）酶：\n\n1.  氨酰tRNA合成酶，能够专一性识别氨基酸，使之与相对应的tRNA的3-OH结合，活化氨基酸。每活化一个氨基酸消耗1个ATP生成AMP，相当于2个高能键。\n\n2.  肽基转移酶：参与肽链延伸过程中的成肽步骤，活性由大亚基23S/28SrRNA提供，催化A位点上的AA-氨酰tRNA对P位的起始tRNA羰基亲核攻击形成肽键，形成的二肽在A位点。\n\n（2）原核生物参与蛋白质合成的因子\n\n①起始因子\n\nIF-1：占据A位点，防止起始tRNA进入A位点；增强IF-2、IF-3的活性。\n\nIF-2：介导fMet-tRNA选择性的与30S小亚基P位点结合，水解GTP\n\nIF-3：与30S亚基结合，促进其rRNA与mRNA起始部位SD序列识别并结合，有解旋酶活性，使核糖体大小亚基保持解离状态。\n\n②延伸因子\n\nEF-Tu：参与肽链延伸中的进位步骤，按mRNA编码序列，携带相应的AA-tRNA进入A位，具GTP酶活性\n\nEF-Ts：促进EF-Tu的再利用，EF-Tu-GDP转换为EF-Tu-GTP\n\nEF-G：参与肽链延伸中的移位，使肽酰tRNA从A位点转移到P位点。\n\n③释放因子的参与\n\nRF1：识别终止密码子UAA、UAG\n\nRF2：识别终止密码子UAA、UGA\n\nRF3：本身不识别终止密码子，增强RF1、RF2的活性，结合到核糖体后，引起GTP水解，使RF1、RF2脱离\n\n（3）真核生物参与蛋白质合成的因子\n\n①起始因子\n\neIF6 ：使无活性的80S核糖体解离为40S和60S亚基。\n\neIF1、eIF1A：结合40S小亚基，维持起始复合物处于\"开放构象\"，帮助其沿mRNA扫描。\n\neIF2 ：介导Met-tRNAi与40S小亚基P位点结合；水解GTP\n\neIF3 ：与40S小亚基结合，增强复合体稳定性，防止大小亚基提前聚合\n\neIF4E：帽子结合蛋白，结合mRNA5'端帽子结构\n\neIF4G：衔接蛋白，能与eIF3、eIF4A、eIF4B、PABP结合，通过eIF4E连到mRNA上\n\neIF4A、eIF4B：结合eIF4G进而结合到mRNA上，具有RNA解旋酶活性，水解ATP，促使小亚基沿mRNA扫描至AUG定位。\n\neIF5：释放起始因子，促进小亚基与大亚基结合\n\nPABP：poly（A）结合蛋白，也与eIF4G结合。\n\n②延伸因子\n\neEF-1A、eEF-1B，相当于EF-Tu和EF-Ts，协助AA-tRNA进入A位，具GTP酶活性；促进eEF-1A的再利用\n\neEF2，相当于EF-G，参与肽链延伸中的移位，使肽酰tRNA从A位点转移到P位点。\n\n③释放因子\n\neRF1：I类释放因子，识别3种终止密码子，催化新合成的肽链从P位点释放出来。\n\neRF3：II类释放因子，水解GTP，促进I类释放因子从核糖体解离。"},{"year":"2009","type":"简答题","number":"6","question":"新陈代谢中所有的有机反应类型有哪些?请写出代谢途径中符合每种有机反应类型的反应式(用中文文字或结构式表示反应物和产物均可)。","answer":"新陈代谢中所有的有机反应类型主要包括氧化还原反应；基团转移反应；消除、异构化和重排反应；碳-碳键的形成和断裂反应；自由基反应。以下是代谢途径中符合每种有机反应类型的反应：\n\n（1）氧化还原反应：电子（或氢原子）在分子间的转移。\n\n典型代谢反应：\n\n甘油醛-3-磷酸脱氢酶反应：3-磷酸甘油醛+NAD+ ⇌ 1,3-二磷酸甘油酸 + NADH\n\n异柠檬酸脱氢酶反应：异柠檬酸+NAD+→α-酮戊二酸+CO2+NADH\n\n琥珀酸脱氢酶反应：琥珀酸 + FAD ⇌ 延胡索酸 + FADH₂\n\n3-磷酸甘油脱氢酶反应：3-磷酸甘油 + FAD ⇌ 磷酸二羟丙酮 + FADH₂\n\n脂酰CoA脱氢酶反应：脂酰CoA+FAD→烯酰CoA+FADH2\n\n（2）基团转移反应：官能团（磷酸基、氨基等）从一个分子转移到另一个分子上。\n\n典型代谢反应：\n\n己糖激酶反应：葡萄糖 + ATP → 葡萄糖-6-磷酸 + ADP\n\n磷酸甘油酸激酶反应：1,3-二磷酸甘油酸 + ADP → 3-磷酸甘油酸 + ATP\n\n丙酮酸激酶反应：磷酸烯醇式丙酮酸 + ADP → 丙酮酸 + ATP\n\n谷丙转氨酶反应：谷氨酸 + 丙酮酸 ⇌ α-酮戊二酸 + 丙氨酸\n\n（3）消除、异构化和重排反应：分子内原子或官能团重新排列、去除或转移，不改变总分子式。\n\n典型代谢反应：\n\n烯醇化酶脱水消除反应：2-磷酸甘油酸 → 磷酸烯醇式丙酮酸 + H₂O\n\nβ-羟丁酰-ACP脱水酶反应：β-羟丁酰-ACP → β-丁烯酰-ACP+ H₂O\n\n磷酸葡萄糖异构酶反应：葡萄糖-6-磷酸 ⇌ 果糖-6-磷酸\n\n磷酸丙糖异构酶反应：二羟丙酮磷酸 ⇌ 甘油醛-3-磷酸\n\n磷酸甘油酸变位酶反应：3-磷酸甘油酸⇌ 2-磷酸甘油酸\n\n磷酸葡萄糖变位酶反应：葡萄糖-1-磷酸 ⇌ 葡萄糖-6-磷酸\n\n（4）碳--碳键的形成与断裂反应：通过裂解或形成碳--碳键实现碳骨架的分解与合成\n\n典型代谢反应：\n\n醛缩酶反应：果糖-1,6-二磷酸 → 甘油醛-3-磷酸 + 磷酸二羟丙酮\n\n柠檬酸合酶反应：草酰乙酸 + 乙酰-CoA → 柠檬酸 + CoA-SH\n\n丙酮酸羧化酶反应：丙酮酸 + CO₂ + ATP → 草酰乙酸 + ADP + Pi\n\n硫解酶反应：2 乙酰-CoA ⇌ 乙酰乙酰-CoA + CoA-SH\n\n（5）自由基反应：通过自由基中间体进行单电子转移的反应\n\n典型代谢反应：\n\n核糖核苷酸还原酶反应（DNA合成）：NDP → dNDP + H₂O"},{"year":"2010","type":"名词解释","number":"1","question":"寡糖链10/24","answer":"寡糖链是指由2～10个单糖分子通过糖苷键连接形成的短链多糖结构。它们可以以游离形式存在，也常以共价键形式连接在蛋白质或脂类上，分别形成糖蛋白或糖脂。寡糖链在细胞表面广泛分布，可参与细胞间相互作用、受体识别以及蛋白质的正确折叠与运输。"},{"year":"2010","type":"名词解释","number":"2","question":"肽键97/10","answer":"**3. 蛋白质折叠**\n\n蛋白质折叠是指新生多肽链在合成后通过自身氨基酸序列的化学性质及非共价相互作用，自发形成具有特定三维空间构象的过程。蛋白质的折叠结构是生理条件下自由能最低的构象，蛋白质自身熵减但整个反应体系熵增，这一过程是分阶段快速完成的，需要中间态，驱动力是疏水相互作用。体内蛋白质的折叠需要肽基脯氨酸异构酶、分子伴侣以及蛋白二硫键异构酶的参与。"},{"year":"2010","type":"名词解释","number":"4","question":"酶的可逆共价修饰","answer":"共价修饰酶通过其他酶对其多肽链上的某些基团进行可逆的共价修饰，使其处于活性与非活性的互变状态，进而调节酶的活性。常见的共价修饰包括，磷酸化，腺苷酸化，尿苷酸化，甲基化，乙酰化，二硫键的形成等。这种调节方式比别构调节慢，而且一般需要耗能，与其他调节方式不同的是，它能对更多的效应物刺激作出反应，调节形式更灵活，能对效应物浓度变化做出更强烈的反应，存在级联放大效应，是一种经济，快速，节能的调节方式。例如糖原磷酸化酶因专一性丝氨酸是否磷酸化实现活性和非活性互变，大肠杆菌中的谷氨酰胺合成酶因专一性酪氨酸是否结合AMP实现活性和非活性的互变。"},{"year":"2010","type":"名词解释","number":"5","question":"双向电泳03/10","answer":"**6. 光合磷酸化**\n\n光合磷酸化是指由光照所引起的电子传递与磷酸化作用相偶联生成ATP的过程。光合作用通过光合磷酸化形成ATP，再通过CO2同化将能量储存在有机物中。发生在叶绿体的类囊体薄膜上。最初电子来源为水的光解，经过电子传递链（PSI、PSII、PQ和Cytb6f）传递给NADP+，在类囊体膜两侧形成质子浓度梯度，当H+从类囊体腔流向基质时ATP合成酶产生ATP。包括循环式光合磷酸化和非循环式光合磷酸化，前者是在光反应的循环式电子传递过程中形成的质子梯度驱动ATP合成；后者涉及水的光解，产生O2、H+和电子。"},{"year":"2010","type":"名词解释","number":"7","question":"代谢调节网络","answer":"不同的代谢途径可通过交叉点上共同的中间代谢物而相互转化，使各代谢途径得以沟通，形成经济有效、运转良好的代谢网络通路。其中三个最关键的中间代谢物是：6-磷酸葡萄糖、丙酮酸和乙酰辅酶A。细胞内4类主要生物分子糖、脂类、蛋白质和核酸在代谢过程中相互转化，密切相关。柠檬酸循环不仅是各类物质共同的代谢途径，而且也是它们之间相互联系的渠道。不同代谢途径之间虽然相互沟通，但它们存在各自的调节与控制。包括分子水平、细胞水平以及个体水平等不同层次的调控，无论哪一层次最终仍需通过酶的调节起作用，因此酶水平的调节是最关键、最基础的代谢调节。"},{"year":"2010","type":"名词解释","number":"8","question":"RNA的反式剪接","answer":"RNA的反式剪接是指来自不同RNA分子的外显子通过剪接反应连接在一起，形成新的成熟RNA分子的过程。与常见的顺式剪接不同，反式剪接并非发生在同一初级转录本内部，而是跨越两个独立RNA分子之间进行外显子拼接。该过程同样依赖剪接体或snRNA的识别与催化，可产生具有新的编码序列或功能组合的mRNA，在原生动物、线虫及部分真核生物中均有发现。"},{"year":"2010","type":"名词解释","number":"9","question":"Cori-cycle10/13/18","answer":"乳酸的形成发生在肌细胞和红细胞中，其糖异生的进行主要发生在肝脏中，所以乳酸需要通过一种叫Cori-cycle即可立式循环的方式进行糖异生。肌肉细胞中的乳酸扩散到血液并随血液循环进入肝脏细胞，在肝细胞中先经乳酸脱氢酶转变为丙酮酸，生成NADH，丙酮酸经过糖异生途径生成葡萄糖，又回到血液中随血液循环供应脑和肌肉对葡萄糖的需要。乳酸循环的生理意义为促进乳酸再利用，更新肝糖原，防止酸中毒。"},{"year":"2010","type":"名词解释","number":"10","question":"柯斯质粒10/15","answer":"柯斯质粒是一种兼具λ噬菌体的cos端序列与细菌质粒复制元件的人工载体。它保留了λ噬菌体的cos端------即位于噬菌体DNA两端的互补单链黏性末端序列。cos端可通过碱基互补配对，使噬菌体DNA由线状转变为环状，从而在宿主细胞内复制，同时cos位点可被特异性核酸内切酶切割，重新生成线性DNA，以便装入新的噬菌体头部。柯斯质粒除具有cos序列外，还含有质粒的复制起点和抗性标记。它可携带较大的外源DNA片段，因此常用于构建基因组文库或克隆较大DNA片段，结合了噬菌体载体高转导效率与质粒载体易操作的优点。"},{"year":"2010","type":"填空题","number":"10","question":"6 的蛋白质在 pH 8.8 的 Tris-HCl\n缓冲液带（**正**）电荷，其在 SDS-PAGE 中向（**正**）极方向移动。\n\n5\\.\n膜内蛋白质与膜脂之间的结合主要依赖于（**疏水相互作用**）这种非共价作用，参与此作用的基团包括膜脂的（**疏水烃链**）与膜内在蛋白质的（**疏水性氨基酸侧链**）。\n\n6\\.\n氧气分子的结合可促进血红蛋白的构象由（**T**）态向（**R**）态转变，（**BPG、氢离子、二氧化碳**）的结合则具有相反的效果。\n\n7\\.\n在以下试剂（葡聚糖、甘氨酸、肽聚糖、硫酸铵、硫酸铜、琼脂糖、丙氨酸、硫酸锌、\n\n组氨酸）中，被用于测定糖的还原性的是（**硫酸铜**），被用于测定蛋白质浓度是（**硫酸铜**），用分离核酸的是（**琼脂糖**）。\n\n8\\.\n柠檬酸合酶属于六大酶类中的（**裂合酶**），该类酶催化反应的特点为（**催化碳骨架的结合或断裂**）\n\n9\\.\n可用于验证双功能酶所催化的两种化学反应是否发生在同一催化部位的物质是（**底物类似物**）。\n\n10\\. 已知反竞争性抑制剂的浓度\\[I\\] = 3k，底物浓度\\[S\\] =\n4Km，则根据米氏方程计算出的反\n\n应速率v = （**4/17**）Vmax。v= Vmax​\\[S\\]/Km​+\\[S\\](1+\\[I\\]/Ki​) ​\n\n11\\. 蛋白质与 RNA\n形成的超分子复合物为（**核糖体**），其中具有催化功能的是（**RNA**）。\n\n12\\. 一个含有 10 bp 的双螺旋 DNA 分子中，两条链共含有 20%的 A，则该 DNA\n分子所有的碱基对之间的总氢键数目为（**26**）。\n\n13\\.\n基因芯片的核心原理是（**核酸互补配对的杂交原理）**（将大量已知序列的寡核苷酸或cDNA固定在固体载体上，将带有荧光标记的样品DNA或cRNA与其互补序列发生特异性杂交）\n\n14\\. 在生物体内，最直接储能的高能磷酸化合物是（**ATP**）。\n\n15\\. 人的红细胞和脑细胞一般利用（**葡萄糖**）作为唯一的能量支援。\n\n16\\. 德国科学家 Hans Krebs 提出了（**TCA**）循环和（**尿素**）循环。\n\n17\\. 在分解代谢中，最后进入柠檬酸循环的关键入口物质是（**乙酰CoA**）。\n\n18\\. 线粒体电子传递链中复合体 IV\n的功能是（**将电子由细胞色素C传递给氧气**）。\n\n19\\. 戊糖磷酸途径是细胞产生（**NADPH**）的主要途径。","answer":""},{"year":"2010","type":"填空题","number":"20","question":"催化将UDPG上的葡萄糖分子转移到已存在的糖原分子的非还原末端上的酶是（**糖原合酶**）\n\n21\\.\n奇数碳原子脂肪酸先通过（**β氧化**）产生丙酰辅酶A，再经过多步酶促反应最后形成（**琥珀酰CoA**）。\n\n22\\. 人在饥饿或患糖尿病的情况下，首先利用（**酮体**）作为能源。\n\n23\\. 所有氨基转移酶都以（**磷酸吡哆醛**）作为辅基。\n\n24\\. 一碳单位是生物体各种化合物（**甲基化**）的主要来源。\n\n25\\. 在人和猿类中，嘌呤分解代谢的最终产物是（**尿酸**）。\n\n26\\. RNA 干扰是（**调控真核生物**）基因表达的重要方式。\n\n27\\. M. Meselson 和 F. Stahl\n用（**密度梯度离心实验（同位素标记法）**）实验证明了 DNA 的半保留复制。\n\n28\\.\n同源重组是由（**两条同源区的DNA分子**）通过配对、链的断裂和再连接，而产生片段交换的现象。\n\n29\\. tRNA 前体的加工需在其 3'端上加上（**-CCA序列**）。\n\n30\\.\n白喉毒素能将腺苷二磷酸核糖基转移到（**延伸因子EF-2**）上，而使真核生物多肽链的延伸循环终止。\n\n31\\.\n生物合成和生物形态的建成是耗能和增加有序结构的过程，需要由（**酶**）、（**能量**）和（**遗传信息**）来支持。\n\n32\\. Trp\n操纵子通常借助（**负控阻遏**）和（**衰减调节**）来调节其有关酶类的合成。\n\n33\\. 反向 PCR\n使部分序列已知的限制性核酸片段（**环化**），然后在已知序列部位设计一对反向引物，最后经过\nPCR 而使未知序列得到扩增。","answer":""},{"year":"2010","type":"简答题","number":"1","question":"回答以下与抗体结构功能相关的问题","answer":"**（1）利用抗体的结构特点解释抗体的以下特性与功能：①特异性②使抗原沉淀③促进巨噬细胞对抗原的吞噬。**\n\n①\n特异性：又称空间结构互补性，抗体分子是具有4条多肽链的对称结构，包括2条较长、相对分子量较大的相同的重链H链和2条较短、相对分子质量较小的轻链L链。链间由二硫键和非共价相互作用连接。整个抗体分子分为恒定区Fc和可变区Fab，在给定物种中，不同抗体分子的恒定区都具有相同或几乎相同的氨基酸序列。可变区位于Y的两臂末端，其中有一小部分氨基酸残基变化特别剧烈，称为高变区（V~L~、V~H~），位于分子表面，能与抗原通过空间互补和非共价作用（如氢键、范德华力、离子键、疏水作用等）特异结合，决定了该抗体结合抗原的特异性。\n\n②使抗原沉淀：抗体的两个结合臂能同时与两个相同抗原结合，多价抗原与多价抗体之间形成三维交联网络，从而生成可见沉淀或凝集产物，这就是抗体促进抗原沉淀或凝集的结构基础。抗原与抗体的结合依赖于多种非共价相互作用，其中疏水相互作用在沉淀形成中尤为重要。当抗原与抗体结合时，其疏水区域相互靠拢，破坏水化层，使复合物趋向聚集并进一步降低溶解度，从而促进沉淀生成。该过程具有一定可逆性，受pH、温度及离子强度等条件影响，只有在抗原与抗体比例适当的等价区时，交联最充分，沉淀量最大。\n\n③促进吞噬作用：抗体的Fc段能与巨噬细胞或中性粒细胞表面的Fc受体结合，使抗原--抗体复合物被识别并吞噬，即所谓\"调理作用\"，增强吞噬细胞清除抗原的效率。\n\n**（2）在利用抗体抗原作用的实验方法中，充分利用了抗体结合抗原的特异性和可逆性的特点的方法是什么？需要酶共价偶联的抗体的方法是什么？请给出简要的解释。**\n\n免疫亲和层析是一种利用抗原--抗体特异性亲和力实现分离的一种纯化方法。其基本步骤是：将纯化的抗体（或抗原）通过共价键固定在惰性载体（如琼脂糖凝胶）上，形成固相亲和配基；当含有目标抗原（或抗体）的样品溶液通过层析柱时，目标分子会与固定相上的特异性抗体结合，而杂蛋白和其他成分则因无特异性作用被洗脱出去。随后，通过改变洗脱液的pH值、离子强度或使用变性剂等条件，可破坏抗原--抗体间的非共价作用，使目标分子可逆解离并被洗脱下来。\n\n酶联免疫吸附测定ELISA：可以快速筛查和定量样品中的一个抗原。以待测抗原和酶标抗体特异性反应为基础，通过酶活力来确定抗原或抗体含量的技术。实验步骤包括：将待测样品中的蛋白质吸附到一个惰性表面；在惰性表面加入非特异性蛋白并一起温育，以封闭未被蛋白样品覆盖的表面部位；与抗待测抗原的一抗温育；与抗一抗，与催化生成有色产物的酶共价连接的二抗温育；加入酶标二抗的底物。"},{"year":"2010","type":"简答题","number":"2","question":"回答以下与酶催化作用相关的问题。","answer":"**（1）酶的催化机制可分为共价作用和非共价作用两类，请分别列举两种共价作用机制与两种非共价作用机制，并对其催化机理进行简要介绍；**\n\n共价催化：又称亲核催化或亲电子催化。催化时，亲核基团或亲电子基团分别放出或汲取电子并作用于酶分子的缺电子中心或负电子中心，迅速形成不稳定的中间态复合物，降低反应活化能，加速催化反应。常见的亲核基团包括Ser的羟基，Cys的巯基和His的咪唑基。常见的亲电子基团包括磷酸吡哆醛和焦磷酸硫胺素TPP。天冬氨酸转氨酶就属于共价催化范畴。\n\n非共价催化：\n\n酸碱催化：是通过瞬时的向反应物提供质子和从反应物接受质子以稳定过渡态，加速催化反应的一类催化机制。常见的酸碱催化基团包括Ser的羟基，Cys的巯基和His的咪唑基，以及碱性氨基酸的氨基和酸性氨基酸的羧基。His是酸碱催化中最活泼的一个催化功能团，可以作为质子供体，也可以质子受体，其给出或得到电子的速度也最快。\n\n金属离子催化：金属离子作为酶的催化剂，紧密结合金属离子的酶称为金属酶，松散结合金属离子的酶称为金属激活酶。金属离子通常以3种方式参加作用：通过结合底物使其在反应中正确定向；通过自身氧化态变化发生氧化还原反应，通过静电相互作用稳定或屏蔽净电荷，稳定过渡态。\n\n**（2）在酶的催化作用中通常是多种催化基团以协同的方式起作用，试举两例证明。**\n\n烯醇化酶催化2-磷酸甘油酸脱水生成磷酸烯醇式丙酮酸。酶的活性中心含有两个Mg²⁺，用于稳定底物带负电的磷酸基并增强邻近氢的酸性；谷氨酸残基作为碱性催化基团，从底物C-2位夺取一个质子；同时，赖氨酸残基将C-3位的羟基质子化，使其以水分子形式离去。随着C-2与C-3之间形成双键，反应完成。这一过程体现了金属离子与酸碱催化基团的协同作用。胰凝乳蛋白酶的催化依赖\"催化三联体\"------丝氨酸、组氨酸和天冬氨酸残基的协同作用。天冬氨酸的羧基与组氨酸形成氢键，使组氨酸的咪唑环更易接受质子；接着，组氨酸从丝氨酸羟基上夺取一个质子，激活丝氨酸的--OH，使其进行亲核攻击，从而共同完成肽键的切断。这两例都说明酶的催化并非单一基团完成，而是多个催化基团通过立体协作产生高效的催化效果。"},{"year":"2010","type":"简答题","number":"3","question":"实验设计与分析题","answer":"**（1）你从水稻叶片纯化得到了一种蛋白质A，请设计两个不同的实验测定其等电点。**\n\n①等电聚焦电泳法：IEF，又称电聚焦技术，是一种高分辨率的蛋白质分离技术，主要用于测定蛋白质的等电点。利用特殊缓冲液（两性电解质）在聚丙烯酰胺凝胶中形成pH梯度，蛋白质在电泳时迁移到他的等电点PI时，即蛋白质到达梯度中某一pH时，蛋白质就不再带有净的正电荷或负电荷了，停止迁移，实现蛋白质的分离，通过与已知pI的标准蛋白对比，即可测得蛋白A的等电点。目前常用的凝胶包括聚丙烯酰胺凝胶，葡聚糖凝胶，琼脂糖凝胶等。这种方法常用于分离同工酶，分子量接近但等电点不同的蛋白质。\n\n②\npH梯度洗脱离子交换层析法：在离子交换层析中，蛋白质在pH低于其等电点时带正电，可吸附在阳离子交换剂上；在pH高于等电点时带负电，可吸附在阴离子交换剂上。通过逐渐改变洗脱缓冲液的pH值（形成pH梯度洗脱），当pH接近蛋白的等电点时，蛋白净电荷为零，与离子交换剂的结合力最弱，从柱上被洗脱下来。记录该蛋白的洗脱pH，即为其等电点。\n\n**（2）你成功地将蛋白质A的基因克隆导入大肠杆菌BL21，在获得BL21的全蛋白提取液后，请设计一个实验测定该蛋白混合液中目标蛋白质A的分子量，以检验蛋白质A是否完整表达。**\n\n在获得BL21全蛋白提取液后，可通过SDS--PAGE结合凝胶过滤层析两步法测定蛋白质A的分子量并判断其是否完整表达。\n\n首先取诱导表达后的蛋白样品与未诱导对照样品进行SDS--PAGE，蛋白质完全变性并断开二硫键，使其仅按亚基分子量迁移。若在诱导样品中出现一条分子量与理论值相符的新条带，而对照组中无此条带，说明目标蛋白A已成功、完整地表达。接着将含有目标蛋白的上清液进行凝胶过滤层析，在缓冲液流动相中按分子体积大小分离。测定目标蛋白的洗脱体积并计算其分子量。若测得的值与SDS--PAGE所得亚基量一致，说明为单体；若为其倍数，则说明以二聚体或多聚体形式存在。\n\n若SDS--PAGE显示分子量正确，且凝胶过滤层析结果与理论结构一致，则说明蛋白质A已完整表达并保持天然构象。\n\n**（3）你按照以下方法操作作实验后发现所制备的蛋白质，样品中只有50%是目标蛋白A，其他均为杂质，蛋白质请分析原因并提出解决方案。**\n\n**实验方法：工程菌的培养→1 mM\nIPTG诱导16小时→菌体的收集与破碎→离心后收集上清液→硫酸铵沉淀（收集硫酸铵饱和度在0.3～0.5之间的蛋白质沉淀，离心收集后重新溶解）→用DEAE-EF阴离子交换层析柱分离，用0.1\nM NaCl梯度洗脱，收集有生物活性的样品。**\n\n首先，从表达阶段看，IPTG诱导16 h\n过长，可能导致蛋白质A部分降解或形成包涵体，表达量虽高但可溶性降低，破碎后目标蛋白未全部进入上清，杂蛋白比例上升。应优化诱导条件，如降低诱导温度（30℃或25℃）并缩短诱导时间（4--8h），可提高正确折叠比例。\n\n其次，从硫酸铵分级沉淀看，选取0.3--0.5饱和度区间较宽，易将其他蛋白共沉淀。应先做小样试验，测定目标蛋白在不同饱和度下的沉淀曲线，精确控制至目标蛋白主要析出的狭窄范围；沉淀后充分透析除去盐分，以免影响后续层析分离。\n\n再者，在DEAE-纤维素阴离子交换层析环节，洗脱条件过于温和或NaCl梯度过窄或变化过快，会导致杂蛋白与目标蛋白共洗脱。应优化pH与离子强度，使目标蛋白与固定载体电荷差异最大；可延长梯度范围（0--0.5\nM\nNaCl）或使用线性梯度洗脱以提高分辨率。必要时可增加进一步的纯化步骤，如凝胶过滤层析（按分子量分离）或亲和层析（若蛋白带有标签或特异配基），以获得更高纯度。"},{"year":"2010","type":"简答题","number":"4","question":"举例说明真核生物转录前水平的调节。00/10","answer":"真核生物基因组DNA以致密的染色质形式存在，所有通过改变DNA序列和染色质结构从而影响基因表达的过程称为转录前水平调控。\n\n1.  基因扩增：某些基因的拷贝数专一性大大增加，通过基因数量调控基因表达，使某一表达产物在短时间内大大增加满足细胞生命活动所需。\n\n2.  基因重排：将一个基因从远离启动子的地方移到据他很近的位点从而启动转录，基因重排可使表达的基因发生切换，即从表达一个基因到表达另一个基因。\n\n3.  DNA甲基化：DNA碱基可以发生甲基化，如5-甲基胞嘧啶。生物体内有两种甲基转移酶，一类是保持性甲基转移酶，在模板链指导下使对应部位发生甲基化；另一类是从头合成甲基转移酶，无需模板链指导。DNA甲基化可以改变DNA分子构象，从而改变某些基因上游调控区与各种转录相关蛋白因子相互作用，被甲基化的基因不能表达。\n\n4.  异染色质化：凝缩状态的染色质称为异染色质，为非活性转录区。真核生物可以通过异染色质化关闭某些基因的表达，例如巴氏小体。\n\n5.  基因或染色质的丢失：在细胞分化过程中，可以通过丢掉一段DNA或整条染色体而去掉这些基因的活性。"},{"year":"2010","type":"简答题","number":"5","question":"请写出新陈代谢中需要NAD+/NADH或NADP+/NADPH参与的10种不同的反应。","answer":"**糖酵解：**\n\n甘油醛-3-磷酸脱氢酶反应：3-磷酸甘油醛+NAD+ ⇌ 1,3-二磷酸甘油酸 + NADH\n\n丙酮酸脱氢酶复合体反应：丙酮酸+HS-CoA+NAD+→乙酰CoA+NADH+CO2\n\n**TCA循环：**\n\n异柠檬酸脱氢酶反应：异柠檬酸+NAD+→α-酮戊二酸+CO2+NADH\n\nα-酮戊二酸脱氢酶反应：α-酮戊二酸+NAD+→琥珀酰CoA+NADH\n\n苹果酸脱氢酶反应：苹果酸+ NAD+→草酰乙酸+NADH\n\n**戊糖磷酸途径：氧化脱羧阶段**\n\n6-磷酸葡糖酸脱氢酶反应：6-磷酸葡萄糖+NADP+→6-磷酸葡糖酸内酯+NADPH\n\n6-磷酸葡糖酸脱氢酶反应：6-磷酸葡萄糖酸+ NADP+→5-磷酸核酮糖+CO2\n\n**脂肪酸β-氧化：**\n\nβ-羟脂酰脱氢酶反应：β-羟脂酰CoA+ NAD+→β-酮脂酰CoA+NADH\n\n**酮体生成：**\n\nβ-羟丁酸脱氢酶反应：乙酰乙酸+ NADH→β-羟丁酸+ NAD+\n\n**胆固醇合成：**\n\nHMG-CoA还原酶反应：HMG-CoA+ 2NADPH→甲羟戊酸+2 NADP+\n\n**脂肪酸的生物合成：**\n\nβ-酮脂酰ACP还原酶反应：β-乙酰乙酰ACP+NADPH→β-羟丁酰ACP+ NADP+\n\nβ-丁烯酰ACP还原酶反应：β-丁烯酰ACP+ NADPH→丁酰-ACP+ NADP+\n\n**氧化脱氨基：**\n\n谷氨酸脱氢酶反应：谷氨酸+ NAD（P）+→亚谷氨酸+ NAD（P）H\n\nNO合酶反应：精氨酸+ NADPH+O2→瓜氨酸+NO+NADP+\n\n**嘧啶分解：**\n\n二氢尿嘧啶脱氢酶反应：尿嘧啶+ NAD（P）+→二氢尿嘧啶+ NAD（P）H\n\n二氢胸腺嘧啶脱氢酶反应：胸腺嘧啶+ NAD（P）+→二氢胸腺嘧啶+ NAD（P）H\n\n**脱氧核糖核苷酸的合成：**\n\n核糖核苷酸还原酶反应：NDP +NADPH→ dNDP + H₂O+NADP+"},{"year":"2010","type":"简答题","number":"6","question":"动物的肝脏具有再生功能，即肝脏在切除一部分后，剩余的部分会出现增生。研究表明，肝脏在再生过程中表达多种可以促进肝细胞生长的蛋白因子，请你设计一个实验流程图，来发现这些蛋白因子，克隆这些蛋白因子的基因，并初步验证它们的功能。","answer":"（1）发现阶段：选用部分肝切除动物模型，比较再生期与正常肝组织的蛋白质表达差异。可通过蛋白质组学分析或差异电泳（SDS-PAGE、电泳图谱比较）筛选在再生过程中特异上调的蛋白质因子，提取并纯化这些候选蛋白。\n\n（2）基因克隆阶段：提取再生期肝组织的mRNA，反转录获得cDNA，以候选蛋白的氨基酸序列反推合成引物，利用PCR扩增相应基因片段，连接至合适的表达载体中，转入大肠杆菌或哺乳动物细胞表达，获得重组蛋白。\n\n（3）功能验证阶段：将获得的重组蛋白作用于培养的肝细胞，观察其对细胞生长、DNA合成及增殖标志物（如³H-胸苷掺入）的影响；同时在动物体内进行注射或过表达实验，若能促进肝细胞增殖或肝脏再生，即证明该蛋白因子是促进细胞生长的蛋白因子。"},{"year":"2011","type":"名词解释","number":"1","question":"化学渗透学说11/23","answer":"化学家米切尔提出，化学渗透假说认为，电子传递链各组分在线粒体内膜中不对称分布，当高能电子沿其传递时，所释放的能量将H+从基质泵到膜间隙，形成H+电化学梯度。在这个梯度驱动下，H+通过ATP合酶回到基质，同时合成ATP。电化学梯度中蕴藏的能量储存到ATP高能磷酸键中。氧化磷酸化是生成ATP的一种主要方式，是细胞内能量转换的主要环节。"},{"year":"2011","type":"名词解释","number":"2","question":"凝胶过滤95/03/11/12/23","answer":"凝胶过滤，又称大小排阻层析、分子筛，指根据多孔介质对不同大小和形状的分子排阻能力不同而分离蛋白质混合物的方法。不同大小和形状的分子流经凝胶柱时，比凝胶孔径大的分子不能进入凝胶珠，随溶剂沿凝胶珠间隙向下流动，流动距离最短，最先流出；比凝胶孔径小的分子不同程度选择性进入凝胶珠，流动距离较长，后流出。同大小的分子，线状分子在前，球状分子在后。常用的凝胶为交联葡聚糖（也叫sephadexG-n，后面的数字越大，交联程度越低，凝胶孔径越大，分子量分离范围越大）"},{"year":"2011","type":"名词解释","number":"3","question":"RNA编辑03/11","answer":"RNA编辑是mRNA前体的一种加工方式，通过碱基的替换，插入或删除，改变和扩大原有模板携带的遗传信息，从而编码出更多不同氨基酸序列的蛋白质。介导RNA编辑的方式有两种：位点特异性脱氨基作用，如A→I，C→U；被编辑的mRNA序列与指导RNA（gRNA）互补，与蛋白质结合构成复合体，即编辑体，gRNA可以作为RNA编辑模板指导尿嘧啶的插入和删除。生理意义包括：消除移码突变等基因突变带来的危害，增加基因产物的种类，影响生物发育和分化，是基因表达调控的一种方式。"},{"year":"2011","type":"名词解释","number":"4","question":"同工酶11/23","answer":"同工酶是指催化相同的化学反应，但其蛋白质分子结构、理化性质和免疫性能等方面都存在明显差异的一组酶，它们被不同基因编码。例如乳酸脱氢酶LDH，5种形式都是由4个亚基聚合而成的四聚体，2种不同的结构基因编码2种不同的蛋白亚基，即心肌型H亚基和肌肉型M亚基，这两种亚基在氨基酸组成上有较大差别，H型富含酸性氨基酸，M型富含碱性氨基酸，因此在电场中很容易分开，对乳酸的亲和力H＞M。从阴极向阳极排列LDH5（M4）、LDH4（M3H1）、LDH3（M2H2）、LDH2（M1H3）、LDH1（H4），对乳酸亲和力由弱到强。"},{"year":"2011","type":"名词解释","number":"5","question":"实时定量荧光PCR","answer":"实时定量荧光PCR（qPCR）是一种在PCR扩增过程中实时监测产物积累量的核酸定量技术。它通过在反应体系中加入能与双链DNA特异性结合的荧光染料或带有荧光的探针，在每个循环的延伸阶段检测荧光信号强度，从而反映DNA扩增的数量。荧光信号的累积与扩增产物量成正比。该方法具有灵敏度高、特异性强、重复性好等优点"},{"year":"2011","type":"简答题","number":"1","question":"关于蛋白质分离纯化得到了好几种现象，问是什么原因？","answer":"**2.\n关于设计实验题，说的是研究渗透剂（蔗糖）对苹果酸脱氢酶的热稳定性的影响。**\n\n苹果酸脱氢酶（MDH）是一种温度敏感的酶，温度过高会使其构象改变导致失活。蔗糖作为一种渗透保护剂和稳定剂，能与蛋白质表面的水分子竞争形成氢键，从而稳定蛋白质的水化层，减少热引起的构象变化；同时蔗糖可增加体系的溶液黏度，限制分子运动，使酶分子间的碰撞和聚集减少。由此，蔗糖可有效保护苹果酸脱氢酶的天然构象，提高其对热的耐受性和热稳定性。\n\n取相同浓度的苹果酸脱氢酶溶液分为两组：一组加入一定浓度蔗糖（实验组），另一组不加（对照组）。将两组样品在不同温度（如40℃、50℃、60℃）或相同温度下不同时间处理后，迅速冷却，测定其剩余酶活力（以NADH吸光度变化速率表示）。该反应中，NADH在340nm波长处具有特征吸收峰，而NAD⁺在该波长几乎无吸收，因此可利用紫外分光光度法测定苹果酸脱氢酶活力。\n\n实验时，以草酰乙酸为底物，使反应按生成苹果酸的方向进行，即NADH被氧化为NAD⁺。以缓冲液为空白，在340nm波长下用紫外分光光度计连续记录吸光度的变化。反应进行过程中，NADH的消耗使A₃₄₀随时间下降，其下降速率（ΔA₃₄₀/Δt）即代表酶促反应速率。根据Lambert--Beer定律，可计算NADH消耗速率，从而得出单位时间内催化1μmolNADH氧化所需的酶量，即为1个酶活单位（U）。\n\n比较实验组与对照组在相同条件下的剩余酶活力或Tm。如果加入蔗糖的样品剩余酶活力更高或Tm更高，说明蔗糖对苹果酸脱氢酶具有显著的热保护作用，提高其热稳定性。"},{"year":"2011","type":"简答题","number":"3","question":"举个例子，说明糖代谢过程中的级联放大反应。","answer":"cAMP-PKA：体内cAMP含量升高激活PKA，活化的PKA磷酸化糖原磷酸化酶激酶GPK使其活化，进而磷酸化糖原磷酸化酶GP，促进糖原磷酸化降解；磷酸化糖原合酶GS使其失活，抑制糖原合成。磷酸化（磷蛋白磷酸酶抑制蛋白）IP使其活化，进而抑制PP（磷蛋白磷酸酶）。PP能够催化GS，GP和GPK去磷酸化，促进糖原合成。6-磷酸葡萄糖结合到糖原合酶的一个别构部位后，使其更容易被PP去磷酸化而激活。\n\n1.  肾上腺素、胰高血糖素和胰岛素对糖原代谢的调节\n\n肾上腺素、胰高血糖素可以激活特定的GPCR，进而激活Gs蛋白，引起细胞中特定信号通路，体内cAMP含量升高激活PKA，活化的PKA磷酸化糖原磷酸化酶激酶GPK使其活化，进而磷酸化糖原磷酸化酶GP，促进糖原磷酸化降解；磷酸化糖原合酶GS使其失活，抑制糖原合成。磷酸化（磷蛋白磷酸酶抑制蛋白）IP使其活化，进而抑制PP（磷蛋白磷酸酶）。PP能够催化GS，GP和GPK去磷酸化，促进糖原合成。胰岛素通过激活PI3K-Akt（PKB）信号通路，抑制GSK3活性同时促使PP活化，解除对糖原合酶的抑制，使糖原磷酸化酶失活，刺激糖原的合成。"},{"year":"2011","type":"简答题","number":"4","question":"细胞内核糖的来源以及去路有哪些？请写出其反应。","answer":"**来源**：戊糖磷酸途径，核酸降解\n\n戊糖磷酸途径PPP，又叫磷酸己糖支路、6-磷酸葡萄糖途径或己糖单磷酸途径。发生在细胞溶胶中。6-磷酸葡萄糖为起点，分为两个阶段：氧化脱羧阶段和分子重排阶段。首先6-磷酸葡萄糖在6-磷酸葡萄糖脱氢酶的作用下生成6-磷酸葡萄糖内酯，生成一分子NADPH，是反应的限速步骤。6-磷酸葡萄糖内酯在6-磷酸葡萄糖内酯酶作用下生成6-磷酸葡萄糖酸+1水；随后在6-磷酸葡萄糖酸脱氢酶的作用下生成5-磷酸核酮糖+NADPH+CO2。进入分子重排阶段：5-磷酸核酮糖在差向异构酶的作用下生成5-磷酸木酮糖，在异构酶的作用下生成5-磷酸核糖。2个5-磷酸木酮糖在转酮酶的作用下生成7-磷酸景天庚酮糖和3-磷酸甘油醛；二者在转醛酶的作用下生成4-磷酸赤藓糖和6-磷酸果糖；4-磷酸赤藓糖和5-磷酸木酮糖在转酮酶的作用下生成3-磷酸甘油醛和6-磷酸果糖；进入糖酵解进一步降解。\n\n核酸在核酸酶的作用下生成核苷酸，在核苷酸酶作用下进一步生成核苷和磷酸，最后在核苷磷酸化酶作用下生成碱基和核糖。\n\n**去路**：进入糖酵解；进入糖异生；逆反应生成磷酸戊糖；合成His和Trp；合成核苷酸。\n\n5-磷酸核糖在磷酸核糖焦磷酸激酶（PRPP合成酶）的作用下，由ATP提供磷酸基形成PRPP。在嘌呤核苷酸合成过程中，PRPP提供磷酸核糖部分，在它基础上形成嘌呤环。嘌呤环的形成分为两部分，左边部分形成嘌呤的咪唑基，右边部分最终形成第二个环和嘌呤的闭合。由N10-甲酰四氢叶酸提供甲基，反应需要6个ATP，相当于7个高能磷酸键（算PRPP合成），限速酶是谷氨酰胺的酰胺转移酶和PRPP合成酶。合成嘧啶时，先形成嘧啶环，再与PRPP结合，在磷酸核糖转移酶作用下形成乳清苷酸，随后在脱羧酶的作用下生成UMP。"},{"year":"2011","type":"简答题","number":"5","question":"核生物重复序列以及内含子对于生物多样性的影响表现在哪些方面？至少举三个例子。","answer":"1.  重复序列增加基因组变异：重复序列包括卫星DNA、微卫星序列和转座元件等，它们可以在基因组中不断复制、插入或移动，导致基因的重排或突变。例如，人类基因组中的Alu重复序列常常插入到新的位置，可能改变基因的结构或调控区域，从而使不同个体之间的DNA序列产生差异，增加遗传多样性。\n\n2.  内含子促进蛋白质多样化：内含子使得基因能够进行可变剪接，也就是说，同一个基因可以通过不同的剪接方式去除不同的内含子片段，从而产生多种mRNA，再翻译成不同功能的蛋白质。例如，免疫球蛋白基因通过可变剪接产生不同类型的抗体，使机体能识别并应对各种外来抗原，这大大丰富了生物功能的多样性。\n\n3.  重复序列和内含子调节基因表达：一些重复序列或内含子中含有增强子、启动子等调控元件，它们能影响基因何时、在何处以及在多大程度上表达。例如，某些内含子中的调控序列可以在特定组织或环境下激活基因表达，使生物能灵活地适应外界变化。这样的调控差异也促进了不同物种和个体在表型上的多样化。"},{"year":"2011","type":"简答题","number":"6","question":"设计实验，抑制肿瘤中端粒酶活性","answer":"端粒酶是一种有效抑制端粒缩短，从而使细胞能够持续增殖的酶。端粒酶是一种核糖核蛋白复合体，具有反转录酶的性质，通过自身含有的物种特异RNA为模板，反转录出端粒DNA加到母链的3-端来避免端粒缩短。大部分正常体细胞中端粒酶活性很低甚至没有活性，所以正常细胞端粒会缩短，细胞增殖代数有限。肿瘤细胞具有表达端粒酶活性的能力，使得癌细胞得以无限制增殖。\n\n（1）基因水平抑制：通过干扰端粒酶催化亚基hTERT的基因表达，可从根本上降低端粒酶的合成。常用方法包括反义寡核苷酸或siRNA技术，使hTERT的mRNA降解或翻译受阻。例如，转染hTERT\nsiRNA后，肿瘤细胞端粒逐渐缩短，出现衰老和凋亡。\n\n（2）转录调控抑制：端粒酶基因的表达受多种转录因子调节，如c-Myc可促进hTERT转录。通过阻断这些转录激活因子的作用或抑制其结合，可降低端粒酶的转录水平。例如，应用转录抑制剂或利用CRISPR干扰系统抑制hTERT启动子活性。\n\n（3）酶活性抑制：直接作用于端粒酶蛋白的催化部位，使其失活。代表性化合物如BIBR1532。\n\n（4）阻断端粒底物结合：端粒酶需要以RNA模板与染色体末端DNA结合才能发挥作用。若采用竞争性寡核苷酸模拟端粒序列与其结合，可阻止端粒酶与真正的端粒DNA结合，达到抑制效果。\n\n（5）间接抑制途径：通过抑制与端粒酶稳定性或定位相关的信号通路（如Akt、c-Myc通路），或促进端粒酶降解，也能间接降低其活性。"}];

                }
            }
            if (document.getElementById('type-fill').checked) {
                const count = parseInt(document.getElementById('num-fill').value) || 0;
                if (count > 0) {
                    selectedTypes.push('填空题');
                    typeCounts['填空题'] = count;
                }
            }
            if (document.getElementById('type-short').checked) {
                const count = parseInt(document.getElementById('num-short').value) || 0;
                if (count > 0) {
                    selectedTypes.push('简答题');
                    typeCounts['简答题'] = count;
                }
            }
            
            if (selectedTypes.length === 0) {
                alert('请至少选择一种题型');
                return;
            }
            
            // 按题型随机抽题
            currentQuestions = [];
            selectedTypes.forEach(type => {
                const typeQuestions = questionBank.filter(q => q.type === type);
                const shuffled = typeQuestions.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, typeCounts[type]);
                currentQuestions.push(...selected);
            });
            
            if (currentQuestions.length === 0) {
                alert('没有找到符合条件的题目');
                return;
            }
            
            // 设置时间
            const timeLimit = parseInt(document.getElementById('timeLimit').value) || 60;
            timeRemaining = timeLimit * 60; // 转换为秒
            
            // 初始化
            currentIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null).map(() => ({
                answer: '',
                score: 0,
                feedback: ''
            }));
            startTime = Date.now();
            
            // 显示答题界面
            document.getElementById('examConfig').classList.remove('active');
            document.getElementById('quizContainer').classList.add('active');
            document.getElementById('timer').style.display = 'block';
            document.getElementById('questionYear').style.display = 'none';
            
            // 开始计时
            startTimer();
            
            // 显示第一题
            showQuestion();
        }
        
        // 开始训练
        function startPractice() {
            const selectedType = document.getElementById('practiceType').value;
            const selectedYear = document.getElementById('practiceYear').value;
            
            // 筛选题目
            let filtered = questionBank;
            if (selectedType !== 'all') {
                filtered = filtered.filter(q => q.type === selectedType);
            }
            if (selectedYear !== 'all') {
                filtered = filtered.filter(q => q.year === selectedYear);
            }
            
            if (filtered.length === 0) {
                alert('没有找到符合条件的题目');
                return;
            }
            
            // 随机打乱
            currentQuestions = filtered.sort(() => 0.5 - Math.random());
            
            // 初始化
            currentIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null).map(() => ({
                answer: '',
                score: 0,
                feedback: ''
            }));
            
            // 显示答题界面
            document.getElementById('practiceConfig').classList.remove('active');
            document.getElementById('quizContainer').classList.add('active');
            document.getElementById('questionYear').style.display = 'inline-block';
            
            // 显示第一题
            showQuestion();
        }
        
        // 显示题目
        function showQuestion() {
            const question = currentQuestions[currentIndex];
            
            document.getElementById('questionNumber').textContent = `第 ${currentIndex + 1} / ${currentQuestions.length} 题`;
            document.getElementById('questionType').textContent = question.type;
            document.getElementById('questionText').textContent = question.question;
            
            if (currentMode === 'practice') {
                document.getElementById('questionYear').textContent = question.year + '年';
            }
            
            // 恢复之前的答案
            document.getElementById('answerInput').value = userAnswers[currentIndex].answer || '';
            
            // 清除反馈
            const feedback = document.getElementById('answerFeedback');
            feedback.classList.remove('show', 'correct', 'partial', 'incorrect');
            feedback.innerHTML = '';
            
            // 更新按钮显示
            if (currentMode === 'practice') {
                document.getElementById('submitAnswerBtn').style.display = 'inline-block';
                document.getElementById('nextQuestionBtn').style.display = 'none';
                document.getElementById('finishExamBtn').style.display = 'none';
            } else {
                document.getElementById('submitAnswerBtn').style.display = 'inline-block';
                document.getElementById('nextQuestionBtn').style.display = 'none';
                document.getElementById('finishExamBtn').style.display = 'none';
            }
            
            // 更新进度条
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        // 计时器
        function startTimer() {
            timer = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                const timerDisplay = document.getElementById('timer');
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // 最后5分钟警告
                if (timeRemaining <= 300 && timeRemaining > 0) {
                    timerDisplay.classList.add('warning');
                }
                
                // 时间到
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    alert('考试时间已到，系统将自动提交');
                    finishExam();
                }
            }, 1000);
        }
        
        // 提交答案
        async function submitAnswer() {
            const answer = document.getElementById('answerInput').value.trim();
            
            if (!answer) {
                alert('请输入答案');
                return;
            }
            
            // 保存答案
            userAnswers[currentIndex].answer = answer;
            
            // 显示加载状态
            const submitBtn = document.getElementById('submitAnswerBtn');
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = '<span class="loading"></span> AI判卷中...';
            submitBtn.disabled = true;
            
            // AI评分
            try {
                await gradeAnswer(currentIndex);
            } catch (error) {
                console.error('AI评分失败:', error);
                // 使用简单匹配作为备选
                simpleGrade(currentIndex);
            }
            
            // 恢复按钮
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            
            // 显示反馈
            showFeedback();
            
            // 更新按钮
            document.getElementById('submitAnswerBtn').style.display = 'none';
            
            if (currentMode === 'practice') {
                if (currentIndex < currentQuestions.length - 1) {
                    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('finishExamBtn').style.display = 'inline-block';
                }
            } else {
                if (currentIndex < currentQuestions.length - 1) {
                    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('finishExamBtn').style.display = 'inline-block';
                }
            }
        }
        
        // AI评分
        async function gradeAnswer(index) {
            const question = currentQuestions[index];
            const userAnswer = userAnswers[index].answer;
            
            const prompt = `你是一位严格的考研生物化学阅卷老师。请按照考研标准评判以下答案。

题目类型：${question.type}
题目：${question.question}

标准答案：
${question.answer}

学生答案：
${userAnswer}

请按以下格式返回JSON评分结果：
{
    "score": 分数(0-10),
    "feedback": "评语（指出答对了哪些要点，漏掉了哪些关键内容，以及表述是否准确）"
}

评分标准：
- 名词解释（10分）：完整准确定义6-8分，基本正确但不够完整4-5分，概念模糊或错误0-3分
- 填空题（10分）：完全正确10分，部分正确5分，错误0分
- 简答题（10分）：要点齐全、表述准确8-10分，要点基本齐全但表述欠缺5-7分，要点不全或有明显错误0-4分

请严格按照考研标准评判，不要过于宽容。`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'qwen-plus',
                    messages: [
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.3
                })
            });
            
            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            // 解析JSON结果
            try {
                const match = aiResponse.match(/\{[\s\S]*\}/);
                if (match) {
                    const result = JSON.parse(match[0]);
                    userAnswers[index].score = result.score;
                    userAnswers[index].feedback = result.feedback;
                } else {
                    // 如果无法解析，使用简单匹配
                    simpleGrade(index);
                }
            } catch (e) {
                simpleGrade(index);
            }
        }
        
        // 简单评分（备选方案）
        function simpleGrade(index) {
            const question = currentQuestions[index];
            const userAnswer = userAnswers[index].answer.toLowerCase();
            const standardAnswer = question.answer.toLowerCase();
            
            // 提取关键词
            const keywords = standardAnswer.match(/[\u4e00-\u9fa5]{2,}/g) || [];
            let matchCount = 0;
            
            keywords.forEach(keyword => {
                if (userAnswer.includes(keyword)) {
                    matchCount++;
                }
            });
            
            const ratio = keywords.length > 0 ? matchCount / keywords.length : 0;
            
            if (ratio >= 0.8) {
                userAnswers[index].score = 9;
                userAnswers[index].feedback = '答案基本正确，涵盖了大部分关键要点。';
            } else if (ratio >= 0.6) {
                userAnswers[index].score = 7;
                userAnswers[index].feedback = '答案部分正确，但遗漏了一些关键要点。';
            } else if (ratio >= 0.4) {
                userAnswers[index].score = 5;
                userAnswers[index].feedback = '答案涵盖了部分要点，但不够完整。';
            } else {
                userAnswers[index].score = 3;
                userAnswers[index].feedback = '答案与标准答案差异较大，建议重新学习相关知识点。';
            }
        }
        
        // 显示反馈
        function showFeedback() {
            const question = currentQuestions[currentIndex];
            const result = userAnswers[currentIndex];
            const feedback = document.getElementById('answerFeedback');
            
            let className = 'incorrect';
            let title = '需要改进';
            
            if (result.score >= 8) {
                className = 'correct';
                title = '优秀';
            } else if (result.score >= 6) {
                className = 'partial';
                title = '良好';
            }
            
            let html = `
                <div class="feedback-title">${title}（${result.score}/10分）</div>
                <div class="ai-analysis">
                    <div class="ai-title">AI评语</div>
                    <div>${result.feedback}</div>
                </div>
            `;
            
            if (currentMode === 'practice') {
                html += `
                    <div class="reference-answer">
                        <div class="reference-title">参考答案（${question.year}年）</div>
                        <div>${question.answer}</div>
                    </div>
                `;
            }
            
            feedback.innerHTML = html;
            feedback.classList.add('show', className);
        }
        
        // 下一题
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                finishExam();
            }
        }
        
        // 完成考试
        function finishExam() {
            if (timer) {
                clearInterval(timer);
            }
            
            // 计算成绩
            const totalScore = userAnswers.reduce((sum, a) => sum + a.score, 0);
            const maxScore = currentQuestions.length * 10;
            const finalScore = Math.round((totalScore / maxScore) * 100);
            const correctCount = userAnswers.filter(a => a.score >= 8).length;
            const accuracy = Math.round((correctCount / currentQuestions.length) * 100);
            
            // 计算用时
            const timeUsed = startTime ? Math.round((Date.now() - startTime) / 60000) : 0;
            
            // 显示成绩
            document.getElementById('quizContainer').classList.remove('active');
            document.getElementById('resultsPanel').classList.add('active');
            
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('totalCount').textContent = currentQuestions.length;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('timeUsed').textContent = timeUsed;
            
            // 生成回顾列表
            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '';
            
            currentQuestions.forEach((question, index) => {
                const result = userAnswers[index];
                let scoreClass = 'incorrect';
                let scoreText = '需改进';
                
                if (result.score >= 8) {
                    scoreClass = 'correct';
                    scoreText = '优秀';
                } else if (result.score >= 6) {
                    scoreClass = 'partial';
                    scoreText = '良好';
                }
                
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <div class="review-item-header">
                        <div class="review-question">
                            <strong>${index + 1}. [${question.type}]</strong> ${question.question.substring(0, 50)}...
                        </div>
                        <div class="review-score ${scoreClass}">${scoreText} (${result.score}/10)</div>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem;">
                        ${result.feedback}
                    </div>
                `;
                reviewList.appendChild(item);
            });
        }
        
        // 重新开始
        function restartQuiz() {
            document.getElementById('resultsPanel').classList.remove('active');
            document.getElementById('modeSelection').style.display = 'grid';
            currentMode = '';
            currentQuestions = [];
            currentIndex = 0;
            userAnswers = [];
        }
        
        // 页面加载时初始化
        window.addEventListener('load', initQuestionBank);
    </script>
</body>
</html>
